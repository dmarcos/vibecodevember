<style>
  :root { --ink: #f3eee6; --soft: #c9c0b2; --bar: 56px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c0b; color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
  .scrim { position: fixed; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none; background: linear-gradient(to top, rgba(8,6,4,.42), transparent); }
  .bar { position: fixed; left: 0; right: 0; top: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(16px, 3vw, 36px); pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,.55); }
  .brand { font: 500 10px Inter, sans-serif; letter-spacing: .34em; text-transform: uppercase; color: var(--ink); opacity: .85; }
  .name { font: italic 400 24px 'Cormorant Garamond', Georgia, serif; letter-spacing: .05em; }
  #hud { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); text-align: center; pointer-events: none; text-shadow: 0 0 12px rgba(0,0,0,.8); }
  #mach { display: inline-flex; align-items: baseline; gap: 10px; }
  #mach .lbl { font: 500 10px Inter, sans-serif; letter-spacing: .34em; text-transform: uppercase; color: var(--soft); }
  #machv { font: italic 500 34px 'Cormorant Garamond', Georgia, serif; font-variant-numeric: tabular-nums; min-width: 64px; text-align: left; transition: color .3s; }
  #machv.super { color: #ffd9a8; }
  #hint { margin-top: 4px; font-size: 10.5px; letter-spacing: .08em; color: var(--soft); }
  #hint b { color: var(--ink); font-weight: 500; }
  #snd { position: fixed; right: clamp(16px, 3vw, 36px); bottom: 22px; z-index: 3; border: 1px solid rgba(243,238,230,.3); background: rgba(0,0,0,.25); color: var(--ink); border-radius: 16px; padding: 6px 12px; font: 500 10px Inter, sans-serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px); }
  #snd:hover { background: rgba(0,0,0,.45); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0c0b; font: italic 400 21px 'Cormorant Garamond', Georgia, serif; color: var(--soft); transition: opacity .9s; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
  body.shot .bar, body.shot #hud, body.shot .scrim, body.shot #snd, body.shot #loading { display: none !important; }

    #snd { bottom: auto; top: 64px; }

  }

<body>
<canvas id="c"></canvas>

<script type="module">
import * as THREE from 'three';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================================ constants
// Metres. +X is the direction of flight (screen right), +Y up, +Z toward the camera.
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot');
if (SHOT) document.body.classList.add('shot');
const CAPTURE = Q.has('capture');
if (CAPTURE) document.body.classList.add('capture');
const PERIOD = 6000;                      // the world repeats every 6 km in x, so we can wrap without a seam
const ALT = 9;                            // flight altitude above the desert floor
const CRUISE = 0.82;
const VIS_K = 0.42;                       // metres-per-second of screen speed per m/s of true airspeed
const SHUTTER = 1 / 42;                   // motion blur exposure (s)
const SUN = new THREE.Vector3(0.62, 0.50, 0.60).normalize();
const VFOV = 30;
const TP = Math.PI * 2 / PERIOD;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT });
const DPR = Math.min(window.devicePixelRatio || 1, matchMedia('(pointer: coarse)').matches ? 1.5 : 1.75);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;

// ============================================================================ shared GLSL
const v3 = (v) => `vec3(${v.x.toFixed(5)}, ${v.y.toFixed(5)}, ${v.z.toFixed(5)})`;
const NOISE = /* glsl */`
uint ihash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float h2(vec2 i){ uvec2 u = uvec2(ivec2(i) + 65536); return float(ihash(u.x + ihash(u.y))) * (1.0 / 4294967295.0); }
float h3(vec3 i){ uvec3 u = uvec3(ivec3(i) + 65536); return float(ihash(u.x + ihash(u.y + ihash(u.z)))) * (1.0 / 4294967295.0); }
float vnoise(vec2 p, float per){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  float x0 = mod(i.x, per), x1 = mod(i.x + 1.0, per);
  float a = h2(vec2(x0, i.y)), b = h2(vec2(x1, i.y)), c = h2(vec2(x0, i.y + 1.0)), d = h2(vec2(x1, i.y + 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
// world noise, periodic in x over ${PERIOD} m; c = cells per period (integer)
float wn(vec2 p, float c){ return vnoise(vec2(p.x * c / ${PERIOD.toFixed(1)}, p.y * c / ${PERIOD.toFixed(1)}), c); }
float wfbm(vec2 p, float c, int oct){
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 6; i++){ if (i >= oct) break; s += a * wn(p, c); n += a; c *= 2.0; a *= 0.5; p.y += 37.0; }
  return s / n;
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), u.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), u.x), u.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), u.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), u.x), u.y), u.z);
}
`;
const SKY = /* glsl */`
const vec3 SUN_DIR = ${v3(SUN)};
vec3 skyRad(vec3 d){
  float y = d.y;
  float h = max(y, 0.0);
  vec3 zen = vec3(0.075, 0.17, 0.42);
  vec3 hor = vec3(0.74, 0.78, 0.82);
  vec3 col = mix(hor, zen, pow(h, 0.42));
  col = mix(col, vec3(0.66, 0.63, 0.58), (1.0 - smoothstep(-0.12, 0.0, y)) * 0.8);
  float mu = max(dot(d, SUN_DIR), 0.0);
  col += vec3(1.0, 0.86, 0.66) * (0.28 * pow(mu, 6.0) + 0.7 * pow(mu, 60.0));
  return col * 1.15;
}
vec3 hazeRad(vec3 d){ return skyRad(normalize(vec3(d.x, max(d.y, 0.0) * 0.5 + 0.006, d.z))); }
`;

// Patch three's fog so it takes the colour of the sky in the direction you're looking: seamless horizon haze.
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG\n varying float vFogDepth; varying vec3 vFogDir;\n#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG\n vFogDepth = length(mvPosition.xyz); vFogDir = (vec4(mvPosition.xyz, 0.0) * viewMatrix).xyz;\n#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG\n varying float vFogDepth; varying vec3 vFogDir;\n ${SKY}\n#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  vec3 fdir = normalize(vFogDir);
  float fogF = 1.0 - exp(-vFogDepth / 2600.0);
  fogF *= 1.0 - 0.45 * smoothstep(0.0, 0.2, fdir.y);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, hazeRad(fdir), fogF);
#endif`;

// ============================================================================ scene, camera
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 1, 2);   // enables the (patched) fog chunks
const camera = new THREE.PerspectiveCamera(VFOV, 1, 1.0, 14000);
camera.layers.enable(1);

const sunLight = new THREE.DirectionalLight(new THREE.Color(1.0, 0.94, 0.86), 6.2);
sunLight.layers.enableAll();
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
const sc = sunLight.shadow.camera;
sc.left = -34; sc.right = 34; sc.top = 34; sc.bottom = -34; sc.near = 1; sc.far = 420;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.04;
scene.add(sunLight, sunLight.target);

// sky dome
const skyMat = new THREE.ShaderMaterial({
  uniforms: { uEnv: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: `${NOISE}\n${SKY}\nuniform float uEnv; varying vec3 vDir;
  void main(){
    vec3 d = normalize(vDir);
    vec3 c = skyRad(d);
    if (uEnv > 0.5) {
      // lower hemisphere = sunlit desert, so the jet's belly picks up warm bounce
      c = mix(c, vec3(0.30, 0.215, 0.14) * 1.25, 1.0 - smoothstep(-0.06, 0.02, d.y));
    } else {
      if (d.y > 0.0) {
        vec2 q = d.xz / (d.y + 0.08) * 1.6;
        float ci = wfbm(vec2(q.x * 40.0, q.y * 220.0), 600.0, 5);
        ci = smoothstep(0.52, 0.8, ci) * smoothstep(0.02, 0.25, d.y);
        c = mix(c, vec3(1.05, 1.04, 1.02) * 1.15, ci * 0.55);
      }
      float mu = dot(d, SUN_DIR);
      c += vec3(60.0, 54.0, 46.0) * smoothstep(0.99993, 0.99997, mu);
    }
    gl_FragColor = vec4(c, 1.0);
  }`,
  side: THREE.BackSide, depthWrite: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(10000, 48, 24), skyMat);
sky.renderOrder = -10;
sky.frustumCulled = false;
scene.add(sky);

// environment map (sky + desert) for reflections on the paint and canopy
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const envScene = new THREE.Scene();
  const envMat = skyMat.clone(); envMat.uniforms.uEnv.value = 1;
  envMat.vertexShader = `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), envMat));
  const sunBall = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(9, 8.2, 7.2) }));
  sunBall.position.copy(SUN).multiplyScalar(40);
  envScene.add(sunBall);
  scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 200).texture;
}

// ============================================================================ terrain
const H_GLSL = /* glsl */`
const float TP = ${TP.toFixed(10)};
float hNear(vec2 p){ return 1.1 * sin(p.x * TP * 12.0 + 1.3) * sin(p.y * 0.017 + 0.4) + 0.6 * sin(p.x * TP * 30.0 + p.y * 0.023) + 0.3 * sin(p.x * TP * 68.0 - p.y * 0.052 + 2.0); }
float groundH(vec2 p){
  float farF = 1.0 - smoothstep(-600.0, 0.0, p.y);
  float h = hNear(p) * (1.0 + 3.0 * farF);
  float mf = 1.0 - smoothstep(-3000.0, -1500.0, p.y);
  if (mf > 0.0) {
    float r = 0.0, a = 1.0, c = 7.0; vec2 q = p;
    for (int i = 0; i < 5; i++){ float n = wn(q, c); n = 1.0 - abs(n * 2.0 - 1.0); r += a * pow(n, 1.6); a *= 0.45; c *= 2.0; q.y += 31.0; }
    float mesa = smoothstep(0.56, 0.6, wfbm(p + vec2(0.0, 500.0), 14.0, 3));
    float far = 1.0 - smoothstep(-4600.0, -3000.0, p.y);
    h += mf * (r * (80.0 + 260.0 * far) + mesa * 60.0);
  }
  return h;
}`;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const hNear = (x, z) => 1.1 * Math.sin(x * TP * 12 + 1.3) * Math.sin(z * 0.017 + 0.4) + 0.6 * Math.sin(x * TP * 30 + z * 0.023) + 0.3 * Math.sin(x * TP * 68 - z * 0.052 + 2.0);
const groundH = (x, z) => hNear(x, z) * (1 + 3 * (1 - smooth(-600, 0, z)));   // valid for z > -950

const TERR_DX = 24;
function terrainGeometry() {
  const cols = 300, rows = 170, x0 = -3600, x1 = 3600, zNear = 70, zFar = -5600;
  const pos = new Float32Array((cols + 1) * (rows + 1) * 3);
  let k = 0;
  for (let r = 0; r <= rows; r++) {
    const t = r / rows; const z = zNear + (zFar - zNear) * Math.pow(t, 2.1);
    for (let c = 0; c <= cols; c++) { pos[k++] = x0 + (x1 - x0) * c / cols; pos[k++] = 0; pos[k++] = z; }
  }
  const idx = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = r * (cols + 1) + c, b = a + 1, d = a + cols + 1, e = d + 1;
    idx.push(a, b, d, b, e, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(pos.length).fill(0).map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
  g.setIndex(idx);
  return g;
}
const terrainMat = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0, envMapIntensity: 0.9 });
terrainMat.onBeforeCompile = (sh) => {
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>\n${NOISE}\n${H_GLSL}\nvarying vec3 vW;`)
    .replace('#include <beginnormal_vertex>', `
      vec3 wp0 = (modelMatrix * vec4(position, 1.0)).xyz;
      float hc = groundH(wp0.xz);
      float ee = max(0.6, length(wp0 - cameraPosition) * 0.006);
      float hx = groundH(wp0.xz + vec2(ee, 0.0)), hz = groundH(wp0.xz + vec2(0.0, ee));
      vec3 objectNormal = normalize(vec3(-(hx - hc) / ee, 1.0, -(hz - hc) / ee));`)
    .replace('#include <begin_vertex>', `vec3 transformed = vec3(position.x, hc, position.z); vW = vec3(wp0.x, hc, wp0.z);`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>\n${NOISE}\nvarying vec3 vW;
      const float TP2 = ${TP.toFixed(10)};
      float fadeS(float s, float px){ return 1.0 - smoothstep(s * 0.2, s * 0.9, px); }
      float bumpH(vec2 p, float px){
        return 0.30 * wn(p, 3000.0) * fadeS(2.0, px) + 0.10 * wn(p + vec2(0.0, 3.0), 12000.0) * fadeS(0.5, px) + 0.03 * wn(p + vec2(0.0, 7.0), 48000.0) * fadeS(0.125, px);
      }`)
    .replace('#include <color_fragment>', `#include <color_fragment>
      vec2 gp = vW.xz;
      float gpx = max(length(vec2(dFdx(gp.x), dFdy(gp.x))), length(vec2(dFdx(gp.y), dFdy(gp.y))));
      float big = wfbm(gp, 30.0, 4);
      float mid = wfbm(gp + vec2(0.0, 91.0), 400.0, 3);
      float wash = wfbm(gp + vec2(0.0, 300.0), 120.0, 3);
      vec3 sandL = vec3(0.47, 0.335, 0.215), sandD = vec3(0.32, 0.215, 0.13), redC = vec3(0.29, 0.14, 0.075), paleC = vec3(0.60, 0.50, 0.37), scrubC = vec3(0.085, 0.08, 0.05);
      vec3 gcol = mix(sandD, sandL, smoothstep(0.3, 0.7, big));
      gcol = mix(gcol, redC, smoothstep(0.55, 0.8, mid) * 0.65);
      gcol = mix(gcol, paleC, smoothstep(0.6, 0.82, wash) * 0.6);
      float scr = smoothstep(0.76, 0.9, wn(gp + vec2(0.0, 13.0), 3000.0));
      gcol = mix(gcol, scrubC, mix(0.06, scr, fadeS(2.0, gpx)) * 0.85);
      float grav = wn(gp, 24000.0) * 0.6 + wn(gp + vec2(0.0, 1.0), 6000.0) * 0.4;
      gcol *= mix(1.0, 0.72 + 0.56 * grav, fadeS(0.5, gpx));
      float rz = gp.y + 110.0 + 6.0 * sin(gp.x * TP2 * 4.0) + 2.0 * sin(gp.x * TP2 * 17.0 + 1.0);
      float road = 1.0 - smoothstep(3.0, 4.4, abs(rz) + (wn(gp, 6000.0) - 0.5) * 0.8);
      float tracks = (1.0 - smoothstep(0.2, 0.55, abs(abs(rz) - 1.05))) * fadeS(0.6, gpx);
      gcol = mix(gcol, vec3(0.55, 0.44, 0.32) * (1.0 - 0.22 * tracks), road * 0.85);
      float mt = smoothstep(14.0, 90.0, vW.y);
      vec3 rockC = mix(vec3(0.21, 0.105, 0.06), vec3(0.42, 0.28, 0.17), wn(vec2(gp.x, vW.y * 9.0), 700.0));
      gcol = mix(gcol, rockC * (0.75 + 0.5 * big), mt);
      diffuseColor.rgb = gcol;`)
    .replace('#include <roughnessmap_fragment>', `float roughnessFactor = 0.93 - 0.1 * road;`)
    .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      {
        float e = 0.05;
        float b0 = bumpH(gp, gpx), bx = bumpH(gp + vec2(e, 0.0), gpx), bz = bumpH(gp + vec2(0.0, e), gpx);
        vec2 gr = vec2(bx - b0, bz - b0) / e * (1.0 - mt);
        normal = normalize(normal - (viewMatrix * vec4(gr.x, 0.0, gr.y, 0.0)).xyz * 0.9);
      }`);
};
const terrain = new THREE.Mesh(terrainGeometry(), terrainMat);
terrain.receiveShadow = true;
terrain.frustumCulled = false;
scene.add(terrain);

// ============================================================================ scatter: rocks, scrub, power line
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(15);
function lumpy(geo, amp, seed, flatten = 0.6) {
  const r = rng(seed); const ks = [];
  for (let i = 0; i < 6; i++) ks.push([new THREE.Vector3(r() - .5, r() - .5, r() - .5).normalize(), 1.5 + r() * 4, r() * 6.28, amp / (1 + i * 0.6)]);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); const n = v.clone().normalize(); let d = 1;
    for (const [k, f, ph, a] of ks) d += a * Math.sin(n.dot(k) * f + ph);
    v.multiplyScalar(d); v.y *= flatten; if (v.y < -0.25) v.y = -0.25 - (v.y + 0.25) * 0.1;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}
const rockGeo = lumpy(new THREE.IcosahedronGeometry(1, 2), 0.22, 3, 0.62);
const rockMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, flatShading: true, envMapIntensity: 0.8 });
const bushGeo = (() => {
  const parts = []; const r = rng(9);
  for (let i = 0; i < 7; i++) {
    const g = lumpy(new THREE.IcosahedronGeometry(0.32 + r() * 0.22, 1), 0.25, 20 + i, 0.85);
    const a = r() * 6.28, d = r() * 0.42; g.translate(Math.cos(a) * d, 0.18 + r() * 0.3, Math.sin(a) * d); parts.push(g);
  }
  return mergeGeometries(parts);
})();
const bushMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, envMapIntensity: 0.6 });

const view = { dist: 34, halfTanH: 0.5 };
const spanW = (z) => (view.dist + camShake.zoom - z) * view.halfTanH * 1.18 + 25;
const camShake = { zoom: 0 };
class Scatter {
  constructor(geo, mat, n, zFn, sFn, colFn, sink) {
    this.mesh = new THREE.InstancedMesh(geo, mat, n);
    this.mesh.castShadow = true; this.mesh.receiveShadow = true; this.mesh.frustumCulled = false;

  else if (t >= 6.2) m = 1.06 + 0.26 * sm((t - 6.2) / 2.0);
  return { mach: m, ab: t >= CAP.light ? 1 : 0 };
}
async function renderSoundtrack() {
  const sr = 48000, dur = CAP.dur, ctx = new OfflineAudioContext(2, sr * dur, sr);
  const noise = (sec, brown, k = 0.02) => {
    const len = Math.floor(sr * sec), b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0); let last = 0; const r = rng(5 + sec * 100);
    for (let i = 0; i < len; i++) { const w = r() * 2 - 1; if (brown) { last = (last + k * w) / (1 + k); d[i] = last * 3.5; } else d[i] = w; }

  const s1 = ctx.createBufferSource(); s1.buffer = noise(4, true); s1.loop = true;
  const ef = ctx.createBiquadFilter(); ef.type = 'lowpass';
  const eg = ctx.createGain();

  const s2 = ctx.createBufferSource(); s2.buffer = noise(3, false); s2.loop = true;
  const rf = ctx.createBiquadFilter(); rf.type = 'bandpass'; rf.Q.value = 0.6;

  for (let k = 0; k <= dur * 60; k++) {
    const t = k / 60, c = capFlight(t);
    ab += (c.ab - ab) * (1 - Math.exp(-(1 / 60) * (c.ab ? 9 : 2.5)));
    ef.frequency.setValueAtTime(380 + 260 * (c.mach - 0.8) + 700 * ab, t);
    eg.gain.setValueAtTime(0.28 + 0.3 * ab, t);
    rg.gain.setValueAtTime(0.03 + 0.16 * ab, t);
    rf.frequency.setValueAtTime(500 + 500 * ab, t);
  }
  // reheat thump
  { const o = ctx.createBufferSource(); o.buffer = noise(0.6, true); const g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 260; g.gain.setValueAtTime(1.4, CAP.light); g.gain.exponentialRampToValueAtTime(0.001, CAP.light + 0.55);
    o.connect(f).connect(g).connect(master); o.start(CAP.light); }
  // sonic boom: N-wave double bang + rolling rumble + sub thump
  {
    const len = Math.floor(sr * 3.2), b = ctx.createBuffer(2, len, sr); const r = rng(99);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let last = 0; const t0 = Math.floor(0.01 * sr), Ln = Math.floor(0.13 * sr);
      for (let i = 0; i < len; i++) {
        const t = i / sr; let v = 0;

        const w = r() * 2 - 1; last = (last + 0.04 * w) / 1.04;

    }
    const src = ctx.createBufferSource(); src.buffer = b;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const g = ctx.createGain(); g.gain.value = 1.1;
    const th = ctx.createOscillator(); th.frequency.setValueAtTime(52, CAP.boom); th.frequency.exponentialRampToValueAtTime(28, CAP.boom + 0.9);
    const tg = ctx.createGain(); tg.gain.setValueAtTime(0, 0); tg.gain.setValueAtTime(0.9, CAP.boom); tg.gain.exponentialRampToValueAtTime(0.001, CAP.boom + 1.2);
    src.connect(lp).connect(g).connect(master); th.connect(tg).connect(master);

  }
  // fade in/out
  master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(0.85, 0.4);
  master.gain.setValueAtTime(0.85, dur - 0.5); master.gain.linearRampToValueAtTime(0, dur);
  const buf = await ctx.startRendering();
  // 16-bit WAV, returned base64
  const n = buf.length, L = buf.getChannelData(0), Rr = buf.getChannelData(1);
  let peak = 1e-6; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(Rr[i]));
  const gain = Math.min(1, 0.89 / peak);
  const ab2 = new ArrayBuffer(44 + n * 4), dv = new DataView(ab2);
  const wstr = (o, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(o + i, str.charCodeAt(i)); };
  wstr(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); wstr(8, 'WAVE'); wstr(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);

// ============================================================================ flight state & input
const S = {
  x: 0, camX: 0, mach: CRUISE, target: CRUISE, abT: 0, ab: 0, vSmooth: 0, lead: 0,
  vap: 0, vapSeed: 0, shake: 0, shockT: 9, flash: 0, t: 0, pitch: 0,
};
function press() {
  initAudio();
  if (S.abT <= 0) lightSound();
  S.abT = 2.2;
  S.target = Math.min(Math.max(S.target, 1.3) + (S.mach > 1.0 ? 0.14 : 0), 1.85);
}
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); } if (e.key === 'm' || e.key === 'M') sndBtn.click(); });
function boom() {
  S.shake = 1; S.shockT = 0; S.flash = 0.22; S.vapSeed = Math.random() * 100;
  S.vap = 1;
  boomSound();
  // burst of dust along the whole shock footprint
  const mu = Math.asin(1 / 1.04), tanMu = Math.tan(mu);
  for (let i = 0; i < 420; i++) { const z = 14 - Math.random() * 110; spawnDust(S.x + 7 - Math.sqrt(ALT * ALT + z * z) / tanMu - Math.random() * 30, z, 1.0); }
}

rocks.init(0); bushes.init(0); updatePoles(0);

// ============================================================================ loop
const machEl = document.getElementById('machv');
const v3a = new THREE.Vector3(), v3b = new THREE.Vector3();
const toUv = (v, out) => { v.project(camera); return out.set(v.x * 0.5 + 0.5, v.y * 0.5 + 0.5); };
let last = performance.now(), lastMachTxt = '';
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tick(dt);
  requestAnimationFrame(frame);
}
function tick(dt) {
  S.t += dt;
  // --- flight model: reheat pushes toward the target Mach, drag pulls back to cruise
  S.abT -= dt;
  if (S.abT <= 0) S.target = CRUISE;
  const abOn = S.abT > 0 ? 1 : 0;
  S.ab += (abOn - S.ab) * (1 - Math.exp(-dt * (abOn ? 9 : 2.5)));
  const prevM = S.mach;
  const rate = S.target > S.mach ? 0.62 : 0.95;
  S.mach += (S.target - S.mach) * (1 - Math.exp(-dt * rate));
  if (Q.has('mach')) { S.mach = +Q.get('mach'); S.abT = 1; if (S.t < 0.1 && S.mach >= 1) boom(); }
  if (CAPTURE) { const c = capFlight(S.t); S.mach = c.mach; S.target = c.mach; S.abT = c.ab; }
  if (prevM < 1 && S.mach >= 1) boom();
  if (prevM >= 1 && S.mach < 1) { S.vapSeed = Math.random() * 100; }
  const trans = Math.exp(-Math.pow((S.mach - 1.0) / 0.06, 2));
  S.vap = Math.max(S.vap * Math.exp(-dt * 1.0), trans);
  const v = S.mach * 340 * VIS_K;
  S.x += v * dt;
  // camera lags acceleration so the jet surges ahead in frame, then settles
  S.vSmooth += (v - S.vSmooth) * (1 - Math.exp(-dt * 0.9));
  const leadT = THREE.MathUtils.clamp((v - S.vSmooth) * 0.06, -2.5, 3.5);
  S.lead += (leadT - S.lead) * (1 - Math.exp(-dt * 3));
  S.camX = CAPTURE ? S.x - 0.4 - S.lead * 0.55 : S.x - 1.2 - S.lead;
  // seamless wrap of the periodic world
  if (S.x > PERIOD * 1.5) {
    S.x -= PERIOD; S.camX -= PERIOD; S.vSmooth = S.vSmooth;
    rocks.shift(-PERIOD); bushes.shift(-PERIOD);
    for (const p of dustP) p.x -= PERIOD;
    for (const q of shedP) q.p.x -= PERIOD;
  }
  // --- jet attitude: low-level buffet
  const tb = S.t;
  const buff = 0.06 + 0.1 * Math.max(0, S.mach - 0.95) + 0.08 * S.ab;
  const bob = Math.sin(tb * 0.7) * 0.35 + Math.sin(tb * 1.9 + 1) * 0.12 + (Math.sin(tb * 23) * Math.sin(tb * 17.3)) * buff * 0.25;
  jet.position.set(S.x, ALT + bob, 0);
  S.pitch += ((Math.cos(tb * 0.7) * 0.35 * 0.7) * 0.02 - S.pitch) * (1 - Math.exp(-dt * 2));
  // pilot scans the horizon, glances our way now and then, and gets jolted by the boom
  const glance = Math.pow(Math.max(0, Math.sin(tb * 0.23 + 1.0)), 6);
  pilotHead.rotation.set(Math.sin(tb * 0.9) * 0.04 + S.shake * Math.sin(tb * 31) * 0.08,
    Math.sin(tb * 0.37) * 0.25 - glance * 0.9,
    Math.sin(tb * 0.29) * 0.06 - 0.04 + S.shake * Math.sin(tb * 27) * 0.06);
  jet.rotation.set(Math.sin(tb * 0.53) * 0.025 + Math.sin(tb * 13) * buff * 0.01, 0, S.pitch + Math.sin(tb * 19) * buff * 0.004);
  // --- effects
  // shocks oscillate: the cloud flickers, its rear edge jitters, and it slides aft as Mach climbs
  const flick = 0.8 + 0.2 * Math.sin(S.t * 37) * Math.sin(S.t * 23 + 1.3) + 0.08 * Math.sin(S.t * 71);
  const jit = Math.sin(S.t * 41) * Math.sin(S.t * 29 + 0.7) * 0.01;
  const vs = 0.85 + 0.3 * THREE.MathUtils.clamp(S.mach - 0.95, 0, 0.2) / 0.2;
  const xoff = -THREE.MathUtils.clamp(S.mach - 0.97, 0, 0.15) * 6;
  {
    const u = volMat.uniforms;
    u.uAmt.value = Math.min(1, S.vap * 1.3);
    u.uCol.value = Math.min(1, S.vap * (0.35 + 0.45 * Math.exp(-Math.pow((S.mach - 0.98) / 0.05, 2))));
    u.uFlick.value = 0.9 + 0.1 * flick;
    u.uTail.value = 0;
    u.uTime.value = S.t; u.uSeed.value = (S.vapSeed % 10) * 0.37; u.uJit.value = jit;

  plumeMat.uniforms.uAB.value = S.ab; plumeMat.uniforms.uTime.value = S.t;
  plume.visible = S.ab > 0.01;
  const pl = 0.55 + 0.45 * S.ab + 0.08 * Math.sin(S.t * 31) * S.ab;
  plume.scale.set(1, 0.9 + 0.1 * S.ab, 0.9 + 0.1 * S.ab);
  plume.position.x = (1 - pl) * 0; plumeMat.uniforms.uLen.value = PLUME_L;
  engineMat.emissiveIntensity = 0.4 + 9 * S.ab;
  // dust where the Mach cone touches the desert
  if (S.mach > 1.0) {
    const tanMu = 1 / Math.sqrt(S.mach * S.mach - 1);
    const n = Math.floor((500 + 900 * (S.mach - 1)) * dt + Math.random());
    for (let i = 0; i < n; i++) { const z = 12 - Math.pow(Math.random(), 1.5) * 90; spawnDust(S.x + 7 - Math.sqrt(ALT * ALT + z * z) / tanMu, z, Math.min(1, (S.mach - 1) * 3 + 0.3)); }
  }
  updateDust(dt);
  // --- camera
  S.shake *= Math.exp(-dt * 2.2);
  const sh = S.shake * S.shake * 0.45 + 0.02 + 0.05 * Math.max(0, S.mach - 1) + 0.025 * S.ab;
  const shx = (Math.sin(S.t * 41) * 0.6 + Math.sin(S.t * 67 + 2) * 0.4) * sh;
  const shy = (Math.sin(S.t * 53 + 1) * 0.6 + Math.sin(S.t * 29 + 4) * 0.4) * sh;
  const fovKick = VFOV + 2.2 * THREE.MathUtils.clamp(S.mach - CRUISE, 0, 1);
  if (Math.abs(camera.fov - fovKick) > 0.01) { camera.fov = fovKick; camera.updateProjectionMatrix(); }
  const d = view.dist;
  camera.position.set(S.camX + shx, ALT + 1.6 + d * 0.055 + shy, d);
  camera.lookAt(S.camX + shx * 0.5, ALT - 0.2 + shy * 0.5, 0);
  if (Q.has('closeup')) { const c = jet.localToWorld(new THREE.Vector3(2.7, 1.25, 4.2)); camera.position.copy(c); camera.lookAt(jet.localToWorld(new THREE.Vector3(2.6, 0.95, 0))); }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  terrain.position.x = Math.floor(S.camX / TERR_DX) * TERR_DX;
  rocks.update(S.camX); bushes.update(S.camX); updatePoles(S.camX);
  sunLight.target.position.set(S.x - 6, 0, -10);
  sunLight.position.copy(sunLight.target.position).addScaledVector(SUN, 200);
  // --- post uniforms in screen space
  toUv(v3a.set(NOZ_X, 0.02, 0).applyMatrix4(jet.matrixWorld), finalMat.uniforms.uNoz.value);
  const bp = toUv(v3b.set(NOZ_X - 10, 0.02, 0).applyMatrix4(jet.matrixWorld), new THREE.Vector2());
  const nz = finalMat.uniforms.uNoz.value;
  finalMat.uniforms.uNozDir.value.set(bp.x - nz.x, bp.y - nz.y);
  finalMat.uniforms.uHazeLen.value = bp.distanceTo(nz) * (innerWidth / innerHeight) * 1.0;
  finalMat.uniforms.uHazeW.value = bp.distanceTo(nz) * 0.06;
  finalMat.uniforms.uHazeAmt.value = 0.35 + 0.9 * S.ab;
  toUv(v3a.set(7.3, -0.03, 0).applyMatrix4(jet.matrixWorld), finalMat.uniforms.uNose.value);
  finalMat.uniforms.uMachAng.value = S.mach > 1 ? Math.asin(1 / S.mach) : 1.5;
  finalMat.uniforms.uMachAmt.value = THREE.MathUtils.smoothstep(S.mach, 1.0, 1.08);
  finalMat.uniforms.uMachLen.value = 0.75;
  S.shockT += dt;
  finalMat.uniforms.uShockC.value.copy(finalMat.uniforms.uNose.value);
  finalMat.uniforms.uShockR.value = S.shockT * 1.6;
  finalMat.uniforms.uShockAmt.value = S.shockT < 1.2 ? Math.pow(1 - S.shockT / 1.2, 2) : 0;
  S.flash *= Math.exp(-dt * 5);
  finalMat.uniforms.uFlash.value = S.flash;
  finalMat.uniforms.uTime.value = S.t;
  // --- audio
  if (actx) {
    const ct = actx.currentTime;
    engFilt.frequency.setTargetAtTime(380 + 260 * (S.mach - 0.8) + 700 * S.ab, ct, 0.1);
    engGain.gain.setTargetAtTime(0.28 + 0.3 * S.ab, ct, 0.1);
    roarGain.gain.setTargetAtTime(0.03 + 0.16 * S.ab, ct, 0.08);
    roarFilt.frequency.setTargetAtTime(500 + 500 * S.ab, ct, 0.1);
  }
  const mt = S.mach.toFixed(2);
  if (mt !== lastMachTxt) { machEl.textContent = mt; machEl.classList.toggle('super', S.mach >= 1); lastMachTxt = mt; }

  render(dt, v);
}

function render(dt, v) {
  // 1. scene (world + jet) -> HDR, MSAA, with depth
  camera.layers.set(0); camera.layers.enable(1);
  renderer.shadowMap.needsUpdate = true;
  renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
  // 2. jet coverage mask (the jet travels with the camera: it must stay sharp)
  camera.layers.set(1);
  scene.overrideMaterial = whiteMat;
  const fog = scene.fog; scene.fog = null; sky.visible = false;
  renderer.setClearColor(0x000000, 1);
  renderer.setRenderTarget(maskRT); renderer.render(scene, camera);
  scene.overrideMaterial = null;
  // 3. camera motion blur from depth: static world points slide by -v * shutter in view space
  const vel = v3a.set(-v * SHUTTER, 0, 0).transformDirection(camera.matrixWorldInverse).multiplyScalar(v * SHUTTER);
  blurMat.uniforms.uVel.value.copy(vel);
  blurMat.uniforms.tColor.value = sceneRT.texture; blurMat.uniforms.tDepth.value = sceneRT.depthTexture; blurMat.uniforms.tMask.value = maskRT.texture;
  blurMat.uniforms.uProj.value.copy(camera.projectionMatrix); blurMat.uniforms.uProjInv.value.copy(camera.projectionMatrixInverse);
  renderer.setRenderTarget(postRT); renderer.render(blurScene, orthoCam);
  // 4. jet depth, then vapour cone & afterburner on top (unblurred, they ride with the jet)
  renderer.autoClear = false;
  renderer.clearDepth();
  camera.layers.set(1); scene.overrideMaterial = depthOnlyMat; renderer.render(scene, camera);
  scene.overrideMaterial = null;
  camera.layers.set(2); renderer.render(scene, camera);
  // 4b. volumetric vapour cone: raymarched at half resolution against the scene depth, then composited
  if (volMat.uniforms.uAmt.value > 0.01 || volMat.uniforms.uCol.value > 0.01) {
    jet.updateMatrixWorld();
    const u = volMat.uniforms;
    u.tDepth.value = sceneRT.depthTexture;
    u.uProjInv.value.copy(camera.projectionMatrixInverse); u.uCamWorld.value.copy(camera.matrixWorld);
    _invJet.copy(jet.matrixWorld).invert(); u.uInvJet.value.copy(_invJet);
    jet.getWorldQuaternion(_q); u.uSunL.value.copy(SUN).applyQuaternion(_q.invert());
    renderer.autoClear = true; renderer.setRenderTarget(volRT); renderer.setClearColor(0x000000, 0); renderer.render(volScene, orthoCam);
    volCompMat.uniforms.tDepth.value = sceneRT.depthTexture; volCompMat.uniforms.uVolRes.value.set(volRT.width, volRT.height);
    renderer.autoClear = false; renderer.setRenderTarget(postRT); renderer.render(volCompScene, orthoCam);
  }
  renderer.autoClear = true;
  scene.fog = fog; sky.visible = true;
  camera.layers.set(0); camera.layers.enable(1);
  // 5. bloom (HDR) composited into postRT
  bloom.render(renderer, null, postRT, dt, false);
  // 6. lens, tone map, grain
  finalMat.uniforms.tColor.value = postRT.texture;
  renderer.setRenderTarget(null); renderer.render(finalScene, orthoCam);
}

if (!CAPTURE) requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); setTimeout(() => document.getElementById('loading').classList.add('done'), 350); });
else {
  // deterministic film: one fixed 1/30 s step per frame, driven by the recorder
  window.__frame = (i) => { while (S.t < i / 30 - 1e-6) tick(1 / 30); return S.t; };
  window.__soundtrack = renderSoundtrack;
  window.__ready = true;
}
if (Q.has('boom')) setTimeout(press, +Q.get('boom') || 1000);
</script>
