<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot');
if (SHOT) document.body.classList.add('shot');
const CAPTURE = Q.has('capture');
if (CAPTURE) document.body.classList.add('capture');

// ============================================================================ small utilities
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
function hash3(i, j, k) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1274126177)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = hash3(xi, yi, zi), b = hash3(xi + 1, yi, zi), c = hash3(xi, yi + 1, zi), d = hash3(xi + 1, yi + 1, zi);
  const e = hash3(xi, yi, zi + 1), f = hash3(xi + 1, yi, zi + 1), g = hash3(xi, yi + 1, zi + 1), h = hash3(xi + 1, yi + 1, zi + 1);
  return lerp(lerp(lerp(a, b, u), lerp(c, d, u), v), lerp(lerp(e, f, u), lerp(g, h, u), v), w);
}
function fbm3(x, y, z, o = 4) { let s = 0, a = 0.5, n = 0; for (let i = 0; i < o; i++) { s += a * noise3(x, y, z); n += a; x *= 2.03; y *= 2.03; z *= 2.03; a *= 0.5; } return s / n; }
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function ramp(stops, t) {
  if (t <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) return mix3(stops[i - 1][1], stops[i][1], sstep(0, 1, (t - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0])));
  return stops[stops.length - 1][1];
}
const toLin = (c) => Math.pow(clamp(c, 0, 1), 2.2);
function gauss(rng) { return Math.sqrt(-2 * Math.log(rng() + 1e-9)) * Math.cos(TAU * rng()); }
function fibDirs(n, rng, jit = 0) {
  const out = [], off = rng() * TAU;
  for (let i = 0; i < n; i++) {
    const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), th = i * 2.399963 + off;
    const v = new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r);
    if (jit) v.add(new THREE.Vector3(gauss(rng), gauss(rng), gauss(rng)).multiplyScalar(jit));
    out.push(v.normalize());
  }
  return out;
}

// ============================================================================ renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT });
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.autoClear = false;

// ============================================================================ geometry helpers (mushrooms, units = cm)
function finish(g) {
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'color') g.deleteAttribute(k);
  g = mergeVertices(g, 1e-4);
  g.computeVertexNormals();
  return g;
}
function colorize(g, fn) {
  const P = g.attributes.position, n = P.count, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const c = fn(P.getX(i), P.getY(i), P.getZ(i)); col[i * 3] = toLin(c[0]); col[i * 3 + 1] = toLin(c[1]); col[i * 3 + 2] = toLin(c[2]); }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
// lathe with per-vertex displacement (along the lathe normal) and colour; profile = [[r, y], ...] going up the outside
function lathe(profile, segs, colorFn, dispFn) {
  const pts = profile.map(p => new THREE.Vector2(Math.max(p[0], 0.0004), p[1]));
  const g = new THREE.LatheGeometry(pts, segs);
  const P = g.attributes.position, N = g.attributes.normal, UV = g.attributes.uv, n = P.count;
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
    const info = { x, y, z, t: UV.getY(i), r: Math.hypot(x, z), a: Math.atan2(z, x) };
    if (dispFn) { const d = dispFn(info); P.setXYZ(i, x + N.getX(i) * d, y + N.getY(i) * d, z + N.getZ(i) * d); }
    const c = colorFn(info);
    col[i * 3] = toLin(c[0]); col[i * 3 + 1] = toLin(c[1]); col[i * 3 + 2] = toLin(c[2]);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return finish(g);
}
function smoothProfile(pts, n) {
  const c = new THREE.SplineCurve(pts.map(p => new THREE.Vector2(p[0], p[1])));
  return c.getSpacedPoints(n).map(v => [v.x, v.y]);
}
// indexed grid; fn(i, j) -> {p:[x,y,z], c:[r,g,b]}; columns wrap if wrap=true
function gridGeo(rows, cols, fn, wrap = false) {
  const nc = wrap ? cols : cols + 1;
  const pos = new Float32Array((rows + 1) * nc * 3), col = new Float32Array((rows + 1) * nc * 3), idx = [];
  for (let i = 0; i <= rows; i++) for (let j = 0; j < nc; j++) {
    const o = fn(i, j), k = (i * nc + j) * 3;
    pos[k] = o.p[0]; pos[k + 1] = o.p[1]; pos[k + 2] = o.p[2];
    col[k] = toLin(o.c[0]); col[k + 1] = toLin(o.c[1]); col[k + 2] = toLin(o.c[2]);
  }
  const cc = wrap ? cols : cols;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cc; j++) {
    const j1 = wrap ? (j + 1) % nc : j + 1;
    const a = i * nc + j, b = i * nc + j1, c = (i + 1) * nc + j, d = (i + 1) * nc + j1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
// tube along a curve with variable radius; colorFn(t, angle, p) ; returns indexed geometry
function tubeGeo(curve, n, radial, radiusFn, colorFn, capEnd = false) {
  const frames = curve.computeFrenetFrames(n, false);
  const rows = [];
  const geo = gridGeo(n, radial, (i, j) => {
    const t = i / n, p = curve.getPointAt(t), N = frames.normals[i], B = frames.binormals[i];
    const a = j / radial * TAU, r = radiusFn(t, a, p);
    const v = p.clone().addScaledVector(N, Math.cos(a) * r).addScaledVector(B, Math.sin(a) * r);
    return { p: [v.x, v.y, v.z], c: colorFn(t, a, v) };
  }, true);
  return geo;
}
function alignQuat(n, yaw) {
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
  return q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw));
}
function placed(geo, pos, quat, scale) {
  const g = geo.clone();
  g.applyMatrix4(new THREE.Matrix4().compose(pos, quat, scale));
  return g;
}
function blobGeo(rng, det = 1, flat = 0.5, col = [0.93, 0.9, 0.78], lift = 0.25) {
  let g = new THREE.IcosahedronGeometry(1, det);
  g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const P = g.attributes.position, s = rng() * 100;
  for (let i = 0; i < P.count; i++) {
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i);
    const k = 0.72 + 0.55 * noise3(x * 1.6 + s, y * 1.6, z * 1.6);
    P.setXYZ(i, x * k, (y * k + lift) * flat, z * k);
  }
  colorize(g, (x, y) => { const t = 0.9 + 0.1 * y; return [col[0] * t, col[1] * t, col[2] * t]; });
  return finish(g);
}

// ============================================================================ mushroom materials
const MAT = {
  flesh: new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.62, sheen: 0.7, sheenRoughness: 0.45, sheenColor: new THREE.Color(0.32, 0.3, 0.28), side: THREE.DoubleSide }),
  cap: new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.4, clearcoat: 0.18, clearcoatRoughness: 0.45, sheen: 0.35, sheenRoughness: 0.6, sheenColor: new THREE.Color(0.5, 0.2, 0.12), side: THREE.DoubleSide }),
  matte: new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, side: THREE.DoubleSide }),
  lacq: new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.3, clearcoat: 1.0, clearcoatRoughness: 0.1, side: THREE.DoubleSide }),
};

// ---------------------------------------------------------------- procedural surface detail
// Object-space noise drives a bump (normal perturbation from screen derivatives), albedo mottling,
// cavity darkening and roughness variation. Octaves fade out with fwidth so nothing shimmers at distance.
const TEX_COMMON = /* glsl */`
varying vec3 vObjPos;
float th(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(th(i), th(i + vec3(1,0,0)), f.x), mix(th(i + vec3(0,1,0)), th(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(th(i + vec3(0,0,1)), th(i + vec3(1,0,1)), f.x), mix(th(i + vec3(0,1,1)), th(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbmA(vec3 p, float fw, int oct){ float s = 0.0, a = 0.5, f = 1.0;
  for (int i = 0; i < 6; i++){ if (i >= oct) break; s += a * clamp(1.6 - fw * f * 2.2, 0.0, 1.0) * (vn(p * f) - 0.5); f *= 2.03; a *= 0.5; p += 17.3; }
  return s * 2.0; }
float cellN(vec3 p){ vec3 i = floor(p), f = fract(p); float d = 8.0;
  for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++){
    vec3 o = vec3(float(x), float(y), float(z)); vec3 r = o + vec3(th(i + o), th(i + o + 13.1), th(i + o + 27.7)) * 0.85 - f; d = min(d, dot(r, r)); }
  return sqrt(d); }
vec3 bumpN(vec3 surf_pos, vec3 n, vec2 dH, float fd){
  vec3 sx = dFdx(surf_pos), sy = dFdy(surf_pos);
  vec3 R1 = cross(sy, n), R2 = cross(n, sx);
  float det = dot(sx, R1) * fd;
  vec3 g = sign(det) * (dH.x * R1 + dH.y * R2);
  return normalize(abs(det) * n - g);
}`;
const TEX_MODES = {
  // smooth, slightly sticky cap cuticle with soft mottling and wet/dry gloss patches
  skin: `float m1 = fbmA(p * 1.6, fw * 1.6, 4), m2 = fbmA(p * 9.0, fw * 9.0, 4), m3 = fbmA(vec3(p.x, p.y * 6.0, p.z) * 14.0, fw * 40.0, 3);
    h = 0.03 * m1 + 0.008 * m2 + 0.003 * m3;
    tint = vec3(1.0 + 0.22 * m1 + 0.1 * m2) * mix(vec3(1.0), vec3(0.86, 0.92, 1.05), smoothstep(0.1, 0.6, m1));
    rough = 0.26 + 0.36 * smoothstep(-0.3, 0.4, m2 + 0.5 * m1);`,
  // silky fibrous stems and veils: fibres run along the stem axis
  fiber: `float f1 = fbmA(vec3(p.x * 34.0, p.y * 2.2, p.z * 34.0), fw * 34.0, 4), g = fbmA(p * 5.0, fw * 5.0, 3);
    h = 0.007 * f1 + 0.012 * g;
    tint = vec3(1.0 + 0.16 * f1 + 0.1 * g) * vec3(1.0, 0.995, 0.97 + 0.04 * f1);
    rough = 0.5 + 0.22 * f1;`,
  // woolly, torn scales of the ink cap
  shaggy: `float f1 = fbmA(vec3(p.x * 20.0, p.y * 3.0, p.z * 20.0), fw * 20.0, 4), f2 = fbmA(p * 45.0, fw * 45.0, 3);
    h = 0.014 * f1 + 0.005 * f2;
    tint = vec3(1.0 + 0.2 * f1 + 0.1 * f2) * mix(vec3(1.0), vec3(0.95, 0.9, 0.82), smoothstep(0.0, 0.6, f1));
    rough = 0.7 + 0.2 * f2;`,
  // morel head: fine wrinkles and grain inside the pits and on the ridges
  morel: `float w = fbmA(p * 9.0, fw * 9.0, 4), c = cellN(p * 22.0), aa = clamp(1.5 - fw * 22.0 * 2.0, 0.0, 1.0);
    h = 0.012 * w - 0.006 * (1.0 - smoothstep(0.0, 0.5, c)) * aa;
    tint = vec3(1.0 + 0.3 * fbmA(p * 3.0, fw * 3.0, 3) + 0.15 * w) * mix(1.0, mix(0.8, 1.04, smoothstep(0.1, 0.5, c)), aa);
    rough = 0.62 + 0.2 * w;`,
  // granular / furfuraceous surfaces: puffball skin, morel stem, veil warts

// ============================================================================ state & UI
let si = clamp(parseInt(Q.get('s') ?? '0', 10) || 0, 0, SPECIES.length - 1);
let oi = clamp(parseInt(Q.get('m') ?? '3', 10), 0, OBJ.length - 1);
let slide = null;
const stage = { x: 0, y: 0 };
let focus = 4, hunt = { t0: -10, amp: 0 }, dark = 0, darkTarget = 1, pendingSwap = null, retOn = true;
const $ = id => document.getElementById(id);
const focusEl = $('focus');
const L = { x: 0, y: 0, w: 1, h: 1 }, C = { x: 0, y: 0, D: 100, cx: 0, cy: 0 };

const spNav = $('species');
SPECIES.forEach((s, i) => { const b = document.createElement('button'); b.className = 'pill'; b.textContent = s.latin.split(' ')[0]; b.title = s.latin; b.onclick = () => setSpecies(i); spNav.appendChild(b); });
const magNav = $('mags');
OBJ.forEach((o, i) => { const b = document.createElement('button'); b.className = 'pill'; b.innerHTML = `${o.mag}×<small>${o.sub}</small>`; b.onclick = () => setMag(i); magNav.appendChild(b); });
function syncButtons() {
  [...spNav.children].forEach((b, i) => b.classList.toggle('on', i === si));
  [...magNav.children].forEach((b, i) => b.classList.toggle('on', i === oi));
}
function setCard() {
  const s = SPECIES[si];
  $('cCommon').textContent = s.common; $('cLatin').textContent = s.latin;
  $('cFacts').innerHTML = s.facts.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
}
function updateReadout() {
  const o = OBJ[oi];
  const fov = o.fov >= 1000 ? (o.fov / 1000).toFixed(1) + ' mm' : o.fov + ' µm';
  const f = focus.toFixed(1);
  $('readout').innerHTML = `<b>${o.mag}×</b> &nbsp;·&nbsp; field ⌀ ${fov} &nbsp;·&nbsp; 1 div = ${o.div} µm &nbsp;·&nbsp; focus ${f} µm`;
}
function setMag(i, instant = false) {
  if (i === oi && !instant) return;
  const swap = () => { oi = i; if (slide) selectInstances(slide, oi, stage.x, stage.y); hunt = { t0: performance.now() / 1000, amp: OBJ[oi].u * (2.5 + Math.random() * 1.5) * (Math.random() < 0.5 ? -1 : 1) }; syncButtons(); updateReadout(); };
  if (instant) { swap(); return; }
  pendingSwap = swap; darkTarget = 0;
}
let lfade = $('lfade');
function setSpecies(i, instant = false) {
  if (i === si && !instant) return;
  const swap = () => {
    si = i;
    const grp = getMush(si);
    if (current) mushScene.remove(current);
    current = grp; mushScene.add(grp); renderer.shadowMap.needsUpdate = true;
    const v = SPECIES[si].view;
    orbit.target.set(...v.target); orbit.tDist = orbit.dist = v.dist * (Q.has('d') ? parseFloat(Q.get('d')) : 1); orbit.tPitch = orbit.pitch = v.pitch;
    mushScene.fog = new THREE.Fog(0x000000, v.dist * 0.98, v.dist * 1.45);
    slide = buildSlide(si);
    stage.x = slide.start[0]; stage.y = slide.start[1];
    focus = Q.has('f') ? parseFloat(Q.get('f')) : slide.focus0; focusEl.value = focus;
    selectInstances(slide, oi, stage.x, stage.y);
    setCard(); syncButtons(); updateReadout();
    hunt = { t0: performance.now() / 1000, amp: OBJ[oi].u * 3 };
  };
  if (instant) { swap(); return; }
  lfade.style.opacity = 1; $('card').style.opacity = 0; darkTarget = 0;
  pendingSwap = () => { swap(); setTimeout(() => { lfade.style.opacity = 0; $('card').style.opacity = 1; }, 60); };
}

// ---------------------------------------------------------------- layout
let W = 1, H = 1, portrait = false;
function layout() {
  W = innerWidth; H = innerHeight; portrait = W < H * 1.05;
  if (CAPTURE) {
    renderer.setSize(W, H, false);
    Object.assign(L, { x: 0, y: 0, w: W, h: H });
    const D = Math.round(Math.min(W, H) * 0.8);
    Object.assign(C, { D, cx: W / 2, cy: H / 2 + 4, x: W / 2 - D / 2, y: H / 2 + 4 - D / 2 });
    Object.assign(lfade.style, { left: 0, top: 0, width: W + 'px', height: H + 'px', transition: 'none' });
    mcamL.aspect = W / H; mcamL.updateProjectionMatrix();
    ensureRTs(clamp(Math.round(D * DPR), 256, 1280));
    return;
  }
  document.body.classList.toggle('portrait', portrait);
  renderer.setSize(W, H, false);
  const card = $('card').style, sp = spNav.style, mg = magNav.style, ro = $('readout').style, fw = $('fwrap').style, lf = lfade.style;
  if (!portrait) {
    Object.assign(L, { x: 0, y: 0, w: W * 0.5, h: H });
    const mw = W * 0.5, D = Math.min(mw * 0.8, H * 0.7);
    Object.assign(C, { D, cx: W * 0.5 + mw * 0.47, cy: H * 0.47 });
    card.left = 'clamp(16px, 3vw, 36px)'; card.top = '78px'; card.bottom = '';
    sp.left = '16px'; sp.width = (W * 0.5 - 32) + 'px'; sp.bottom = '18px'; sp.top = '';
    fw.left = (C.cx + D / 2 + 26) + 'px'; fw.top = (C.cy - 105) + 'px';
  } else {
    const lh = Math.round(H * 0.44);
    Object.assign(L, { x: 0, y: 0, w: W, h: lh });
    const D = Math.min(W * 0.88, (H - lh) * 0.66);
    Object.assign(C, { D, cx: W / 2, cy: lh + 30 + D / 2 + 24 });
    card.left = '16px'; card.top = '56px'; card.bottom = '';
    sp.left = '8px'; sp.width = (W - 16) + 'px'; sp.bottom = ''; sp.top = (lh - (spNav.offsetHeight || 34) - 6) + 'px';
    fw.left = (W / 2 - 110) + 'px'; fw.top = (C.cy + D / 2 + 58) + 'px';
  }
  C.x = C.cx - C.D / 2; C.y = C.cy - C.D / 2;
  mg.left = (C.cx - 260) + 'px'; mg.width = '520px'; mg.top = (C.cy + C.D / 2 + 16) + 'px';
  if (portrait) { mg.left = '8px'; mg.width = (W - 16) + 'px'; }
  ro.left = (C.cx - 300) + 'px'; ro.width = '600px'; ro.top = (C.cy - C.D / 2 - 30) + 'px';
  Object.assign(lf, { left: L.x + 'px', top: L.y + 'px', width: L.w + 'px', height: L.h + 'px' });
  mcamL.aspect = L.w / L.h; mcamL.updateProjectionMatrix();
  ensureRTs(clamp(Math.round(C.D * DPR), 256, 1280));
}
addEventListener('resize', layout);

// ---------------------------------------------------------------- input
const inScope = (x, y) => Math.hypot(x - C.cx, y - C.cy) < C.D / 2;
const inLeft = (x, y) => x >= L.x && x < L.x + L.w && y >= L.y && y < L.y + L.h;
let drag = null;
canvas.addEventListener('pointerdown', e => {
  const mode = inScope(e.clientX, e.clientY) ? 'pan' : inLeft(e.clientX, e.clientY) ? 'orbit' : null;
  if (!mode) return;
  drag = { mode, x: e.clientX, y: e.clientY, id: e.pointerId }; canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = mode === 'pan' ? 'grabbing' : 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (!drag) { canvas.style.cursor = inScope(e.clientX, e.clientY) ? 'grab' : inLeft(e.clientX, e.clientY) ? 'ew-resize' : 'default'; return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.mode === 'pan') {
    const k = OBJ[oi].fov / C.D;
    stage.x -= dx * k; stage.y += dy * k;
    const r = Math.hypot(stage.x, stage.y), lim = REG - OBJ[oi].fov * 0.25;
    if (r > lim) { stage.x *= lim / r; stage.y *= lim / r; }
  } else {
    orbit.tYaw -= dx * 0.006; orbit.tPitch = clamp(orbit.tPitch + dy * 0.004, -0.05, 0.9); orbit.idle = 0;
  }
});
const endDrag = () => { drag = null; canvas.style.cursor = 'default'; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (inScope(e.clientX, e.clientY)) {
    const o = OBJ[oi], step = Math.max(o.u, 0.35) * 0.012;
    setFocus(focus - e.deltaY * step);
  } else if (inLeft(e.clientX, e.clientY)) {
    const v = SPECIES[si].view; orbit.tDist = clamp(orbit.tDist * Math.exp(e.deltaY * 0.001), v.dist * 0.5, v.dist * 1.5);
  }
}, { passive: false });
function setFocus(f) { focus = clamp(f, -4, 26); focusEl.value = focus; updateReadout(); }
focusEl.addEventListener('input', () => { focus = parseFloat(focusEl.value); updateReadout(); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') setSpecies((si + 1) % SPECIES.length);
  else if (e.key === 'ArrowLeft') setSpecies((si + SPECIES.length - 1) % SPECIES.length);
  else if (e.key >= '1' && e.key <= '5') setMag(+e.key - 1);
  else if (e.key === 'ArrowUp') setFocus(focus + Math.max(OBJ[oi].u, 0.3) * 0.5);
  else if (e.key === 'ArrowDown') setFocus(focus - Math.max(OBJ[oi].u, 0.3) * 0.5);
  else if (e.key === 'r' || e.key === 'R') retOn = !retOn;
});

// ============================================================================ render
function renderScope(time) {
  const sl = slide; if (!sl) return;
  const o = OBJ[oi], S = RTS;
  if (o.mag > 100 && sl.last && Math.hypot(sl.last.cx - stage.x, sl.last.cy - stage.y) > o.fov * 0.12) selectInstances(sl, oi, stage.x, stage.y);
  mcam.left = stage.x - o.fov / 2; mcam.right = stage.x + o.fov / 2; mcam.top = stage.y + o.fov / 2; mcam.bottom = stage.y - o.fov / 2;
  mcam.position.set(0, 0, 200); mcam.updateProjectionMatrix();
  // focus hunting after an objective change: a damped wobble around the set focus
  const ht = time - hunt.t0, hv = ht < 2 ? hunt.amp * Math.exp(-ht * 3.2) * Math.cos(ht * 7.5) : 0;
  const f = focus + hv; SU.uFocus.value = f; SU.uTime.value = time;
  renderer.setScissorTest(false);
  renderer.setClearColor(0xffffff, 1);
  const ppu = S / o.fov;
  for (let i = 0; i < 10; i++) compU['t' + i].value = WHITE;
  if (o.mag <= 100) {
    SU.uZmin.value = -1e9; SU.uZmax.value = 1e9;
    const sig = 0.5 * Math.abs(f - sl.focus0) * o.k * ppu;
    if (sig > 0.4) {
      renderer.setRenderTarget(rtA); renderer.clear(); renderer.render(sl.scene, mcam);
      blur(rtA, rtB, 1 / S, 0, sig); blur(rtB, rtC, 0, 1 / S, sig);
    } else { renderer.setRenderTarget(rtC); renderer.clear(); renderer.render(sl.scene, mcam); }
  } else {
    const u = o.u;
    SU.uZmin.value = f - 0.5 * u; SU.uZmax.value = f + 0.5 * u;
    renderer.setRenderTarget(rtC); renderer.clear(); renderer.render(sl.scene, mcam);
    let j = 0;
    for (const side of [-1, 1]) for (let k = 0; k < 5; k++) {
      const lo = EDGES[k] * u, hi = EDGES[k + 1] * u;
      const zmin = side > 0 ? f + lo : f - hi, zmax = side > 0 ? f + hi : f - lo;
      if (zmax < -2 || zmin > MOUNT + 3) { j++; continue; }
      SU.uZmin.value = zmin; SU.uZmax.value = zmax;
      renderer.setRenderTarget(rtA); renderer.clear(); renderer.render(sl.scene, mcam);
      const sig = (0.5 * REP[k] * u * o.k + 0.1) * ppu;
      blur(rtA, halfTmp, 1 / S, 0, sig); blur(halfTmp, half[j], 0, 2 / S, sig * 0.5);
      compU['t' + j].value = half[j].texture; j++;
    }
  }
  compU.tC.value = rtC.texture;
  compU.uDpx.value = C.D * DPR;
  compU.uRetLen.value = 100 * o.div / o.fov * C.D * DPR;
  compU.uRetDiv.value = o.div / o.fov * C.D * DPR;
  compU.uRetOn.value = retOn ? 1 : 0;
  compU.uDark.value = dark;
  quad.material = compMat;
  renderer.setRenderTarget(null);
  renderer.setViewport(C.x, H - C.y - C.D, C.D, C.D);
  renderer.setScissor(C.x, H - C.y - C.D, C.D, C.D); renderer.setScissorTest(true);
  renderer.render(postScene, postCam);
}
function renderMush(dt) {
  if (!current) return;
  orbit.idle += dt;
  if (!drag && orbit.idle > 2.5) orbit.tYaw += dt * 0.08;
  const k = 1 - Math.exp(-dt * 6);
  orbit.yaw = lerp(orbit.yaw, orbit.tYaw, k); orbit.pitch = lerp(orbit.pitch, orbit.tPitch, k); orbit.dist = lerp(orbit.dist, orbit.tDist, k);
  const t = orbit.target;
  mcamL.position.set(t.x + Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist, t.y + Math.sin(orbit.pitch) * orbit.dist, t.z + Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist);
  mcamL.lookAt(t);
  renderer.setRenderTarget(null);
  renderer.setViewport(L.x, H - L.y - L.h, L.w, L.h);
  renderer.setScissor(L.x, H - L.y - L.h, L.w, L.h); renderer.setScissorTest(true);
  renderer.render(mushScene, mcamL);
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const time = now / 1000;
  // objective / slide changes go dark while the turret turns
  if (pendingSwap && dark < 0.02) { const s = pendingSwap; pendingSwap = null; s(); darkTarget = 1; }
  dark += (darkTarget - dark) * (1 - Math.exp(-dt * (darkTarget > dark ? 5 : 16)));
  if (pendingSwap && dark < 0.05) dark = 0;
  renderer.setScissorTest(false); renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1); renderer.clear();
  renderScope(time);
  renderMush(dt);
  requestAnimationFrame(frame);
}

// ============================================================================ capture film
// Deterministic: the recorder calls __frame(i) once per 1/30 s. Each species: the mushroom turning, a push in
// and fade, then the eyepiece stepping through the objectives (dark turret turn + focus hunt at each change).
const FILM = (Q.get('film') || '0,2,3').split(',').map(Number);
const FILM_OFF = { 0: [30, 140], 2: [-150, 150] };   // per-species stage offset (µm) to centre a clean patch of spores
const MUSH_T = 3.8, HOLDS = [1.2, 1.3, 1.6, 1.8, 2.0], SEG = MUSH_T + HOLDS.reduce((a, b) => a + b, 0);
const capEl = { c1: document.querySelector('#cap .c1'), c2: document.querySelector('#cap .c2'), cap: $('cap'), mb: document.querySelector('#magl b'), ms: document.querySelector('#magl small'), mag: $('magl') };
let filmSp = -1, filmOi = -1;
function filmFrame(i) {
  const T = i / 30, n = Math.floor(T / SEG), done = n >= FILM.length;
  const seg = Math.min(n, FILM.length - 1), t = T - seg * SEG;
  if (FILM[seg] !== filmSp) { filmSp = FILM[seg]; filmOi = -1; setSpecies(filmSp, true); }
  const sp = SPECIES[filmSp];
  renderer.setScissorTest(false); renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1); renderer.clear();
  if (t < MUSH_T) {
    // mushroom: slow turn, gentle push, then a quick dive toward the gills and a fade to black
    const v = sp.view, dive = sstep(MUSH_T - 0.85, MUSH_T, t);
    orbit.target.set(...v.target);
    orbit.yaw = orbit.tYaw = 0.35 + t * 0.16;
    orbit.pitch = orbit.tPitch = v.pitch - dive * 0.08;
    orbit.dist = orbit.tDist = v.dist * (0.8 - t * 0.03) * (1 - 0.42 * dive);
    renderMush(0);
    lfade.style.opacity = Math.max(seg > 0 ? 1 - sstep(0, 0.45, t) : 0, sstep(MUSH_T - 0.45, MUSH_T, t));
    capEl.c1.textContent = sp.common; capEl.c2.textContent = sp.latin;
    capEl.cap.style.opacity = Math.min(sstep(0.1, 0.5, t), 1 - sstep(MUSH_T - 0.4, MUSH_T, t)) + (seg === 0 && t < 0.5 ? 1 : 0);
    capEl.mag.style.opacity = 0;
  } else {
    // eyepiece: objectives in turn, slide drifting slowly under the lens
    lfade.style.opacity = 0;
    let u = t - MUSH_T, k = 0;
    while (k < HOLDS.length - 1 && u >= HOLDS[k]) { u -= HOLDS[k]; k++; }
    if (k !== filmOi) {
      filmOi = k; oi = k; selectInstances(slide, oi, stage.x, stage.y);
      hunt = { t0: T, amp: OBJ[oi].u * 2.4 * (k % 2 ? -1 : 1) };
    }
    const o = OBJ[oi], hold = HOLDS[k], ang = 0.9 + filmSp * 1.7;
    const drift = o.fov * 0.05 * (u - hold / 2);
    const off = (window.__off || FILM_OFF)[filmSp] || [0, 0];
    stage.x = slide.start[0] + off[0] + Math.cos(ang) * drift; stage.y = slide.start[1] + off[1] + Math.sin(ang) * drift;
    const last = k === HOLDS.length - 1;
    const dIn = k === 0 ? sstep(0, 0.4, u) : sstep(0, 0.16, u), dOut = last ? 1 - sstep(hold - 0.45, hold, u) : 1 - sstep(hold - 0.12, hold, u);
    dark = Math.min(dIn, dOut);
    renderScope(T);
    capEl.c1.textContent = 'spores of ' + sp.common.split(' · ')[0].toLowerCase(); capEl.c2.textContent = sp.latin;
    const capA = Math.min(sstep(0, 0.4, t - MUSH_T), last ? 1 - sstep(hold - 0.4, hold, u) : 1);
    capEl.cap.style.opacity = capA; capEl.mag.style.opacity = capA;
    capEl.mb.textContent = o.mag + '×';
    capEl.ms.textContent = 'field ⌀ ' + (o.fov >= 1000 ? (o.fov / 1000).toFixed(1) + ' mm' : o.fov + ' µm');
  }
  return { t: T, done: done || T >= SEG * FILM.length - 1 / 60 };
}

// ============================================================================ boot
layout();
if (CAPTURE) {
  setTimeout(() => {
    FILM.forEach(i => { getMush(i); buildSlide(i); });
    retOn = true;
    window.__frame = filmFrame; window.__frames = Math.round(SEG * FILM.length * 30);
    window.__ready = true;
  }, 30);
} else setTimeout(() => {
  setSpecies(si, true); setMag(oi, true);
  dark = 0; darkTarget = 1;
  $('loading').classList.add('done');
  requestAnimationFrame(frame);
  // warm the other species in the background so switching is quick
  let k = 1;
  const warm = () => { if (k >= SPECIES.length) return; const i = (si + k++) % SPECIES.length; getMush(i); buildSlide(i); setTimeout(warm, 200); };
  setTimeout(warm, 1500);
}, 30);
</script>
</body>
