<!-- ============================================================================================
     The voice: a JS port of the idea behind CHIMERA (github.com/jamesondh/chimera-vocal-synth):
     every sound comes from a simulated airway, not samples. Here each jumper owns a small
     Kelly-Lochbaum waveguide tract (glottis -> pharynx -> tongue -> lips) driven by an LF
     glottal pulse, with aspiration, turbulence at constrictions and release bursts for stops.
     Phrases are articulatory targets (tongue, lips, constrictions, pitch, lung pressure)
     that glide in time, so "wheee", "oof" and "blblbl" are gestures, not recordings.
     ============================================================================================ -->
<script id="worklet" type="text/plain">
const TAU = Math.PI * 2;
let seed = 1234567;
const noise = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 2147483648 - 1; };

class BP {
  constructor(f, q) { const w = TAU * f / sampleRate, a = Math.sin(w) / (2 * q), a0 = 1 + a; this.b0 = a / a0; this.b2 = -a / a0; this.a1 = -2 * Math.cos(w) / a0; this.a2 = (1 - a) / a0; this.x1 = this.x2 = this.y1 = this.y2 = 0; }
  run(x) { const y = this.b0 * x + this.b2 * this.x2 - this.a1 * this.y1 - this.a2 * this.y2; this.x2 = this.x1; this.x1 = x; this.y2 = this.y1; this.y1 = y; return y; }
}

// Liljencrants-Fant glottal flow derivative, parameterised by tenseness (Rd)
function lf(tense) {
  const Rd = Math.min(2.7, Math.max(0.5, 3 * (1 - tense)));
  const Ra = -0.01 + 0.048 * Rd, Rk = 0.224 + 0.118 * Rd;
  const Rg = (Rk / 4) * (0.5 + 1.2 * Rk) / (0.11 * Rd - Ra * (0.5 + 1.2 * Rk));
  const Ta = Ra, Tp = 1 / (2 * Rg), Te = Tp + Tp * Rk;
  const eps = 1 / Ta, shift = Math.exp(-eps * (1 - Te)), Delta = 1 - shift;
  let rhs = (1 / eps) * (shift - 1) + (1 - Te) * shift; rhs /= Delta;
  const lower = -(Te - Tp) / 2 + rhs, upper = -lower;
  const omega = Math.PI / Tp, s = Math.sin(omega * Te);
  const y = -Math.PI * s * upper / (Tp * 2), z = Math.log(y), alpha = z / (Tp / 2 - Te), E0 = -1 / (s * Math.exp(alpha * Te));
  return { alpha, E0, eps, shift, Delta, Te, omega };
}
const lfAt = (L, t) => t > L.Te ? (-Math.exp(-L.eps * (t - L.Te)) + L.shift) / L.Delta : L.E0 * Math.exp(L.alpha * t) * Math.sin(L.omega * t);

const KEYS = ['f0', 'vol', 'breath', 'tense', 'tI', 'tD', 'lip', 'cI', 'cD', 'vib', 'vibR', 'bend'];
const SAMPLE_KEYS = new Set(['f0', 'vol', 'breath', 'bend']);

class Voice {
  constructor(o) {
    const n = this.n = o.n; this.s = n / 44;
    this.bladeStart = Math.round(10 * this.s); this.tipStart = Math.round(32 * this.s); this.lipStart = Math.round(39 * this.s);
    this.R = new Float32Array(n); this.L = new Float32Array(n); this.jR = new Float32Array(n + 1); this.jL = new Float32Array(n + 1);
    this.k = new Float32Array(n + 1); this.d = new Float32Array(n); this.rest = new Float32Array(n);
    for (let i = 0; i < n; i++) this.rest[i] = i < 7 * this.s - 0.5 ? 0.6 : i < 12 * this.s ? 1.1 : 1.5;
    this.quant = o.quant || 0;
    this.tgt = { f0: o.f0, vol: 0, breath: 0, tense: o.tense, tI: 20, tD: 3, lip: 1.4, cI: 30, cD: 5, vib: o.vib || 0.15, vibR: 5.2, bend: 1 };
    this.cur = Object.assign({}, this.tgt);
    this.coef = {}; for (const k of KEYS) this.coef[k] = 0.01;
    this.base = { tense: o.tense, vib: o.vib || 0.15, vibR: 5.2 };
    this.q = [];
    this.phase = 0; this.L_ = lf(o.tense); this.vibPh = Math.random(); this.jit = 0;
    this.asp = new BP(500, 0.5); this.fric = new BP(o.fricF || 2200, 0.6); this.burst = new BP(1800, 0.7);
    this.wasClosed = false; this.trA = 0; this.trT = 1; this.trI = 0;
    this.fricI = 0; this.fricS = 0; this.lipClosed = 0; this.hum = 0; this.dc1 = 0; this.dc2 = 0;
    this.shape();
  }
  setGlide(k, ms, block) { const n = Math.max(1, ms / 1000 * sampleRate / (block ? 128 : 1)); this.coef[k] = 1 - Math.exp(-1 / n); }
  apply(step) {
    for (const k in step.p) {
      if (!(k in this.tgt)) continue;
      this.tgt[k] = step.p[k];
      const ms = k === 'f0' ? (step.gf ?? Math.max(step.g, 50)) : k === 'vol' ? (step.gv ?? step.g) : step.g;
      this.setGlide(k, ms, !SAMPLE_KEYS.has(k));
    }
  }
  shape() {
    const { n, s, d, rest } = this, c = this.cur;
    const tI = c.tI * s, tD = c.tD, bs = this.bladeStart, ts = this.tipStart, ls = this.lipStart;
    for (let i = 0; i < n; i++) d[i] = rest[i];
    for (let i = bs; i < ls; i++) {
      const t = 1.1 * Math.PI * (tI - i) / (ts - bs);
      const ftd = 2 + (tD - 2) / 1.5;
      let curve = (1.5 - ftd + 1.7) * Math.cos(t);
      if (i === bs - 2 || i === ls - 1) curve *= 0.8;
      if (i === bs || i === ls - 2) curve *= 0.94;
      d[i] = 1.5 - curve;
    }
    for (let i = ls; i < n; i++) d[i] = Math.min(d[i], c.lip);
    if (c.cD < 3) {
      const index = c.cI * s, ix44 = c.cI;
      let width = ix44 < 25 ? 10 : ix44 >= 32 ? 5 : 10 - 5 * (ix44 - 25) / 7; width *= s;
      const ii = Math.round(index);
      for (let j = -Math.ceil(width) - 1; j < width + 1; j++) {
        const i = ii + j; if (i < 2 || i >= n) continue;
        const rel = Math.abs(i - index) - 0.5;
        const shrink = rel <= 0 ? 0 : rel > width ? 1 : 0.5 * (1 - Math.cos(Math.PI * rel / width));
        if (c.cD < d[i]) d[i] = c.cD + (d[i] - c.cD) * shrink;
      }
    }
    // reflections, closure tracking
    let dmin = 9, imin = 0;
    for (let i = Math.round(12 * s); i < n; i++) { if (d[i] < dmin) { dmin = d[i]; imin = i; } }
    for (let i = 1; i < n; i++) {
      const a0 = d[i - 1] * d[i - 1], a1 = d[i] * d[i];
      this.k[i] = a0 + a1 < 1e-6 ? 0.999 : (a0 - a1) / (a0 + a1);
    }
    const lung = Math.max(c.vol, c.breath * 1.4, this.tgt.vol * 0.8);
    const closed = dmin < 0.03;
    if (this.wasClosed && dmin > 0.1) { this.trA = 0.12 + 0.35 * lung; this.trT = 0; this.trI = Math.min(n - 1, imin + 1); }
    this.wasClosed = closed;
    this.fricI = Math.min(n - 1, imin + 1);
    this.fricS = !closed && dmin < 0.45 ? (0.45 - dmin) / 0.45 * lung * 0.9 : 0;
    this.lipClosed = Math.max(0, 1 - c.lip / 0.12);
  }
  block(out, off, len) {
    const c = this.cur, t = this.tgt, cf = this.coef;
    for (const k of KEYS) if (!SAMPLE_KEYS.has(k)) c[k] += (t[k] - c[k]) * cf[k];
    this.shape();
    const { n, R, L, jR, jL, k } = this;
    for (let j = 0; j < len; j++) {
      c.f0 += (t.f0 - c.f0) * cf.f0; c.vol += (t.vol - c.vol) * cf.vol; c.breath += (t.breath - c.breath) * cf.breath; c.bend += (t.bend - c.bend) * cf.bend;
      this.vibPh += c.vibR / sampleRate; if (this.vibPh > 1) this.vibPh -= 1;
      let f = c.f0 * c.bend * Math.pow(2, (c.vib * Math.sin(TAU * this.vibPh)) / 12) * (1 + this.jit);
      if (this.quant) f = 55 * Math.pow(2, Math.round(12 * Math.log2(f / 55)) / 12);
      this.phase += f / sampleRate;
      if (this.phase >= 1) { this.phase -= 1; this.L_ = lf(c.tense); this.jit = this.jit * 0.6 + noise() * 0.006; }
      const op = Math.max(0, Math.sin(TAU * this.phase));
      const g = lfAt(this.L_, this.phase) * c.vol;
      const asp = this.asp.run(noise()) * (c.breath * 1.6 + c.vol * (1 - Math.sqrt(c.tense)) * 0.5 * (0.3 + 0.7 * op));
      const gin = g * 0.9 + asp;
      const fr = this.fricS > 0.001 ? this.fric.run(noise()) * this.fricS : 0;
      let tr = 0;
      if (this.trT < 0.06) { tr = this.trA * Math.pow(2, -200 * this.trT) * (this.trT < 0.0004 ? 1 : 0) + this.trA * Math.exp(-this.trT * 90) * this.burst.run(noise()) * 0.8; this.trT += 1 / sampleRate; }
      let lip = 0;
      for (let h = 0; h < 2; h++) {
        jR[0] = L[0] * 0.75 + gin;
        jL[n] = R[n - 1] * -0.85;
        for (let i = 1; i < n; i++) { const w = k[i] * (R[i - 1] + L[i]); jR[i] = R[i - 1] - w; jL[i] = L[i] + w; }
        if (fr) { const i = this.fricI; jR[i] += fr * 0.5; jL[i] += fr * 0.5; }
        if (tr) { const i = this.trI; jR[i] += tr * 0.5; jL[i] += tr * 0.5; }
        for (let i = 0; i < n; i++) { R[i] = jR[i] * 0.999; L[i] = jL[i + 1] * 0.999; }
        lip += R[n - 1];
      }
      this.hum += (g - this.hum) * 0.05;
      let y = lip * 0.5 + this.hum * 0.5 * this.lipClosed;
      // dc block + gentle saturation
      const yy = y - this.dc1 + 0.995 * this.dc2; this.dc1 = y; this.dc2 = yy;
      out[off + j] = Math.tanh(yy * 0.55) * 0.8;
    }
  }
}

// trampoline / impact sounds: a pool of two-pole resonators plus a falling sine "thwump"
class Foley {
  constructor() {
    this.N = 40; this.y1 = new Float32Array(this.N); this.y2 = new Float32Array(this.N); this.a1 = new Float32Array(this.N); this.a2 = new Float32Array(this.N); this.x = new Float32Array(this.N); this.rr = 0;
    this.sw = []; this.slap = 0; this.slapF = new BP(380, 0.7); this.hiss = new BP(5200, 1.2);
  }
  ring(f, dec, amp) {
    const i = this.rr++ % this.N, w = TAU * f / sampleRate, r = Math.exp(-1 / (dec * sampleRate));
    this.a1[i] = 2 * r * Math.cos(w); this.a2[i] = -r * r; this.x[i] += amp * Math.sin(w);
  }
  thump(a, tone) {
    this.sw.push({ ph: 0, t: 0, f0: 105 * tone, f1: 42 * tone, amp: a * 0.9 });
    if (this.sw.length > 6) this.sw.shift();
    this.slap = Math.min(1.5, this.slap + a * 0.6);
  }
  bonk(a) { this.ring(640, 0.07, a * 0.7); this.ring(1190, 0.05, a * 0.45); this.ring(2370, 0.03, a * 0.2); }
  clank(a) { for (const f of [410, 777, 1213, 1838, 2610]) this.ring(f * (0.98 + Math.random() * 0.04), 0.5, a * 0.18); }
  block(out, len) {
    const { N, y1, y2, a1, a2, x } = this;
    for (let j = 0; j < len; j++) {
      let s = 0;
      for (let i = 0; i < N; i++) { const y = a1[i] * y1[i] + a2[i] * y2[i] + x[i]; x[i] = 0; y2[i] = y1[i]; y1[i] = y; s += y; }
      for (const w of this.sw) { const f = w.f1 + (w.f0 - w.f1) * Math.exp(-w.t * 22); w.ph += f / sampleRate; s += Math.sin(TAU * w.ph) * w.amp * Math.exp(-w.t * 9) * Math.min(1, w.t * 900); w.t += 1 / sampleRate; }
      if (this.slap > 1e-4) { s += this.slapF.run(noise()) * this.slap * 0.9 + this.hiss.run(noise()) * this.slap * 0.08; this.slap *= 0.9975; }
      out[j] = Math.tanh(s * 0.7);
    }
    this.sw = this.sw.filter(w => w.t < 0.8);
  }
}

// the stands: a few hundred hands (independent filtered-noise claps) plus a handful of
// buzzy formant voices going "wooo!", "yaaay!" or "awww", and someone's two-finger whistle
class Crowd {
  constructor() {
    this.t = 99; this.dur = 0; this.amp = 0; this.mood = 1; this.claps = []; this.vox = []; this.wh = null;
    this.bands = [new BP(1000, .9), new BP(1700, 1), new BP(2700, 1.2)]; this.ex = [0, 0, 0]; this.hub = new BP(550, .6);
  }
  start(m) {
    this.t = 0; this.dur = m.dur; this.amp = m.amp; this.mood = m.mood; this.vox = [];
    const n = m.mood > 0 ? 10 : m.mood < 0 ? 8 : 3;
    for (let i = 0; i < n; i++) {
      const hi = Math.random() < .5, f0 = hi ? 240 + Math.random() * 160 : 105 + Math.random() * 75, k = hi ? 1.15 : 1;
      const kind = m.mood < 0 ? 'aww' : Math.random() < .55 ? 'woo' : 'yay';
      const F = kind === 'woo' ? [340, 820] : kind === 'yay' ? [640, 1750] : [720, 1150];
      this.vox.push({ f0, kind, ph: Math.random(), st: Math.random() * (m.mood < 0 ? .15 : .6), len: (m.mood < 0 ? .7 : .45) + Math.random() * .8,

  const r = canvas.getBoundingClientRect();
  // jumpers first: nearest projected body within reach
  let best = null, bd = 1e9;
  for (const j of live().filter(j => !j.landed)) {
    vtmp.set(j.x, j.y, j.z).project(camera);
    const px = (vtmp.x * .5 + .5) * r.width, py = (-vtmp.y * .5 + .5) * r.height;
    const dd = Math.hypot(px - (e.clientX - r.left), py - (e.clientY - r.top));
    vtmp.set(j.x + Math.max(j.def.rx, j.def.ry), j.y, j.z).project(camera);
    const rad = Math.max(30, Math.abs((vtmp.x * .5 + .5) * r.width - px) * 1.4);
    if (dd < rad && dd < bd) { bd = dd; best = j; }
  }
  if (best) { megaBounce(best); return; }
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(plane, hit) && Math.hypot(hit.x, hit.z) < RM - 0.1) {
    poke(hit.x, hit.z, 4.5); ripples.push({ x: hit.x, z: hit.z, r: 0.05, t: 0, s: 6 });
    post({ type: 'thump', amp: .4, tone: 1.2 });
  }
});
function stomp() { poke(0, 0, 7, 0.45); ripples.push({ x: 0, z: 0, r: .05, t: 0, s: 8 }); post({ type: 'thump', amp: .6, tone: .8 }); }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!soundOn && !audioInit) setSound(true); stomp(); }
  if (e.key === 'm' || e.key === 'M') setSound(!soundOn);
  const n = parseInt(e.key); if (n >= 1 && n <= JUMPERS.length) choose(n - 1);
});

// ---------------------------------------------------------------- main loop
const SUB = 1 / 960;
function tick(dt) {
  simT += dt;
  stageTick();
  const ON = live();
  // the camera tilts up a little to keep the performer in frame on big jumps (but lets the exit fly off)
  const act = stage.act, k = clamp(dt * 5);
  let tx = 0, ty = .85, tz = 0;
  if (act && act.leaving >= 2) { tx = act.pad.x * .45; tz = act.pad.z * .45; ty = .5 + clamp((act.y - 1.0) * .85, 0, 2.6); }
  else if (act) ty = .85 + clamp((act.y - 1.0) * .9, 0, 3);
  controls.target.x += (tx - controls.target.x) * k; controls.target.y += (ty - controls.target.y) * k; controls.target.z += (tz - controls.target.z) * k;
  const n = Math.ceil(dt / SUB), h = dt / n, events = [];
  const PH = ON.filter(j => !j.landed);
  for (const j of PH) j.gatherKernel();
  for (let s = 0; s < n; s++) {
    F.fill(0);
    for (const j of PH) j.physics(h, events);
    matStep(h);
  }
  for (const [type, j, v] of events) type === 'land' ? onLand(j, v) : onTakeoff(j);
  for (const j of ON) {
    if (!j.cSub && !j.leaving && j.prevVyAir > 0 && j.vy <= 0) onApex(j);
    j.prevVyAir = j.cSub ? 0 : j.vy;
  }
  // after a seat drop or a flop, scramble back onto your feet (the legs unfold and pop you up)
  for (const j of ON) {
    if (j.cSub && j.mode !== 'feet') { j.lowT = (j.lowT || 0) + dt; if (j.lowT > (j.landed ? 1.0 : 0.45)) { if (j.landed) j.y = PAD_TOP + j.probeFeet; j.mode = 'feet'; j.nextMode = null; j.lowT = 0; j.gatherKernel(); } }
    else j.lowT = 0;
  }
  if (bottomed > 0) { post({ type: 'clank', amp: clamp(bottomed / 6, .3, 1.2) }); bottomed = 0; }
  collide();
  for (const j of ON) { if (j.pending && simT >= j.pending.at) { speak(j, j.pending.name); j.pending = null; } animate(j, dt); }
  for (let i = ripples.length - 1; i >= 0; i--) { const rp = ripples[i]; rp.t += dt; rp.r += dt * (1.5 + rp.s * .25); if (rp.t > .7) ripples.splice(i, 1); }
  // stereo: pan each voice by where its owner sits on screen
  for (const j of ON) {
    vtmp.set(j.x, j.y, j.z).project(camera); const pan = clamp(vtmp.x * .8, -.9, .9);
    if (CAPTURE) panLog.push([simT, j.i, pan]);
    if (ac && soundOn && panners[j.i]) panners[j.i].pan.setTargetAtTime(pan, ac.currentTime, .05);
  }
}
function render(dt) {
  drawMat();
  for (const j of live()) drawJumper(j);
  composer.render();
  updateBubbles(dt);
  if (!CAPTURE) drawSlots(simT);
}

if (CAPTURE) {
  window.__frame = i => { const target = i / 30; while (simT < target - 1e-6) { const d = Math.min(1 / 60, target - simT); tick(d); } controls.update(1 / 30); render(1 / 30); return simT; };
  window.__renderAudio = async secs => { // -> base64 16-bit stereo WAV of the first `secs` of what has been captured
    const SR = 48000, off = new OfflineAudioContext(2, Math.ceil(secs * SR), SR);
    const g = await buildAudio(off, capLog.filter(e => e.t < secs).map(e => ({ f: Math.round(e.t * SR), m: e.m })));
    g.master.gain.value = .9;
    for (const [t, i, v] of panLog) if (t < secs) g.panners[i].pan.linearRampToValueAtTime(v, t);
    const buf = await off.startRendering(), n = buf.length, L = buf.getChannelData(0), Rr = buf.getChannelData(1);
    const wav = new DataView(new ArrayBuffer(44 + n * 4)), str = (o, x) => { for (let i = 0; i < x.length; i++) wav.setUint8(o + i, x.charCodeAt(i)); };
    str(0, 'RIFF'); wav.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 2, true);
    wav.setUint32(24, SR, true); wav.setUint32(28, SR * 4, true); wav.setUint16(32, 4, true); wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) { wav.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); wav.setInt16(46 + i * 4, clamp(Rr[i], -1, 1) * 32767, true); }
    const b = new Uint8Array(wav.buffer); let s = ''; for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode(...b.subarray(i, i + 32768));
    return btoa(s);
  };
  window.__ready = true;
} else {
  let last = performance.now() / 1000;
  const loop = () => {
    const now = performance.now() / 1000, dt = Math.min(1 / 30, now - last); last = now;
    tick(dt); controls.update(dt); render(dt);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  if (AUDIOREC) { setSound(true); window.__ready = true; }
}
</script>
