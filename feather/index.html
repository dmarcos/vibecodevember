  }
}

// plucking / regrowth
function pluck(n) {
  let any = false;

    if (tuftsAlive <= 0) { looseFeather(); continue; }
    let i = -1;
    for (let tries = 0; tries < 30; tries++) { const j = randInt(0, NT - 1); if (TUFT[j].alive) { i = j; break; } }
    if (i < 0) break;
    const t = TUFT[i]; t.alive = false; t.g = 0; t.gv = 0; setTuft(i); tuftsAlive--; any = true;
    b2w(t.p, tA); tB.copy(t.n).applyQuaternion(C.quat);
    spawnFeather(tA, tB, rand(1.5, 4.5));
    if (Math.random() < 0.5) spawnFeather(tA, tB, rand(1, 3), 0.8);
  }
  tufts.instanceMatrix.needsUpdate = true;
  const pf = 1 - tuftsAlive / NT;
  TAIL.forEach((tl, i) => {
    if (tl.alive && pf > 0.25 + i * 0.12 && Math.random() < 0.25) {
      tl.alive = false; tl.mesh.getWorldPosition(tA); tB.set(0, 1, -0.5).applyQuaternion(C.quat);
      spawnFeather(tA, tB, rand(2, 4), 2.1);

}
function looseFeather() {

  b2w(lp, tA); tB.set(s, rand(0, 1), rand(-1, 0.5)).normalize().applyQuaternion(C.quat);
  spawnFeather(tA, tB, rand(1.5, 3.5), rand(0.8, 1.2));
}
function regrow() {
  if (tuftsAlive >= NT) { TAIL.forEach(t => t.alive = true); return; }
  for (let tries = 0; tries < 40; tries++) { const j = randInt(0, NT - 1); if (!TUFT[j].alive) { TUFT[j].alive = true; tuftsAlive++; break; } }
  const pf = 1 - tuftsAlive / NT;
  TAIL.forEach((tl, i) => { if (!tl.alive && pf < 0.2 + i * 0.12) tl.alive = true; });
}
function updateTufts(dt) {
  let dirty = false;
  for (let i = 0; i < NT; i++) {
    const t = TUFT[i], tgt = t.alive ? 1 : 0;
    if (Math.abs(t.g - tgt) < 0.002 && Math.abs(t.gv) < 0.01) { if (t.g !== tgt) { t.g = tgt; setTuft(i); dirty = true; } continue; }

  if (dirty) tufts.instanceMatrix.needsUpdate = true;

}

// ───────────────────────── frame ─────────────────────────
let T = 0;
const clock = new THREE.Clock();
const camShake = new V3();
function update(dt) {
  if (C.mode === 'held') updateHand(dt);
  // panic

    const tgt = clamp((C.shakeE - 10) / 55, 0, 1.15);
    C.panic += (tgt - C.panic) * (tgt > C.panic ? dk(5, dt) : dk(0.9, dt));
  } else C.panic = Math.max(0, C.panic - dt * (C.mode === 'fall' ? 0.55 : C.mode === 'recover' ? 1.6 : 2.5));

  if (C.mode === 'wander') updateWander(dt);

  // plucking from shaking

    while (C.pluckAcc >= 1) { C.pluckAcc--; pluck(1); }

  } else if (C.sqEnd > T) { C.sqEnd = T; screamOff(); }
  let mo = 0;
  C.beaks = C.beaks.filter(b => b.t1 > T);
  for (const b of C.beaks) if (T >= b.t0) mo = Math.max(mo, b.a * Math.sin(Math.PI * (T - b.t0) / (b.t1 - b.t0)));

  updateDirt(dt);

let shownLost = 0; const countN = document.getElementById('countN'), countEl = document.getElementById('count');

const _ov = new V3();
function orient(mesh, a, b) { _ov.subVectors(b, a); const l = _ov.length() || 1e-4; mesh.position.copy(a); mesh.quaternion.setFromUnitVectors(UP, _ov.divideScalar(l)); return l; }
function applyVisuals(dt) {
  const s = C.scream, P = C.panic;
  // body
  bodyG.position.copy(C.pos); bodyG.quaternion.copy(C.quat);
  C.sqV += (-C.sq * 260 - C.sqV * 11) * dt; C.sq += C.sqV * dt;
  const sq = clamp(C.sq, -0.45, 0.6), tr = s * 0.04 * Math.sin(T * 70);
  bodyIn.scale.set(1 - sq * 0.45 + tr, 1 + sq - tr, 1 - sq * 0.45 + tr);
  bodyIn.position.set(rand(-1, 1) * 0.015 * s, rand(-1, 1) * 0.015 * s, 0);
  // plumage colour
  const pf = 1 - tuftsAlive / NT;
  thighMat.color.copy(cWhite).lerp(cSkin, Math.pow(pf, 0.7));
  neckMat.color.copy(cWhite).lerp(cSkin, clamp(pf * 1.3, 0, 1));
  // wings
  let amp = 0, freq = 4;
  if (C.mode === 'held') { amp = 0.35 + 1.0 * Math.min(P, 1); freq = 5 + 7 * Math.min(P, 1); }
  else if (C.mode === 'fall') { amp = 1.15; freq = 8; }
  else if (C.mode === 'recover') { amp = C.rPhase === 'daze' ? 0.12 : C.rPhase === 'ruffle' ? 0.5 : 0.3; freq = C.rPhase === 'daze' ? 1.5 : 7; }
  else if (C.beaks.some(b => b.a > 0.9 && T >= b.t0)) { amp = 0.5; freq = 6; }
  C.flapAmp += (amp - C.flapAmp) * dk(8, dt); C.flapPh += freq * dt;
  for (const w of WINGS) { const a = C.flapAmp * (0.5 + 0.5 * Math.sin(C.flapPh * 6.283)); w.piv.rotation.z = w.s * a * 1.25; w.piv.rotation.y = -w.s * 0.25 * C.flapAmp * Math.cos(C.flapPh * 6.283); }
  tailG.rotation.set(Math.sin(T * 9) * 0.05 * (C.mode === 'wander' ? 1 : 0) + rand(-1, 1) * 0.15 * s, Math.sin(T * 6) * 0.12 + rand(-1, 1) * 0.2 * s, 0);
  // head kinematics for jiggles
  C.headVelVis.copy(C.head).sub(C.headPrev).divideScalar(dt); C.headPrev.copy(C.head);
  tA.copy(C.headVelVis).sub(C.headAcc).divideScalar(dt); C.headAcc.copy(C.headVelVis);
  tB.set(1, 0, 0).applyQuaternion(C.headQuat); tC.set(0, 1, 0).applyQuaternion(C.headQuat);
  const ax = clamp(tA.dot(tB), -400, 400), ay = clamp(tA.dot(tC), -400, 400);
  C.combV += (-C.combA * 150 - C.combV * 7 + ax * 0.03 + rand(-1, 1) * 60 * s) * dt; C.combA = clamp(C.combA + C.combV * dt, -0.9, 0.9);
  C.watV += (-C.watA * 120 - C.watV * 6 - ay * 0.02 + ax * 0.01) * dt; C.watA = clamp(C.watA + C.watV * dt, -1, 1);
  combG.rotation.z = C.combA; wattleG.rotation.x = C.watA; wattleG.rotation.z = C.combA * 0.6;
  // head
  headG.position.copy(C.head); headG.quaternion.copy(C.headQuat);
  headIn.scale.setScalar(1 + 0.22 * s + C.mouth * 0.04);
  // neck
  const nb = b2w(NECK_BASE, tD), nt = tR.set(0, -0.07, -0.08).applyQuaternion(C.headQuat).add(C.head);
  const nl = orient(neck, nb, nt); const nr = clamp(Math.sqrt(0.36 / Math.max(nl, 0.05)), 0.55, 1.15); neck.scale.set(nr, nl, nr);
  // beak / mouth
  beakG.scale.setScalar(1 + 0.55 * s);
  upperPiv.rotation.x = -0.4 * C.mouth;
  lowerPiv.rotation.x = 1.05 * C.mouth + Math.sin(T * 55) * 0.08 * s;
  tongue.rotation.set(Math.sin(T * 23) * 0.35 * s, Math.sin(T * 37) * 0.6 * s, 0); tongue.scale.set(1, 1, 1 + 0.9 * s * C.mouth);
  // eyes
  C.blinkT -= dt; if (C.blinkT < -0.12) C.blinkT = rand(1.6, 4.5);
  const daze = C.mode === 'recover' && C.rPhase === 'daze';
  let lidT = C.mode === 'wander' ? (C.act === 'look' ? 0.62 : 0.42) : C.mode === 'held' ? 0.85 : C.mode === 'fall' ? 0.9 : daze ? 0.3 : 0.55;
  lidT = Math.max(lidT, s);
  if (C.blinkT < 0 && C.pop < 0.1) lidT = 0;
  C.lid += (lidT - C.lid) * dk(C.blinkT < 0 ? 40 : 14, dt);
  veinMat.opacity = clamp(C.pop * 1.3, 0, 1);
  const lookCam = (C.mode === 'wander' && C.act === 'look') || C.mode === 'held';
  for (const e of EYES) {
    const pop = Math.max(-0.1, C.pop);
    e.eyeG.position.copy(e.socket).addScaledVector(e.out, 0.2 * Math.max(0, pop));
    const sc = 1 + 0.8 * pop + C.popV * 0.012; e.eyeG.scale.setScalar(Math.max(0.6, sc));
    e.stalk.visible = pop > 0.04;
    if (e.stalk.visible) { const l = orient(e.stalk, e.socket, e.eyeG.position); e.stalk.scale.set(1, l, 1); }
    e.lid.rotation.x = 1.5 + (-1.35 - 1.5) * clamp(C.lid + Math.max(0, pop) * 0.3, 0, 1.15);
    // pupil
    if (daze) { const a = T * 9 * e.s; e.look.set(Math.cos(a) * 0.5, Math.sin(a) * 0.5, 1); }
    else if (s > 0.1) { e.look.set(rand(-1, 1) * 0.25 * s, rand(-1, 1) * 0.25 * s, 1); }
    else if (lookCam) { e.eyeG.getWorldQuaternion(qT).invert(); e.eyeG.getWorldPosition(tA); e.look.subVectors(camera.position, tA).applyQuaternion(qT); e.look.z = Math.max(0.4, e.look.z); }
    else e.look.lerp(tA.set(-e.s * 0.25, -0.05, 1), dk(10, dt));
    e.look.normalize();
    e.pupil.position.copy(e.look).multiplyScalar(0.064); e.pupil.quaternion.setFromUnitVectors(ZAX, e.look);
    const ps = (1 - 0.6 * s * (e.s > 0 ? 1 : 0.6)) * (daze ? 1.1 : 1);

  for (let i = 0; i < 2; i++) {
    const L = LEGS[i], f = C.feet[i];
    const hip = b2w(HIP[i], tA), ank = tB.copy(f.p); ank.y += 0.035;
    const l = orient(L.shin, hip, ank); L.shin.scale.set(1, l, 1);
    L.foot.position.copy(f.p);
    if (air) { qT.copy(C.quat).multiply(qT2.setFromEuler(tE.set(1.1 + Math.sin(T * 25 + i * 3) * 0.4 * (P + 0.2), 0, 0))); L.foot.quaternion.slerp(qT, dk(20, dt)); L.toes.scale.setScalar(1 - 0.2 * Math.sin(T * 30 + i)); }
    else { qT.setFromEuler(tE.set(f.step ? -0.35 * Math.sin(Math.PI * Math.min(1, f.t)) : 0, C.yaw, 0, 'YXZ')); L.foot.quaternion.slerp(qT, dk(25, dt)); L.toes.scale.setScalar(1); }
  }
  // stars
  starsG.visible = daze && C.rT > 0.2;
  if (starsG.visible) {
    starsG.position.copy(C.head).add(tA.set(0, 0.32, 0));
    starsG.children.forEach((st, k) => { const a = T * 4 + k / 5 * Math.PI * 2; st.position.set(Math.cos(a) * 0.3, Math.sin(a * 2) * 0.04, Math.sin(a) * 0.3); st.rotation.set(0, -a, 0); st.scale.setScalar(Math.min(1, (C.rT - 0.2) * 4)); });
  }
  camShake.set(rand(-1, 1), rand(-1, 1), 0).multiplyScalar(0.035 * s);
}
function updateCamera(dt) {
  const asp = innerWidth / innerHeight, k = asp < 1 ? Math.pow(1 / asp, 0.75) : 1;
  if (C.mode !== 'held') {
    camLook.x += (C.pos.x * 0.55 - camLook.x) * dk(1.6, dt);
    camLook.z += (C.pos.z * 0.35 - camLook.z) * dk(1.6, dt);

function frame() {

}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
updateCamera(1);
pickTarget();
frame();
