    if (air) qW.copy(C.quat).multiply(qT2.setFromEuler(tE.set(0.9 + Math.sin(T * 25 + i * 3) * 0.4 * (P + 0.2), 0, 0)));
    else qW.setFromEuler(tE.set(f.step ? -0.35 * Math.sin(Math.PI * Math.min(1, f.t)) : 0, C.yaw, 0, 'YXZ'));
    qL.copy(C.quat).multiply(bones['thigh' + side].quaternion).multiply(bones['shin' + side].quaternion).invert().multiply(qW);
    bones['foot' + side].quaternion.slerp(qL, dk(25, dt));
  }
  // dizzy stars
  starsG.visible = daze && C.rT > 0.2;
  if (starsG.visible) {
    starsG.position.copy(C.head).add(tA.set(0, 0.24, 0));
    starsG.children.forEach((st, k) => { const a = T * 4 + k / 5 * Math.PI * 2; st.position.set(Math.cos(a) * 0.22, Math.sin(a * 2) * 0.03, Math.sin(a) * 0.22); st.rotation.set(0, -a, 0); st.scale.setScalar(Math.min(1, (C.rT - 0.2) * 4) * 0.75); });
  }

}
function updateCamera(dt) {
  const asp = innerWidth / innerHeight, k = asp < 1 ? Math.pow(1 / asp, 0.75) : 1;
  if (C.mode !== 'held') {
    camLook.x += (C.pos.x * 0.55 - camLook.x) * dk(1.6, dt);
    camLook.z += (C.pos.z * 0.35 - camLook.z) * dk(1.6, dt);
  }
  camera.position.set(camLook.x, camLook.y + 1.4 * k, camLook.z + 4.9 * k);
  camera.lookAt(camLook);
}
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30) || 1 / 60; T += dt;
  update(dt);
  camera.position.add(camShake); renderer.render(scene, camera); camera.position.sub(camShake);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
updateCamera(1);
pickTarget();
frame();
</script>
