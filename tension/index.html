  #panel { position: fixed; z-index: 3; left: 50%; top: 50%; width: calc(100vw + 80px); height: calc(100vh + 80px);

    pointer-events: none; transition: width .55s cubic-bezier(.2,1.25,.3,1), height .55s cubic-bezier(.2,1.25,.3,1), transform .55s cubic-bezier(.2,1.25,.3,1); }

<script type="module">
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ------------------------------------------------------------------ renderer + passes
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: false, premultipliedAlpha: true });
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.02, 60);

const rtCol = new THREE.WebGLRenderTarget(4, 4, { samples: 4 });
const rtND = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });

const U = { light: { value: new THREE.Vector3(0.5, 0.7, 0.5) }, cell: { value: 5 * DPR } };
const TOON_VS = /* glsl */`
varying vec3 vN; varying vec3 vP;
void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vP = mv.xyz; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * mv; }`;
const TOON_FS = /* glsl */`
uniform vec3 uLight; uniform float uCell; uniform float uTone; uniform float uKind;
varying vec3 vN; varying vec3 vP;
float dotsAt(vec2 p, float cell, float cov){
  const float c = 0.70710678;
  vec2 q = mat2(c, -c, c, c) * p / cell; vec2 f = fract(q) - 0.5;

void main(){
  vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
  vec3 l = normalize(uLight); vec3 v = normalize(-vP);
  float ndl = dot(n, l);
  vec2 p = gl_FragCoord.xy;
  float ink = 0.0;
  if (uKind < 0.5) {                     // toned: white / light tone / dark tone / tone+hatch
    float t = (1.0 - ndl) * 0.5 + uTone;
    float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
    if (t < 0.40) ink = 0.0;
    else if (t < 0.60) ink = dotsAt(p, uCell, 0.15);
    else if (t < 0.80) ink = dotsAt(p, uCell, 0.36);
    else ink = max(dotsAt(p, uCell, 0.5), hatch(p, uCell));
    if (t > 1.05) ink = 1.0;
    if (rim > 0.55 && ndl < 0.0 && uTone < 0.3) ink = 0.0;   // back-light rim, very manga
  } else if (uKind < 1.5) {              // ink with glossy white streaks (hair, shoes)
    ink = 1.0;
    float s = dot(n, normalize(l + v));
    if (s > 0.985) ink = 0.0; else if (s > 0.955) ink = 1.0 - dotsAt(p, uCell * 0.8, 0.45);
  } else if (uKind < 2.5) { ink = 0.0; }  // flat white
  else { ink = 1.0; }                     // flat black
  gl_FragColor = vec4(vec3(1.0 - ink), 1.0);
}`;
const matCache = {};
function toon(kind, tone = 0) {
  const k = kind + ':' + tone;
  if (!matCache[k]) matCache[k] = new THREE.ShaderMaterial({ vertexShader: TOON_VS, fragmentShader: TOON_FS,
    uniforms: { uLight: U.light, uCell: U.cell, uTone: { value: tone }, uKind: { value: kind } } });
  return matCache[k];
}
const SKIN = toon(0, -0.02), PANTS = toon(0, 0.3), CLOTH = toon(0, -0.12), HAIR = toon(1), WHITE = toon(2), BLACK = toon(3);

const ndMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec3 vN; varying float vD; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vD = -mv.z; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying vec3 vN; varying float vD; void main(){ vec3 n = normalize(vN); if(!gl_FrontFacing) n = -n; gl_FragColor = vec4(n, vD); }`,
});
const compMat = new THREE.ShaderMaterial({
  uniforms: { tCol: { value: rtCol.texture }, tND: { value: rtND.texture }, uRes: { value: new THREE.Vector2(1, 1) }, uW: { value: 1.2 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tCol, tND; uniform vec2 uRes; uniform float uW; varying vec2 vUv;
  void main(){
    vec4 c = texture2D(tND, vUv); float e = 0.0; vec2 o = uW / uRes;
    for (int i = 0; i < 8; i++) {
      float a = float(i) * 0.785398;
      vec4 s = texture2D(tND, vUv + vec2(cos(a), sin(a)) * o);
      float dn = (c.w > 0.0 && s.w > 0.0) ? 1.0 - dot(c.xyz, s.xyz) : 0.0;
      float near = min(c.w > 0.0 ? c.w : 1e4, s.w > 0.0 ? s.w : 1e4);
      float dd = (c.w > 0.0 || s.w > 0.0) ? abs(c.w - s.w) / max(near, 1e-3) : 0.0;
      e = max(e, max(smoothstep(0.2, 0.42, dn), smoothstep(0.014, 0.03, dd)));
    }
    vec4 col = texture2D(tCol, vUv);
    float a = max(col.a, e);
    gl_FragColor = vec4(col.rgb * (1.0 - e) * a, a);
  }`,
  depthTest: false, depthWrite: false,
});
const quadScene = new THREE.Scene();
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compMat));
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ------------------------------------------------------------------ build helpers
const SPH = new THREE.SphereGeometry(1, 40, 28);
function G(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
function M(parent, geo, mat, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); parent.add(m); return m; }
const ell = (p, mat, x, y, z, rx, ry, rz) => M(p, SPH, mat, x, y, z, rx, ry, rz);
// z of an ellipsoid's front surface at (x, y)
const surfZ = (cx, cy, cz, rx, ry, rz, x, y) => cz + rz * Math.sqrt(Math.max(0, 1 - ((x - cx) / rx) ** 2 - ((y - cy) / ry) ** 2));
function cyl(p, mat, rt, rb, len, x = 0, y = 0, z = 0, seg = 24) { return M(p, new THREE.CylinderGeometry(rt, rb, len, seg, 1, true), mat, x, y, z); }
function cap(p, mat, r, len, x = 0, y = 0, z = 0) { return M(p, new THREE.CapsuleGeometry(r, len, 6, 16), mat, x, y, z); }
function lathe(p, mat, prof) { return M(p, new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), 32), mat); }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const tag = (o, r) => (o.userData.region = r, o);

// ------------------------------------------------------------------ the fighter (original design)
const root = G(scene);
const pelvis = tag(G(root, 0, 0.98, 0), 'legs');
ell(pelvis, PANTS, 0, -0.01, 0, 0.17, 0.13, 0.125);
// sash
const sash = M(pelvis, new THREE.TorusGeometry(1, 0.2, 14, 48), BLACK, 0, 0.075, 0, 0.158, 0.118, 0.17); sash.rotation.x = Math.PI / 2;
ell(pelvis, BLACK, 0.06, 0.06, 0.115, 0.03, 0.025, 0.02);
const sashTails = [];
for (let i = 0; i < 2; i++) { const g = G(pelvis, 0.055 + i * 0.015, 0.05, 0.12); g.rotation.z = 0.15 + i * 0.25; M(g, new THREE.BoxGeometry(0.03, 0.16, 0.008), BLACK, 0, -0.08, 0); sashTails.push(g); }

const spine = G(pelvis, 0, 0.07, 0);
const AB = [0, 0.12, 0, 0.135, 0.165, 0.105];
ell(spine, SKIN, AB[0], AB[1], AB[2], AB[3], AB[4], AB[5]);
const absMeshes = [];
for (let r = 0; r < 3; r++) for (const s of [-1, 1]) {
  const x = s * 0.036, y = 0.055 + r * 0.062;
  absMeshes.push(ell(spine, SKIN, x, y, surfZ(...AB, x, y) - 0.012, 0.033, 0.029, 0.018));
}
for (const s of [-1, 1]) { const o = ell(spine, SKIN, s * 0.105, 0.09, 0.03, 0.05, 0.1, 0.07); o.rotation.z = s * 0.25; }

const chest = G(spine, 0, 0.24, 0);
const RIB = [0, 0.08, -0.005, 0.172, 0.16, 0.112];
ell(chest, SKIN, ...RIB);
const pecs = [];
for (const s of [-1, 1]) {
  const x = s * 0.074, y = 0.112;
  const p = ell(chest, SKIN, x, y, surfZ(...RIB, x, y) - 0.036, 0.09, 0.062, 0.05); p.rotation.z = s * 0.2; pecs.push(p);
  ell(chest, SKIN, s * 0.135, 0.03, -0.03, 0.07, 0.13, 0.085);                 // lats
  const t = ell(chest, SKIN, s * 0.07, 0.225, -0.035, 0.095, 0.045, 0.07); t.rotation.z = -s * 0.45; // traps
}
const neck = tag(G(chest, 0, 0.24, -0.008), 'eyes');
cyl(neck, SKIN, 0.052, 0.066, 0.12, 0, 0.03, 0);

// head: one sculpted mesh (cranium, brow ridge, cheekbones, tapering jaw, chin)
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function sculpt(seg, fn) {
  let g = new THREE.SphereGeometry(1, seg, Math.round(seg * 0.75));
  g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const P = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < P.count; i++) { v.fromBufferAttribute(P, i).normalize(); fn(v); P.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}
const headShape = (v) => {
  let { x, y, z } = v; const ax = Math.abs(x);
  const j = sm(-0.15, -1, y);
  x *= 1 - 0.52 * Math.pow(j, 1.3);
  if (z > 0) z *= 1 + 0.12 * j; else z *= (1 - 0.65 * j) * (1 + 0.1 * (1 - j));
  if (z > 0) {
    z += 0.07 * Math.exp(-(((y - 0.17) / 0.08) ** 2)) * sm(0.55, 0.95, v.z) * (1 - sm(0.3, 0.75, ax));      // brow ridge
    z -= 0.035 * Math.exp(-((y / 0.08) ** 2) - (((ax - 0.36) / 0.14) ** 2));                            // eye sockets
    const ck = 0.035 * Math.exp(-(((y + 0.2) / 0.11) ** 2) - (((ax - 0.55) / 0.16) ** 2));             // cheekbones
    x += Math.sign(x) * ck * 0.6; z += ck;
    z -= 0.05 * sm(0.75, 1, v.z) * (1 - sm(-0.5, -0.8, y));                                               // flatter face
  }
  v.set(x * 0.086, 0.1 + y * 0.112, z * 0.1 - 0.004);
};
const head = tag(G(neck, 0, 0.085, 0.012), 'eyes');
head.scale.setScalar(1.08);
const headMesh = M(head, sculpt(72, headShape), SKIN);
const _rc = new THREE.Raycaster();
function faceZ(x, y) {           // front surface of the sculpted head (head-local)
  _rc.set(new THREE.Vector3(x, y, 0.5), new THREE.Vector3(0, 0, -1));
  headMesh.updateMatrixWorld(true);
  const inv = headMesh.matrixWorld.clone();
  const hit = _rc.intersectObject(new THREE.Mesh(headMesh.geometry), false)[0];
  return hit ? hit.point.z : 0.09;
}
for (const s of [-1, 1]) ell(head, SKIN, s * 0.087, 0.092, -0.008, 0.012, 0.025, 0.016);   // ears
const nose = M(head, new THREE.ConeGeometry(0.008, 0.024, 3), SKIN, 0, 0.074, faceZ(0, 0.074) + 0.003);
nose.rotation.set(0.42, 0, 0); nose.scale.set(1, 1, 0.7);

// face features
const face = { brows: [], pupils: [], whites: [], lids: [] };
for (const s of [-1, 1]) {
  const x = s * 0.033, y = 0.1, z = faceZ(x, y);
  const w = ell(head, WHITE, x, y, z - 0.001, 0.019, 0.0078, 0.005); w.rotation.z = s * 0.14; face.whites.push(w);
  const p = ell(head, BLACK, x - s * 0.0015, y - 0.0005, z + 0.0032, 0.0055, 0.0064, 0.0018); face.pupils.push(p);
  const lid = ell(head, BLACK, x + s * 0.002, y + 0.0058, z + 0.0018, 0.022, 0.0024, 0.0035); lid.rotation.z = s * 0.2; lid.userData.y = y + 0.0058; face.lids.push(lid);
  const bx = s * 0.037, by = 0.119;
  const bg = G(head, bx, by, faceZ(bx, by) + 0.003);
  M(bg, new THREE.BoxGeometry(0.036, 0.0075, 0.01), BLACK); bg.userData.s = s; face.brows.push(bg);
}
face.mouth = ell(head, BLACK, 0, 0.037, faceZ(0, 0.037) + 0.001, 0.02, 0.0022, 0.004);
face.teeth = ell(head, WHITE, 0, 0.037, faceZ(0, 0.037) + 0.0005, 0.018, 0.006, 0.004); face.teeth.visible = false;
face.teethLine = ell(head, BLACK, 0, 0.037, faceZ(0, 0.037) + 0.0045, 0.018, 0.0008, 0.001); face.teethLine.visible = false;

// hair: black ink, swept back like a flame, with a couple of strands breaking over the brow
const hairG = G(head);
const capShape = (v) => { headShape(v); v.x *= 1.09; v.z = v.z * 1.08 - 0.014; v.y = (v.y - 0.1) * 1.07 + 0.112; };
M(hairG, sculpt(48, capShape), HAIR);
seed = 23;
function spike(base, dir, len, r, seg = 6) {

}
let debugCam = null;
function updateCamera(dt, t) {

  camera.position.x += (Math.random() - 0.5) * sh; camera.position.y += (Math.random() - 0.5) * sh;

    grunt({ f0: 125, dur: 0.95, open: 1, gain: 0.55, delay: 0.12, rise: 1 });
    sfx('ザッ!!', { x: '30%', y: '80%', size: 130, rot: -10, cls: 'jp', delay: 560 });
    sfx('HAAA!!', { x: '68%', y: '20%', size: 96, rot: 6, cls: 'en', delay: 220 });
    sfx('ドン', { x: '80%', y: '62%', size: 80, rot: 12, cls: 'jp black', delay: 640 });
  }
  later(30, refreshUI);
}
function pullBack() { if (shot === 'wide') return; timers.splice(0).forEach(clearTimeout); clearSfx(); setShot('wide'); refreshUI(); }
function relax() {
  initAudio(); pullBack();
  S.focus = S.fist = S.stance = S.sweat = S.sparks = 0;
  if (ac) { const t = ac.currentTime; grunt({ f0: 85, dur: 0.9, open: 0.6, gain: 0.25 }); }
  refreshUI();
}
relaxBtn.addEventListener('click', (e) => { e.stopPropagation(); relax(); });
for (const r in chips) chips[r].addEventListener('click', (e) => { e.stopPropagation(); trigger(r); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') pullBack(); if (e.key === '1') trigger('eyes'); if (e.key === '2') trigger('hand'); if (e.key === '3') trigger('legs'); if (e.key === 'r') relax(); });

// hotspots
const hotEl = document.getElementById('hot');
const hots = [
  { r: 'eyes', label: 'Eyes', at: () => eyesMid() },
  { r: 'hand', label: 'Fist', at: () => (W.stance > 0.5 ? arms[1] : arms[-1]).wrist.localToWorld(new THREE.Vector3(0, -0.06, 0)) },
  { r: 'legs', label: 'Stance', at: () => legs[1].knee.getWorldPosition(new THREE.Vector3()) },
].map(h => { const el = document.createElement('div'); el.className = 'hs'; el.innerHTML = `<i></i><span>${h.label}</span>`; el.addEventListener('click', (e) => { e.stopPropagation(); trigger(h.r); }); hotEl.appendChild(el); return { ...h, el }; });
function placeHots() {
  for (const h of hots) { const p = proj(h.at()); h.el.style.transform = `translate(${p.x}px, ${p.y}px)`; }
}

// raycast clicks on the body itself
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function regionAt(x, y) {
  ndc.set((x / VW) * 2 - 1, -(y / VH) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(root, true).find(h => h.object.visible);
  if (!hit) return null;
  let o = hit.object; while (o && !o.userData.region) o = o.parent;
  return o ? o.userData.region : null;
}
let downX = 0, downY = 0;
glCanvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
glCanvas.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8) return;
  if (shot !== 'wide') { pullBack(); return; }
  const r = regionAt(e.clientX, e.clientY);
  if (r) trigger(r);
});
glCanvas.addEventListener('pointermove', (e) => {
  mx = (e.clientX / VW - 0.5) * 2; my = (e.clientY / VH - 0.5) * 2;
  if (shot === 'wide' && e.pointerType === 'mouse') document.body.classList.toggle('hover-hit', !!regionAt(e.clientX, e.clientY));
  else document.body.classList.remove('hover-hit');
});

// ------------------------------------------------------------------ loop
const lightW = new THREE.Vector3(0.55, 0.75, 0.55).normalize();
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  pose(t, dt);
  updateCamera(dt, t);
  root.updateMatrixWorld(true);
  U.light.value.copy(lightW).transformDirection(camera.matrixWorldInverse);

  renderer.setRenderTarget(rtCol); renderer.clear(); renderer.render(scene, camera);
  shadows.visible = false; scene.overrideMaterial = ndMat;
  renderer.setRenderTarget(rtND); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null; shadows.visible = true;
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(quadScene, quadCam);

  drawBack(dt); drawFront(dt, t); placeHots();
  requestAnimationFrame(frame);
}
resize(); refreshUI();
document.fonts.ready.then(() => document.getElementById('loading').classList.add('done'));
setTimeout(() => document.getElementById('loading').classList.add('done'), 2500);
requestAnimationFrame(frame);

// test hooks for screenshots
window.__t = { trigger, pullBack, relax, S, W, cam: (c) => { debugCam = c; } };
</script>
