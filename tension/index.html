<html lang="en">
<head>

<title>Vibecodevember - Day 14 - Tension</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #0b0b0b; --paper: #fbfaf7; --bar: 56px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; cursor: default; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; touch-action: none; }
  #back { z-index: 0; } #gl { z-index: 1; } #front { z-index: 2; pointer-events: none; }
  body.hover-hit #gl { cursor: pointer; }

  /* comic panel: a frame whose white gutter covers everything outside it */
  #panel { position: fixed; z-index: 3; left: 50%; top: 50%; width: calc(100vw + 80px); height: calc(100vh + 80px);
    transform: translate(-50%, -50%) rotate(0deg); border: 7px solid var(--ink); box-shadow: 0 0 0 220vmax var(--paper);
    pointer-events: none; transition: width .55s cubic-bezier(.2,1.25,.3,1), height .55s cubic-bezier(.2,1.25,.3,1), transform .55s cubic-bezier(.2,1.25,.3,1); }
  #panel::after { content: ''; position: absolute; inset: 5px; border: 2px solid var(--ink); opacity: 0; transition: opacity .3s; }
  body.zoom #panel::after { opacity: 1; }
  body.m-eyes #panel { width: min(94vw, 1180px); height: min(34vh, 330px); transform: translate(-50%, -50%) rotate(-1.2deg); }
  body.m-hand #panel { width: min(74vw, 88vh, 760px); height: min(74vh, 700px); transform: translate(-50%, -50%) rotate(2deg); }
  body.m-legs #panel { width: min(64vw, 700px); height: min(84vh, 860px); transform: translate(-50%, -50%) rotate(-1.5deg); }
  @media (max-width: 700px) {
    body.m-hand #panel { width: 88vw; height: 62vh; }
    body.m-legs #panel { width: 84vw; height: 76vh; }
    body.m-eyes #panel { height: 26vh; }
  }
  /* neighbouring panels peeking in the gutter */
  .ghost { position: fixed; z-index: 3; border: 5px solid var(--ink); background: var(--paper); pointer-events: none; opacity: 0; transition: opacity .35s .25s, transform .6s cubic-bezier(.2,1.2,.3,1); }
  body.zoom .ghost { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; display: block; }

  #sfx { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .fx { position: absolute; white-space: nowrap; line-height: .9; color: var(--paper); paint-order: stroke fill;
    -webkit-text-stroke: 0.16em var(--ink); letter-spacing: .02em; transform-origin: 50% 50%;
    animation: pop .38s cubic-bezier(.2,1.8,.4,1) both; }
  .fx.jp { font-family: 'Dela Gothic One', sans-serif; }
  .fx.en { font-family: Bangers, Impact, sans-serif; letter-spacing: .05em; }
  .fx.black { color: var(--ink); -webkit-text-stroke: 0.12em var(--paper); }
  .fx.shake { animation: pop .38s cubic-bezier(.2,1.8,.4,1) both, shake .09s linear .38s infinite; }
  .fx.out { animation: fade .3s ease-in forwards !important; }
  .fx.vert { writing-mode: vertical-rl; text-orientation: upright; }
  @keyframes pop { from { opacity: 0; scale: 2.2; } to { opacity: 1; scale: 1; } }
  @keyframes shake { 0% { translate: 0 0; } 25% { translate: 2px -2px; } 50% { translate: -2px 1px; } 75% { translate: 1px 2px; } }
  @keyframes fade { to { opacity: 0; scale: .85; } }

  #hot { position: fixed; inset: 0; z-index: 5; pointer-events: none; transition: opacity .3s; }
  body.zoom #hot { opacity: 0; }
  .hs { position: absolute; width: 0; height: 0; pointer-events: auto; cursor: pointer; }
  .hs i { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); }
  .hs i::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--ink); }
  .hs i::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ink); animation: ping 1.6s ease-out infinite; }
  .hs span { position: absolute; left: 20px; top: -10px; font: 400 17px Bangers, Impact, sans-serif; letter-spacing: .08em; color: var(--ink);
    background: var(--paper); border: 2px solid var(--ink); padding: 1px 7px 0; transform: rotate(-3deg); white-space: nowrap; }
  .hs.done i::before { background: var(--paper); box-shadow: inset 0 0 0 4px var(--ink); }
  body.zoom .hs { pointer-events: none; }
  @keyframes ping { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }

  .bar { position: fixed; z-index: 6; left: 0; right: 0; top: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(16px, 3vw, 36px); pointer-events: none; }
  .brand { font: 600 10px Inter, sans-serif; letter-spacing: .34em; text-transform: uppercase; }
  .name { font: 400 30px Bangers, Impact, sans-serif; letter-spacing: .12em; transform: rotate(-2deg); }

  #hud { position: fixed; z-index: 6; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #meter { display: flex; gap: 8px; align-items: center; }
  .chip { font: 400 16px Bangers, Impact, sans-serif; letter-spacing: .1em; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink);
    padding: 5px 12px 3px; cursor: pointer; transform: skew(-8deg); box-shadow: 3px 3px 0 var(--ink); transition: background .15s, color .15s, transform .1s; }
  .chip:active { transform: skew(-8deg) translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .chip.on { background: var(--ink); color: var(--paper); }
  .chip.ghosted { opacity: .4; pointer-events: none; }
  .chip.locked { opacity: .28; cursor: not-allowed; box-shadow: none; }
  .chip.on { cursor: default; pointer-events: none; }
  .gauge { font: 400 15px Bangers, Impact, sans-serif; letter-spacing: .14em; margin-right: 2px; }
  body.charged .gauge { color: var(--paper); }
  .chip.next { animation: beckon 1.2s ease-in-out infinite; }
  .chip.wiggle { animation: wiggle .4s; }
  @keyframes beckon { 50% { transform: skew(-8deg) translateY(-3px); box-shadow: 3px 6px 0 var(--ink); } }
  @keyframes wiggle { 25% { transform: skew(-8deg) translateX(-6px); } 75% { transform: skew(-8deg) translateX(6px); } }
  .hs.locked { display: none; }
  .hs.flip span { left: auto; right: 20px; transform: rotate(3deg); }
  .bar, #hint, #credit { transition: color .4s; }
  body.charged .bar, body.charged #hint, body.charged #credit { color: var(--paper); }
  body.charged #snd { border-color: var(--paper); }
  #hint { font: 600 10.5px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #555; text-align: center; min-height: 14px; }
  #snd { position: fixed; z-index: 6; right: clamp(16px, 3vw, 36px); bottom: 18px; width: 36px; height: 36px; border: 2.5px solid var(--ink); background: var(--paper); border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  #snd svg { width: 18px; height: 18px; }
  #snd.off .w { display: none; } #snd:not(.off) .x { display: none; }
  @media (max-width: 560px) { #snd { bottom: auto; top: 12px; right: 12px; width: 32px; height: 32px; } .name { display: none; } }
  body.flash #back, body.flash #gl, body.flash #front { filter: invert(1); }
  #credit { position: fixed; z-index: 6; left: clamp(16px, 3vw, 36px); bottom: 18px; font: 500 9.5px Inter, sans-serif; letter-spacing: .06em; color: #777; max-width: 200px; line-height: 1.4; }
  #credit a { color: inherit; }
  @media (max-width: 700px) { #credit { display: none; } }
  #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--paper); font: 400 34px Bangers, Impact, sans-serif; letter-spacing: .14em; transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ------------------------------------------------------------------ renderer + passes
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: false, premultipliedAlpha: true });
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.02, 60);

const rtCol = new THREE.WebGLRenderTarget(4, 4, { samples: 4 });
const rtND = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });

const U = { light: { value: new THREE.Vector3(0.5, 0.7, 0.5) }, cell: { value: 5 * DPR } };
// skinned + morphed vertex shader shared by the ink pass and the normal/depth pass
const TOON_VS = /* glsl */`
#include <common>
#include <morphtarget_pars_vertex>
#include <skinning_pars_vertex>
uniform mat3 uMapT;
varying vec3 vN; varying vec3 vP; varying vec2 vUv;
void main(){
  vUv = (uMapT * vec3(uv, 1.0)).xy;
  #include <beginnormal_vertex>
  #include <morphinstance_vertex>
  #include <morphnormal_vertex>
  #include <skinbase_vertex>
  #include <skinnormal_vertex>
  #include <defaultnormal_vertex>
  #include <begin_vertex>
  #include <morphtarget_vertex>
  #include <skinning_vertex>
  #include <project_vertex>
  vN = normalize(transformedNormal); vP = mvPosition.xyz;
}`;
const TOON_FS = /* glsl */`
uniform vec3 uLight; uniform float uCell; uniform float uTone; uniform float uKind;
uniform sampler2D uMap; uniform float uHasMap; uniform vec3 uColor;
varying vec3 vN; varying vec3 vP; varying vec2 vUv;
float dotsAt(vec2 p, float cell, float cov){
  const float c = 0.70710678;
  vec2 q = mat2(c, -c, c, c) * p / cell; vec2 f = fract(q) - 0.5;
  float r = sqrt(cov / 3.14159); float aa = 0.8 / cell;
  return 1.0 - smoothstep(r - aa, r + aa, length(f));
}
float hatch(vec2 p, float cell){ float k = fract((p.x - p.y) / (cell * 0.75)); return step(0.6, k); }
void main(){
  vec4 tex = uHasMap > 0.5 ? texture2D(uMap, vUv) : vec4(1.0);
  if (tex.a < 0.5) discard;
  vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
  vec3 l = normalize(uLight); vec3 v = normalize(-vP);
  float ndl = dot(n, l);
  vec2 p = gl_FragCoord.xy;
  float ink = 0.0;
  if (uKind < 0.5) {                     // texture luminance + light -> white / tones / hatch / black
    float lum = pow(clamp(dot(tex.rgb * uColor, vec3(0.299, 0.587, 0.114)), 0.0, 1.0), 1.0 / 2.2);
    float shadeK = mix(0.7, 0.32, smoothstep(0.62, 0.8, lum));     // bright skin keeps clean paper
    float t = (1.0 - ndl) * 0.5 * shadeK + (1.0 - lum) * 0.62 - 0.06 + uTone;
    float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
    if (t < 0.36) ink = 0.0;
    else if (t < 0.52) ink = dotsAt(p, uCell, 0.14);
    else if (t < 0.68) ink = dotsAt(p, uCell, 0.34);
    else if (t < 0.84) ink = max(dotsAt(p, uCell, 0.5), hatch(p, uCell));
    else ink = 1.0;
    if (lum < 0.16) ink = 1.0;                                   // drawn lines in the texture stay solid ink
    if (rim > 0.6 && ndl < 0.0 && t < 0.84) ink = 0.0;            // back-light rim
  } else if (uKind < 2.5) { ink = 0.0; } // flat white
  else { ink = 1.0; }                     // flat black
  gl_FragColor = vec4(vec3(1.0 - ink), 1.0);
}`;
const ND_FS = /* glsl */`
uniform sampler2D uMap; uniform float uHasMap; uniform vec3 uColor; uniform float uLum;
varying vec3 vN; varying vec3 vP; varying vec2 vUv;
void main(){
  vec4 tex = uHasMap > 0.5 ? texture2D(uMap, vUv) : vec4(1.0);
  if (tex.a < 0.5) discard;
  vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
  float lum = uLum >= 0.0 ? uLum : pow(clamp(dot(tex.rgb * uColor, vec3(0.299, 0.587, 0.114)), 0.0, 1.0), 1.0 / 2.2);
  gl_FragColor = vec4(n.xy, lum, -vP.z);       // normal.xy, painted luminance, depth
}`;
const ID3 = new THREE.Matrix3();
function makeMats(kind, { map = null, color = new THREE.Color(1, 1, 1), side = THREE.FrontSide, tone = 0 } = {}) {
  if (map) map.updateMatrix();
  const shared = { uMap: { value: map }, uHasMap: { value: map ? 1 : 0 }, uMapT: { value: map ? map.matrix : ID3 }, uColor: { value: color.clone() }, uLum: { value: kind === 2 ? 1 : kind === 3 ? 0 : -1 } };
  const toonM = new THREE.ShaderMaterial({ vertexShader: TOON_VS, fragmentShader: TOON_FS, side,
    uniforms: { ...shared, uLight: U.light, uCell: U.cell, uTone: { value: tone }, uKind: { value: kind } } });
  const ndM = new THREE.ShaderMaterial({ vertexShader: TOON_VS, fragmentShader: ND_FS, side, uniforms: shared });
  return { toon: toonM, nd: ndM };
}
const inkMeshes = [];   // every mesh that takes part in both passes
function inked(mesh, mats) { mesh.userData.mats = mats; mesh.material = mats.toon; inkMeshes.push(mesh); return mesh; }
const WHITE = () => makeMats(2), BLACK = () => makeMats(3);

const compMat = new THREE.ShaderMaterial({
  uniforms: { tCol: { value: rtCol.texture }, tND: { value: rtND.texture }, uRes: { value: new THREE.Vector2(1, 1) }, uW: { value: 1.2 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform sampler2D tCol, tND; uniform vec2 uRes; uniform float uW; varying vec2 vUv;
  void main(){
    vec4 c = texture2D(tND, vUv); float e = 0.0; vec2 o = uW / uRes;
    vec3 cn = vec3(c.xy, sqrt(max(0.0, 1.0 - dot(c.xy, c.xy))));
    for (int i = 0; i < 8; i++) {
      float a = float(i) * 0.785398;
      vec4 s = texture2D(tND, vUv + vec2(cos(a), sin(a)) * o);
      vec3 sn = vec3(s.xy, sqrt(max(0.0, 1.0 - dot(s.xy, s.xy))));
      float dn = (c.w > 0.0 && s.w > 0.0) ? 1.0 - dot(cn, sn) : 0.0;
      float dl = (c.w > 0.0 && s.w > 0.0) ? abs(c.z - s.z) : 0.0;     // eyes, brows, mouth, hairline painted in the texture
      e = max(e, smoothstep(0.2, 0.34, dl));
      float near = min(c.w > 0.0 ? c.w : 1e4, s.w > 0.0 ? s.w : 1e4);
      float dd = (c.w > 0.0 || s.w > 0.0) ? abs(c.w - s.w) / max(near, 1e-3) : 0.0;
      e = max(e, max(smoothstep(0.24, 0.46, dn), smoothstep(0.016, 0.034, dd)));
    }
    vec4 col = texture2D(tCol, vUv);
    float a = max(col.a, e);
    gl_FragColor = vec4(col.rgb * (1.0 - e) * a, a);
  }`,
  depthTest: false, depthWrite: false,
});
const quadScene = new THREE.Scene();
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compMat));
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ------------------------------------------------------------------ the fighter: VIPE Heroes (Polygonal Mind, CC-BY), retargeted procedurally; ?hero=302|1226|1691|170
const lerp = (a, b, t) => a + (b - a) * t;
const SEG = (f) => f === 'Thumb' ? ['Metacarpal', 'Proximal', 'Distal'] : ['Proximal', 'Intermediate', 'Distal'];
const S = { focus: 0, fist: 0, stance: 0, sweat: 0, sparks: 0, aura: 0 }; // targets
const W = { focus: 0, fist: 0, stance: 0, sweat: 0, sparks: 0, aura: 0 }; // smoothed
const RATE = { focus: 7, fist: 9, stance: 5.5, sweat: 1.2, sparks: 6, aura: 2.2 };
const Q = new THREE.Quaternion(), Q2 = new THREE.Quaternion(), Q3 = new THREE.Quaternion();
const V1 = new THREE.Vector3(), V2 = new THREE.Vector3(), V3 = new THREE.Vector3();
const UPV = new THREE.Vector3(0, 1, 0);
const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

let vrm = null, B = null, R = null, rest = null;
const headFx = new THREE.Group();          // sweat + vein ride on the raw head bone
const shadows = new THREE.Group(); scene.add(shadows);
const disc = new THREE.CircleGeometry(1, 40);
const shBody = inked(new THREE.Mesh(disc), BLACK()); shBody.rotation.x = -Math.PI / 2; shadows.add(shBody);
const shFeet = [0, 1].map(() => { const m = inked(new THREE.Mesh(disc), BLACK()); m.rotation.x = -Math.PI / 2; shadows.add(m); return m; });

const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
const HEROES = ['302', '1226', '1691', '170'];
const heroNo = HEROES.includes(new URLSearchParams(location.search).get('hero')) ? new URLSearchParams(location.search).get('hero') : '302';
document.getElementById('heroNo').textContent = heroNo;
const ready = loader.loadAsync(`models/hero${heroNo}.vrm`).then((gltf) => {
  vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  vrm.scene.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const src = Array.isArray(o.material) ? o.material : [o.material];
    const pairs = src.map((m) => {
      const map = m.map || m.uniforms?.map?.value || null;
      const color = m.color || m.uniforms?.litFactor?.value || new THREE.Color(1, 1, 1);
      const p = makeMats(0, { map, color, side: m.side });
      if (m.isOutline) { p.toon.visible = false; p.nd.visible = false; }
      return p;
    });
    o.userData.mats = { toon: Array.isArray(o.material) ? pairs.map(p => p.toon) : pairs[0].toon, nd: Array.isArray(o.material) ? pairs.map(p => p.nd) : pairs[0].nd };
    o.material = o.userData.mats.toon; inkMeshes.push(o);
  });
  const hum = vrm.humanoid;
  B = (n) => hum.getNormalizedBoneNode(n);
  R = (n) => hum.getRawBoneNode(n);
  hum.resetNormalizedPose(); vrm.update(0); vrm.scene.updateMatrixWorld(true);
  const wp = (n) => B(n).getWorldPosition(v3());
  const wq = (n) => B(n).getWorldQuaternion(new THREE.Quaternion());
  rest = { q: {}, p: {} };
  const names = ['hips', 'spine', 'chest', 'upperChest', 'neck', 'head'];
  for (const s of ['left', 'right']) {
    names.push(s + 'Shoulder', s + 'UpperArm', s + 'LowerArm', s + 'Hand', s + 'UpperLeg', s + 'LowerLeg', s + 'Foot', s + 'Toes');
    for (const f of ['Thumb', 'Index', 'Middle', 'Ring', 'Little']) for (const k of SEG(f)) names.push(s + f + k);
  }
  for (const n of names) if (B(n)) { rest.q[n] = wq(n); rest.p[n] = wp(n); }
  rest.hipsLocal = B('hips').position.clone();
  rest.thigh = rest.p.leftUpperLeg.distanceTo(rest.p.leftLowerLeg);
  rest.shin = rest.p.leftLowerLeg.distanceTo(rest.p.leftFoot);
  rest.k = rest.p.hips.y / 0.875;            // scale relative to the tuning model
  // finger curl axes (local to each bone): rotate the finger toward the palm
  rest.curl = {};
  for (const s of ['left', 'right']) {
    const palm = v3(0, -1, 0);
    for (const f of ['Index', 'Middle', 'Ring', 'Little', 'Thumb']) SEG(f).forEach((k, i, seg) => {
      const n = s + f + k, next = i < 2 ? s + f + seg[i + 1] : null;
      if (!B(n) || !rest.p[n]) return;
      const dir = next ? rest.p[next].clone().sub(rest.p[n]) : rest.p[n].clone().sub(rest.p[s + f + seg[1]]);
      dir.normalize();
      let n2 = palm;
      if (f === 'Thumb') n2 = v3(0, -0.55, -0.85).normalize();     // thumb folds down and back across the fingers
      const axisW = dir.clone().cross(n2).normalize();
      rest.curl[n] = axisW.applyQuaternion(rest.q[n].clone().invert());
    });

// ------------------------------------------------------------------ interactions
