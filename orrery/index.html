<head>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #f6e6c2; --soft: #b9a57f; --gold: #ffc35a; --bg: #07040c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; touch-action: none; position: fixed; inset: 0; }
  .title { position: fixed; top: 22px; left: 28px; pointer-events: none; font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 24px; letter-spacing: .08em; text-shadow: 0 2px 0 #1a0a12, 0 0 14px rgba(0,0,0,.8); }
  .title small { display: block; margin-top: 4px; font: 500 11px Inter, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--soft); }
  #hud { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(860px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #bodies { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  #bodies button { padding: 6px 12px; font: 500 12px Cinzel, Georgia, serif; letter-spacing: .06em; color: var(--ink); cursor: pointer; background: rgba(12,6,16,.62); border: 1px solid rgba(255,195,90,.32); border-radius: 3px; }
  #bodies button:hover { border-color: var(--gold); }
  #bodies button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #24110a; }
  #controls { display: flex; align-items: center; gap: 14px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); text-shadow: 0 1px 4px #000; }
  #year { font: 700 18px Cinzel, Georgia, serif; letter-spacing: .06em; color: var(--gold); font-variant-numeric: tabular-nums; min-width: 128px; text-align: right; text-transform: none; }
  #speed { width: 170px; accent-color: var(--gold); }
  .title, #hud { transition: opacity 1.2s ease .8s; }
  body.intro .title, body.intro #hud { opacity: 0; pointer-events: none; }
  #veil { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at 66% 42%, rgba(10,2,4,.18), rgba(4,1,2,.86) 72%); transition: opacity 2.6s ease; }
  #veil.out { opacity: 0; }
  #intro { position: fixed; inset: 0; z-index: 5; cursor: pointer; }
  #intro.out { pointer-events: none; }
  #seer { position: absolute; left: max(-6vw, -80px); bottom: 0; height: min(100vh, 1024px); aspect-ratio: 1; opacity: 0; transform: translateX(-90px); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); }
  #seer img { display: block; width: 100%; height: 100%; animation: breathe 6s ease-in-out infinite alternate; transform-origin: 50% 100%; filter: drop-shadow(0 0 40px rgba(0,0,0,.7)); -webkit-mask-image: linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent); }
  @keyframes breathe { to { transform: scale(1.012) translateY(-4px); } }
  #intro.in #seer { opacity: 1; transform: none; }
  #intro.out #seer { opacity: 0; transform: translateX(-160px); transition-duration: .75s; }
  #dlg { position: absolute; left: calc(min(100vh, 1024px) * .58); right: 4vw; bottom: 8vh; max-width: 860px; padding: 46px 64px 40px 60px; background: center / 100% 100% no-repeat; filter: drop-shadow(0 0 2px #000) drop-shadow(0 14px 34px rgba(0,0,0,.85)); opacity: 0; transform: translateY(18px); transition: opacity .6s ease .45s, transform .8s cubic-bezier(.2,.8,.2,1) .45s; }
  #intro.in #dlg { opacity: 1; transform: none; }
  #intro.out #dlg { opacity: 0; transform: translateY(12px); transition-delay: 0s; transition-duration: .45s; }
  #nameplate { position: absolute; top: -20px; left: 26px; padding: 12px 40px 12px 30px; background: center / 100% 100% no-repeat; color: #f7ecdb; font: 700 21px Cinzel, Georgia, serif; letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 2px 0 rgba(40,0,0,.6); }
  #line { margin: 0; min-height: 2.9em; font: 400 24px/1.5 Spectral, Georgia, serif; color: #efe4d2; }
  #next { position: absolute; right: 36px; bottom: 20px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid #d23a24; opacity: 0; }
  #next.on { opacity: 1; animation: nudge 1s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(4px); } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 760px) {
    #seer { height: 70vh; left: calc(50% - 37vh); top: 0; bottom: auto; }
    #dlg { left: 10px; right: 10px; bottom: 14px; padding: 38px 30px 30px; }
    #line { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) { #seer img { animation: none; } }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: Cinzel, Georgia, serif; }
  @media (max-width: 620px) {
    .title { top: 14px; left: 16px; font-size: 19px; }
    #bodies button { padding: 5px 8px; font-size: 11px; }
    #speed { width: 110px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div class="title">The Great Orrery<small>Vibecodevember · drag to turn · scroll to zoom</small></div>
<div id="hud">
  <div id="bodies" role="group" aria-label="Follow a body"></div>
  <div id="controls">
    <label for="speed">Clockwork</label>
    <input id="speed" type="range" min="0" max="4" step="0.01" value="1" />
    <span id="year">Anno 1887.0</span>
  </div>
</div>
<div id="error">This orrery needs WebGL 2.</div>
<div id="veil"></div>
<div id="intro" role="dialog" aria-labelledby="nameplate" aria-describedby="said">
  <div id="seer" aria-hidden="true"><img src="seer.webp" alt="" decoding="async" /></div>
  <div id="dlg">
    <div id="nameplate">Vespera</div>
    <p id="line" aria-hidden="true"></p>
    <span id="said" class="sr"></span>
    <div id="next" aria-hidden="true"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const params = new URLSearchParams(location.search);
const LOW = params.has('low');
const TAU = Math.PI * 2;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// Seeded so the room is furnished identically on every load.
let seed = 1887;
const rnd = (a = 1, b) => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  const r = seed / 4294967296;
  return b === undefined ? r * a : a + r * (b - a);
};

/* ---- Room dimensions, shared by every builder ---- */
const R = 24;                 // wall apothem
const BAYS = 12;
const HALF = R * Math.tan(Math.PI / BAYS);
const GALLERY_Y = 7.4;
const GALLERY_IN = 20.5;
const WALL_TOP = 15;
const SUN = V(0, 8.6, 0);

/* ------------------------------------------------------------------ */
/*  Renderer                                                           */
/* ------------------------------------------------------------------ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: params.has('capture') });
} catch (e) {
  document.getElementById('error').style.display = 'flex';
  throw e;
}
let pixelRatio = LOW ? 1 : Math.min(devicePixelRatio, 2, Math.max(1, 1300 / innerHeight));
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.prepend(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
// True isometric: 35.26 degrees above the horizon, orthographic, free to turn about the vertical.
const ISO_POLAR = Math.acos(1 / Math.sqrt(3));
const CAM_D = 80;
const ROOM_TARGET = V(0, 5.5, 0);
const isoDir = (az) => V(Math.sin(ISO_POLAR) * Math.sin(az), Math.cos(ISO_POLAR), Math.sin(ISO_POLAR) * Math.cos(az));
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 175);
camera.position.copy(ROOM_TARGET).addScaledVector(isoDir(Math.PI / 4), CAM_D);
camera.layers.enable(1);
function frameCamera() {
  // Fit the whole machine: wide screens are limited by height, tall ones by width.
  const a = innerWidth / innerHeight, h = Math.max(13.5, 19.5 / a);
  camera.top = h; camera.bottom = -h; camera.left = -h * a; camera.right = h * a;
  camera.updateProjectionMatrix();
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(ROOM_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minPolarAngle = controls.maxPolarAngle = ISO_POLAR;
controls.minZoom = 0.8;
controls.maxZoom = 7;
controls.autoRotate = true;
controls.autoRotateSpeed = -0.35;
controls.enablePan = false;

// Dollhouse cutaway: the near walls, near gallery and the dome above the machine are sliced away.
const CUT = 19.5;
const clipCut = new THREE.Plane(), clipTop = new THREE.Plane();
renderer.clippingPlanes = [clipCut, clipTop];
let capMesh = null;
function updateClip() {
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  const nx = Math.sin(az), nz = Math.cos(az);
  clipCut.normal.set(-nx, 0, -nz); clipCut.constant = CUT;
  clipTop.normal.set(-0.8 * nx, -1, -0.8 * nz); clipTop.constant = 26; clipTop.normalize();
  if (capMesh) {
    capMesh.position.set(nx * (CUT - 0.02), 0, nz * (CUT - 0.02));
    capMesh.rotation.set(0, az, 0);
  }
}

/* ------------------------------------------------------------------ */
/*  Painted textures: everything is hand-inked on a 2D canvas          */
/* ------------------------------------------------------------------ */
function paint(w, h, fn, { repeat = true, srgb = true } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  fn(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
function strokes(g, w, h, n, style, len, width, ang = 0, spread = 0.3) {
  g.strokeStyle = style; g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = rnd(w), y = rnd(h), a = ang + rnd(-spread, spread), l = len * rnd(0.4, 1.3);
    g.lineWidth = width * rnd(0.5, 1.4);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
}
function blotches(g, w, h, n, style, r0, r1) {
  g.fillStyle = style;
  for (let i = 0; i < n; i++) {
    g.beginPath();
    const x = rnd(w), y = rnd(h), r = rnd(r0, r1);
    for (let k = 0; k <= 9; k++) {
      const a = k / 9 * TAU, q = r * rnd(0.6, 1.2);
      k ? g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q) : g.moveTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
    }
    g.fill();
  }
}
const INK = '#120812';

const TEX = {
  brick: paint(1024, 1024, (g, w, h) => {
    g.fillStyle = '#1b0f14'; g.fillRect(0, 0, w, h);
    const rows = 12, bh = h / rows, bw = w / 6;
    for (let r = 0; r < rows; r++) for (let c = -1; c < 7; c++) {
      const x = c * bw + (r % 2) * bw / 2, y = r * bh, hue = rnd(5, 24), l = rnd(17, 33);
      g.fillStyle = hsl(hue, rnd(35, 55), l);
      g.beginPath();
      g.moveTo(x + 5 + rnd(3), y + 5 + rnd(2)); g.lineTo(x + bw - 5 - rnd(3), y + 5 + rnd(3));
      g.lineTo(x + bw - 5 - rnd(2), y + bh - 5 - rnd(3)); g.lineTo(x + 5 + rnd(3), y + bh - 5 - rnd(2));
      g.closePath(); g.fill();
      g.fillStyle = hsl(hue + 6, 55, l + 10, 0.7);
      g.fillRect(x + 9, y + 8, bw * rnd(0.3, 0.75), 5);
      g.fillStyle = hsl(290, 40, 8, 0.6);
      g.fillRect(x + bw * rnd(0.2, 0.5), y + bh - 15, bw * 0.45, 7);
    }
    strokes(g, w, h, 500, 'rgba(18,8,18,.55)', 32, 2.2, 0.8, 0.14);
    blotches(g, w, h, 30, 'rgba(10,6,18,.25)', 24, 70);
  }),
  iron: paint(1024, 1024, (g, w, h) => {
    g.fillStyle = '#343344'; g.fillRect(0, 0, w, h);
    blotches(g, w, h, 90, 'rgba(62,62,86,.45)', 30, 90);
    blotches(g, w, h, 60, 'rgba(20,16,28,.5)', 20, 80);
    blotches(g, w, h, 26, 'rgba(120,58,34,.3)', 8, 34);
    strokes(g, w, h, 500, 'rgba(14,10,20,.5)', 30, 2, 1.57, 0.12);
    strokes(g, w, h, 240, 'rgba(120,125,160,.22)', 28, 1.6, 0, 0.1);
  }),
  brass: paint(512, 512, (g, w, h) => {
    g.fillStyle = '#d29a3a'; g.fillRect(0, 0, w, h);
    blotches(g, w, h, 34, 'rgba(240,190,90,.5)', 18, 56);
    blotches(g, w, h, 30, 'rgba(110,62,20,.42)', 14, 50);
    strokes(g, w, h, 360, 'rgba(70,34,12,.4)', 26, 1.4, 0.4, 0.16);
    strokes(g, w, h, 140, 'rgba(255,230,160,.45)', 22, 1.2, 0.4, 0.16);
  }),
  copper: paint(1024, 1024, (g, w, h) => {
    g.fillStyle = '#a65a33'; g.fillRect(0, 0, w, h);
    blotches(g, w, h, 80, 'rgba(204,118,64,.5)', 20, 70);
    blotches(g, w, h, 40, 'rgba(58,146,128,.55)', 20, 90);
    strokes(g, w, h, 240, 'rgba(66,170,148,.5)', 90, 6, 1.57, 0.08);
    strokes(g, w, h, 400, 'rgba(40,16,14,.45)', 26, 2, 0.5, 0.2);
  }),
  wood: paint(1024, 1024, (g, w, h) => {
    g.fillStyle = '#3f2015'; g.fillRect(0, 0, w, h);
    const planks = 5;
    for (let p = 0; p < planks; p++) {
      const y = p * h / planks;
      g.fillStyle = hsl(rnd(12, 24), rnd(42, 58), rnd(14, 24));
      g.fillRect(0, y, w, h / planks);
      for (let i = 0; i < 26; i++) {
        g.strokeStyle = rnd() < 0.72 ? 'rgba(18,7,10,.55)' : 'rgba(170,92,44,.3)';
        g.lineWidth = rnd(1, 3);
        const y0 = y + rnd(h / planks); g.beginPath(); g.moveTo(0, y0);
        for (let x = 0; x <= w; x += 64) g.lineTo(x, y0 + Math.sin(x * 0.007 + i + p) * 7);
        g.stroke();
      }
      g.fillStyle = INK; g.fillRect(0, y, w, 4);
    }
  }),
  plaster: paint(1024, 1024, (g, w, h) => {
    g.fillStyle = '#1e3a44'; g.fillRect(0, 0, w, h);
    blotches(g, w, h, 90, 'rgba(38,84,92,.14)', 30, 110);
    blotches(g, w, h, 70, 'rgba(12,16,36,.16)', 30, 110);
    strokes(g, w, h, 420, 'rgba(8,10,24,.45)', 34, 2, 0.8, 0.16);
    // Riveted seams, so the upper tier reads as a painted iron hull.
    g.strokeStyle = 'rgba(6,6,16,.9)'; g.lineWidth = 6;
    for (const [a, b, c, d] of [[0, 512, 1024, 512], [512, 0, 512, 512], [256, 512, 256, 1024], [768, 512, 768, 1024]]) { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); }
    g.strokeStyle = 'rgba(112,178,170,.35)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 518); g.lineTo(1024, 518); g.moveTo(518, 0); g.lineTo(518, 505); g.stroke();
  }),
  white: paint(4, 4, (g) => { g.fillStyle = '#fff'; g.fillRect(0, 0, 4, 4); }),
};
TEX.book = paint(128, 256, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(0, 0, w * 0.2, h);
  g.fillStyle = '#ffe9a4';
  for (const y of [24, 40, 200, 216]) g.fillRect(0, y, w, 6);
  g.fillRect(16, 96, w - 32, 34);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(24, 106, w - 48, 4); g.fillRect(24, 116, w - 58, 4);
});

/* ---- Floor: a great inlaid disc, ring upon ring of tile ---- */
const GLYPHS = '♈♉♊♋♌♍♎♏♐♑♒♓'.split('').map((s) => s + '︎');
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
TEX.floor = paint(LOW ? 2048 : 4096, LOW ? 2048 : 4096, (g, w) => {
  const c = w / 2, s = w / 52;       // pixels per metre: the disc is 52 m across
  g.fillStyle = '#100a18'; g.fillRect(0, 0, w, w);
  g.save(); g.translate(c, c);
  const rings = [[8, 10.2, 36], [10.2, 12.4, 48], [12.4, 15.2, 60], [15.2, 18.2, 72], [18.2, 21.4, 84], [21.4, 26, 96]];
  rings.forEach(([a, b, n], r) => {
    for (let i = 0; i < n; i++) {
      const t0 = i / n * TAU, t1 = (i + 1) / n * TAU;
      const odd = (i + r) % 2;
      g.fillStyle = odd ? hsl(rnd(188, 200), rnd(30, 42), rnd(14, 20)) : hsl(rnd(278, 296), rnd(22, 34), rnd(11, 16));
      g.beginPath(); g.arc(0, 0, a * s, t0, t1); g.arc(0, 0, b * s, t1, t0, true); g.closePath(); g.fill();
      g.strokeStyle = INK; g.lineWidth = 5; g.stroke();
      // Veins and painted wear on every tile.
      const tm = (t0 + t1) / 2;
      g.fillStyle = 'rgba(190,226,230,.07)';
      g.beginPath(); g.arc(0, 0, (a + (b - a) * 0.4) * s, t0 + 0.012, tm); g.arc(0, 0, (a + (b - a) * 0.8) * s, tm, t0 + 0.012, true); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(214,236,226,.14)'; g.lineWidth = 2;
      g.beginPath();
      for (let k = 0; k < 4; k++) {
        const rr = (a + (b - a) * rnd()) * s, tt = t0 + (t1 - t0) * rnd();
        k ? g.lineTo(Math.cos(tt) * rr, Math.sin(tt) * rr) : g.moveTo(Math.cos(tt) * rr, Math.sin(tt) * rr);
      }
      g.stroke();
    }
  });
  // Brass inlay rings.
  for (const [r, lw] of [[8, 16], [10.2, 8], [12.4, 12], [15.2, 22], [15.5, 6], [18.2, 10], [21.4, 18]]) {
    g.strokeStyle = '#7a4e1d'; g.lineWidth = lw + 4; g.beginPath(); g.arc(0, 0, r * s, 0, TAU); g.stroke();
    g.strokeStyle = '#d7a144'; g.lineWidth = lw; g.beginPath(); g.arc(0, 0, r * s, 0, TAU); g.stroke();
  }
  // Compass rays between the dais and the zodiac band.
  for (let i = 0; i < 24; i++) {
    const t = i / 24 * TAU, big = i % 2 === 0;
    g.save(); g.rotate(t);
    g.fillStyle = big ? '#c58f35' : '#7a5222';
    g.beginPath(); g.moveTo(8 * s, -0.42 * s); g.lineTo((big ? 12.3 : 10.15) * s, 0); g.lineTo(8 * s, 0.42 * s); g.closePath(); g.fill();
    g.strokeStyle = INK; g.lineWidth = 5; g.stroke();
    g.restore();
  }
  // Zodiac band, with each sign set in a brass medallion.
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 12; i++) {
    const t = (i + 0.5) / 12 * TAU, rr = 16.7 * s;
    g.save(); g.rotate(t); g.translate(rr, 0); g.rotate(Math.PI / 2);
    g.fillStyle = '#231528'; g.strokeStyle = '#d7a144'; g.lineWidth = 10;
    g.beginPath(); g.arc(0, 0, 1.15 * s, 0, TAU); g.fill(); g.stroke();
    g.font = `${1.5 * s}px "Segoe UI Symbol","Apple Symbols",serif`;
    g.fillStyle = '#efc56c'; g.fillText(GLYPHS[i], 0, 0);
    g.font = `700 ${0.5 * s}px Georgia,serif`;
    g.fillText(ROMAN[i], 0, -1.32 * s + 2.6 * s + 0.1 * s);
    g.restore();
  }
  // Degree ticks.
  for (let i = 0; i < 360; i++) {
    const t = i / 360 * TAU, big = i % 30 === 0;
    g.strokeStyle = big ? '#f4cf79' : '#b88a3a'; g.lineWidth = big ? 7 : 3;
    g.beginPath(); g.moveTo(Math.cos(t) * 15.5 * s, Math.sin(t) * 15.5 * s);
    g.lineTo(Math.cos(t) * (15.5 + (big ? 0.6 : i % 5 ? 0.18 : 0.34)) * s, Math.sin(t) * (15.5 + (big ? 0.6 : i % 5 ? 0.18 : 0.34)) * s);
    g.stroke();
  }
  // Footworn paths and soot.
  for (let i = 0; i < 260; i++) {

const gearCache = new Map();
function gearGeo(teeth, module, thick, { spokes = 0, hole = 0, bevel = 0.012 } = {}) {
  const key = [teeth, module, thick, spokes, hole, bevel].join();
  if (gearCache.has(key)) return gearCache.get(key);
  const r = module * teeth / 2, ro = r + module * 0.9, rr = r - module * 1.1;
  const s = new THREE.Shape();
  for (let i = 0; i < teeth; i++) {
    const a = i / teeth * TAU, w = TAU / teeth;
    const pts = [[rr, -0.5 * w], [rr, -0.27 * w], [ro, -0.13 * w], [ro, 0.13 * w], [rr, 0.27 * w]];
    pts.forEach(([q, d], k) => {
      const x = Math.cos(a + d) * q, y = Math.sin(a + d) * q;
      (i === 0 && k === 0) ? s.moveTo(x, y) : s.lineTo(x, y);

  }
  s.closePath();
  const hub = Math.max(hole * 1.6, r * 0.2), rim = rr * 0.8;

    for (let i = 0; i < spokes; i++) {
      const a0 = i / spokes * TAU + 0.16 * (6 / spokes), a1 = (i + 1) / spokes * TAU - 0.16 * (6 / spokes);
      const h = new THREE.Path();
      const N = 10;
      for (let k = 0; k <= N; k++) { const t = a0 + (a1 - a0) * k / N; k ? h.lineTo(Math.cos(t) * rim, Math.sin(t) * rim) : h.moveTo(Math.cos(t) * rim, Math.sin(t) * rim); }

    }
  }
  if (hole) { const h = new THREE.Path(); h.absarc(0, 0, hole, 0, TAU, true); s.holes.push(h); }

}

  bookM.forEach((m, i) => { books.setMatrixAt(i, m); books.setColorAt(i, col.setHex(bookC[i])); });

function bandsTex(cols, ink = 'rgba(14,6,20,.55)') {
  return (g, w, h) => {
    g.fillStyle = cols[0]; g.fillRect(0, 0, w, h);
    let y = 0;
    let i = 0;
    while (y < h) {
      const bh = rnd(h * 0.04, h * 0.13);
      g.fillStyle = cols[i++ % cols.length];
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.03 + i) * 5 + Math.sin(x * 0.011 + i * 2) * 7);
      g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fill();
      g.strokeStyle = ink; g.lineWidth = 3;
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.03 + i) * 5 + Math.sin(x * 0.011 + i * 2) * 7);
      g.stroke();
      y += bh;
    }
  };
}
function cratered(base, dark, light, n) {
  return (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    blotches(g, w, h, 40, light, 16, 50);
    blotches(g, w, h, 30, dark, 14, 42);
    for (let i = 0; i < n; i++) {
      const x = rnd(w), y = rnd(h), r = rnd(4, 22);
      g.fillStyle = dark; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      g.strokeStyle = light; g.lineWidth = Math.max(1.5, r * 0.18); g.beginPath(); g.arc(x, y, r, 0.6, 3.2); g.stroke();
      g.strokeStyle = INK; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 3.4, 6.1); g.stroke();
    }
  };
}

function ringMesh(rIn, rOut, tex, op = 1) {
  const g = new THREE.RingGeometry(rIn, rOut, 96, 3);
  const pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (Math.hypot(pos.getX(i), pos.getY(i)) - rIn) / (rOut - rIn), 0.5);
  g.rotateX(-Math.PI / 2);
  const m = phong({ map: tex, transparent: op < 1, opacity: op, alphaTest: 0.08, side: THREE.DoubleSide, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.32, shininess: 30, specular: 0x222222 }, { rim: 0, hatch: 0.3 });
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.layers.set(1);
  return mesh;
}

function buildOrrery() {
  const fixed = new Bucket();

  // Dais: stepped marble, brass nosings and a calendar plate.
  const R0 = 9;
  for (const [y, r, h] of [[0.12, R0, 0.24], [0.44, R0 - 0.45, 0.4], [0.8, R0 - 0.9, 0.32]]) {

    fixed.add(MO.brass, tor(r + 0.03, 0.05, 8, 96).rotateX(Math.PI / 2), T(0, y + h / 2 - 0.02, 0));
  }
  const top = new THREE.Mesh(new THREE.CircleGeometry(8.1, 96).rotateX(-Math.PI / 2), MO.dais);
  top.position.y = 0.97; top.receiveShadow = true; orreryRoot.add(top);
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU, x = Math.cos(a) * 8.6, z = Math.sin(a) * 8.6;
    fixed.add(MO.brass, cyl(0.08, 0.12, 0.08, 12), T(x, 0.27, z));
    fixed.add(MO.gold, sph(0.09, 10, 8), T(x, 0.36, z));
  }
  // Railing posts round the dais.
  for (let i = 0; i < 24; i++) {
    const a = (i + 0.5) / 24 * TAU, x = Math.cos(a) * 7.6, z = Math.sin(a) * 7.6;
    fixed.add(MO.brass, lathe([[0.1, 0], [0.06, 0.1], [0.03, 0.2], [0.03, 0.72], [0.06, 0.78], [0.03, 0.82], [0, 0.88]], 10), T(x, 0.97, z));
  }
  fixed.add(MO.brass, tor(7.6, 0.025, 6, 96).rotateX(Math.PI / 2), T(0, 1.7, 0));
  fixed.add(MO.ironDark, tor(7.6, 0.015, 6, 96).rotateX(Math.PI / 2), T(0, 1.4, 0));

  // Gearbox: an open cage with plates top and bottom; the train inside is on show.
  const cage = 5.55;
  fixed.add(MO.iron, cyl(cage + 0.1, cage + 0.25, 0.14, 64), T(0, 1.04, 0));
  const plateShape = new THREE.Shape(); plateShape.absarc(0, 0, cage + 0.12, 0, TAU);
  const plateHole = new THREE.Path(); plateHole.absarc(0, 0, 1.02, 0, TAU, true); plateShape.holes.push(plateHole);
  const windows = 8;
  for (let i = 0; i < windows; i++) {
    const a0 = i / windows * TAU + 0.1, a1 = (i + 1) / windows * TAU - 0.1, h = new THREE.Path();
    for (let k = 0; k <= 8; k++) { const t = a0 + (a1 - a0) * k / 8; k ? h.lineTo(Math.cos(t) * 5.05, Math.sin(t) * 5.05) : h.moveTo(Math.cos(t) * 5.05, Math.sin(t) * 5.05); }
    for (let k = 8; k >= 0; k--) { const t = a0 + (a1 - a0) * k / 8; h.lineTo(Math.cos(t) * 2.7, Math.sin(t) * 2.7); }
    h.closePath(); plateShape.holes.push(h);
  }
  fixed.add(MO.brass, new THREE.ExtrudeGeometry(plateShape, { depth: 0.1, bevelEnabled: true, bevelSize: 0.015, bevelThickness: 0.015, bevelSegments: 1, curveSegments: 48 }).rotateX(-Math.PI / 2), T(0, 3.42, 0));
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU, x = Math.cos(a) * cage, z = Math.sin(a) * cage;
    fixed.add(i % 2 ? MO.brass : MO.ironDark, lathe([[0.16, 0], [0.16, 0.08], [0.09, 0.16], [0.07, 1.1], [0.11, 1.18], [0.07, 1.26], [0.09, 2.2], [0.16, 2.3], [0.16, 2.36]], 12), T(x, 1.07, z));
  }
  for (let i = 0; i < 64; i++) { const a = i / 64 * TAU; rivet(T(Math.cos(a) * (cage - 0.06), 3.52, Math.sin(a) * (cage - 0.06), 0, 0, 0, 0.045)); }
  for (let i = 0; i < 40; i++) { const a = i / 40 * TAU; rivet(T(Math.cos(a) * 1.15, 3.52, Math.sin(a) * 1.15, 0, 0, 0, 0.045)); }

  // Fixed spindle rising above the top tube to carry the sun.
  fixed.add(MO.brass, lathe([[0.22, 5.85], [0.22, 6.9], [0.32, 6.96], [0.26, 7.02], [0.5, 7.2], [0.28, 7.3], [0.2, 7.45], [0.34, 7.56]], 24));

  /* ---- Sun cradle: brass petals curling up around the sun ---- */
  for (let i = 0; i < 12; i++) {

    const g = new THREE.ExtrudeGeometry(s, { depth: 0.025, bevelEnabled: false, curveSegments: 6 });

    { r: 1.98, t: 0.03, rx: 0.5,  rz: 1.2,  rate: 0.16,  mat: MO.copper },
    { r: 1.8,  t: 0.025, rx: 1.7,  rz: 0.7,  rate: -0.23, mat: MO.brass },
  ];
  armillary.forEach((a, i) => {

    const b = new Bucket();
    b.add(a.mat, tor(a.r, a.t, 8, 96).rotateX(Math.PI / 2));
    if (a.gr) {
      b.add(MO.ironDark, tor(a.r - 0.09, 0.015, 6, 96).rotateX(Math.PI / 2));
      b.add(MO.ironDark, tor(a.r + 0.09, 0.015, 6, 96).rotateX(Math.PI / 2));
      for (let k = 0; k < 72; k++) { const t = k / 72 * TAU; b.add(k % 6 ? MO.brass : MO.gold, box(k % 6 ? 0.012 : 0.03, 0.03, 0.14), new THREE.Matrix4().makeRotationY(t).multiply(T(a.r, 0, 0, 0, Math.PI / 2))); }

  });

  spire.add(MO.brass, lathe([[0.1, 0], [0.04, 0.3], [0.06, 0.34], [0.02, 0.8], [0, 1.0]], 12), T(0, SUN.y + 1.55, 0));
  spire.bake(orreryRoot);

  /* ---- Rail for the outermost arm, on stanchions from the floor ---- */
  const outer = PLANETS[7], railY = outer.arm - 0.2;
  const rail = new Bucket();
  rail.add(MO.brass, tor(outer.r, 0.07, 8, 192).rotateX(Math.PI / 2), T(0, railY, 0));
  rail.add(MO.ironDark, tor(outer.r, 0.04, 6, 192).rotateX(Math.PI / 2), T(0, railY - 0.24, 0));
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU, x = Math.cos(a) * outer.r, z = Math.sin(a) * outer.r;
    rail.add(MO.ironDark, lathe([[0.3, 0], [0.3, 0.1], [0.14, 0.2], [0.08, 0.6], [0.06, railY - 0.7], [0.1, railY - 0.6], [0.06, railY - 0.5], [0.09, railY - 0.1], [0.04, railY - 0.05]], 12), T(x, 0, z));
    for (let k = 0; k < 6; k++) { const q = k / 6 * TAU; rivet(T(x + Math.cos(q) * 0.25, 0.1, z + Math.sin(q) * 0.25, 0, 0, 0, 0.035)); }
  }
  rail.bake(orreryRoot, { cast: true });

  /* ---- Each planet: coaxial tube, crown gear, truss arm, post, body ---- */
  PLANETS.forEach((p, i) => {
    const arm = new THREE.Group();
    const b = new Bucket(), g = new Bucket();
    const rate = BASE_RATE / Math.pow(p.period, 0.55);
    p.rate = rate;

    // Crown gear low in the box. Innermost tubes are tallest; the outer planets' gears sit lowest.
    const gearY = 3.18 - i * 0.26;
    const gr = MODULE * p.T / 2;
    const tubeR = 0.2 + i * 0.1;
    const tubeTop = p.arm + 0.12;
    g.add(MO.brass, flat(gearGeo(p.T, MODULE, 0.09, { spokes: p.T > 30 ? 8 : 6, hole: tubeR, bevel: 0.008 })), T(0, gearY, 0));
    g.add(MO.ironDark, cyl(tubeR + 0.03, tubeR + 0.03, 0.2, 18), T(0, gearY, 0));
    g.add(i % 2 ? MO.brass : MO.copper, cyl(tubeR, tubeR, tubeTop - gearY, 20), T(0, (tubeTop + gearY) / 2, 0));
    g.add(MO.gold, cyl(tubeR + 0.05, tubeR + 0.05, 0.1, 20), T(0, tubeTop - 0.02, 0));
    g.add(MO.ironDark, cyl(tubeR + 0.11, tubeR + 0.11, 0.26, 16), T(0, p.arm, 0));
    for (let k = 0; k < 12; k++) { const a = k / 12 * TAU; g.add(MO.gold, sph(0.022, 6, 4), T(Math.cos(a) * (tubeR + 0.11), p.arm + 0.13, Math.sin(a) * (tubeR + 0.11))); }

    // Truss arm: top and bottom chords, zig-zag bracing, tapering outward.
    const hNear = 0.12 + p.r * 0.012, n = Math.max(5, Math.round(p.r * 2.1));
    const chordX = (s) => tubeR + (p.r - tubeR) * s;
    const yAt = (s, up) => (up ? p.arm + hNear * (1 - s * 0.7) : p.arm - hNear * (1 - s * 0.7));
    const chR = 0.028 + p.r * 0.0022;
    g.beam(MO.brass, V(chordX(0), yAt(0, 1), 0), V(chordX(1), yAt(1, 1), 0), chR, 7);
    g.beam(MO.brass, V(chordX(0), yAt(0, 0), 0), V(chordX(1), yAt(1, 0), 0), chR, 7);
    for (let k = 0; k < n; k++) {
      const s0 = k / n, s1 = (k + 1) / n;
      g.beam(MO.ironDark, V(chordX(s0), yAt(s0, k % 2), 0), V(chordX(s1), yAt(s1, !(k % 2)), 0), chR * 0.62, 5);
    }
    for (const s of [0.25, 0.5, 0.75]) g.add(MO.gold, cyl(0.06 + p.r * 0.004, 0.06 + p.r * 0.004, 0.05, 12).rotateX(Math.PI / 2), T(chordX(s), p.arm, 0));

    // Counterweight on the far side.
    const cw = 0.9 + p.r * 0.2;
    g.beam(MO.ironDark, V(-tubeR, p.arm, 0), V(-cw, p.arm, 0), chR * 1.3, 7);
    g.add(MO.brass, sph(0.14 + p.s * 0.2, 24, 16).scale(1.3, 0.8, 0.8), T(-cw, p.arm, 0));
    g.add(MO.gold, cyl(0.02, 0.02, 0.2 + p.s * 0.5, 6), T(-cw, p.arm, 0));

    // Post: tall, with collars, a small drive gear and a filigree scroll.
    const postTop = p.y - p.s - (p.key === 'saturn' ? 0.02 : 0.02);
    const postR = 0.038 + p.r * 0.0014;
    g.add(MO.brass, cyl(postR, postR * 1.6, postTop - p.arm, 10), T(p.r, (postTop + p.arm) / 2, 0));
    g.add(MO.brass, flat(gearGeo(14, 0.04, 0.03, { bevel: 0 })), T(p.r, p.arm + 0.2, 0));
    for (let k = 1; k < 4; k++) g.add(k % 2 ? MO.gold : MO.ironDark, cyl(postR * 1.8, postR * 1.8, 0.05, 10), T(p.r, p.arm + (postTop - p.arm) * k / 4, 0));
    g.add(MO.ironDark, lathe([[0.18, -0.2], [0.14, -0.1], [0.08, 0.1], [postR, 0.3]], 12), T(p.r, p.arm, 0));
    // Scroll brace from arm to post.
    const brace = new THREE.CatmullRomCurve3([V(p.r - 1.0 - p.r * 0.05, p.arm + 0.1, 0), V(p.r - 0.5, p.arm + 0.22, 0), V(p.r - 0.15, p.arm + 0.5, 0), V(p.r - postR, p.arm + 0.75 + p.r * 0.03, 0)]);
    g.add(MO.brass, new THREE.TubeGeometry(brace, 14, 0.018 + p.r * 0.0009, 5));

    // Neptune's arm also rides a roller on the rail.
    if (i === 7) {
      g.add(MO.ironDark, cyl(0.2, 0.2, 0.09, 14).rotateZ(Math.PI / 2), T(p.r, railY + 0.18, 0));
      g.beam(MO.ironDark, V(p.r, p.arm - 0.15, 0), V(p.r, railY + 0.18, 0), 0.03, 6);
    }
    g.bake(arm, { cast: true, brassy: MO });
    arm.rotation.y = p.phase;
    orreryRoot.add(arm);
    p.pivot = arm;

    // The body itself, in a cup and half-meridian.
    const holder = new THREE.Group();
    holder.position.set(p.r, p.y, 0);
    arm.add(holder);
    p.holder = holder;
    const d = new Bucket();
    const cupR = Math.max(0.12, p.s * 0.48);
    d.add(MO.brass, lathe([[0.02, 0], [cupR * 0.4, 0.015], [cupR, 0.1], [cupR * 1.1, 0.13], [cupR, 0.14], [cupR * 0.4, 0.04]], 16), T(0, -p.s - 0.05, 0));
    // A half-meridian, skipped where rings would foul it.
    if (!['saturn', 'uranus', 'neptune'].includes(p.key)) {
      d.add(MO.brass, tor(p.s * 1.1, 0.008 + p.s * 0.012, 6, 32, Math.PI), T(0, 0, 0, 0, 0, Math.PI / 2 + 0.0));
      d.add(MO.gold, sph(0.02 + p.s * 0.03, 8, 6), T(0, p.s * 1.1, 0));
    }
    d.bake(holder, { brassy: MO });

    const glowAmt = 0.2;
    const body = new THREE.Mesh(sph(p.s, 40, 28), planetMat(p.key, glowAmt));
    body.castShadow = true; body.receiveShadow = true;
    body.rotation.z = p.tilt;
    holder.add(body);
    p.body = body;

    // Every planet is a lamp as well as a body.
    const light = new THREE.PointLight(p.light, p.I * 0.95, 30, 1.25);
    holder.add(light);
    p.light3 = light;
    const halo = glow(V(), 1.4 + p.s * 4.6, p.light, holder, 0.34);
    powered.push({ sprite: halo, op: 0.34 });
    p.halo = halo;

    if (p.key === 'saturn') {
      const tex = ringTex([[0, 0.14, 'rgba(160,136,96,.75)'], [0.14, 0.5, '#e8cf94'], [0.5, 0.54, 'rgba(0,0,0,0)'], [0.54, 0.74, '#cfa968'], [0.74, 0.8, 'rgba(0,0,0,0)'], [0.8, 0.96, '#f0dcae'], [0.96, 1, 'rgba(200,170,120,.5)']]);
      const ring = ringMesh(1.28, 1.85, tex); ring.rotation.z = p.tilt;
      holder.add(ring);
      const ringBand = new Bucket();
      ringBand.add(MO.gold, tor(1.85, 0.015, 6, 96).rotateX(Math.PI / 2));
      ringBand.bake(ring);
    }
    if (p.key === 'uranus') {
      const tex = ringTex([[0, 0.3, 'rgba(0,0,0,0)'], [0.3, 0.42, '#bff2ee'], [0.42, 0.7, 'rgba(0,0,0,0)'], [0.7, 0.86, '#e6fff8'], [0.86, 1, 'rgba(0,0,0,0)']]);
      const ring = ringMesh(0.92, 1.18, tex); ring.rotation.z = p.tilt;
      holder.add(ring);
    }
    if (p.key === 'neptune') {
      const tex = ringTex([[0, 0.5, 'rgba(0,0,0,0)'], [0.5, 0.64, '#9bb7ff'], [0.64, 1, 'rgba(0,0,0,0)']]);
      const ring = ringMesh(0.9, 1.15, tex); ring.rotation.z = p.tilt;
      holder.add(ring);
    }
    const addMoon = (key, r, s, rate, h = 0, phase = 0) => {
      const carrier = new THREE.Group();
      carrier.position.y = h;
      const c = new Bucket();
      c.beam(MO.brass, V(0, 0, 0), V(r, 0, 0), 0.012, 5);
      c.add(MO.ironDark, cyl(0.03, 0.03, 0.05, 8), T(0, 0, 0));
      c.add(MO.gold, cyl(0.03, 0.03, s + 0.04, 6), T(r, -s / 2, 0));
      c.bake(carrier, { brassy: MO });
      const moon = new THREE.Mesh(sph(s, 18, 12), planetMat(key, 0.22));
      moon.position.set(r, 0, 0);
      carrier.add(moon);
      holder.add(carrier);
      moons.push({ carrier, rate, phase });
      carrier.rotation.y = phase;
    };
    if (p.key === 'earth') addMoon('moon', 0.86, 0.13, 1.1);
    if (p.key === 'mars') { addMoon('ice', 0.55, 0.05, 1.8); addMoon('ice', 0.72, 0.04, 1.2, 0, 2); }
    if (p.key === 'jupiter') { addMoon('ice', 1.46, 0.07, 1.5, 0.04); addMoon('moon', 1.58, 0.07, 1.0, -0.04, 1.4); addMoon('moon', 1.7, 0.09, 0.66, 0.02, 3); addMoon('ice', 1.82, 0.08, 0.4, -0.02, 4.4); }

    // Lay shaft and pinion meshing with the crown gear.
    const Tp = 14;
    const rp = MODULE * Tp / 2;
    const az = i / 8 * TAU + 0.4;
    const dist = gr + rp;
    const px = Math.cos(az) * dist, pz = -Math.sin(az) * dist;
    const pin = new THREE.Mesh(flat(gearGeo(Tp, MODULE, 0.09, { hole: 0.02, bevel: 0.008 })), MO.copper);
    pin.position.set(px, gearY, pz);
    orreryRoot.add(pin);
    const shaft = new Bucket();
    shaft.add(MO.ironDark, cyl(0.045, 0.045, 3.45 - gearY, 8), T(px, (3.45 + gearY) / 2, pz));
    shaft.add(MO.ironDark, cyl(0.045, 0.045, gearY - 1.06, 8), T(px, (gearY + 1.06) / 2, pz));
    shaft.add(MO.gold, cyl(0.07, 0.07, 0.04, 10), T(px, 3.56, pz));
    shaft.bake(orreryRoot);
    pinions.push({ mesh: pin, az, Tg: p.T, Tp, planet: p });
  });
}

/* ------------------------------------------------------------------ */
/*  The sun: animated cel fire with tongues of flame                   */
/* ------------------------------------------------------------------ */
const NOISE = /* glsl */`
  vec3 hash3(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6))); return -1.+2.*fract(sin(p)*43758.5453); }
  float gn(vec3 p){ vec3 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
    return mix(mix(mix(dot(hash3(i),f),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
               mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z); }
  float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*gn(p); p=p*2.03+7.1; a*=.5; } return s; }`;
const SUN_R = 1.32;
let sunCore, sunFlame;
const powered = [];          // glow sprites that belong to the orrery's power
function buildSun() {
  sunCore = new THREE.Mesh(sph(SUN_R, 64, 48), new THREE.ShaderMaterial({
    uniforms: { uTime: shared.uTime, uPower: shared.uPower },
    vertexShader: `varying vec3 vP; varying vec3 vN; varying vec3 vV;
      void main(){ vP=position; vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); vV=projectionMatrix[3][3]>.5?vec3(0.,0.,1.):normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `uniform float uTime, uPower; varying vec3 vP; varying vec3 vN; varying vec3 vV; ${NOISE}
      void main(){
        vec3 p=normalize(vP);
        float w=fbm(p*2.2+vec3(0.,uTime*.12,0.));
        float n=fbm(p*3.4+w*2.+vec3(uTime*.07,-uTime*.1,uTime*.05))*1.4+.5;
        float limb=pow(clamp(dot(normalize(vN),normalize(vV)),0.,1.),.6);
        float t=n*.62+limb*.34;
        vec3 c;
        // Four hard-edged paint colours, then pushed well over 1 for the bloom.
        if(t<.62) c=vec3(1.,.2,.03)*1.5; else if(t<.76) c=vec3(1.,.38,.04)*1.9; else if(t<.9) c=vec3(1.,.62,.12)*2.4; else c=vec3(1.,.86,.5)*3.2;
        // Switched off: a cold cinder with a few cracks still faintly glowing.
        vec3 cold=vec3(.006,.004,.007)+vec3(.018,.014,.03)*pow(limb,3.)+vec3(.6,.12,.03)*smoothstep(.88,.96,t)*.4;
        gl_FragColor=vec4(mix(cold,c,uPower),1.);
      }`,
  }));
  sunCore.position.copy(SUN);
  orreryRoot.add(sunCore);

  sunFlame = new THREE.Mesh(sph(SUN_R * 1.02, 72, 54), new THREE.ShaderMaterial({
    uniforms: { uTime: shared.uTime, uPower: shared.uPower },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `uniform float uTime; varying vec3 vP; varying float vH; ${NOISE}
      void main(){ vec3 d=normalize(position); float h=fbm(d*2.8+vec3(0.,-uTime*.34,uTime*.1));
        h=max(0.,h+.1); vH=h; vP=d; vec3 q=position+d*h*1.5; gl_Position=projectionMatrix*modelViewMatrix*vec4(q,1.); }`,
    fragmentShader: `uniform float uTime, uPower; varying vec3 vP; varying float vH; ${NOISE}
      void main(){ float f=fbm(vP*5.+vec3(0.,-uTime*.6,0.))+vH;
        if(f<.13+(1.-uPower)*.7) discard;    // tongues shrink back into the sphere as power drops
        vec3 c = f<.24 ? vec3(1.,.16,.02)*.5 : f<.42 ? vec3(1.,.34,.04)*.7 : vec3(1.,.6,.14)*.9;
        gl_FragColor=vec4(c*uPower,1.);
      }`,
  }));
  sunFlame.position.copy(SUN);
  sunFlame.layers.set(1);
  orreryRoot.add(sunFlame);

  powered.push({ sprite: glow(SUN, 9, 0xff7a24, orreryRoot, 0.3), op: 0.3 });
  powered.push({ sprite: glow(SUN, 26, 0xc0401a, orreryRoot, 0.13), op: 0.13 });
}

/* ------------------------------------------------------------------ */
/*  Atmosphere: shafts, embers, dust, steam                            */
/* ------------------------------------------------------------------ */
function buildAtmosphere() {
  // Moonbeam quads: flat colour with hard streaks, drawn additively.
  const shaftTex = paint(128, 256, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, 'rgba(255,255,255,.34)'); grd.addColorStop(0.55, 'rgba(255,255,255,.1)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'destination-out';
    for (const [x, ww, a] of [[10, 10, 0.7], [40, 7, 0.5], [68, 14, 0.75], [100, 6, 0.6]]) { g.fillStyle = `rgba(0,0,0,${a})`; g.fillRect(x, 0, ww, h); }
  }, { repeat: false });
  const list = [];
  for (const s of shafts) {
    const dir = s.b.clone().sub(s.a), len = dir.length();
    const up = V(0, 1, 0);
    const side = new THREE.Vector3().crossVectors(dir, up).normalize().multiplyScalar(s.w / 2);
    const a0 = s.a.clone().sub(side), a1 = s.a.clone().add(side), b0 = s.b.clone().sub(side.clone().multiplyScalar(1.5)), b1 = s.b.clone().add(side.clone().multiplyScalar(1.5));
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([...a0, ...a1, ...b1, ...b0].length ? [a0.x, a0.y, a0.z, a1.x, a1.y, a1.z, b1.x, b1.y, b1.z, b0.x, b0.y, b0.z] : [], 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
    g.setIndex([0, 1, 2, 0, 2, 3]);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: shaftTex, color: s.col, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    m.layers.set(1);
    scene.add(m);
    list.push(m);
    void len;
  }

  atmos.shafts = list;

  // Points in three flavours sharing one shader.
  const pointMat = (extra) => new THREE.ShaderMaterial({
    uniforms: { uTime: shared.uTime, uPx: { value: 1 }, ...extra },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `uniform float uTime,uPx,uPower; attribute vec4 aSeed; varying vec3 vC; varying float vA;
      void main(){
        float life=fract(aSeed.w+uTime*aSeed.y*.05);
        float a=aSeed.x+uTime*.13*(aSeed.z-.5);
        float rad=1.5+pow(life,.7)*aSeed.z*17.;
        vec3 p=vec3(cos(a)*rad, 8.6+(aSeed.y-.5)*5.+life*life*8.-(1.-aSeed.z)*2., sin(a)*rad);
        p.xz += vec2(sin(uTime*.6+aSeed.x*9.),cos(uTime*.5+aSeed.y*7.))*.3;
        vec4 mv=modelViewMatrix*vec4(p,1.);
        vA=smoothstep(0.,.08,life)*(1.-smoothstep(.55,1.,life));
        vC=mix(vec3(3.2,1.5,.35),vec3(2.2,.45,.1),life)*uPower;
        gl_PointSize=min((.022+.03*aSeed.y)*uPx*projectionMatrix[1][1]*.5*(projectionMatrix[3][3]>.5?1.:1./-mv.z),uPx/170.); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying vec3 vC; varying float vA; void main(){ vec2 d=gl_PointCoord-.5;
      if(abs(d.x)+abs(d.y)>.5) discard; gl_FragColor=vec4(vC*vA,1.); }`,
  });
  const nEmb = LOW ? 150 : 340;
  const seeds = new Float32Array(nEmb * 4);
  for (let i = 0; i < nEmb * 4; i += 4) { seeds[i] = rnd(TAU); seeds[i + 1] = rnd(0.2, 1); seeds[i + 2] = rnd(); seeds[i + 3] = rnd(); }
  const eg = new THREE.BufferGeometry();
  eg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nEmb * 3), 3));
  eg.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
  const embers = new THREE.Points(eg, pointMat({ uPower: shared.uPower }));
  embers.frustumCulled = false; embers.layers.set(1); scene.add(embers);
  embers.material.uniforms.uPx.value = innerHeight * pixelRatio;
  atmos.embers = embers;

  // Dust: lazy drifting motes, brightened by distance to the sun.
  const nD = LOW ? 300 : 900;
  const dp = new Float32Array(nD * 3), ds = new Float32Array(nD);
  for (let i = 0; i < nD; i++) {
    const a = rnd(TAU), r = Math.sqrt(rnd()) * 21;
    dp[i * 3] = Math.cos(a) * r; dp[i * 3 + 1] = rnd(0.2, 20); dp[i * 3 + 2] = Math.sin(a) * r; ds[i] = rnd(TAU);
  }
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  dg.setAttribute('aS', new THREE.BufferAttribute(ds, 1));
  const dust = new THREE.Points(dg, new THREE.ShaderMaterial({
    uniforms: { uTime: shared.uTime, uPx: { value: innerHeight * pixelRatio } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `uniform float uTime,uPx; attribute float aS; varying float vA;
      void main(){ vec3 p=position; p.y+=sin(uTime*.08+aS)*.7; p.x+=sin(uTime*.05+aS*2.)*.9; p.z+=cos(uTime*.07+aS*3.)*.9;
        float d=length(p-vec3(0.,8.6,0.)); vA=clamp(10./(d+3.),.04,.9)*(.6+.4*sin(uTime*.7+aS*5.));
        vec4 mv=modelViewMatrix*vec4(p,1.); gl_PointSize=clamp((.03+.03*fract(aS))*uPx*projectionMatrix[1][1]*.5*(projectionMatrix[3][3]>.5?1.:1./-mv.z),1.5,uPx/300.); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying float vA; void main(){ vec2 d=gl_PointCoord-.5; if(dot(d,d)>.25) discard; gl_FragColor=vec4(vec3(1.,.72,.42)*vA*.55,1.); }`,
  }));
  dust.frustumCulled = false; dust.layers.set(1); scene.add(dust);
  atmos.dust = dust;

  // Steam: flat stacked puffs.
  for (let i = 0; i < 20; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.puff, color: 0xd8c6c0, transparent: true, opacity: 0, depthWrite: false }));
    s.layers.set(1); scene.add(s);
    atmos.steam.push({ s, vent: i % Math.max(1, vents.length), t: rnd(), rate: rnd(0.12, 0.24), drift: V(rnd(-0.5, 0.5), 0, rnd(-0.5, 0.5)) });
  }
}
const atmos = { steam: [] };

/* ------------------------------------------------------------------ */
/*  Post-processing: bloom, god rays, ink lines, grade                 */
/* ------------------------------------------------------------------ */
const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
const sceneRT = new THREE.WebGLRenderTarget(1, 1, { ...rtOpts, depthBuffer: true });

normalRT.depthTexture = new THREE.DepthTexture(1, 1, THREE.UnsignedIntType);
sceneRT.depthTexture = normalRT.depthTexture;
const raysRT = new THREE.WebGLRenderTarget(1, 1, rtOpts);
const MIPS = 4;
const down = Array.from({ length: MIPS }, () => new THREE.WebGLRenderTarget(1, 1, rtOpts));
const up = Array.from({ length: MIPS - 1 }, () => new THREE.WebGLRenderTarget(1, 1, rtOpts));
const normalOverride = new THREE.MeshNormalMaterial();
const VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;

const brightMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: null }, texel: { value: new THREE.Vector2() } }, vertexShader: VS, depthTest: false, depthWrite: false,
  fragmentShader: `uniform sampler2D t; uniform vec2 texel; varying vec2 vUv;
    void main(){ vec3 c=vec3(0.); for(int i=0;i<4;i++){ vec2 o=vec2(i<2?-1.:1., (i==0||i==2)?-1.:1.)*texel; c+=texture2D(t,vUv+o).rgb; } c*=.25;
      float m=max(c.r,max(c.g,c.b)); c*=smoothstep(1.5,3.2,m); gl_FragColor=vec4(min(c,vec3(30.)),1.); }`,
});
const downMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: null }, texel: { value: new THREE.Vector2() } }, vertexShader: VS, depthTest: false, depthWrite: false,
  fragmentShader: `uniform sampler2D t; uniform vec2 texel; varying vec2 vUv;
    void main(){ vec3 c=texture2D(t,vUv).rgb*.25;
      c+=(texture2D(t,vUv+texel*vec2(-1,-1)).rgb+texture2D(t,vUv+texel*vec2(1,-1)).rgb+texture2D(t,vUv+texel*vec2(-1,1)).rgb+texture2D(t,vUv+texel*vec2(1,1)).rgb)*.1875;
      gl_FragColor=vec4(c,1.); }`,
});
const upMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: null }, b: { value: null }, texel: { value: new THREE.Vector2() } }, vertexShader: VS, depthTest: false, depthWrite: false,
  fragmentShader: `uniform sampler2D t,b; uniform vec2 texel; varying vec2 vUv;
    void main(){ vec3 c=vec3(0.); for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++){ float w=(x==0?2.:1.)*(y==0?2.:1.); c+=w*texture2D(t,vUv+texel*vec2(x,y)).rgb; } c/=16.;
      gl_FragColor=vec4(c+texture2D(b,vUv).rgb,1.); }`,

  frame(az = Math.PI / 4, zoom = 1, target = [0, 5.5, 0], t = 20, sim = 60) {
    window.__freeze = true;
    simT = sim;
    shared.uEnv.value = env.v;
    pw = shared.uPower.value = power.v;
    setPose(t, 0);
    controls.target.set(...target);
    camera.position.copy(controls.target).addScaledVector(isoDir(az), CAM_D);
    camera.zoom = zoom; camera.updateProjectionMatrix();
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    updateClip();
    renderFrame();
    return renderer.info.render;
  },
  planets: PLANETS,
};
</script>
