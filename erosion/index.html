// One fixed macro shot of a patch of forest soil through a storm and the drought after it.
// Scans, model and HDRI: Poly Haven (CC0) — brown_mud_02, mud_cracked_dry_03, leaves_forest_ground (8k/4k crops),
// stone_01, dry_branches_medium_01, autumn_forest_01.
// The ground is real displaced geometry (~0.4 mm grid) from 16-bit scanned heights. A GPU shallow-water model
// (virtual pipes) runs on a 1 mm grid over the patch: rain soaks in until the soil saturates, then runs off into the
// real hollows, carrying and dropping sediment; each drop leaves a crater and spatters mud; puddles ripple from a
// separate wave simulation; as it dries, silt is left behind and the soil shrinks into cracks.
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// ============================================================================ helpers
const Q = new URLSearchParams(location.search);

const L = 0.508, X0 = -0.254, Z0 = -0.274;
const AD = 0.024, AL = 0.022, AC = 0.011, LB = 0.0105;   // height ranges: soil, litter, crack plates; litter base

const DX = L / SIM;
const f6 = (v) => v.toFixed(6);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT || CAPTURE });

renderer.setSize(innerWidth, innerHeight, false);

const ANISO = renderer.capabilities.getMaxAnisotropy();

// ============================================================================ assets
say('loading the soil scans…');
const texLoader = new THREE.TextureLoader();
const tex = (name, srgb) => texLoader.loadAsync(`assets/patch/${name}`).then((t) => {
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;

}
const [T, HDc, HLc, HDR, gStone, gBranch] = await Promise.all([
  Promise.all([['dirt_diff.jpg', 1], ['dirt_nr.jpg', 0], ['dirt_h.png', 0], ['crack_diff.jpg', 1], ['crack_nr.jpg', 0], ['crack_h.png', 0], ['litter_diff.jpg', 1], ['litter_nr.jpg', 0], ['litter_h.png', 0]].map(([n, s]) => tex(n, s))),
  heightCPU('dirt_h.png'), heightCPU('litter_h.png'),
  new RGBELoader().loadAsync('assets/hdri/autumn_forest_01_4k.hdr'),
  new GLTFLoader().loadAsync('assets/models/stone_01/stone_01.gltf'),
  new GLTFLoader().loadAsync('assets/models/dry_branches_medium_01/dry_branches_medium_01.gltf'),
]);
const [tDd, tDn, tDh, tCd, tCn, tCh, tLd, tLn, tLh] = T;
HDR.mapping = THREE.EquirectangularReflectionMapping;
say('building the ground…');

// CPU mirrors of the scanned heights (uv: u = +x, v = +z, image rows run from v = 1 down)
function sampleCPU(M, u, v) {
  const N = M.N, x = clamp(u, 0, 1) * N - 0.5, y = (1 - clamp(v, 0, 1)) * N - 0.5;
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const at = (i, j) => M.a[clamp(j, 0, N - 1) * N + clamp(i, 0, N - 1)];
  return lerp(lerp(at(x0, y0), at(x0 + 1, y0), fx), lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), fx), fy);
}
// value noise shared with GLSL (sin-hash; only used for soft masks so tiny float differences don't matter)
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) {

}
const litMaskCPU = (x, z) => smooth(-0.03, 0.03, (-x - 0.1) * 0.7 + (-z - 0.06) * 0.7 + 0.03 * vnoise(x * 22, z * 22) + 0.012 * vnoise(x * 70, z * 70));
function groundCPU(x, z) {
  const u = (x - X0) / L, v = (z - Z0) / L;
  const hd = sampleCPU(HDc, u, v) * AD, hl = LB + sampleCPU(HLc, u, v) * AL;
  const wL = smooth(-0.003, 0.003, hl - hd - (1 - litMaskCPU(x, z)) * 0.03);
  return lerp(hd, hl, wL);

// ============================================================================ shared GLSL
const NOISE = /* glsl */`
float hash2(vec2 p) { return fract(sin(p.x * 127.1 + p.y * 311.7) * 43758.5453); }
float vnoise(vec2 x) {
  vec2 i = floor(x), f = x - i, u = f * f * (3. - 2. * f);
  return -1. + 2. * mix(mix(hash2(i), hash2(i + vec2(1, 0)), u.x), mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), u.x), u.y);
}
`;
const U = {
  uTime: { value: 0 }, uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uCanopy: { value: 0.2 }, uSunAmt: { value: 0 },
  uCrackMix: { value: 0 }, uCrackThr: { value: 0 }, uSiltCrack: { value: 0 }, uDrought: { value: 0 }, uBake: { value: 1 },
  tS0: { value: null }, tS2: { value: null }, tAOb: { value: null },
  tDd: { value: tDd }, tDn: { value: tDn }, tDh: { value: tDh }, tCd: { value: tCd }, tCn: { value: tCn }, tCh: { value: tCh },
  tLd: { value: tLd }, tLn: { value: tLn }, tLh: { value: tLh },
};
const GROUND = /* glsl */`
uniform sampler2D tDd, tDn, tDh, tCd, tCn, tCh, tLd, tLn, tLh, tS0, tS2, tAOb;
uniform float uTime, uCanopy, uSunAmt, uCrackMix, uCrackThr, uSiltCrack, uDrought;
uniform vec3 uSunDir;
const float L = ${f6(L)}, AD = ${f6(AD)}, AL = ${f6(AL)}, AC = ${f6(AC)}, LB = ${f6(LB)};
const vec2 P0 = vec2(${f6(X0)}, ${f6(Z0)});
const int SIM = ${SIM};
vec2 puv(vec2 p) { return (p - P0) / L; }
float dec(vec4 c) { return (c.r * 65280. + c.g * 255.) / 65535.; }
// sim textures are 32-bit float; filter them by hand so we don't depend on float-linear support
vec4 simTex(sampler2D t, vec2 uv) {
  vec2 x = clamp(uv, 0., 1.) * float(SIM) - 0.5; vec2 i = floor(x), f = x - i; ivec2 a = ivec2(i);
  ivec2 m = ivec2(SIM - 1);
  vec4 s00 = texelFetch(t, clamp(a, ivec2(0), m), 0), s10 = texelFetch(t, clamp(a + ivec2(1, 0), ivec2(0), m), 0);
  vec4 s01 = texelFetch(t, clamp(a + ivec2(0, 1), ivec2(0), m), 0), s11 = texelFetch(t, clamp(a + ivec2(1, 1), ivec2(0), m), 0);
  return mix(mix(s00, s10, f.x), mix(s01, s11, f.x), f.y);
}
float litMask(vec2 p) { return smoothstep(-0.03, 0.03, (-p.x - 0.1) * 0.7 + (-p.y - 0.06) * 0.7 + 0.03 * vnoise(p * 22.) + 0.012 * vnoise(p * 70.)); }

// crack opening field: plates lift at their rims, cracks open from their deepest centre lines outward
float crackMod(vec2 uv, float lod, float cm, float sc, out float open) {
  float dc = dec(textureLod(tCh, uv * CRS + CRO, lod));
  open = (1. - smoothstep(uCrackThr - 0.045, uCrackThr + 0.015, dc)) * cm;
  float hc = mix(max(dc, 0.64), dc * 0.9 - 0.12, open);
  float rim = smoothstep(0.66, 0.52, dc) * (1. - open) * cm;
  float flakeOpen; float dc2 = dec(textureLod(tCh, uv * 2.7 + 0.53, lod));
  flakeOpen = (1. - smoothstep(0.36 * uSiltCrack - 0.05, 0.36 * uSiltCrack + 0.02, dc2)) * sc;
  float flakeRim = smoothstep(0.66, 0.45, dc2) * (1. - flakeOpen) * sc;
  open = max(open, flakeOpen * 0.8);
  return (hc - 0.64) * AC * cm + rim * 0.0011 * cm + flakeRim * 0.00045 - flakeOpen * 0.0007;
}
float crackAmt(vec4 s2) { return uCrackMix * (0.45 + 0.55 * smoothstep(0.15, 0.7, s2.a)); }
float siltAmt(vec4 s2) { return smoothstep(0.00004, 0.0003, s2.b) * uSiltCrack; }
// full surface height (world y) at p; lod picks the texture mip
float groundH(vec2 p, float lod, out float wL, out float open, out vec4 s0, out vec4 s2) {
  vec2 uv = puv(p);
  float hd = dec(textureLod(tDh, uv, lod)) * AD;
  float hl = LB + dec(textureLod(tLh, uv, lod)) * AL;
  wL = smoothstep(-0.003, 0.003, hl - hd - (1. - litMask(p)) * 0.03);
  s0 = simTex(tS0, uv); s2 = simTex(tS2, uv);
  float cm = crackAmt(s2) * (1. - wL);
  float h = hd + crackMod(uv, lod, cm, siltAmt(s2) * (1. - wL), open);
  return mix(h, hl, wL) + s0.r;
}
`;
const DAPPLE = /* glsl */`
float gSunVis = 1.0;
float dappleW(vec3 wp) {
  vec3 Ls = normalize(uSunDir);
  vec2 q = wp.xz + Ls.xz * (12.0 - wp.y) / max(Ls.y, 0.15);
  q += 0.05 * vec2(sin(uTime * 0.9 + q.y * 0.4), cos(uTime * 0.7 + q.x * 0.4));
  float n = 0.5 * vnoise(q * 0.5) + 0.3 * vnoise(q * 1.3 + 5.) + 0.2 * vnoise(q * 3.6 + 9.);
  return mix(0.06, 1.0, smoothstep(uCanopy - 0.05, uCanopy + 0.05, n)) * gSunVis;
}
`;
const LFB = THREE.ShaderChunk.lights_fragment_begin.replace('getDirectionalLightInfo( directionalLight, directLight );',
  'getDirectionalLightInfo( directionalLight, directLight );\n\t\tdirectLight.color *= ( UNROLLED_LOOP_INDEX == 0 ) ? dappleW( vWorldP ) : 1.0;');
function rep(s, a, b) { if (!s.includes(a)) console.warn('patch miss:', a.slice(0, 60)); return s.replace(a, b); }
function patch(mat, key, opt) {

    Object.assign(sh.uniforms, U, opt.uniforms || {});
    let v = 'varying vec3 vWorldP;\n' + NOISE + (opt.vHead || '') + '\n' + sh.vertexShader;
    for (const [a, b] of opt.v || []) v = rep(v, a, b);
    v = rep(v, '#include <project_vertex>', `#include <project_vertex>
      { vec4 w = vec4(transformed, 1.0);

        #endif

    let f = 'varying vec3 vWorldP;\n' + NOISE + (opt.fHead || '') + '\n' + DAPPLE + sh.fragmentShader;
    if (opt.lit !== false) f = rep(f, '#include <lights_fragment_begin>', LFB);
    for (const [a, b] of opt.f || []) f = rep(f, a, b);

// ============================================================================ scene, camera
const scene = new THREE.Scene();
const SKY_ROT = +(Q.get('rot') || 4.0);

scene.backgroundRotation.set(0, SKY_ROT, 0);

const camera = new THREE.PerspectiveCamera(+(Q.get('fov') || 33), innerWidth / innerHeight, 0.02, 20);
const CAM_POS = new THREE.Vector3(0.0, 0.285, 0.2), CAM_TGT = new THREE.Vector3(0.0, 0.012, -0.02);

// ============================================================================ simulation targets

const ripRT = [0, 1].map(() => new THREE.WebGLRenderTarget(RIP, RIP, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false }));
const aoRT = new THREE.WebGLRenderTarget(512, 512, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });
const objRT = new THREE.WebGLRenderTarget(1024, 1024, { type: THREE.FloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });

}

// ============================================================================ ground
function makeGrid(N, x0, x1, z0, z1, cx, cz, kx, kz) {

  sun.color.copy(SUN_COL).lerp(SUN_HOT, S.drought * 0.7); tSun.color.copy(sun.color);
  flash.intensity = S.flash * 4;
  const env = lerp(0.95, 0.55, S.storm) * (1 + S.flash * 2.5) * lerp(1, 0.72, S.sunAmt) * lerp(1, 0.85, S.drought);
  scene.environmentIntensity = transScene.environmentIntensity = env;
  OBJ_U.uObjWet.value = smooth(5, 12, simT) * (1 - smooth(38, 46, simT));
  PU.uLight.value.setRGB(1, 1, 1).multiplyScalar(env * 0.9);
  PU.uSun.value.copy(sun.color).multiplyScalar(sun.intensity);
  renderer.toneMappingExposure = (0.95 + S.storm * 0.55 - S.sunAmt * 0.05) / (1 + S.flash * 0.25);
  const fu = finalPass.u;
  fu.uSat.value = lerp(lerp(0.96, 0.75, S.storm), 0.9, S.drought);
  fu.uContrast.value = lerp(1.03, 1.1, S.drought) - S.storm * 0.03;
  fu.uGain.value.set(1, 1, 1).lerp(new THREE.Vector3(0.93, 0.98, 1.06), S.storm).lerp(new THREE.Vector3(1.07, 1.0, 0.88), S.drought);
  fu.uFlash.value = S.flash * 0.3;
  if (++aoAge > 24) { aoAge = 0; aoPass.render(aoRT); }
}

function renderFrame() {
  renderer.shadowMap.needsUpdate = state.sunAmt > 0.01;
  renderer.setClearColor(0x000000, 1);
  renderer.setRenderTarget(rtOpq); renderer.render(scene, camera);
  copyPass.u.tC.value = rtOpq.texture; copyPass.u.tD.value = rtOpq.depthTexture; copyPass.render(rtCopy);
  renderer.setClearColor(0x000000, 0);
  pGeo.attributes.aP.needsUpdate = pGeo.attributes.aV.needsUpdate = pGeo.attributes.aS.needsUpdate = true;
  renderer.setRenderTarget(rtTrans); renderer.render(transScene, camera);
  renderer.setClearColor(0x000000, 1);
  const focus = camera.position.distanceTo(CAM_TGT);
  Object.assign(cocPass.u.tO, { value: rtCopy.texture }); cocPass.u.tT.value = rtTrans.texture;
  cocPass.u.uFocus.value = focus; cocPass.u.uH.value = buf.y; cocPass.u.uAp.value = +(Q.get('ap') || 0.03) * (33 / camera.fov); cocPass.u.uMax.value = buf.y * 0.014;
  cocPass.render(rtCoc);
  gatherPass.u.tC.value = rtCoc.texture; gatherPass.u.uTexel.value.set(1 / buf.x, 1 / buf.y); gatherPass.u.uMax.value = buf.y * 0.014;
  gatherPass.render(rtBlur);
  const fu = finalPass.u; fu.tC.value = rtCoc.texture; fu.tB.value = rtBlur.texture; fu.uTime.value = simT; fu.uAspect.value = buf.x / buf.y; fu.uRes.value.copy(buf);
  finalPass.render(null);
}

// water mesh needs the opaque copy; it must not be in the opaque scene
// ============================================================================ HUD + loop
const playBtn = document.getElementById('play'), dayEl = document.getElementById('day'), capEl = document.getElementById('caption');
const fillEl = document.getElementById('fill'), knobEl = document.getElementById('knob'), fadeEl = document.getElementById('fade');
let playing = !SHOT && !Q.has('p'), target = Q.has('p') ? +Q.get('p') * DUR : 0, seeking = Q.has('p'), lastCap = '', hold = 0, looping = false;
function setPlaying(v) { playing = v; playBtn.textContent = v ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); }
setPlaying(playing);
playBtn.addEventListener('click', () => { if (simT >= DUR) { resetSim(); } setPlaying(!playing); });
function seekTo(t) { target = clamp(t, 0, DUR); if (target < simT) resetSim(); seeking = true; }
{
  const bar = document.getElementById('bar'); let drag = false;
  const seek = (e) => { const r = bar.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width * DUR); };
  bar.addEventListener('pointerdown', (e) => { drag = true; bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove', (e) => drag && seek(e));
  bar.addEventListener('pointerup', () => { drag = false; });
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (simT >= DUR) resetSim(); setPlaying(!playing); }
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
  else if (e.key === 'ArrowRight') seekTo(simT + 4);
  else if (e.key === 'ArrowLeft') seekTo(simT - 4);
});
function onResize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); makeRTs(); }
addEventListener('resize', onResize);
function hud() {
  const P = simT / DUR;
  dayEl.textContent = 'Day ' + dayOf(simT);
  fillEl.style.width = (P * 100) + '%'; knobEl.style.left = (P * 100) + '%';
  let cap = CAPTIONS[0][1]; for (const [t, c] of CAPTIONS) if (simT >= t) cap = c;
  if (seeking) cap = 'time passing…';
  if (cap !== lastCap) { lastCap = cap; capEl.style.opacity = 0; setTimeout(() => { capEl.textContent = cap; capEl.style.opacity = 1; }, 300); }
}

// ============================================================================ boot
say('settling the water…');
bakeObjects();
basePass.render(baseRT);
resetSim();
Object.assign(state, stateAt(0));
applyLook();
aoPass.render(aoRT);
const clock = new THREE.Clock();
let acc = 0, frameAvg = 16, dprT = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (seeking) {
    const t0 = performance.now();
    while (simT < target - 1e-6 && performance.now() - t0 < 45) stepSim();
    if (simT >= target - 1e-6) { seeking = false; acc = 0; }
  } else if (playing && !looping) {
    acc += dt;
    let n = 0; while (acc >= 1 / FPS && n < 2) { acc -= 1 / FPS; if (simT < DUR) stepSim(); n++; }
    if (n === 2) acc = 0;
    if (simT >= DUR && (hold += dt) > 4) {
      looping = true; fadeEl.style.opacity = 1;
      setTimeout(() => { resetSim(); hold = 0; fadeEl.style.opacity = 0; looping = false; }, 1300);
    }
  }
  applyLook();
  hud();
  renderFrame();
  frameAvg = frameAvg * 0.95 + dt * 1000 * 0.05; dprT += dt;
  if (!SHOT && dprT > 2.5) {
    dprT = 0;
    const nd = frameAvg > 34 ? Math.max(0.6, dpr - 0.15) : frameAvg < 18 ? Math.min(MAX_DPR, dpr + 0.1) : dpr;
    if (Math.abs(nd - dpr) > 0.01) { dpr = nd; renderer.setPixelRatio(dpr); onResize(); }
  }
  window.__simT = simT; window.__seeking = seeking;
}
if (!CAPTURE) renderer.setAnimationLoop(frame);
else {
  // ?capture: deterministic film, window.__frame(i) renders frame i at 30 fps (two sim frames each)
  const capDay = document.getElementById('capDay'), capStage = document.getElementById('capStage');
  window.__frame = (i) => {
    const t = i / 30;
    while (simT < t - 1e-6) stepSim();

    applyLook(); renderFrame();
    capDay.textContent = 'Day ' + dayOf(simT);
    let cap = CAPTIONS[0][1]; for (const [tt, c] of CAPTIONS) if (simT >= tt) cap = c; capStage.textContent = cap;
    return t;
  };
}
requestAnimationFrame(() => requestAnimationFrame(() => loadingEl.classList.add('done')));
window.__ready = true;
window.__dbg = { U, state, S0: [M[0]], M, renderer, scene, camera, stepSim, get simT() { return simT; } };
</script>
