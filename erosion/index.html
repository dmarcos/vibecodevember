<script type="module">

// One fixed macro shot of a patch of forest soil through a storm and the drought after it.
// Scans, model and HDRI: Poly Haven (CC0) — brown_mud_02, mud_cracked_dry_03, leaves_forest_ground (8k/4k crops),
// namaqualand_stones_01, dry_branches_medium_01, autumn_forest_01.
// The ground is real displaced geometry (~0.4 mm grid) from 16-bit scanned heights. A GPU shallow-water model
// (virtual pipes) runs on a 1 mm grid over the patch: rain soaks in until the soil saturates, then runs off into the
// real hollows, carrying and dropping sediment; each drop leaves a crater and spatters mud; puddles ripple from a
// separate wave simulation; as it dries, silt is left behind and the soil shrinks into cracks.
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================================ helpers
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot'), CAPTURE = Q.has('capture');
if (SHOT) document.body.classList.add('shot');
if (CAPTURE) document.body.classList.add('capture');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const loadingEl = document.getElementById('loading');
const say = (s) => { loadingEl.textContent = s; };
const trace = (m) => { if (Q.has('trace')) fetch('/__log?' + encodeURIComponent(m)).catch(() => {}); };

// patch geometry (metres). Everything the camera sees lies inside this square.
const L = 0.508, X0 = -0.254, Z0 = -0.274;
const AD = 0.024, AL = 0.011, AC = 0.011, LB = 0.0135;   // height ranges: soil, litter, crack plates; litter base
const SIM = 384, HBN = 1024;
const DX = L / SIM;
const f6 = (v) => v.toFixed(6);

// ============================================================================ renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT || CAPTURE });
// phones and tablets get half-resolution scans and a lighter pipeline: the full set needs over a gigabyte of GPU memory
const MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const LITE = Q.has('lite') || (MOBILE && !Q.has('full'));
const AS = LITE ? 'assets/mobile/' : 'assets/';
const MAX_DPR = CAPTURE ? +(Q.get('ss') || 1.5) : Math.min(window.devicePixelRatio || 1, SHOT ? 1 : LITE ? 1.5 : 2);
const MIN_DPR = Math.min(1, MAX_DPR);
let dpr = MAX_DPR;
renderer.setPixelRatio(dpr);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
const ANISO = renderer.capabilities.getMaxAnisotropy();
if (Q.has('trace')) {
  const gl = renderer.getContext();
  trace('exts ' + ['EXT_color_buffer_float', 'EXT_color_buffer_half_float', 'OES_texture_float_linear', 'EXT_float_blend', 'OES_texture_half_float_linear'].map((e) => e + '=' + !!gl.getExtension(e)).join(' ') + ' maxTex=' + gl.getParameter(gl.MAX_TEXTURE_SIZE) + ' maxDraw=' + gl.getParameter(gl.MAX_DRAW_BUFFERS) + ' units=' + gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS) + ' vunits=' + gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS) + ' frag=' + gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision);
  for (const k of ['error', 'warn']) { const o = console[k]; console[k] = (...a) => { trace(k + ' ' + a.map(String).join(' ').slice(0, 1500)); o.apply(console, a); }; }
}

// ============================================================================ assets
say('loading the soil scans…');
const texLoader = new THREE.TextureLoader();
const tex = (name, srgb) => texLoader.loadAsync(`${AS}patch/${name}`).then((t) => {
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.anisotropy = Math.min(4, ANISO); trace('tex ' + name); return t;
});
async function heightCPU(name) {
  const img = new Image(); img.src = `${AS}patch/${name}`; await img.decode();
  const N = img.width, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const ctx = cv.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' }); ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, N, N).data, a = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) a[i] = (d[i * 4] * 256 + d[i * 4 + 1]) / 65535;
  trace('heights ' + name); return { a, N };
}
const [T, HDc, HLc, HDR, gPebbles, gBranch] = await Promise.all([
  Promise.all([['dirt_diff.jpg', 1], ['dirt_nr.jpg', 0], ['dirt_h.png', 0], ['crack_diff.jpg', 1], ['crack_nr.jpg', 0], ['crack_h.png', 0], ['litter_diff.jpg', 1], ['litter_nr.jpg', 0], ['litter_h.png', 0]].map(([n, s]) => tex(n, s))),
  heightCPU('dirt_h.png'), heightCPU('litter_h.png'),
  new RGBELoader().loadAsync(AS + 'hdri/autumn_forest_01_4k.hdr').then((h) => { trace('hdr'); return h; }),
  new GLTFLoader().loadAsync(AS + 'models/namaqualand_stones_01/namaqualand_stones_01.gltf').then((g) => { trace('stones'); return g; }),
  new GLTFLoader().loadAsync(AS + 'models/dry_branches_medium_01/dry_branches_medium_01.gltf').then((g) => { trace('branch'); return g; }),
]);
const [tDd, tDn, tDh, tCd, tCn, tCh, tLd, tLn, tLh] = T;
trace('all assets'); HDR.mapping = THREE.EquirectangularReflectionMapping;
say('building the ground…'); trace('building');

// CPU mirrors of the scanned heights (uv: u = +x, v = +z, image rows run from v = 1 down)
function sampleCPU(M, u, v) {
  const N = M.N, x = clamp(u, 0, 1) * N - 0.5, y = (1 - clamp(v, 0, 1)) * N - 0.5;
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const at = (i, j) => M.a[clamp(j, 0, N - 1) * N + clamp(i, 0, N - 1)];
  return lerp(lerp(at(x0, y0), at(x0 + 1, y0), fx), lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), fx), fy);
}
// value noise shared with GLSL (sin-hash; only used for soft masks so tiny float differences don't matter)
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return -1 + 2 * lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), ux), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), ux), uy);
}
const litMaskCPU = (x, z) => smooth(-0.03, 0.03, (-x - 0.1) * 0.7 + (-z - 0.06) * 0.7 + 0.03 * vnoise(x * 22, z * 22) + 0.012 * vnoise(x * 70, z * 70));
function groundCPU(x, z) {
  const u = (x - X0) / L, v = (z - Z0) / L;
  const hd = sampleCPU(HDc, u, v) * AD, hl = LB + sampleCPU(HLc, u, v) * AL;
  const wL = 0;
  return lerp(hd, hl, wL);
}

// ============================================================================ shared GLSL
const FLOAT_LINEAR = renderer.extensions.has('OES_texture_float_linear');
const NOISE = (FLOAT_LINEAR ? '#define FLOAT_LINEAR\n' : '') + /* glsl */`
float hash2(vec2 p) { return fract(sin(p.x * 127.1 + p.y * 311.7) * 43758.5453); }
float vnoise(vec2 x) {
  vec2 i = floor(x), f = x - i, u = f * f * (3. - 2. * f);
  return -1. + 2. * mix(mix(hash2(i), hash2(i + vec2(1, 0)), u.x), mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), u.x), u.y);
}
`;
const U = {
  tDap: { value: null }, uDapO: { value: new THREE.Vector2(13, 4) }, uTime: { value: 0 }, uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uCanopy: { value: 0.2 }, uSunAmt: { value: 0 },
  uCrackMix: { value: 0 }, uCrackThr: { value: 0 }, uSiltCrack: { value: 0 }, uDrought: { value: 0 }, uBake: { value: 1 },
  tS0: { value: null }, tS2: { value: null }, tAOb: { value: null }, tHB: { value: null }, tBase: { value: null },
  tDd: { value: tDd }, tDn: { value: tDn }, tDh: { value: tDh }, tCd: { value: tCd }, tCn: { value: tCn }, tCh: { value: tCh },
  tLd: { value: tLd }, tLn: { value: tLn }, tLh: { value: tLh },
};
const GROUND = /* glsl */`
uniform sampler2D tDd, tDn, tDh, tCd, tCn, tCh, tLd, tLn, tLh, tS0, tS2, tAOb, tHB, tBase;
uniform sampler2D tDap;
uniform vec2 uDapO;
uniform float uTime, uCanopy, uSunAmt, uCrackMix, uCrackThr, uSiltCrack, uDrought;
uniform vec3 uSunDir;
const float L = ${f6(L)}, AD = ${f6(AD)}, AL = ${f6(AL)}, AC = ${f6(AC)}, LB = ${f6(LB)};
const vec2 P0 = vec2(${f6(X0)}, ${f6(Z0)});
const int SIM = ${SIM}, HBN = ${HBN};
vec2 puv(vec2 p) { return (p - P0) / L; }
float dec(vec4 c) { return (c.r * 65280. + c.g * 255.) / 65535.; }
// sim textures are 32-bit float; filter them by hand so we don't depend on float-linear support
vec4 simTex(sampler2D t, vec2 uv) {
#ifdef FLOAT_LINEAR
  return textureLod(t, clamp(uv, 0.5 / float(SIM), 1. - 0.5 / float(SIM)), 0.);
#endif
  vec2 x = clamp(uv, 0., 1.) * float(SIM) - 0.5; vec2 i = floor(x), f = x - i; ivec2 a = ivec2(i);
  ivec2 m = ivec2(SIM - 1);
  vec4 s00 = texelFetch(t, clamp(a, ivec2(0), m), 0), s10 = texelFetch(t, clamp(a + ivec2(1, 0), ivec2(0), m), 0);
  vec4 s01 = texelFetch(t, clamp(a + ivec2(0, 1), ivec2(0), m), 0), s11 = texelFetch(t, clamp(a + ivec2(1, 1), ivec2(0), m), 0);
  return mix(mix(s00, s10, f.x), mix(s01, s11, f.x), f.y);
}
// ---- the leaf layer: real leaves cut out of the litter scan by their height plateaus, thinning out toward the soil
float leafLM(vec2 p) { return (-p.x - 0.1) * 0.7 + (-p.y - 0.06) * 0.7 + 0.03 * vnoise(p * 22.) + 0.012 * vnoise(p * 70.); }
float leafThr(vec2 p) { return clamp(0.36 - leafLM(p) * 6.5, 0., 1.2); }
float leafDl(vec2 uv, float lod) { return dec(textureLod(tLh, uv, lod)); }
// the leaf's own smooth shape: it bridges small lumps, stacks by layer and curls at its rim (this alone drives shading)
float leafY(vec2 p, float dl) {
  float under = dec(textureLod(tDh, puv(p), 4.5)) * AD;
  // dry leaves curl up at their edges, more so as the drought sets in
  // (only along the litter's outer edge, judged from blurred heights, so no leaf's rim ever pokes through the one above it)
  float rim = 1. - smoothstep(0., 0.12, dec(textureLod(tLh, puv(p), 4.)) - leafThr(p));
  // layers sit about half a millimetre apart, like real stacked leaves
  return under + 0.0012 + max(dl - leafThr(p), 0.) * 0.0016 + rim * (0.0006 + 0.0012 * uDrought);
}
// where it actually lies (position only): carried by the storm's broad scour and deposit, never below the soil
float leafRest(vec2 p, float dl) {
  vec2 uv = puv(p); const float o = 3. / float(SIM);
  float sim = 0., soil = 0.;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) { vec2 q = uv + vec2(i, j) * o; sim += simTex(tS0, q).r; soil = max(soil, textureLod(tHB, q, 0.).r); }
  // a stiff leaf spans the crumbs: it rests on the highest soil nearby, not on every crater
  return max(leafY(p, dl) + sim / 9., soil + 0.0008);
}
float litMask(vec2 p) { return smoothstep(-0.03, 0.03, (-p.x - 0.1) * 0.7 + (-p.y - 0.06) * 0.7 + 0.03 * vnoise(p * 22.) + 0.012 * vnoise(p * 70.)); }
const vec2 CRS = vec2(1.0), CRO = vec2(0.0);
// crack opening field: plates lift at their rims, cracks open from their deepest centre lines outward
float crackMod(vec2 uv, float lod, float cm, float sc, out float open) {
  float dc = dec(textureLod(tCh, uv * CRS + CRO, lod));
  open = (1. - smoothstep(uCrackThr - 0.045, uCrackThr + 0.015, dc)) * cm;
  float hc = mix(max(dc, 0.64), dc * 0.9 - 0.12, open);
  float rim = smoothstep(0.66, 0.52, dc) * (1. - open) * cm;
  float flakeOpen; float dc2 = dec(textureLod(tCh, uv * 2.7 + 0.53, lod));
  flakeOpen = (1. - smoothstep(0.36 * uSiltCrack - 0.05, 0.36 * uSiltCrack + 0.02, dc2)) * sc;
  float flakeRim = smoothstep(0.66, 0.45, dc2) * (1. - flakeOpen) * sc;
  open = max(open, flakeOpen * 0.8);
  return (hc - 0.64) * AC * cm + rim * 0.0011 * cm + flakeRim * 0.00045 - flakeOpen * 0.0007;
}
// cubic B-spline sampling of a sim field (four filtered taps): contours stay round instead of zig-zagging along the grid
vec4 simTexB(sampler2D t, vec2 uv) {
#ifdef FLOAT_LINEAR
  float n = float(SIM);
  vec2 x = uv * n - 0.5, i = floor(x), f = x - i;
  vec2 w0 = (1. - f) * (1. - f) * (1. - f) / 6., w1 = (4. - 6. * f * f + 3. * f * f * f) / 6., w2 = (1. + 3. * f + 3. * f * f - 3. * f * f * f) / 6., w3 = f * f * f / 6.;
  vec2 g0 = w0 + w1, g1 = w2 + w3, h0 = (i - 0.5 + w1 / g0) / n, h1 = (i + 1.5 + w3 / g1) / n;
  return g0.y * (g0.x * textureLod(t, h0, 0.) + g1.x * textureLod(t, vec2(h1.x, h0.y), 0.)) + g1.y * (g0.x * textureLod(t, vec2(h0.x, h1.y), 0.) + g1.x * textureLod(t, h1, 0.));
#else
  return simTex(t, uv);
#endif
}
// four B-spline taps half a cell apart: cancels the solver's cell-to-cell checkerboard in thin water exactly
vec4 simTexS(sampler2D t, vec2 uv) {
  float o = 0.5 / float(SIM);
  return 0.25 * (simTexB(t, uv + vec2(o, o)) + simTexB(t, uv + vec2(-o, o)) + simTexB(t, uv + vec2(o, -o)) + simTexB(t, uv + vec2(-o, -o)));
}
float crackAmt(vec4 s2) { return uCrackMix * (0.45 + 0.55 * smoothstep(0.15, 0.7, s2.a)); }

    probeAge = 0; probePass.u.tS0.value = M[0].textures[0]; probePass.render(probeRT);
    renderer.readRenderTargetPixels(probeRT, 0, 0, 128, 128, probe);
  }
  simT += 1 / FPS; simFrame++;
}
function resetSim() {
  for (const r of S1) clearPass.render(r);
  RING.forEach((v) => v.set(0, 0, -99, 0));
  for (const r of M) clearMRT.render(r);
  // the soil starts damp underneath but dry at the surface
  simT = 0; simFrame = 0; pending.length = 0; probe.fill(0); probeAge = 1e9;
  aP.fill(0); for (let i = 0; i < PN; i++) aP[i * 4 + 3] = -1e3; pHead = 0;
  renderer.setRenderTarget(null);
}

let aoAge = 1e9;
function applyLook() {
  const S = state;
  WU.uRing.value = RING; WU.uNow.value = simT;
  U.uTime.value = simT; U.uCanopy.value = S.canopy; U.uSunAmt.value = S.sunAmt;
  U.uCrackMix.value = S.crackMix; U.uCrackThr.value = S.crackThr; U.uSiltCrack.value = S.siltCrack; U.uDrought.value = S.drought;
  U.uSunDir.value.set(Math.cos(S.az) * Math.cos(S.el), Math.sin(S.el), Math.sin(S.az) * Math.cos(S.el));
  sun.position.copy(sun.target.position).addScaledVector(U.uSunDir.value, 1.5);
  sun.intensity = S.sunAmt * lerp(4.5, 8, S.drought);
  sun.color.copy(SUN_COL).lerp(SUN_HOT, S.drought * 0.7);
  if (S.flash > 0.01) {   // lightning takes over the shadow-casting light: cold, hard, from high above
    sun.position.copy(sun.target.position).add(LIGHTNING_DIR);
    sun.intensity = Math.min(S.flash, 1.6) * 15; sun.color.setRGB(0.82, 0.88, 1);
  }
  tSun.position.copy(sun.position); tSun.intensity = sun.intensity; tSun.color.copy(sun.color);
  flash.intensity = S.flash * 2;
  const env = lerp(0.95, 0.55, S.storm) * (1 + S.flash * 2.5) * lerp(1, 0.72, S.sunAmt) * lerp(1, 0.85, S.drought);
  scene.environmentIntensity = transScene.environmentIntensity = env;
  fly.update(simT);
  OBJ_U.uObjWet.value = smooth(5, 12, simT) * (1 - smooth(38, 46, simT));
  LEAF_U.uLeafWet.value = smooth(6, 13, simT) * (1 - smooth(36, 44, simT));
  PU.uLight.value.setRGB(1, 1, 1).multiplyScalar(env * 0.9);
  PU.uSun.value.copy(sun.color).multiplyScalar(sun.intensity);
  renderer.toneMappingExposure = (0.95 + S.storm * 0.55 - S.sunAmt * 0.05) / (1 + S.flash * 0.25);
  const fu = finalPass.u;
  fu.uSat.value = lerp(lerp(0.96, 0.75, S.storm), 0.9, S.drought);
  fu.uContrast.value = lerp(1.03, 1.1, S.drought) - S.storm * 0.03;
  fu.uGain.value.set(1, 1, 1).lerp(new THREE.Vector3(0.93, 0.98, 1.06), S.storm).lerp(new THREE.Vector3(1.07, 1.0, 0.88), S.drought);
  fu.uFlash.value = Math.min(S.flash, 1.6) * 0.15;
  if (++aoAge > 24) { aoAge = 0; aoPass.render(aoRT); }
}

let hbAge = 99, hbAt = -1;
function renderFrame() {
  // the composite height only changes when the world steps; refresh it every other step
  if (simFrame !== hbAt && (++hbAge >= 2 || simFrame < hbAt)) { hbPass.render(hbRT); hbAge = 0; hbAt = simFrame; }
  renderer.shadowMap.needsUpdate = state.sunAmt > 0.01 || state.flash > 0.01;
  renderer.setClearColor(0x000000, 1);
  renderer.setRenderTarget(rtOpq); renderer.render(scene, camera);
  copyPass.u.tC.value = rtOpq.texture; copyPass.u.tD.value = rtOpq.depthTexture; copyPass.render(rtCopy);
  renderer.setClearColor(0x000000, 0);
  pGeo.attributes.aP.needsUpdate = pGeo.attributes.aV.needsUpdate = pGeo.attributes.aS.needsUpdate = true;
  renderer.setRenderTarget(rtTrans); renderer.render(transScene, camera);
  renderer.setClearColor(0x000000, 1);
  const focus = camera.position.distanceTo(CAM_TGT);
  Object.assign(cocPass.u.tO, { value: rtCopy.texture }); cocPass.u.tT.value = rtTrans.texture;
  cocPass.u.uFocus.value = focus; cocPass.u.uH.value = buf.y; cocPass.u.uAp.value = +(Q.get('ap') || 0.014) * (33 / camera.fov); cocPass.u.uMax.value = buf.y * 0.014;
  cocPass.render(rtCoc);
  gatherPass.u.tC.value = rtCoc.texture; gatherPass.u.uTexel.value.set(1 / buf.x, 1 / buf.y); gatherPass.u.uMax.value = buf.y * 0.014;
  gatherPass.render(rtBlur);
  const fu = finalPass.u; fu.tC.value = rtCoc.texture; fu.tB.value = rtBlur.texture; fu.uTime.value = simT; fu.uAspect.value = buf.x / buf.y; fu.uRes.value.copy(buf);
  finalPass.render(null);
}

// water mesh needs the opaque copy; it must not be in the opaque scene
// ============================================================================ HUD + loop
const playBtn = document.getElementById('play'), dayEl = document.getElementById('day'), capEl = document.getElementById('caption');
const fillEl = document.getElementById('fill'), knobEl = document.getElementById('knob'), fadeEl = document.getElementById('fade');
let playing = !SHOT && !Q.has('p'), target = Q.has('p') ? +Q.get('p') * DUR : 0, seeking = Q.has('p'), lastCap = '', hold = 0, looping = false;
function setPlaying(v) { playing = v; playBtn.textContent = v ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); }
setPlaying(playing);
playBtn.addEventListener('click', () => { if (simT >= DUR) { resetSim(); } setPlaying(!playing); });
function seekTo(t) { target = clamp(t, 0, DUR); if (target < simT) resetSim(); seeking = true; }
{
  const bar = document.getElementById('bar'); let drag = false;
  const seek = (e) => { const r = bar.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width * DUR); };
  bar.addEventListener('pointerdown', (e) => { drag = true; bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove', (e) => drag && seek(e));
  bar.addEventListener('pointerup', () => { drag = false; });
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (simT >= DUR) resetSim(); setPlaying(!playing); }
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
  else if (e.key === 'ArrowRight') seekTo(simT + 4);
  else if (e.key === 'ArrowLeft') seekTo(simT - 4);
});
function onResize() { frameCam(); renderer.setSize(innerWidth, innerHeight, false); makeRTs(); }
addEventListener('resize', onResize);
function hud() {
  const P = simT / DUR;
  dayEl.textContent = 'Day ' + dayOf(simT);
  // while fast-forwarding, the knob waits where you put it and the bar fills up to it
  const K = seeking ? target / DUR : P;
  fillEl.style.width = (P * 100) + '%'; knobEl.style.left = (K * 100) + '%';
  let cap = CAPTIONS[0][1]; for (const [t, c] of CAPTIONS) if (simT >= t) cap = c;
  if (seeking) cap = 'time passing…';
  if (cap !== lastCap) { lastCap = cap; capEl.style.opacity = 0; setTimeout(() => { capEl.textContent = cap; capEl.style.opacity = 1; }, 300); }
}

// ============================================================================ boot
say('settling the water…'); trace('settling');
bakeObjects();
basePass.render(baseRT);
resetSim();
Object.assign(state, stateAt(0));
applyLook();
aoPass.render(aoRT);
const clock = new THREE.Clock();
let acc = 0, frameAvg = 16, dprT = 0, lastPreview = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (seeking) {
    // fast-forward: up to ten steps per displayed frame (capped so the GPU never falls behind and the page stays responsive)
    const t0 = performance.now();
    let n = 0;
    while (simT < target - 1e-6 && performance.now() - t0 < 40 && n < 8) { stepSim(); n++; }
    if (simT >= target - 1e-6) { seeking = false; acc = 0; probeAge = 1e9; }
  } else if (playing && !looping) {
    acc += dt;
    // one step per rendered frame at most: on a slow machine the story slows down instead of stuttering
    if (acc >= 1 / FPS) { acc = Math.min(acc - 1 / FPS, 1 / FPS); if (simT < DUR) stepSim(); }
    if (simT >= DUR && (hold += dt) > 4) {
      looping = true; fadeEl.style.opacity = 1;
      setTimeout(() => { resetSim(); hold = 0; fadeEl.style.opacity = 0; looping = false; }, 1300);
    }
  }
  applyLook();
  audio.update(state, simT, !seeking && playing && !looping);
  hud();
  // while fast-forwarding, a preview frame four times a second is plenty; the rest of the time goes to the simulation
  const nowMs = performance.now();
  if (!seeking || nowMs - lastPreview > 250) { renderFrame(); lastPreview = nowMs; }
  if (!seeking) { frameAvg = frameAvg * 0.95 + dt * 1000 * 0.05; dprT += dt; }   // fast-forward frames are slow on purpose
  if (!SHOT && dprT > 2.5) {
    dprT = 0;
    const nd = frameAvg > 38 ? Math.max(MIN_DPR, dpr - 0.15) : frameAvg < 18 ? Math.min(MAX_DPR, dpr + 0.1) : dpr;
    if (Math.abs(nd - dpr) > 0.01) { dpr = nd; renderer.setPixelRatio(dpr); onResize(); }
  }
  window.__simT = simT; window.__seeking = seeking;
}
if (!CAPTURE) renderer.setAnimationLoop(frame);
else {
  // ?capture: deterministic film, window.__frame(i) renders frame i at 30 fps (two sim frames each)
  const capDay = document.getElementById('capDay'), capStage = document.getElementById('capStage');
  window.__frame = (i) => {
    const t = i / 30;
    while (simT < t - 1e-6) stepSim();

    applyLook(); renderFrame();
    capDay.textContent = 'Day ' + dayOf(simT);
    let cap = CAPTIONS[0][1]; for (const [tt, c] of CAPTIONS) if (simT >= tt) cap = c; capStage.textContent = cap;
    return t;
  };
}
requestAnimationFrame(() => requestAnimationFrame(() => loadingEl.classList.add('done')));
window.__ready = true; trace('ready');
window.__audio = audio; window.__seek = seekTo; window.__story = { stateAt, DUR, X0, L, FLASHES }; window.__fly = fly;
window.__dbg = { U, state, S0: [M[0]], M, renderer, scene, camera, stepSim, get simT() { return simT; } };
</script>
