  const sky = g.createLinearGradient(0, 0, 0, H);

  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const ground = 0.94 * H;
  for (const [hMin, hMax, shade, winP, haze] of [[0.04, 0.16, 40, 0.1, 0.5], [0.06, 0.3, 26, 0.16, 0.3], [0.08, 0.45, 14, 0.24, 0]]) {
    let x = R() * 60;
    while (x < W) {
      const w = 28 + R() * 120, h = (hMin + R() ** 2 * (hMax - hMin)) * H, top = ground - h;
      g.fillStyle = `rgb(${shade},${shade},${shade + 6})`; g.fillRect(x, top, w + 1, H - top);
      const warm = R() < 0.7;
      for (let yy = top + 6; yy < ground - 4; yy += 8) for (let xx = x + 4; xx < x + w - 4; xx += 7) if (R() < winP * (R() < 0.15 ? 3 : 1)) {
        const k = R(); g.fillStyle = warm ? `rgba(255,${190 + k * 40 | 0},${110 + k * 60 | 0},${0.5 + R() * 0.5})` : `rgba(${170 + k * 40 | 0},${200 + k * 30 | 0},255,${0.45 + R() * 0.5})`;
        g.fillRect(xx, yy, 3.4, 4.2);
      }
      if (h > 0.3 * H && R() < 0.6) { g.fillStyle = '#ff3a2a'; g.fillRect(x + w / 2 - 2, top - 4, 5, 5); }
      if (haze) { g.fillStyle = `rgba(70,58,66,${haze * 0.5})`; g.fillRect(x, top, w + 1, H - top); }
      x += w + R() * 16;
    }
  }
  for (let k = 0; k < 280; k++) {                     // street lights and their glow
    const x = R() * W, y = ground + (R() - 0.3) * 36, r = 16 + R() * 60, gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,170,80,0.55)'); gr.addColorStop(1, 'rgba(255,140,60,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  const b = document.createElement('canvas'); b.width = 512; b.height = 128; const bg = b.getContext('2d');
  bg.filter = 'blur(2.5px)'; bg.drawImage(c, -8, -2, 528, 132); bg.filter = 'none';
  // what the frost lets through: soft glows of the brightest sources (lit facades, street lamps, the odd neon sign)
  bg.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 360; k++) {
    const x = R() * 512, y = 128 * (0.58 + R() ** 0.7 * 0.36), r = 2 + R() ** 2 * 9, q = R();
    const col = q < 0.5 ? '255,165,85' : q < 0.75 ? '255,225,190' : q < 0.92 ? '150,190,255' : q < 0.96 ? '255,60,80' : '70,220,255';
    const gr = bg.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${0.12 + R() * 0.3})`); gr.addColorStop(1, `rgba(${col},0)`);

const glassMat = new THREE.ShaderMaterial({

    uMoonDir: { value: MOON_DIR }, uMoon: { value: new THREE.Color(0x9fb3dc).multiplyScalar(0.05) },
    uTP: { value: Array.from({ length: 10 }, () => new THREE.Vector3()) }, uTC: { value: Array.from({ length: 10 }, () => new THREE.Vector3()) } },
  vertexShader: /* glsl */`

  fragmentShader: /* glsl */`

    varying vec3 vW, vN; varying vec2 vUv;

    void main(){

      // the glass bends the view: long horizontal ripples (the way cylinder glass was drawn), a slower swell, a tilt per pane
      vec2 q = vUv * vec2(2.2, 9.) + r1 * 17.;
      vec2 wob = vec2(vn(q) - .5, vn(q * vec2(.6, 1.3) + 4.1) - .5) * .9 + vec2(vn(vUv * 1.3 + r2 * 9.) - .5, vn(vUv * 1.1 + r3 * 7.) - .5) * 1.6;

  if (!snd.on || !snd.ctx) return;
  const c1 = Math.cos(S.t1), s1 = Math.sin(S.t1), c2 = Math.cos(S.t2), s2 = Math.sin(S.t2);
  const vx = L1 * S.w1 * c1 + L2 * S.w2 * c2, vy = L1 * S.w1 * s1 + L2 * S.w2 * s2, sp = Math.hypot(vx, vy), t = snd.ctx.currentTime;
  const moving = phaseName === 'run' ? 1 : 0.25, pan = clamp(tipX() / 2.5, -0.9, 0.9);
  snd.swG.gain.setTargetAtTime(Math.min(0.5, sp * sp / 80) * moving, t, 0.05);
  snd.swF.frequency.setTargetAtTime(220 + sp * 160, t, 0.05);
  snd.swP.pan.setTargetAtTime(pan, t, 0.05);
  snd.brG.gain.setTargetAtTime(Math.min(0.02, (Math.abs(S.w1) + Math.abs(S.w2 - S.w1)) * 0.0025) * moving, t, 0.08);
  if (phaseName === 'run' && prevVy > 0.05 && vy <= 0.05 && simT - lastNote > 0.3 && ledLevel * ledGate > 0.5) {
    const hN = clamp((tipY() - (P0.y - L1 - L2)) / (2 * (L1 + L2)), 0, 1), idx = Math.round(hN * (SCALE.length - 1));
    snd.note(196 * 2 ** (SCALE[idx] / 12), 0.07 + 0.05 * Math.min(1, sp / 3), pan);
    lastNote = simT;
  }
  prevVy = vy;
}

// ============================================================================ input + HUD
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); beginLift(); }
  else if (e.key === 'c' || e.key === 'C') mode = (mode + 1) % 3;
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide');
});
const modeEl = document.getElementById('mode'), expoEl = document.getElementById('expo');
function hud() {
  modeEl.textContent = MODES[mode];
  const s = Math.max(0, simT - exposureStart), m = Math.floor(s / 60);
  expoEl.textContent = phaseName === 'run' ? `exposure ${String(m).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}` : (phaseName === 'lift' ? 'winding up' : 'release');
}

// ============================================================================ per-frame scene update
function placeArms() {
  arm1.rotation.z = S.t1;
  arm2.position.set(P0.x + L1 * Math.sin(S.t1), P0.y - L1 * Math.cos(S.t1), ARM2_Z);
  arm2.rotation.z = S.t2;
  const e = ledLevel * ledGate;
  domeMat.color.copy(ledCol).multiplyScalar(14 * e).add(DIM_DOME);
  led.position.set(tipX(), tipY(), LED_Z + 0.03);
  led.color.copy(ledCol); led.intensity = LED_I * e;
  const fade = trailU.uFade.value, LP = volPass.uniforms.uLP.value, LC = volPass.uniforms.uLC.value;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.w < 1e-7) { LC[i].set(0, 0, 0); continue; }
    LP[i].set(c.x / c.w, c.y / c.w, LED_Z); LC[i].set(c.r, c.g, c.b).multiplyScalar(K_TRACE * fade);
  }
  LP[NL - 1].copy(led.position); LC[NL - 1].set(led.color.r, led.color.g, led.color.b).multiplyScalar(led.intensity);
}

let frameNo = 0;
function render() {
  if (frameNo % 6 === 0 || SHOT) {                   // the metal sees the room and the drawing, not itself
    pend.visible = false; floorMirror.visible = false;
    cubeCam.update(renderer, scene);
    pend.visible = true; floorMirror.visible = true;
  }
  trailU.uNow.value = simT;
  renderer.shadowMap.needsUpdate = true;
  if (frameNo < 2) moon.shadow.needsUpdate = true;
  renderer.setRenderTarget(rtS);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  volPass.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse);
  volPass.uniforms.uCamWorld.value.copy(camera.matrixWorld);
  volPass.uniforms.uCamPos.value.copy(camera.position);
  for (const k of ['uInvProj', 'uCamWorld', 'uCamPos']) shaftMat.uniforms[k].value.copy(volPass.uniforms[k].value);
  renderer.setRenderTarget(shaftRT); shaftQuad.render(renderer); renderer.setRenderTarget(null);
  gradePass.uniforms.uTime.value = simT;
  composer.render();
  frameNo++;
}
function keepInRoom() {
  const p = camera.position;
  p.x = clamp(p.x, -RX + 0.6, RX - 0.6); p.y = clamp(p.y, 0.35, RH - 1.8); p.z = clamp(p.z, -RZ + 0.6, RZ - 0.6);
}
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  simulate(dt);
  flushTrail();
  placeArms();
  // a visitor's slow drift between two viewpoints, resumed a while after any drag
  controls.autoRotate = performance.now() - lastInteract > 8000;
  const az = controls.getAzimuthalAngle();
  if (az > 0.6) controls.autoRotateSpeed = -Math.abs(controls.autoRotateSpeed);
  if (az < -0.45) controls.autoRotateSpeed = Math.abs(controls.autoRotateSpeed);
  controls.update(dt); keepInRoom();
  updateSound();
  hud();
  render();
  if (ADAPT) {
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 1.5) {
      const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
      const nr = fps < 30 ? Math.max(RPR_MIN, RPR * 0.9) : fps > 50 ? Math.min(DPR, RPR * 1.08) : RPR;
      if (Math.abs(nr - RPR) > 0.02) { RPR = nr; sizeTargets(); }
    }
  }
  if (!frame.started) { frame.started = true; document.getElementById('loading').classList.add('done'); }
  requestAnimationFrame(frame);
}

if (SHOT) {
  // deterministic still: run the physics forward t seconds of exposure, then draw one frame
  const T = Q.has('t') ? +Q.get('t') : 30;
  simulate(HOLD + 0.001);
  for (let t = 0; t < T; t += 1 / 60) simulate(1 / 60);
  flushTrail(); placeArms(); camera.lookAt(TARGET);
  render(); render();
  window.__ready = true;
} else {
  // compile every shader off the main thread where the browser allows it, so the first frame doesn't stall
  // (into the HDR target the scene really draws to: compiled for the screen they'd get tone mapping baked in and be built twice)
  // open on a drawing already under way rather than an empty room
  simulate(HOLD + 0.001); for (let t = 0; t < 9; t += 1 / 60) simulate(1 / 60);
  flushTrail(); placeArms();
  renderer.setRenderTarget(rtS);
  try { await renderer.compileAsync(scene, camera); } catch (e) {}
  renderer.setRenderTarget(null);
  frame();
}
</script>
</body>
