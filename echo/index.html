<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vibecodevember - Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #dfe9ea; --soft: #7f979c; --sonar: #6ff2d8; --bar: 56px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#gl { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas#gl:active { cursor: grabbing; }
  #fade { position: fixed; inset: 0; pointer-events: none; background: #000; opacity: 1; z-index: 2; }
  .bar { position: fixed; left: 0; right: 0; top: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(16px, 3vw, 36px); pointer-events: none; z-index: 3; }
  .brand { white-space: nowrap; font: 500 10px Inter, sans-serif; letter-spacing: .34em; text-transform: uppercase; opacity: .7; }
  .name { font: italic 400 24px 'Cormorant Garamond', Georgia, serif; letter-spacing: .05em; opacity: .9; }
  #caption { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--lb, 0px) * 0.5 - 18px); width: min(760px, 88vw); text-align: center; font: italic 400 21px 'Cormorant Garamond', Georgia, serif; opacity: 0; transition: opacity 1.6s; pointer-events: none; z-index: 3; }
  #caption small { display: block; font: 500 9px Inter, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--soft); margin-top: 7px; }
  #hint { position: fixed; left: 50%; top: calc(var(--bar) - 4px); transform: translateX(-50%); font-size: 10px; letter-spacing: .12em; color: var(--soft); pointer-events: none; z-index: 3; white-space: nowrap; transition: opacity 1.5s; }
  #hint b { color: var(--ink); font-weight: 500; }
  #scope { position: fixed; right: clamp(16px, 3vw, 36px); bottom: 16px; z-index: 3; pointer-events: none; text-align: right; opacity: .82; }
  #scope canvas { width: 150px; height: 150px; display: block; margin-left: auto; }
  #scope .ro { margin-top: 5px; font: 400 9.5px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .08em; color: var(--sonar); opacity: .8; white-space: pre; }
  #shotname { position: fixed; left: clamp(16px, 3vw, 36px); bottom: 18px; z-index: 3; pointer-events: none; font: 400 9.5px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .12em; color: var(--soft); opacity: .7; white-space: pre; }
  #start { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; cursor: pointer; background: #000; transition: opacity 1.6s; }
  #start div { text-align: center; font: italic 400 34px 'Cormorant Garamond', Georgia, serif; }
  #start span { display: block; margin-top: 14px; font: 500 10px Inter, sans-serif; letter-spacing: .34em; text-transform: uppercase; color: var(--soft); }
  #start.gone { opacity: 0; pointer-events: none; }
  body.capture .bar, body.capture #caption, body.capture #hint, body.capture #start, body.capture #fade, body.capture #shotname, body.capture #scope { display: none !important; }
  body.shot .bar, body.shot #caption, body.shot #hint, body.shot #start, body.shot #fade, body.shot #shotname { display: none !important; }
  @media (max-width: 600px) { .name { font-size: 20px; } .brand { letter-spacing: .2em; font-size: 9px; } #caption { font-size: 16px; } #scope canvas { width: 110px; height: 110px; } #scope .ro { font-size: 8px; } #shotname { display: none; } }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<body>
<div id="fade"></div>
<header class="bar"><span class="brand">Vibecodevember</span><span class="name">Echo</span></header>
<div id="hint"></div>
<div id="caption"></div>
<div id="shotname"></div>
<div id="scope"><canvas id="ppi"></canvas><div class="ro" id="ro"></div></div>
<div id="start"><div>Echo<span>Click to dive · sound on</span></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================================ setup
// Metres. The submarine cruises at y = 0 (150 m below the surface) heading -z; the seabed lies
// around y = -74 with ridges, a trench, rocky seamounts and an old wreck. Sound is slowed ~21x
// (70 m/s instead of 1500) so the eye can follow the wavefront.
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot');
if (SHOT) document.body.classList.add('shot');
const CAPTURE = Q.has('capture');
if (CAPTURE) document.body.classList.add('capture');
const COARSE = matchMedia('(pointer: coarse)').matches;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rs = (a) => (rnd() * 2 - 1) * a;

const C = 70, MAXR = 470, NP = 4, SURF = 150, SPEED = 3.2;
const FOG = new THREE.Color(0.004, 0.022, 0.03), FOGD = 0.0052;
const fogDU = { value: FOGD };

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT });
renderer.domElement.id = 'gl';
const DPR = Math.min(devicePixelRatio, COARSE ? 1.25 : 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG, FOGD);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 3000);

// ============================================================================ noise + seabed height
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 5) { let s = 0, a = 1, n = 0; for (let i = 0; i < o; i++) { s += (vnoise(x, y) - 0.5) * 2 * a; n += a; a *= 0.5; const t = x * 1.97 + y * 0.31; y = y * 1.97 - x * 0.31 + 17.3; x = t + 3.1; } return s / n; }
function ridged(x, y, o = 4) { let s = 0, a = 1, n = 0; for (let i = 0; i < o; i++) { const r = 1 - Math.abs((vnoise(x, y) - 0.5) * 2); s += r * r * a; n += a; a *= 0.5; x = x * 2.03 + 5.2; y = y * 2.03 - 1.7; } return s / n; }
const MOUNTS = [{ x: 78, z: 330, r: 42, h: 58 }, { x: -95, z: 120, r: 60, h: 48 }];
for (let i = 0; i < 26; i++) {
  const side = rnd() < 0.5 ? -1 : 1;
  MOUNTS.push({ x: side * (95 + rnd() * 420), z: -1250 + rnd() * 2500, r: 35 + rnd() * 90, h: 25 + rnd() * 70 });
}
const WRECK = { x: -44, z: 560, yaw: 0.62, base: 0 };
function rawHeight(x, z) {
  let h = -74 + fbm(x * 0.0022, z * 0.0022) * 26 + Math.pow(ridged(x * 0.0065 + 3, z * 0.0065), 2.6) * 26;
  // long sand waves, crests across the current
  h += 1.4 * Math.sin((x * 0.55 + z * 0.83) * 0.045 + fbm(x * 0.003, z * 0.003, 3) * 4);
  for (const m of MOUNTS) {
    const dx = x - m.x, dz = z - m.z, d2 = dx * dx + dz * dz;
    if (d2 > 9 * m.r * m.r) continue;
    const j = 0.65 + 0.7 * vnoise(x * 0.04 + m.x, z * 0.04);
    h += m.h * Math.exp(-d2 / (m.r * m.r)) * j;
  }
  const tr = (x * 0.8 + z * 0.6 - 260);
  h -= 34 * Math.exp(-(tr * tr) / (55 * 55));
  return h;
}
WRECK.base = rawHeight(WRECK.x, WRECK.z);
function heightAt(x, z) {
  let h = rawHeight(x, z);
  // the wreck has settled into a scour pit of its own making
  const dx = x - WRECK.x, dz = z - WRECK.z, d2 = dx * dx + dz * dz;
  if (d2 < 120 * 120) {
    const w = Math.exp(-d2 / (48 * 48)); h = lerp(h, WRECK.base - 1.5 + Math.sqrt(d2) * 0.03, w * 0.85);
    // hull-local coordinates: sediment drifts piled along both sides and around the bow piece
    const px = WRECK.x - Math.sin(WRECK.yaw) * 32, pz = WRECK.z - Math.cos(WRECK.yaw) * 32, ex = x - px, ez = z - pz;
    const c = Math.cos(WRECK.yaw), sn = Math.sin(WRECK.yaw), lx = ex * c - ez * sn, lz = ex * sn + ez * c;
    const along = ease((lz + 3) / 6) * ease((70 - lz) / 8);
    const side = Math.exp(-Math.pow((Math.abs(lx) - 6.2) / 3.2, 2)) * (lx < 0 ? 2.4 : 1.6);
    h += side * along * (0.75 + 0.5 * vnoise(lz * 0.15, lx * 0.2));
  }
  return h;
}

// ============================================================================ shared sonar GLSL
// Each ping: xyz = emission point (the bow array), w = emission time (huge negative = idle).
const pingU = { value: Array.from({ length: NP }, () => new THREE.Vector4(0, 0, 0, -1e4)) };
const timeU = { value: 0 };
const SONAR_DECL = `
  uniform vec4 uPing[${NP}];
  uniform float uTime;
  const float C = ${C.toFixed(1)};
  const float MAXR = ${MAXR.toFixed(1)};
  float sonHash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float sonNoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(sonHash(i), sonHash(i+vec2(1,0)), f.x), mix(sonHash(i+vec2(0,1)), sonHash(i+vec2(1,1)), f.x), f.y); }
  // returns the sonar light at world point w with world normal n
  vec3 sonarAt(vec3 w, vec3 n, float contour, float k, float grain){
    vec3 son = vec3(0.0);
    for (int i = 0; i < ${NP}; i++){
      float age = uTime - uPing[i].w;
      if (age < 0.0 || age > 22.0) continue;
      float r = C * age;
      vec3 to = uPing[i].xyz - w; float d = length(to);
      if (d > MAXR + 40.0) continue;
      float lam = pow(max(dot(n, to / d), 0.0), 1.3);
      float W = 2.2 + r * 0.01;
      float x = (d - r) / W;
      float front = exp(-x * x) * smoothstep(MAXR + 30.0, MAXR - 80.0, r);
      float trail = step(d, r) * exp(-(r - d) / 55.0) * exp(-age * 0.16);
      float att = 1.0 / (1.0 + d / 170.0);
      float speck = mix(1.0, 0.55 + 0.8 * sonNoise(w.xz * 0.35 + float(i) * 7.0) * (0.7 + 0.6 * sonNoise(w.xz * 1.7)), grain);
      son += vec3(0.4, 1.0, 0.88) * front * (0.3 + 0.9 * lam) * att * 0.85 * speck * k;
      son += vec3(0.16, 0.8, 0.7) * trail * att * (0.015 + 0.18 * lam + contour * 0.75) * k;
    }
    return son;
  }
`;
// Inject sonar light into a standard/physical material as emission.
// Caustics: daylight focused by the uneven underside of the ice, dancing over up-facing surfaces.
// Two layers of a classic iterated-warp pattern at different scales and speeds, softly mixed.
const caustU = { value: 0 }, caustColU = { value: new THREE.Color(0.55, 0.9, 1.0) };
const CAUSTIC_GLSL = `
  uniform float uCaust; uniform vec3 uCaustCol;
  // thin interfering light lines: zero-crossings of two warped wave fields, brighter where they cross
  float causticF(vec2 p, float t){
    vec2 q = p + 0.6 * vec2(sin(p.y * 1.7 + t), cos(p.x * 1.5 - t * 0.8)) + 0.35 * vec2(sin(p.y * 3.9 - t * 1.3), cos(p.x * 4.3 + t * 1.1));
    float a = sin(q.x * 2.1 + sin(q.y * 1.3 + t * 0.7) * 1.5);
    float b = sin(q.y * 2.3 + sin(q.x * 1.1 - t * 0.6) * 1.5);
    float c1 = exp(-a * a * 9.0), c2 = exp(-b * b * 9.0);
    float c = (c1 + c2) * 0.5 + c1 * c2;
    return c * c;
  }
`;
function addSonar(mat, k = 1) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uPing = pingU; sh.uniforms.uTime = timeU; sh.uniforms.uCaust = caustU; sh.uniforms.uCaustCol = caustColU;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vSW;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 sw = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          sw = instanceMatrix * sw;
        #endif
        vSW = (modelMatrix * sw).xyz;`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vSW;\n' + SONAR_DECL + CAUSTIC_GLSL)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        if (uCaust > 0.0) {
          vec3 wnc = normalize((vec4(normal, 0.0) * viewMatrix).xyz);
          float upF = smoothstep(-0.1, 0.9, wnc.y);
          vec2 cp = vSW.xz * 0.55 + vSW.y * 0.1;
          float c = causticF(cp, uTime * 0.9) * 0.65 + causticF(cp * 1.6 + 3.1, uTime * 0.7) * 0.35;
          c = clamp(c, 0.0, 1.5);
          vec3 cl = uCaustCol * c * upF * uCaust;
          reflectedLight.directDiffuse += diffuseColor.rgb * cl * 3.5;
          reflectedLight.directSpecular += cl * 0.032;
        }`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        {
          vec3 wn = normalize((vec4(normal, 0.0) * viewMatrix).xyz);
          totalEmissiveRadiance += sonarAt(vSW, wn, 0.0, ${k.toFixed(2)}, 0.0);
        }`);
  };
  return mat;
}

// ============================================================================ seabed
const groundMat = new THREE.ShaderMaterial({
  uniforms: { uPing: pingU, uTime: timeU, uFog: { value: FOG }, uFogD: fogDU, uAmb: { value: new THREE.Vector3(0.014, 0.032, 0.036) }, uDown: { value: new THREE.Vector3(0.085, 0.18, 0.19) } },
  vertexShader: `
    attribute float ao;
    varying vec3 vW; varying vec3 vN; varying float vAo; varying float vRock;
    void main(){
      mat4 m = modelMatrix; vRock = 0.0;
      #ifdef USE_INSTANCING
        m = modelMatrix * instanceMatrix;
      #endif
      vec4 w = m * vec4(position, 1.0);
      vW = w.xyz; vN = normalize(mat3(m) * normal);
      #ifdef USE_INSTANCING
        vAo = 0.55 + 0.45 * clamp(normal.y * 0.5 + 0.5, 0.0, 1.0); vRock = 1.0;
      #else
        vAo = ao;
      #endif
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: SONAR_DECL + `
    uniform vec3 uFog, uAmb, uDown; uniform float uFogD; uniform sampler2D tSand, tSandN;
    varying vec3 vW; varying vec3 vN; varying float vAo; varying float vRock;
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(sonHash(i), sonHash(i+vec2(1,0)), f.x), mix(sonHash(i+vec2(0,1)), sonHash(i+vec2(1,1)), f.x), f.y); }
    float fb(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += vn(p) * a; p = mat2(1.6,1.2,-1.2,1.6) * p; a *= 0.5; } return s; }
    // current ripples: ~75 cm wavelength, gentle stoss side, steep lee face, crests that wander,
    // fork and die out. Returns height in [0,1]; t = phase within one ripple.
    float ripple(vec2 p, out float t){
      vec2 d = vec2(0.83, 0.55);
      float ph = dot(p, d) / 0.75 + fb(p * 0.05) * 6.0 + fb(p * 0.22) * 1.1;
      t = fract(ph);
      float h = t < 0.75 ? smoothstep(0.0, 0.75, t) : 1.0 - smoothstep(0.75, 1.0, t);
      return h * (0.45 + 0.55 * smoothstep(0.2, 0.7, vn(p * 0.3 + 9.0)));
    }
    float megaripple(vec2 p){ return sin(dot(p, vec2(0.6, 0.8)) * 0.7 + fb(p * 0.02) * 5.0) * 0.5 + 0.5; }
    // burrows and the small mounds around them
    float burrow(vec2 p, out float hole){
      vec2 c = floor(p * 0.7); hole = 0.0;
      if (sonHash(c) < 0.86) return 0.0;
      vec2 o = (c + 0.2 + 0.6 * vec2(sonHash(c + 3.1), sonHash(c + 7.7))) / 0.7;
      float r = length(p - o);
      hole = exp(-pow(r / 0.045, 2.0));
      return 0.06 * exp(-pow(r / 0.22, 2.0)) - 0.08 * hole;
    }
    float relief(vec2 p, float rk, out float t, out float hole){
      float rp = ripple(p, t);
      return rp * 0.055 * rk + megaripple(p) * 0.22 + fb(p * 0.4) * 0.15 + burrow(p, hole) * rk;
    }
    void main(){
      vec3 N = normalize(vN);
      float flt = smoothstep(0.80, 0.95, N.y) * (1.0 - vRock);
      vec2 p = vW.xz;
      // ripples fade before they alias
      float fw = fwidth(dot(p, vec2(0.83, 0.55)) / 0.75);
      float rk = (1.0 - smoothstep(0.25, 0.9, fw)) * flt;
      float e = 0.06, t0, tt, h0, hh;
      float r0 = relief(p, rk, t0, h0);
      float rx = relief(p + vec2(e, 0.0), rk, tt, hh), rz = relief(p + vec2(0.0, e), rk, tt, hh);
      N = normalize(N + vec3(-(rx - r0) / e, 0.0, -(rz - r0) / e) * flt);
      vec3 Nr = N;
      if (vRock > 0.5 || flt < 0.5) { float a0 = fb(p * 0.45), ax = fb((p + vec2(0.35, 0.0)) * 0.45), az = fb((p + vec2(0.0, 0.35)) * 0.45); Nr = normalize(N + vec3(-(ax - a0), 0.0, -(az - a0)) * 2.6); }
      N = mix(Nr, N, flt);
      // close-up sand detail from the texture at two scales (rotated) so it never visibly tiles
      vec2 tp1 = p / 2.0, tp2 = mat2(0.8, -0.6, 0.6, 0.8) * p / 6.7 + 0.37;
      vec3 st1 = texture2D(tSand, tp1).rgb, st2 = texture2D(tSand, tp2).rgb;
      vec2 sn = (texture2D(tSandN, tp1).xy * 2.0 - 1.0) * 0.65 + (texture2D(tSandN, tp2).xy * 2.0 - 1.0) * 0.35;
      N = normalize(N + vec3(sn.x, 0.0, -sn.y) * 0.55 * flt);
      // albedo: tan quartz sand; cleaner pale patches, grey silty patches; detritus and shell hash
      // collect in the ripple troughs; fine grain noise up close
      float patchy = fb(p * 0.012), silty = smoothstep(0.45, 0.7, fb(p * 0.006 + 4.0));
      vec3 sand = mix(vec3(0.47, 0.42, 0.33), vec3(0.58, 0.53, 0.43), smoothstep(0.35, 0.7, patchy));
      sand = mix(sand, vec3(0.33, 0.32, 0.28), silty * 0.7);
      float trough = 1.0 - smoothstep(0.0, 0.25, min(t0, 1.0 - t0) * 4.0 - 0.15);
      sand = mix(sand, vec3(0.2, 0.18, 0.14), trough * 0.45 * rk);
      vec3 det = (st1 * 0.65 + st2 * 0.35) * 2.0;
      sand *= mix(vec3(1.0), det, 0.9) * (1.0 + (megaripple(p) - 0.5) * 0.06);
      sand = mix(sand, vec3(0.06, 0.05, 0.04), h0 * 0.85);
      float strata = 0.75 + 0.25 * sin(vW.y * 2.3 + fb(p * 0.1) * 4.0);
      vec3 rock = vec3(0.12, 0.115, 0.11) * (0.65 + 0.55 * fb(p * 0.8)) * strata;
      vec3 alb = mix(rock, sand, flt);
      // light: the last of the daylight, filtered blue-green from far above, plus silt-scattered ambient
      vec3 L = normalize(vec3(0.15, 1.0, 0.1));
      float sh = 0.55 + 0.45 * fb(p * 0.012 + uTime * 0.004);   // drifting veils of turbidity overhead
      vec3 col = alb * (uAmb + uDown * max(dot(N, L), 0.0) * sh) * vAo;
      float dist = length(vW - cameraPosition);
      float f = 1.0 - exp(-pow(uFogD * dist, 2.0));

    cam(t, s) { return { p: s.c.clone().add(V(t * 0.5, t * 0.12, -t * 2.4)), l: V(PROF.x, PROF.y - 6, PROF.z + 40 - t * 3.2) }; } },
