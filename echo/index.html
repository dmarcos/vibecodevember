<!doctype html>

<style>
  :root { --ink: #dfe9ea; --soft: #7f979c; --sonar: #6ff2d8; --bar: 56px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#gl { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas#gl:active { cursor: grabbing; }
  #fade { position: fixed; inset: 0; pointer-events: none; background: #000; opacity: 1; z-index: 2; }
  .bar { position: fixed; left: 0; right: 0; top: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(16px, 3vw, 36px); pointer-events: none; z-index: 3; }
  .brand { white-space: nowrap; font: 500 10px Inter, sans-serif; letter-spacing: .34em; text-transform: uppercase; opacity: .7; }

  #caption { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--lb, 0px) * 0.5 - 18px); width: min(760px, 88vw); text-align: center; font: italic 400 21px 'Cormorant Garamond', Georgia, serif; opacity: 0; transition: opacity 1.6s; pointer-events: none; z-index: 3; }
  #caption small { display: block; font: 500 9px Inter, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--soft); margin-top: 7px; }
  #hint { position: fixed; left: 50%; top: calc(var(--bar) - 4px); transform: translateX(-50%); font-size: 10px; letter-spacing: .12em; color: var(--soft); pointer-events: none; z-index: 3; white-space: nowrap; transition: opacity 1.5s; }
  #hint b { color: var(--ink); font-weight: 500; }
  #scope { position: fixed; right: clamp(16px, 3vw, 36px); bottom: 16px; z-index: 3; pointer-events: none; text-align: right; opacity: .82; }

  #shotname { position: fixed; left: clamp(16px, 3vw, 36px); bottom: 18px; z-index: 3; pointer-events: none; font: 400 9.5px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .12em; color: var(--soft); opacity: .7; white-space: pre; }
  #start { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; cursor: pointer; background: #000; transition: opacity 1.6s; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ============================================================================ setup
// Metres. The submarine cruises at y = 0 (150 m below the surface) heading -z; the seabed lies
// around y = -74 with ridges, a trench, rocky seamounts and an old wreck. Sound is slowed ~21x
// (70 m/s instead of 1500) so the eye can follow the wavefront.
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot');
if (SHOT) document.body.classList.add('shot');
const COARSE = matchMedia('(pointer: coarse)').matches;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rs = (a) => (rnd() * 2 - 1) * a;

const C = 70, MAXR = 470, NP = 4, SURF = 150, SPEED = 3.2;
const FOG = new THREE.Color(0.004, 0.022, 0.03), FOGD = 0.0052;
const fogDU = { value: FOGD };

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT });
renderer.domElement.id = 'gl';
const DPR = Math.min(devicePixelRatio, COARSE ? 1.25 : 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG, FOGD);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 3000);

// ============================================================================ noise + seabed height
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 5) { let s = 0, a = 1, n = 0; for (let i = 0; i < o; i++) { s += (vnoise(x, y) - 0.5) * 2 * a; n += a; a *= 0.5; const t = x * 1.97 + y * 0.31; y = y * 1.97 - x * 0.31 + 17.3; x = t + 3.1; } return s / n; }
function ridged(x, y, o = 4) { let s = 0, a = 1, n = 0; for (let i = 0; i < o; i++) { const r = 1 - Math.abs((vnoise(x, y) - 0.5) * 2); s += r * r * a; n += a; a *= 0.5; x = x * 2.03 + 5.2; y = y * 2.03 - 1.7; } return s / n; }
const MOUNTS = [{ x: 78, z: 330, r: 42, h: 58 }, { x: -95, z: 120, r: 60, h: 48 }];
for (let i = 0; i < 26; i++) {
  const side = rnd() < 0.5 ? -1 : 1;
  MOUNTS.push({ x: side * (95 + rnd() * 420), z: -1250 + rnd() * 2500, r: 35 + rnd() * 90, h: 25 + rnd() * 70 });
}
const WRECK = { x: -44, z: 560, yaw: 0.62, base: 0 };
function rawHeight(x, z) {
  let h = -74 + fbm(x * 0.0022, z * 0.0022) * 26 + Math.pow(ridged(x * 0.0065 + 3, z * 0.0065), 2.6) * 26;
  // long sand waves, crests across the current
  h += 1.4 * Math.sin((x * 0.55 + z * 0.83) * 0.045 + fbm(x * 0.003, z * 0.003, 3) * 4);
  for (const m of MOUNTS) {
    const dx = x - m.x, dz = z - m.z, d2 = dx * dx + dz * dz;
    if (d2 > 9 * m.r * m.r) continue;
    const j = 0.65 + 0.7 * vnoise(x * 0.04 + m.x, z * 0.04);
    h += m.h * Math.exp(-d2 / (m.r * m.r)) * j;
  }
  const tr = (x * 0.8 + z * 0.6 - 260);
  h -= 34 * Math.exp(-(tr * tr) / (55 * 55));
  return h;
}
WRECK.base = rawHeight(WRECK.x, WRECK.z);
function heightAt(x, z) {
  let h = rawHeight(x, z);
  // the wreck has settled into a scour pit of its own making
  const dx = x - WRECK.x, dz = z - WRECK.z, d2 = dx * dx + dz * dz;
  if (d2 < 120 * 120) { const w = Math.exp(-d2 / (48 * 48)); h = lerp(h, WRECK.base - 1.5 + Math.sqrt(d2) * 0.03, w * 0.85); }
  return h;
}

// ============================================================================ shared sonar GLSL
// Each ping: xyz = emission point (the bow array), w = emission time (huge negative = idle).
const pingU = { value: Array.from({ length: NP }, () => new THREE.Vector4(0, 0, 0, -1e4)) };
const timeU = { value: 0 };
const SONAR_DECL = `
  uniform vec4 uPing[${NP}];
  uniform float uTime;
  const float C = ${C.toFixed(1)};
  const float MAXR = ${MAXR.toFixed(1)};
  float sonHash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float sonNoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(sonHash(i), sonHash(i+vec2(1,0)), f.x), mix(sonHash(i+vec2(0,1)), sonHash(i+vec2(1,1)), f.x), f.y); }
  // returns the sonar light at world point w with world normal n
  vec3 sonarAt(vec3 w, vec3 n, float contour, float k, float grain){
    vec3 son = vec3(0.0);
    for (int i = 0; i < ${NP}; i++){
      float age = uTime - uPing[i].w;
      if (age < 0.0 || age > 22.0) continue;
      float r = C * age;
      vec3 to = uPing[i].xyz - w; float d = length(to);
      if (d > MAXR + 40.0) continue;
      float lam = pow(max(dot(n, to / d), 0.0), 1.3);
      float W = 2.2 + r * 0.01;
      float x = (d - r) / W;
      float front = exp(-x * x) * smoothstep(MAXR + 30.0, MAXR - 80.0, r);
      float trail = step(d, r) * exp(-(r - d) / 140.0) * exp(-age * 0.13);
      float att = 1.0 / (1.0 + d / 170.0);
      float speck = mix(1.0, 0.55 + 0.8 * sonNoise(w.xz * 0.35 + float(i) * 7.0) * (0.7 + 0.6 * sonNoise(w.xz * 1.7)), grain);
      son += vec3(0.4, 1.0, 0.88) * front * (0.3 + 0.9 * lam) * att * 0.85 * speck * k;
      son += vec3(0.16, 0.8, 0.7) * trail * att * (0.04 + 0.45 * lam + contour * 0.85) * k;
    }
    return son;
  }
`;
// Inject sonar light into a standard/physical material as emission.
function addSonar(mat, k = 1) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uPing = pingU; sh.uniforms.uTime = timeU;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vSW;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 sw = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          sw = instanceMatrix * sw;
        #endif
        vSW = (modelMatrix * sw).xyz;`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vSW;\n' + SONAR_DECL)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        {
          vec3 wn = normalize((vec4(normal, 0.0) * viewMatrix).xyz);
          totalEmissiveRadiance += sonarAt(vSW, wn, 0.0, ${k.toFixed(2)}, 0.0);
        }`);
  };
  return mat;
}

// ============================================================================ seabed
const groundMat = new THREE.ShaderMaterial({
  uniforms: { uPing: pingU, uTime: timeU, uFog: { value: FOG }, uFogD: fogDU, uAmb: { value: new THREE.Vector3(0.014, 0.032, 0.036) }, uDown: { value: new THREE.Vector3(0.085, 0.18, 0.19) } },
  vertexShader: `
    attribute float ao;
    varying vec3 vW; varying vec3 vN; varying float vAo; varying float vRock;
    void main(){
      mat4 m = modelMatrix; vRock = 0.0;
      #ifdef USE_INSTANCING
        m = modelMatrix * instanceMatrix;
      #endif
      vec4 w = m * vec4(position, 1.0);
      vW = w.xyz; vN = normalize(mat3(m) * normal);
      #ifdef USE_INSTANCING
        vAo = 0.55 + 0.45 * clamp(normal.y * 0.5 + 0.5, 0.0, 1.0); vRock = 1.0;
      #else
        vAo = ao;
      #endif
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: SONAR_DECL + `
    uniform vec3 uFog, uAmb, uDown; uniform float uFogD;
    varying vec3 vW; varying vec3 vN; varying float vAo; varying float vRock;
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(sonHash(i), sonHash(i+vec2(1,0)), f.x), mix(sonHash(i+vec2(0,1)), sonHash(i+vec2(1,1)), f.x), f.y); }
    float fb(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += vn(p) * a; p = mat2(1.6,1.2,-1.2,1.6) * p; a *= 0.5; } return s; }
    // current ripples: ~75 cm wavelength, gentle stoss side, steep lee face, crests that wander,
    // fork and die out. Returns height in [0,1]; t = phase within one ripple.
    float ripple(vec2 p, out float t){
      vec2 d = vec2(0.83, 0.55);
      float ph = dot(p, d) / 0.75 + fb(p * 0.05) * 6.0 + fb(p * 0.22) * 1.1;
      t = fract(ph);
      float h = t < 0.75 ? smoothstep(0.0, 0.75, t) : 1.0 - smoothstep(0.75, 1.0, t);
      return h * (0.45 + 0.55 * smoothstep(0.2, 0.7, vn(p * 0.3 + 9.0)));
    }
    float megaripple(vec2 p){ return sin(dot(p, vec2(0.6, 0.8)) * 0.7 + fb(p * 0.02) * 5.0) * 0.5 + 0.5; }
    // burrows and the small mounds around them
    float burrow(vec2 p, out float hole){
      vec2 c = floor(p * 0.7); hole = 0.0;
      if (sonHash(c) < 0.86) return 0.0;
      vec2 o = (c + 0.2 + 0.6 * vec2(sonHash(c + 3.1), sonHash(c + 7.7))) / 0.7;
      float r = length(p - o);
      hole = exp(-pow(r / 0.045, 2.0));
      return 0.06 * exp(-pow(r / 0.22, 2.0)) - 0.08 * hole;
    }
    float relief(vec2 p, float rk, out float t, out float hole){
      float rp = ripple(p, t);
      return rp * 0.055 * rk + megaripple(p) * 0.22 + fb(p * 0.4) * 0.15 + burrow(p, hole) * rk;
    }
    void main(){
      vec3 N = normalize(vN);
      float flt = smoothstep(0.80, 0.95, N.y) * (1.0 - vRock);
      vec2 p = vW.xz;
      // ripples fade before they alias
      float fw = fwidth(dot(p, vec2(0.83, 0.55)) / 0.75);
      float rk = (1.0 - smoothstep(0.25, 0.9, fw)) * flt;
      float e = 0.06, t0, tt, h0, hh;
      float r0 = relief(p, rk, t0, h0);
      float rx = relief(p + vec2(e, 0.0), rk, tt, hh), rz = relief(p + vec2(0.0, e), rk, tt, hh);
      N = normalize(N + vec3(-(rx - r0) / e, 0.0, -(rz - r0) / e) * flt);
      vec3 Nr = N;
      if (vRock > 0.5 || flt < 0.5) { float a0 = fb(p * 0.45), ax = fb((p + vec2(0.35, 0.0)) * 0.45), az = fb((p + vec2(0.0, 0.35)) * 0.45); Nr = normalize(N + vec3(-(ax - a0), 0.0, -(az - a0)) * 2.6); }
      N = mix(Nr, N, flt);
      // albedo: tan quartz sand; cleaner pale patches, grey silty patches; detritus and shell hash
      // collect in the ripple troughs; fine grain noise up close
      float patchy = fb(p * 0.012), silty = smoothstep(0.45, 0.7, fb(p * 0.006 + 4.0));
      vec3 sand = mix(vec3(0.47, 0.42, 0.33), vec3(0.58, 0.53, 0.43), smoothstep(0.35, 0.7, patchy));
      sand = mix(sand, vec3(0.33, 0.32, 0.28), silty * 0.7);
      float trough = 1.0 - smoothstep(0.0, 0.25, min(t0, 1.0 - t0) * 4.0 - 0.15);
      sand = mix(sand, vec3(0.2, 0.18, 0.14), trough * 0.45 * rk);
      float shell = step(0.985, sonHash(floor(p * 9.0))) * (0.4 + 0.6 * trough) * rk * (1.0 - smoothstep(0.25, 0.8, fwidth(p.x * 9.0)));
      sand = mix(sand, vec3(0.78, 0.74, 0.66), shell);
      float grain = (sonHash(floor(p * 40.0)) - 0.5) * (1.0 - smoothstep(0.25, 0.8, fwidth(p.x * 40.0)));
      sand *= 1.0 + grain * 0.12 + (megaripple(p) - 0.5) * 0.06;
      sand = mix(sand, vec3(0.06, 0.05, 0.04), h0 * 0.85);
      float strata = 0.75 + 0.25 * sin(vW.y * 2.3 + fb(p * 0.1) * 4.0);
      vec3 rock = vec3(0.12, 0.115, 0.11) * (0.65 + 0.55 * fb(p * 0.8)) * strata;
      vec3 alb = mix(rock, sand, flt);
      // light: the last of the daylight, filtered blue-green from far above, plus silt-scattered ambient
      vec3 L = normalize(vec3(0.15, 1.0, 0.1));
      float sh = 0.55 + 0.45 * fb(p * 0.012 + uTime * 0.004);   // drifting veils of turbidity overhead
      vec3 col = alb * (uAmb + uDown * max(dot(N, L), 0.0) * sh) * vAo;
      float dist = length(vW - cameraPosition);
      float f = 1.0 - exp(-pow(uFogD * dist, 2.0));
      // sonar contours: fine every 2.5 m, bold every 12.5 m
      float cl = vW.y / 2.5; float lw = abs(fract(cl - 0.5) - 0.5) / max(fwidth(cl), 1e-4);
      float cl2 = vW.y / 12.5; float lw2 = abs(fract(cl2 - 0.5) - 0.5) / max(fwidth(cl2), 1e-4);
      float contour = max((1.0 - min(lw, 1.0)) * 0.55, 1.0 - min(lw2 * 0.7, 1.0));
      vec3 son = sonarAt(vW, N, contour, 1.0, 1.0) * mix(0.75, 1.0, vAo);
      col = mix(col, uFog, f);
      col += son * mix(1.0, 0.16, f);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
let seabed, rocks;
{
  const S = 2600, SEG = COARSE ? 300 : 420;
  const g = new THREE.PlaneGeometry(S, S, SEG, SEG).rotateX(-Math.PI / 2);
  const p = g.attributes.position, n1 = SEG + 1;
  const H = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) { H[i] = heightAt(p.getX(i), p.getZ(i)); p.setY(i, H[i]); }
  // cavity occlusion from the grid itself: hollows darker than their surroundings
  const ao = new Float32Array(p.count);
  for (let j = 0; j < n1; j++) for (let i = 0; i < n1; i++) {
    let s = 0, c = 0;
    for (const [di, dj] of [[3, 0], [-3, 0], [0, 3], [0, -3], [2, 2], [-2, -2], [2, -2], [-2, 2]]) {
      const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= n1 || jj >= n1) continue; s += H[jj * n1 + ii]; c++;
    }
    ao[j * n1 + i] = clamp(1 + (H[j * n1 + i] - s / c) * 0.06, 0.35, 1.15);
  }
  g.setAttribute('ao', new THREE.BufferAttribute(ao, 1));
  g.computeVertexNormals();
  seabed = new THREE.Mesh(g, groundMat); scene.add(seabed);
  // boulders, denser around the seamounts
  const rg = new THREE.IcosahedronGeometry(1, 2), rp = rg.attributes.position, v = V(0, 0, 0);
  for (let i = 0; i < rp.count; i++) {
    v.fromBufferAttribute(rp, i);
    const k = 1 + 0.35 * (vnoise(v.x * 1.7 + 4, v.y * 1.7 + v.z * 1.3) - 0.5) * 2 + 0.12 * (vnoise(v.x * 5, v.z * 5 + v.y) - 0.5);
    rp.setXYZ(i, v.x * k, v.y * k * 0.8, v.z * k);
  }
  const rgf = rg.index ? rg.toNonIndexed() : rg; rgf.computeVertexNormals();
  const NR = COARSE ? 900 : 2000;
  rocks = new THREE.InstancedMesh(rgf, groundMat, NR);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = V(1, 1, 1), e = new THREE.Euler();
  for (let i = 0; i < NR; i++) {
    let x, z;
    if (rnd() < 0.88) { const mt = MOUNTS[Math.floor(rnd() * MOUNTS.length)]; const a = rnd() * 6.283, rr = mt.r * Math.sqrt(rnd()) * 1.6; x = mt.x + Math.cos(a) * rr; z = mt.z + Math.sin(a) * rr; }
    else { x = rs(600); z = rs(1250); }

// ============================================================================ worlds
const WORLDS = {
  sea: { fog: [0.004, 0.022, 0.03], fogD: 0.0052, top: [0.022, 0.095, 0.115], sun: [0.03, 0.11, 0.12], sunP: 18, hemi: [0x2f7484, 0x010203, 0.9], key: [0x7cc4d0, 2.6], rim: 1.3, env: ENV_SEA, shaft: [0.35, 0.8, 0.85], shaftA: 0.022, surf: 150 },
  ice: { fog: [0.0015, 0.026, 0.075], fogD: 0.0058, top: [0.02, 0.16, 0.42], sun: [0.03, 0.18, 0.42], sunP: 3, hemi: [0x2f86ff, 0x010309, 1.2], key: [0x8fd0ff, 1.2], rim: 0.6, env: ENV_ICE, shaft: [0.35, 0.75, 1.0], shaftA: 0.06, surf: 48 },
};
let world = 'sea';
const ICE_START = V(ICE.x, 0, 800);
const savedPos = { sea: null, ice: ICE_START.clone() };
function applyWorld(w) {
  if (w === world) return;
  savedPos[world] = subPos.clone();
  world = w;
  if (savedPos[w]) subPos.copy(savedPos[w]);
  const W = WORLDS[w];
  FOG.setRGB(...W.fog); scene.fog.color.copy(FOG); fogDU.value = W.fogD; scene.fog.density = W.fogD;
  iceMat.uniforms.uFog.value.copy(FOG);
  sky.material.uniforms.uTop.value.setRGB(...W.top); sky.material.uniforms.uSunC.value.setRGB(...W.sun); sky.material.uniforms.uSunP.value = W.sunP;
  hemi.color.setHex(W.hemi[0]); hemi.groundColor.setHex(W.hemi[1]); hemi.intensity = W.hemi[2];
  key.color.setHex(W.key[0]); key.intensity = W.key[1]; rim.intensity = W.rim;
  scene.environment = W.env;
  shaftMat.uniforms.uCol.value.setRGB(...W.shaft); shaftMat.uniforms.uA.value = W.shaftA;
  for (const o of [seabed, rocks, wreck]) o.visible = w === 'sea';
  for (const o of [iceSheet, rubble]) o.visible = w === 'ice';
  for (const sh of shafts) sh.userData.p = null;
  blips.length = 0; lastBottom = null;
  for (const pv of pingU.value) pv.w = -1e4;
}
const seaSub = () => (world === 'sea' ? subPos : savedPos.sea || subPos);
// ============================================================================ cinematography
// A sequence of slow shots, cut through black. Drag to take the camera; let go for a while and the
// film resumes.
const subAxisPoint = (p) => V(subPos.x, subPos.y, clamp(p.z, subPos.z - L / 2, subPos.z + L / 2));
const SHOTS = [
  { name: 'ABEAM', dur: 15, fov: 30, init(s) {}, cam(t, s) { return { p: subPos.clone().add(V(-84 + t * 0.5, 7 - t * 0.25, -24 + t * 1.8)), l: subPos.clone().add(V(0, 1, -8 + t * 0.5)) }; } },
  { name: 'BOW ARRAY', dur: 12, fov: 32, pingAt: 2.5, cam(t) { return { p: subPos.clone().add(V(26 - t * 0.4, -5 + t * 0.12, -84 + t * 0.9)), l: subPos.clone().add(V(0, -0.5, -38 - t * 0.3)) }; } },
  { name: 'UNDER THE KEEL', dur: 19, fov: 46, init(s) { s.a = subPos.clone().add(V(32, 0, -72)); s.a.y = heightAt(s.a.x, s.a.z) + 3.2; }, cam(t, s) { return { p: s.a.clone().add(V(0, t * 0.05, 0)), l: subPos.clone().add(V(0, 0, -18 + t * 1.2)) }; } },
  { name: 'THE SAND', dur: 16, fov: 38, pingAt: 4, init(s) { s.a = subPos.clone().add(V(14, 0, -150)); s.a.y = heightAt(s.a.x, s.a.z) + 1.6; s.f = s.a.clone().add(V(-2, 0, 9)); s.f.y = heightAt(s.f.x, s.f.z); }, cam(t, s) { return { p: s.a.clone().add(V(-t * 0.15, t * 0.02, t * 0.35)), l: s.a.clone().add(V(-5, -1.2 + ease((t - 8) / 8) * 26, 40)) }; }, focus(s) { return s.f; } },
  { name: 'TRAILING', dur: 15, fov: 42, pingAt: 2, cam(t) { return { p: subPos.clone().add(V(22 - t * 0.3, 24 + t * 0.2, 92 - t * 0.5)), l: subPos.clone().add(V(0, -18, -110)) }; } },
  { name: 'UNDER THE ICE', world: 'ice', dur: 17, fov: 54, cam(t) { return { p: subPos.clone().add(V(38 - t * 0.4, -64 + t * 0.5, 74 - t * 1.4)), l: subPos.clone().add(V(-4, 24, -34 + t * 0.6)) }; } },
  { name: 'KEELS', world: 'ice', dur: 15, fov: 40, init(s) { s.a = subPos.clone().add(V(-34, 0, -100)); s.a.y = Math.min(iceY(s.a.x, s.a.z) - 7, 30); }, cam(t, s) { return { p: s.a.clone().add(V(t * 0.3, -t * 0.12, t * 0.4)), l: subPos.clone().add(V(0, 3, -12 + t * 0.8)) }; } },
  { name: 'ICE ECHO', world: 'ice', dur: 15, fov: 36, pingAt: 2, cam(t) { return { p: subPos.clone().add(V(-72 + t * 0.6, -16 + t * 0.2, -30 + t * 1.3)), l: subPos.clone().add(V(0, 14, -24)) }; } },
  { name: 'THE WRECK', dur: 16, fov: 42, when() { return Math.abs(seaSub().z - WRECK.z) < 230; }, init(s) { const w = V(WRECK.x, WRECK.base, WRECK.z); s.a = w.clone().add(V(30, 0, 24)); s.a.y = heightAt(s.a.x, s.a.z) + 3; s.w = w; }, cam(t, s) { return { p: s.a.clone().add(V(-t * 0.6, t * 0.12, -t * 0.3)), l: s.w.clone().add(V(0, 1.5, 0)).lerp(subPos, ease((t - 7) / 9) * 0.45) }; } },
  { name: 'HIGH', dur: 14, fov: 40, cam(t) { return { p: subPos.clone().add(V(-30 + t * 0.6, 48 - t * 0.3, 20 + t * 0.6)), l: subPos.clone().add(V(0, -6, -6)) }; } },
];
let shotIdx = 0, shotT = 0, shotState = {}, mode = 'cinema', idleT = 0, cutFade = 0;
function nextShot(first = false) {
  if (!first) shotIdx = (shotIdx + 1) % SHOTS.length;
  while (SHOTS[shotIdx].when && !SHOTS[shotIdx].when()) shotIdx = (shotIdx + 1) % SHOTS.length;
  applyWorld(SHOTS[shotIdx].world || 'sea');
  shotT = 0; shotState = {}; SHOTS[shotIdx].init?.(shotState); SHOTS[shotIdx].pinged = false;
  document.getElementById('shotname').textContent = `${String(shotIdx + 1).padStart(2, '0')} · ${SHOTS[shotIdx].name}`;
}
if (SHOT && Q.has('s')) shotIdx = +Q.get('s');
if (Q.has('ice')) shotIdx = SHOTS.findIndex((x) => x.world === 'ice');
nextShot(true);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.enabled = false;
controls.minDistance = 20; controls.maxDistance = 320; controls.enablePan = false; controls.maxPolarAngle = Math.PI * 0.75;
let fovNow = 40;

// ============================================================================ interaction + words
const capEl = document.getElementById('caption'), hintEl = document.getElementById('hint'), startEl = document.getElementById('start');
let capTimer = 0, contactSaid = false;
function say(a, b) { capEl.style.opacity = 0; clearTimeout(capTimer); capTimer = setTimeout(() => { capEl.innerHTML = `${a}<small>${b}</small>`; capEl.style.opacity = 1; clearTimeout(capEl._h); capEl._h = setTimeout(() => { capEl.style.opacity = 0; }, 9000); }, 900); }
hintEl.innerHTML = COARSE ? '<b>Drag</b> to take the camera · <b>Tap</b> to ping' : '<b>Drag</b> to take the camera · <b>Click</b> or <b>Space</b> to ping · <b>I</b> for the ice';
let started = SHOT, startT = 0, nextAuto = 0, lastPing = -99;
function begin() { if (started) return; started = true; startT = clockT; startEl.classList.add('gone'); sound.start(); nextAuto = clockT + 3.5; }
startEl.addEventListener('click', begin);
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (mode === 'cinema') { mode = 'orbit'; controls.enabled = true; controls.target.copy(subPos); camera.fov = fovNow = 40; camera.updateProjectionMatrix(); }
  idleT = 0;
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 350 && started) userPing();
  down = null; idleT = 0;
});
renderer.domElement.addEventListener('wheel', () => { idleT = 0; if (mode === 'cinema') { mode = 'orbit'; controls.enabled = true; controls.target.copy(subPos); } });
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!started) begin(); else userPing(); }
  if (e.code === 'KeyI') {   // jump between the open sea and the ice
    mode = 'cinema'; controls.enabled = false; idleT = 0;
    shotIdx = world === 'ice' ? 0 : SHOTS.findIndex((x) => x.world === 'ice');
    nextShot(true);
  }
});
function userPing() { if (clockT - lastPing < 1.2) return; ping(); nextAuto = clockT + 10; }

// ============================================================================ loop
const clock = new THREE.Clock();
let clockT = 0, flashT = -99, lastCaption = 0;
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  depthRT.setSize(Math.ceil(innerWidth * DPR), Math.ceil(innerHeight * DPR));
  refract.uniforms.uAsp.value = innerWidth / innerHeight;
  dof.uniforms.uRes.value.set(innerWidth * DPR, innerHeight * DPR);
  const asp = innerWidth / innerHeight;
  film.uniforms.uAsp.value = asp;
  const box = asp > 1.3 ? Math.min(1, asp / 2.39) : 1;
  film.uniforms.uBox.value = box;
  document.documentElement.style.setProperty('--lb', `${(1 - box) * innerHeight / 2 * 2}px`);
  snow.material.uniforms.uScale.value = innerHeight * DPR / (2 * Math.tan(camera.fov * Math.PI / 360));
}
addEventListener('resize', resize); resize();
if (SHOT && Q.has('z')) { subPos.z = +Q.get('z'); shotIdx = +(Q.get('s') || 0); nextShot(true); }
if (SHOT) { const t = +(Q.get("t") || 4); clockT = 0; if (!Q.has("noping")) ping(); nextAuto = 1e9; clockT = t; shotT = +(Q.get('st') || 4); }

const hidden = [sky, snow, ...shafts];
if (Q.has('noshafts')) shafts.forEach((m) => scene.remove(m));
if (Q.has('nosnow')) scene.remove(snow);
if (Q.has('norefract')) refract.enabled = false;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  clockT += dt; timeU.value = clockT;

  // the boat makes way
  const prev = subPos.clone();
  subPos.z -= SPEED * dt;
  if (subPos.z < -1000) subPos.copy(world === 'ice' ? ICE_START : SUB0);
  subPos.y = Math.sin(clockT * 0.05) * 1.2;
  const delta = subPos.clone().sub(prev);
  sub.position.copy(subPos);
  sub.rotation.x = Math.sin(clockT * 0.11) * 0.008;
  sub.rotation.z = Math.sin(clockT * 0.07 + 1) * 0.01;

  // camera
  let focusTarget = subPos;
  if (mode === 'cinema') {
    shotT += dt;
    const S = SHOTS[shotIdx];
    if (shotT > S.dur) nextShot();
    const S2 = SHOTS[shotIdx];
    const { p, l } = S2.cam(shotT, shotState);
    camera.position.copy(p);
    // a slow, heavy handheld drift
    camera.position.x += Math.sin(clockT * 0.37) * 0.25; camera.position.y += Math.sin(clockT * 0.29 + 1) * 0.18;
    camera.lookAt(l);
    fovNow = S2.fov; camera.fov = innerWidth < innerHeight ? fovNow * 1.5 : fovNow; camera.updateProjectionMatrix();
    if (S2.pingAt && !S2.pinged && shotT > S2.pingAt && started && clockT - lastPing > 3) { S2.pinged = true; ping(); nextAuto = clockT + 8.5; }
    cutFade = Math.max(1 - shotT / 0.7, 1 - (S2.dur - shotT) / 0.6, 0);
    if (S2.name === 'THE WRECK') focusTarget = V(WRECK.x, WRECK.base + 2, WRECK.z - 10);
    if (S2.focus) focusTarget = S2.focus(shotState);
  } else {
    camera.position.add(delta);
    controls.target.copy(subPos);
    controls.update();
    idleT += dt;
    cutFade = 0;
    if (idleT > 25) { mode = 'cinema'; controls.enabled = false; nextShot(); }
  }
  if (world === 'ice') { const ceil = iceY(camera.position.x, camera.position.z) - 3; if (camera.position.y > ceil) camera.position.y = ceil; }
  else { const floorY = heightAt(camera.position.x, camera.position.z) + 2.5; if (camera.position.y < floorY) camera.position.y = floorY; }
  sky.position.copy(camera.position);
  // shafts stay anchored in the water and recycle ahead of the boat
  for (const s of shafts) {
    if (!s.userData.p || s.userData.p.z - subPos.z > 300) s.userData.p = V(subPos.x + s.userData.off.x, world === 'ice' ? -76 : s.userData.off.y, subPos.z - 260 + s.userData.off.z);
    s.position.copy(s.userData.p);
  }
  key.position.copy(subPos).add(V(30, 120, 20)); key.target.position.copy(subPos);
  rim.position.copy(subPos).add(V(-20, 60, 140)); rim.target.position.copy(subPos);

  // pings
  if (started && clockT > nextAuto) { ping(); nextAuto = clockT + 8.5; }
  const fa = clockT - flashT;
  flash.position.copy(subPos).add(V(0, -2, -L / 2 - 5));
  flash.intensity = fa >= 0 && fa < 2 ? 320 * Math.exp(-fa * 3.2) : 0;

  // focus: the nearest point on the boat's axis (or the shot's subject)
  const fp = focusTarget === subPos ? subAxisPoint(camera.position) : focusTarget;
  const fd = camera.position.distanceTo(fp);
  dof.uniforms.uFocus.value = lerp(dof.uniforms.uFocus.value, fd, 1 - Math.pow(0.02, dt));
  dof.uniforms.uAp.value = 0.9;

  // words
  if (started && lastCaption === 0 && clockT - startT > 5) { lastCaption = 1; say('One hundred fifty metres down, it is too dark to see. So the boat listens.', 'Active sonar · sound slowed twenty-one times'); }
  if (started && clockT - startT > 20) hintEl.style.opacity = 0;
  const intro = 1 - ease((clockT - startT - 0.3) / 3);
  document.getElementById('fade').style.opacity = Math.max(started ? intro : 1, ease(cutFade)) * (SHOT ? 0 : 1);

  drawScope();
  // depth prepass for DOF
  for (const o of hidden) o.userData.v = o.visible, o.visible = false;
  scene.overrideMaterial = depthOnly;
  renderer.setRenderTarget(depthRT); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null; renderer.setRenderTarget(null);
  for (const o of hidden) o.visible = o.userData.v;
  camera.updateMatrixWorld();
  refract.uniforms.uCam.value.copy(camera.position);
  refract.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse);
  refract.uniforms.uCamWorld.value.copy(camera.matrixWorld);
  refract.uniforms.uView.value.copy(camera.matrixWorldInverse);

  film.uniforms.uT.value = clockT;
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
