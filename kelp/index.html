<script type="module">
import * as THREE from 'three';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
const blob = (detail) => { const g = new THREE.IcosahedronGeometry(1, detail); g.deleteAttribute('uv'); g.deleteAttribute('normal'); return mergeVertices(g); };

// ============================================================================ constants
// Metres. Sea surface at y = 0; the diver rises along the y axis at x = z = 0 facing +x.
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot');
if (SHOT) document.body.classList.add('shot');
const CAPTURE = Q.has('capture');
if (CAPTURE) document.body.classList.add('capture');
const CLOSE = Q.has('close');                      // debug: camera right next to the diver
const COARSE = matchMedia('(pointer: coarse)').matches;
const FLOOR = -44;
const START_HIP = Q.has('depth') ? -(+Q.get('depth')) - 0.73 : -40.5;
const VFOV = 50;
const RISE = Q.has('rise') ? +Q.get('rise') : 1;
const CUR = new THREE.Vector3(1, 0, 0.35).normalize();          // slow along-shore current
const SURGE = new THREE.Vector3(0.8, 0, -0.6).normalize();       // back-and-forth swell surge
const SPERP = new THREE.Vector3(-SURGE.z, 0, SURGE.x);

// Sun 40° above the horizon in air; under water it is bent toward the zenith (Snell).
const SUN_AZ = new THREE.Vector2(0.85, -0.53).normalize();
const SUN_EL = THREE.MathUtils.degToRad(40);
const SUN_A = new THREE.Vector3(SUN_AZ.x * Math.cos(SUN_EL), Math.sin(SUN_EL), SUN_AZ.y * Math.cos(SUN_EL));
const thW = Math.asin(Math.cos(SUN_EL) / 1.333);
const SUN_W = new THREE.Vector3(SUN_AZ.x * Math.sin(thW), Math.cos(thW), SUN_AZ.y * Math.sin(thW));

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT });
const DPR = Math.min(window.devicePixelRatio || 1, COARSE ? 1.4 : 1.6);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(VFOV, innerWidth / innerHeight, 0.05, 900);
camera.layers.enable(2);

// ============================================================================ deterministic helpers (JS mirror of the GLSL noise)
const fract = (x) => x - Math.floor(x);
function hash12(x, y) {
  let a = fract(x * 0.1031), b = fract(y * 0.1031), c = fract(x * 0.1031);
  const d = a * (b + 33.33) + b * (c + 33.33) + c * (a + 33.33); a += d; b += d; c += d;
  return fract((a + b) * c);
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash12(ix, iy), b = hash12(ix + 1, iy), c = hash12(ix, iy + 1), d = hash12(ix + 1, iy + 1);
  return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fy;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const canopyNoise = (x, z) => vnoise(x * 0.045, z * 0.045) * 0.6 + vnoise(x * 0.11 + 7, z * 0.11 + 7) * 0.28 + vnoise(x * 0.37 + 3, z * 0.37 + 3) * 0.12;
const canopyCov = (x, z) => smooth(0.5, 0.62, canopyNoise(x, z)) * smooth(5, 13, Math.hypot(x, z));
const floorY = (x, z) => FLOOR + (vnoise(x * 0.06, z * 0.06) - 0.5) * 3.2 + (vnoise(x * 0.21 + 5, z * 0.21) - 0.5) * 0.8;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(1607);
const v3 = (v) => `vec3(${v.x.toFixed(5)}, ${v.y.toFixed(5)}, ${v.z.toFixed(5)})`;

// ============================================================================ light textures
// Caustic network, rendered each frame into a tileable texture (R: surface net, G/B: broad focusing for the shafts)
const causRT = new THREE.WebGLRenderTarget(512, 512, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, depthBuffer: false });
// Floating canopy coverage, baked once: 160 m square around the ascent line
const CAN_N = 512, CAN_SPAN = 160;
const canopyTex = (() => {
  const d = new Uint8Array(CAN_N * CAN_N * 4);
  for (let j = 0; j < CAN_N; j++) for (let i = 0; i < CAN_N; i++) {
    const x = (i / CAN_N - 0.5) * CAN_SPAN, z = (j / CAN_N - 0.5) * CAN_SPAN;
    const k = (j * CAN_N + i) * 4;
    d[k] = Math.round(canopyCov(x, z) * 255); d[k + 3] = 255;
  }
  const t = new THREE.DataTexture(d, CAN_N, CAN_N, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; t.needsUpdate = true;
  return t;
})();
// Sun shadow map (kelp + diver), orthographic along the refracted sun
const SH_RES = COARSE ? 1024 : 2048, SH_R = 24, SH_FAR = 60;
const shadowRT = new THREE.WebGLRenderTarget(SH_RES, SH_RES, { depthTexture: new THREE.DepthTexture(SH_RES, SH_RES, THREE.FloatType), depthBuffer: true });
const shadowCam = new THREE.OrthographicCamera(-SH_R, SH_R, SH_R, -SH_R, 0.5, SH_FAR);
shadowCam.layers.set(1);

const U = {
  uTime: { value: 0 },
  uEyeY: { value: -20 },
  tCaus: { value: causRT.texture },
  tCanopy: { value: canopyTex },
  tShadow: { value: shadowRT.depthTexture },
  uShadowMat: { value: new THREE.Matrix4() },
  uShadowOn: { value: 0 },
  uShRange: { value: 60 },
  uRip: { value: new THREE.Vector4(0, 0, -100, 0) },
};

// ============================================================================ shared GLSL: water optics
const WATER = /* glsl */`
uniform float uTime;
uniform float uEyeY;
uniform sampler2D tCaus;
uniform sampler2D tCanopy;
#define TAU 6.2831853
#define SUN_W ${v3(SUN_W)}
#define SUN_A ${v3(SUN_A)}
#define CUR_V ${v3(CUR)}
#define SURGE_V ${v3(SURGE)}
#define SPERP_V ${v3(SPERP)}
// clear blue-teal Pacific water over a kelp bed: blue carries furthest, green nearly as far, red fades over the
// first ten metres (gentler than raw physics: a diver's camera white-balances some of the red back)
#define KD vec3(0.22, 0.062, 0.046)
#define SIG vec3(0.27, 0.078, 0.056)
#define SUNC vec3(3.5, 3.25, 2.85)
#define SKYC vec3(0.85, 1.25, 1.85)
#define WATC vec3(0.025, 0.30, 0.58)
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float canopyCov(vec2 q){ return texture2D(tCanopy, q / ${CAN_SPAN.toFixed(1)} + 0.5).r; }
float canopyT(vec2 q){ return 1.0 - 0.9 * canopyCov(q); }
vec2 surfPt(vec3 P){ return P.xz + SUN_W.xz * (max(-P.y, 0.0) / SUN_W.y); }
// caustic texture holds raw/1.2; x8.05 normalises the mean to 1
vec3 causTex(vec2 q, float lod){ return textureLod(tCaus, q / TAU, lod).rgb * 9.66; }
vec3 sunAtten(vec3 P){ return SUNC * exp(-KD * max(-P.y, 0.0) / SUN_W.y); }
vec3 ambE(vec3 P, vec3 N){
  float d = max(-P.y, 0.0);
  vec3 dn = SKYC * 0.55 * exp(-KD * d);
  vec3 up = SKYC * 0.55 * exp(-KD * (d + 2.5)) * vec3(0.10, 0.30, 0.34);
  return mix(up, dn, 0.5 + 0.5 * N.y);
}
vec3 waterIns(float d, vec3 v){
  return WATC * 0.30 * exp(-KD * d) * (0.25 + 0.75 * smoothstep(-0.7, 1.0, v.y));
}
// scene colour is stored range-compressed so the MSAA resolve averages perceptually (no blown, jagged edges against the bright surface)
vec4 enc(vec3 c){ c = max(c, 0.0); return vec4(c / (1.0 + max(c.r, max(c.g, c.b))), 1.0); }
vec3 dec(vec3 e){ e = min(e, vec3(0.97)); return e / (1.0 - max(e.r, max(e.g, e.b))); }
vec3 applyWater(vec3 col, vec3 P){
  vec3 V = P - cameraPosition; float dist = length(V); V /= dist;
  float dm = max(-uEyeY - V.y * min(dist, 12.0) * 0.5, 0.0);
  vec3 T = exp(-SIG * dist);
  return col * T + waterIns(dm, V) * (1.0 - T);
}
vec3 skyAir(vec3 r){
  vec3 sky = mix(vec3(1.0, 1.1, 1.18), vec3(0.30, 0.55, 1.05), pow(max(r.y, 0.0), 0.6)) * 1.25;
  float sd = max(dot(r, SUN_A), 0.0);
  sky += vec3(1.0, 0.92, 0.8) * (pow(sd, 900.0) * 900.0 + pow(sd, 60.0) * 6.0 + pow(sd, 6.0) * 0.8);
  return sky;
}
vec3 envCol(vec3 d, vec3 P){
  float dep = max(-P.y, 0.0);
  vec3 c = waterIns(dep, d);
  if (d.y > 0.0) {
    float win = smoothstep(0.63, 0.70, d.y);
    float sd = max(dot(d, SUN_W), 0.0);
    vec3 w = (SKYC * 1.3 + SUNC * (pow(sd, 200.0) * 30.0 + pow(sd, 12.0) * 1.2)) * exp(-SIG * dep / max(d.y, 0.25));
    c += w * win;
  }
  return c;
}
// water motion: every kelp point is displaced by the same surge field, lagging with height
float surgePh(vec3 P, float ps){ return uTime * 0.52 + ps - P.y * 0.07 + dot(P.xz, vec2(0.025, -0.02)); }
vec3 swayDisp(vec3 P, float w, float ps){
  float ph = surgePh(P, ps);
  float a = sin(ph) * 0.85 + sin(uTime * 0.29 + ps * 1.7 - P.y * 0.05) * 0.35;
  float b = sin(uTime * 0.41 + ps * 2.3 - P.y * 0.06);
  vec3 d = (SURGE_V * a + SPERP_V * b * 0.35) * w * 1.05;
  d.y -= dot(d, d) * 0.12;
  return d;
}
vec3 flowDir(vec3 P, float ps){
  float ph = surgePh(P, ps);
  return CUR_V * 0.30 + SURGE_V * cos(ph) * 0.42 + vec3(0.0, 0.34, 0.0);
}
`;
// fragment-only: shadows and lit irradiance
const LIGHT = /* glsl */`
#ifndef SH_TAPS
#define SH_TAPS 8
#endif
uniform sampler2D tShadow;
uniform mat4 uShadowMat;
uniform float uShadowOn;
uniform float uShRange;
float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
const vec2 PD[8] = vec2[8](vec2(-0.613, 0.354), vec2(0.171, -0.887), vec2(0.787, 0.501), vec2(-0.296, -0.231),
                            vec2(0.448, -0.343), vec2(-0.871, -0.385), vec2(0.040, 0.705), vec2(0.952, -0.058));
float shadowAt(vec3 P, float soft){
  if (uShadowOn < 0.5) return 1.0;
  vec3 s = (uShadowMat * vec4(P, 1.0)).xyz;
  if (s.x <= 0.0 || s.x >= 1.0 || s.y <= 0.0 || s.y >= 1.0 || s.z >= 1.0) return 1.0;
  float occ = texture2D(tShadow, s.xy).r;
  float dist = max(s.z - occ, 0.0) * uShRange;                    // metres from blocker to receiver
  float pen = (0.0005 + dist * 0.0005) * soft;                    // soft, widening penumbra (sun disk + forward scatter)
#ifdef SH_STABLE
  const mat2 R = mat2(1.0, 0.0, 0.0, 1.0);                         // fixed pattern: smooth, no per-pixel speckle
#else
  float a = ign(gl_FragCoord.xy) * TAU;
  mat2 R = mat2(cos(a), sin(a), -sin(a), cos(a));
#endif
  float sum = 0.0;
  // soft depth compare: a tap that only grazes a blocker counts partly, so dense thin fronds don't speckle
  for (int i = 0; i < SH_TAPS; i++) sum += smoothstep(-0.0012, 0.0006, texture2D(tShadow, s.xy + R * PD[i] * pen).r - s.z + 0.0009);
  return mix(0.14, 1.0, sum / float(SH_TAPS));
}
float causK(float d){ return 0.12 + 0.88 * exp(-d / 11.0); }
float causLod(float d){ return log2(1.0 + d * 0.55); }
vec3 sunE(vec3 P, float sh){
  vec2 q = surfPt(P); float d = max(-P.y, 0.0);
  float c = causTex(q * 1.15, causLod(d)).r;
  return sunAtten(P) * canopyT(q) * mix(1.0, c, causK(d)) * sh;
}
// dispersion: each wavelength refracts a hair differently, so caustic lines split into colour fringes
vec3 sunERGB(vec3 P, float sh){
  vec2 q = surfPt(P); float d = max(-P.y, 0.0); float k = causK(d), l = causLod(d);
  vec2 dsp = SUN_W.xz * (0.004 + d * 0.003);
  vec3 c = vec3(causTex((q - dsp) * 1.15, l).r, causTex(q * 1.15, l).r, causTex((q + dsp) * 1.15, l).r);
  return sunAtten(P) * canopyT(q) * mix(vec3(1.0), c, k) * sh;
}
`;

// ============================================================================ caustic generator pass
const quadGeo = new THREE.BufferGeometry();
quadGeo.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const QV = `varying vec2 vUv; void main(){ vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const pass = (mat) => { const s = new THREE.Scene(); const m = new THREE.Mesh(quadGeo, mat); m.frustumCulled = false; s.add(m); return s; };
const causMat = new THREE.ShaderMaterial({
  uniforms: { uT: { value: 0 } },
  vertexShader: QV,
  fragmentShader: /* glsl */`
  uniform float uT; varying vec2 vUv;
  // tileable iterative caustic (after Dave Hoskins / joltz0r)
  float caus(vec2 uv, float t){
    vec2 p = uv * 6.2831853 - 250.0; vec2 i = p; float c = 1.0;
    for (int n = 0; n < 5; n++) {
      float tt = t * (1.0 - (3.5 / float(n + 1)));
      i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
      c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005)));
    }
    c /= 5.0; c = 1.17 - pow(c, 1.4);
    return pow(abs(c), 8.0);
  }
  void main(){
    gl_FragColor = vec4(caus(vUv, uT * 0.55 + 23.0), caus(vUv, uT * 0.30 + 11.0), caus(vUv, uT * 0.19 + 31.0), 1.0) / 1.2;
  }`,
  depthWrite: false, depthTest: false,
});
const causScene = pass(causMat);

// ============================================================================ water body + surface
const bgMat = new THREE.ShaderMaterial({
  uniforms: { ...U },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: WATER + `varying vec3 vDir;
  void main(){ vec3 d = normalize(vDir); float dep = max(-uEyeY - d.y * 6.0, 0.0); gl_FragColor = enc(waterIns(dep, d)); }`,
  side: THREE.BackSide, depthWrite: false,
});
const bg = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), bgMat);
bg.renderOrder = -10; bg.frustumCulled = false;
scene.add(bg);

const surfMat = new THREE.ShaderMaterial({
  uniforms: { ...U, tRefl: { value: null }, uReflMat: { value: new THREE.Matrix4() }, uReflOn: { value: 0 } },
  vertexShader: `varying vec3 vP; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: WATER + /* glsl */`
  uniform vec4 uRip;
  uniform sampler2D tRefl; uniform mat4 uReflMat; uniform float uReflOn;
  varying vec3 vP;
  vec2 waveGrad(vec2 p, float t){
    vec2 g = vec2(0.0);
    vec3 W[7];
    W[0] = vec3(0.30, 6.5, 0.007); W[1] = vec3(-0.45, 3.4, 0.010); W[2] = vec3(1.20, 2.2, 0.016);
    W[3] = vec3(2.40, 1.3, 0.024); W[4] = vec3(-1.80, 0.85, 0.022); W[5] = vec3(0.90, 0.55, 0.020); W[6] = vec3(-2.7, 0.37, 0.018);
    for (int i = 0; i < 7; i++) {
      vec2 dir = vec2(cos(W[i].x), sin(W[i].x)); float k = TAU / W[i].y; float w = sqrt(9.81 * k);
      g += dir * W[i].z * cos(dot(dir, p) * k - w * t);
    }
    g += (vec2(vnoise(p * 3.1 + t * 0.7), vnoise(p.yx * 3.1 - t * 0.6)) - 0.5) * 0.03;
    float age = t - uRip.z;
    if (age > 0.0 && age < 12.0) {
      vec2 dv = p - uRip.xy; float r = length(dv) + 1e-3;
      float env = exp(-pow((r - age * 0.9) / (0.35 + age * 0.25), 2.0)) * exp(-age * 0.28) * uRip.w;
      g += dv / r * env * 0.12 * sin(r * 11.0 - age * 9.0);
    }
    return g;
  }

  const wf = actx.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 700; wf.Q.value = 0.6;
  washGain = actx.createGain(); washGain.gain.value = 0;
  wash.connect(wf).connect(washGain).connect(master); wash.start();
}
function bubbleSound(n) {
  if (!actx || !soundOn) return;
  const t0 = actx.currentTime;
  for (let k = 0; k < n; k++) {
    const t = t0 + Math.random() * 0.9, f = 300 + Math.random() * 900;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.8, t + 0.06);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.1);
  }
}
sndBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
sndBtn.addEventListener('click', (e) => {
  e.stopPropagation(); soundOn = !soundOn; initAudio();
  if (master) master.gain.setTargetAtTime(soundOn ? 0.9 : 0, actx.currentTime, 0.05);
  sndBtn.textContent = soundOn ? 'sound off' : 'sound on';
});

// ============================================================================ simulation
// Bifin ascent: slow, long kicks driven from the hips, knees bending late in the up-kick,
// fins flexing hard behind the foot. Kicks fade out ~9 m and the diver glides the last metres on buoyancy.
const D = { t: 0, y: START_HIP, v: 0.95, phi: 0.6, amp: 1, surf: -1, look: 0.06, exhaled: false, fade: 0, bubQ: 0, cycle: 0 };
const CAM = { p: new THREE.Vector3(), t: new THREE.Vector3(), init: false, yaw: 0, yawT: 0, pitchOff: 0, pitchOffT: 0, zoom: 1, zoomT: 1 };
if (Q.has('zoom')) CAM.zoom = CAM.zoomT = +Q.get('zoom');          // e.g. ?zoom=1.5 for a wider recording
// The kick is a wave that starts at the hip: the thigh leads, the shin trails it (so the knee bends
// passively at the start of each down-kick and snaps straight at the end), the foot trails the shin,
// and the fin (spring model below) trails the foot. Angles are absolute segment angles; joints are differences.
const smax = (x, k) => 0.5 * (x + Math.sqrt(x * x + k * k));
const legAng = (p, amp) => {
  const thigh = -0.31 * amp * Math.sin(p) - 0.03 * amp;
  const shin = -0.36 * amp * Math.sin(p - 0.7) - 0.03 * amp;
  const foot = -0.38 * amp * Math.sin(p - 1.3) - 0.03 * amp;
  const knee = 0.035 + smax(shin - thigh + 0.08 * amp, 0.17);
  const ankle = 0.04 + (foot - (thigh + knee)) * 0.75;
  return { hip: thigh, knee, ankle };
};
function footTipZ(a) {
  // z of a point 0.45 m down the fin, in pelvis space, for the fluid-lag model
  const h = a.hip, k = h + a.knee, f = k + a.ankle + 0.42;
  return -(Math.sin(h) * 0.445 + Math.sin(k) * 0.415 + Math.sin(f) * 0.55);
}
function resetDive() {
  D.y = START_HIP; D.v = 0.95; D.surf = -1; D.exhaled = false; D.amp = 1; D.look = 0.06; D.cycle++;
  bub.r.fill(0); U.uRip.value.set(0, 0, -100, 0); CAM.init = false;
  for (const f of fins) { f.B1 = f.B1v = f.B2 = f.B2v = 0; f.prevTipZ = 0; }
}
function simStep(h) {
  D.t += h;
  const depth = Math.max(0, -(D.y + 0.73));
  if (D.surf < 0) {
    const ampT = smooth(5.0, 10.0, depth);
    D.amp += (ampT - D.amp) * (1 - Math.exp(-h / 2.2));
    D.phi += 2 * Math.PI * (0.5 + 0.08 * D.amp) * h * (0.4 + 0.6 * smooth(0.02, 0.3, D.amp));
    // thrust peaks in the power phase of each leg (two per cycle), drag ~ v², buoyancy rises as the lungs re-expand
    const thrust = 1.3 * D.amp * (0.88 + 0.24 * Math.pow(Math.abs(Math.cos(D.phi - 0.25)), 2));
    const buoy = 0.05 + 0.32 * smooth(14, 1, depth);
    D.v += (thrust + buoy - 1.25 * D.v * Math.abs(D.v)) * h * 0.85;
    D.y += D.v * h * (RISE > 1 ? 1.6 + (RISE - 1.6) * smooth(0.5, 6, depth) : 1);   // ?rise=N: compressed ascent for video, eased back to real speed near the surface
    if (!D.exhaled && depth < 2.4) { D.exhaled = true; D.bubQ += 60; bubbleSound(18); }
    if (D.y + 0.86 > 0.04) { D.surf = D.t; U.uRip.value.set(0.12, 0, U.uTime.value, 1); }
  } else {
    D.amp += (0 - D.amp) * (1 - Math.exp(-h / 0.8));
    D.v += (-D.v) * (1 - Math.exp(-h / 0.6));
    D.y += D.v * h + (-0.66 - D.y) * (1 - Math.exp(-h / 1.5)) + Math.sin(D.t * 1.3) * 0.0004;
    D.phi += 2 * Math.PI * 0.25 * h;
  }
  // fins: two-mode damped springs driven by the blade's motion through the water
  [0, 1].forEach((k) => {
    const f = fins[k], a = legAng(D.phi + (k ? Math.PI : 0), D.amp);
    const tz = footTipZ(a), vz = (tz - f.prevTipZ) / h; f.prevTipZ = tz;
    const target = Math.max(-0.65, Math.min(0.65, 0.5 * vz));
    const w1 = 10, z1 = 0.65, w2 = 7, z2 = 0.55;
    f.B1v += (w1 * w1 * (target - f.B1) - 2 * z1 * w1 * f.B1v) * h; f.B1 += f.B1v * h;
    f.B2v += (w2 * w2 * (f.B1 - f.B2) - 2 * z2 * w2 * f.B2v) * h; f.B2 += f.B2v * h;
  });
}
function pose() {
  const p = D.phi, depth = Math.max(0, -(D.y + 0.73)), t = D.t;
  const amp = D.amp * (1 + 0.03 * Math.sin(t * 0.31));
  diver.position.set(0, D.y, 0);
  // the whole body rolls gently about its long axis with each kick (the hips drive it, the shoulders follow late),
  // plus a slight pitch on each power phase and a faint lateral flex
  // In sync with the legs: the left leg's down-kick is fastest at phi = 0, the right's at phi = pi.
  // The hip of the driving leg rolls forward into its kick (cos phi), the shoulders follow a beat later.
  // one smooth roll per kick cycle, small: the hips lead it, the body follows, nothing at double frequency
  const bodyRoll = -0.05 * Math.cos(p - 0.35) * amp;
  diver.rotation.y = Math.PI / 2 + bodyRoll;
  diver.rotation.x = 0.03;
  diver.rotation.z = 0.004 * Math.sin(t * 0.17);
  const roll = -0.03 * Math.cos(p - 0.1) * amp;
  bone.pelvis.rotation.set(0, roll, 0);
  bone.spine.rotation.set(0, -roll * 0.4, 0);
  bone.chest.rotation.set(0, -roll * 0.25, 0);
  const lookT = D.surf >= 0 ? -0.12 : depth < 5 ? -0.18 * smooth(5, 2, depth) : 0.04;
  D.look += (lookT - D.look) * 0.02;
  bone.neck.rotation.set(D.look * 0.45, -bodyRoll * 0.25 + roll * 0.15, 0);          // the head steadies a little against the roll
  bone.head.rotation.set(D.look * 0.55 + 0.006 * Math.sin(t * 0.6), 0.02 * Math.sin(t * 0.21), 0);
  [['L', 0], ['R', Math.PI]].forEach(([k, off]) => {
    const a = legAng(p + off, amp);
    bone['thigh' + k].rotation.set(a.hip, -roll * 0.6, 0);
    bone['shin' + k].rotation.set(a.knee, 0, 0);
    bone['foot' + k].rotation.set(a.ankle, 0, 0);
    bone['upper' + k].rotation.set(0, 0, 0);
    bone['fore' + k].rotation.set(0, 0, 0);
    bone['hand' + k].rotation.set(0, 0, 0);
  });
  bendFin(fins[0]); bendFin(fins[1]);
}

// ============================================================================ interaction
let drag = null;
const pts = new Map();
let pinch = null;
canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: CAM.zoomT }; drag = null;
  } else if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, yaw: CAM.yawT, pitch: CAM.pitchOffT, moved: 0 };
});
canvas.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    CAM.zoomT = THREE.MathUtils.clamp(pinch.z * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 0.3, 2.4);
    return;
  }
  if (!drag) return;
  drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
});
const endDrag = (e) => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (drag && pts.size === 0 && drag.moved < 6 && D.surf < 0) { D.bubQ += 46; bubbleSound(14); }
  if (pts.size === 0) drag = null;
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  CAM.zoomT = THREE.MathUtils.clamp(CAM.zoomT * Math.exp(e.deltaY * 0.0012), 0.3, 2.4);
}, { passive: false });

// ============================================================================ frame
const depthEl = document.getElementById('depthv');
const _tgt = new THREE.Vector3(), _cp = new THREE.Vector3(), _rt = new THREE.Vector3(), _ru = new THREE.Vector3();
let last = 0, acc = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000 || 0.016); last = now;
  tick(dt);
  adaptRes(dt);
  requestAnimationFrame(frame);
}
function tick(dt, draw = true) {
  acc += dt;
  const nSub = Math.max(1, Math.ceil(dt / STEP)); for (let i = 0; i < nSub; i++) simStep(dt / nSub);
  const t = D.t;
  U.uTime.value = t;
  causMat.uniforms.uT.value = t;
  pose();
  const since = D.surf < 0 ? -1 : t - D.surf;
  if (since > 7.5) resetDive();
  const fadeT = since > 6 ? 0 : 1;
  D.fade += (fadeT - D.fade) * Math.min(1, dt * (fadeT ? 0.9 : 2.2));
  if (D.bubQ > 0) { const n = Math.min(D.bubQ, Math.ceil(dt * 70)); emitBubbles(n); D.bubQ -= n; }
  updateBubbles(dt);
  // ---- camera: a videographer finning alongside, a little below; stops ~4 m deep and tilts up as the diver surfaces
  const depth = Math.max(0, -(D.y + 0.73));
  const nearS = smooth(9, 1.5, depth);
  CAM.yaw += (CAM.yawT - CAM.yaw) * Math.min(1, dt * 3);
  CAM.pitchOff += (CAM.pitchOffT - CAM.pitchOff) * Math.min(1, dt * 3);
  CAM.zoom += (CAM.zoomT - CAM.zoom) * Math.min(1, dt * 5);
  _tgt.set(0, D.y - 0.25 + 0.45 * nearS + Math.max(0, 1 - CAM.zoom) * 1.3 + Math.max(0, CAM.zoom - 1) * 0.9 * (1 - nearS), 0);   // zooming in drifts toward the head and hands
  const az = 0.6 + CAM.yaw + 0.12 * Math.sin(t * 0.05), dist = view.dist * (1 - 0.18 * nearS) * CAM.zoom;
  const el = THREE.MathUtils.clamp(0.16 + 0.42 * nearS + CAM.pitchOff, -0.9, 1.35);
  _cp.set(Math.sin(az) * Math.cos(el) * dist, -Math.sin(el) * dist, Math.cos(az) * Math.cos(el) * dist).add(_tgt);
  _cp.y = Math.min(_cp.y, -0.4 - 3.2 * Math.min(1, CAM.zoom));
  if (CLOSE) { const cy = +(Q.get('close') || 0.1); const az = Q.has('az') ? +Q.get('az') : 0.6 + CAM.yaw; _tgt.set(0, D.y + cy, 0); const cd = +(Q.get('cd') || 1.3); _cp.set(Math.sin(az) * cd, D.y + cy - 0.15 * cd, Math.cos(az) * cd); }
  // handheld drift
  _cp.x += Math.sin(t * 0.31) * 0.04 + Math.sin(t * 0.73) * 0.015; _cp.y += Math.sin(t * 0.43) * 0.035; _cp.z += Math.sin(t * 0.27 + 1) * 0.03;
  if (!CAM.init || CLOSE) { CAM.p.copy(_cp); CAM.t.copy(_tgt); CAM.init = true; }
  const kp = 1 - Math.exp(-dt * RISE / 0.9), kt = 1 - Math.exp(-dt * RISE / 0.45);   // a compressed ascent needs a tighter follow
  CAM.p.lerp(_cp, kp); CAM.t.lerp(_tgt, kt);
  camera.position.copy(CAM.p); camera.lookAt(CAM.t);
  const camDepth = -camera.position.y;
  U.uEyeY.value = camera.position.y;
  compMat.uniforms.uExpo.value = 0.95 * Math.exp(0.02 * camDepth) * (0.68 + 0.32 * smooth(1, 9, camDepth));   // the clear shallows are bright: stop down so they stay blue, not milky
  { const k = smooth(1.5, 9, camDepth); compMat.uniforms.uWB.value.set(1 + 1.15 * k, 1, 1 - 0.05 * k); }   // auto white balance: more red lifted the deeper the camera
  compMat.uniforms.uNF.value.set(camera.near, camera.far);
  finalMat.uniforms.uTime.value = t; fxaaMat.uniforms.uTime.value = t; fxaaMat.uniforms.uFade.value = D.fade;
  depthEl.textContent = (since >= 0 ? '0.0' : depth.toFixed(1)) + ' m';
  if (washGain) washGain.gain.setTargetAtTime(0.02 + 0.22 * smooth(10, 0, camDepth), actx.currentTime, 0.3);
  if (draw) render(dt);
}

function render(dt) {
  camera.updateMatrixWorld();
  diver.updateMatrixWorld(true);
  // 1. caustic texture
  renderer.setRenderTarget(causRT); renderer.render(causScene, orthoCam);
  // 2. sun shadow map, texel-snapped around the view
  const C = _cp.copy(camera.position); camera.getWorldDirection(_rt); _rt.y = 0; _rt.normalize();
  C.addScaledVector(_rt, 9); C.y = Math.max(C.y, -40);
  const tex = 2 * SH_R / SH_RES;
  _rt.copy(SUN_W).negate(); _ru.crossVectors(_rt, up).normalize();             // light right
  const lu = new THREE.Vector3().crossVectors(_ru, _rt);
  const cr = C.dot(_ru), cu = C.dot(lu);
  C.addScaledVector(_ru, Math.round(cr / tex) * tex - cr).addScaledVector(lu, Math.round(cu / tex) * tex - cu);
  shadowCam.position.copy(C).addScaledVector(SUN_W, (-C.y + 1.5) / SUN_W.y);
  shadowCam.up.set(0, 1, 0); shadowCam.lookAt(C);
  const sy = shadowCam.position.y, yTop = Math.min(-0.02, camera.position.y + 13), yBot = camera.position.y - 9;
  shadowCam.near = Math.max(0.1, (sy - yTop) / SUN_W.y); shadowCam.far = (sy - yBot) / SUN_W.y;
  shadowCam.updateProjectionMatrix(); shadowCam.updateMatrixWorld();
  U.uShRange.value = shadowCam.far - shadowCam.near;
  U.uShadowMat.value.copy(_bias).multiply(shadowCam.projectionMatrix).multiply(shadowCam.matrixWorldInverse);
  if (!Q.has('nosh')) {
  for (const o of casters) { o.userData.mat = o.material; o.material = o.userData.depthMat; }
  U.uShadowOn.value = 0;
  renderer.setRenderTarget(shadowRT); renderer.clear(); renderer.render(scene, shadowCam);
  for (const o of casters) o.material = o.userData.mat;
  U.uShadowOn.value = 1;
  }
  // 3. mirror image for the underside of the surface
  const reflOn = camera.position.y > -16 && !Q.has('norefl');
  surfMat.uniforms.uReflOn.value = reflOn ? 1 : 0;
  if (reflOn) {
    reflCam.copy(camera); reflCam.layers.set(0);
    reflCam.position.set(camera.position.x, -camera.position.y, camera.position.z);
    camera.getWorldDirection(_rt); _rt.y = -_rt.y; _rt.add(reflCam.position);
    _ru.set(0, 1, 0).applyQuaternion(camera.quaternion); _ru.y = -_ru.y;
    reflCam.up.copy(_ru); reflCam.lookAt(_rt); reflCam.updateMatrixWorld();
    surfMat.uniforms.uReflMat.value.copy(_bias).multiply(reflCam.projectionMatrix).multiply(reflCam.matrixWorldInverse);
    surface.visible = false; snow.visible = false; bg.position.copy(reflCam.position);
    renderer.setRenderTarget(reflRT); renderer.render(scene, reflCam);
    surface.visible = true; snow.visible = true;
    surfMat.uniforms.tRefl.value = reflRT.texture;
  }
  bg.position.copy(camera.position);
  // 4. the scene
  renderer.setRenderTarget(sceneRT); renderer.setClearColor(0x000000, 1); renderer.render(scene, camera);
  // 5. light shafts
  shaftMat.uniforms.tDepth.value = sceneRT.depthTexture; shaftMat.uniforms.uFrame.value++;
  shaftMat.uniforms.uProjInv.value.copy(camera.projectionMatrixInverse);
  shaftMat.uniforms.uCamWorld.value.copy(camera.matrixWorld);
  if (!Q.has('noshaft')) { renderer.setRenderTarget(shaftRT); renderer.render(shaftScene, camera); }
  histMat.uniforms.tCur.value = shaftRT.texture; histMat.uniforms.tHist.value = shaftHist[histI].texture;
  renderer.setRenderTarget(shaftHist[1 - histI]); renderer.render(histScene, orthoCam); histI = 1 - histI;
  compMat.uniforms.tScene.value = sceneRT.texture; compMat.uniforms.tShaft.value = shaftHist[histI].texture; compMat.uniforms.tDepth.value = sceneRT.depthTexture;
  renderer.setRenderTarget(postRT); renderer.render(compScene, orthoCam);
  bloom.render(renderer, null, postRT, dt, false);
  finalMat.uniforms.tColor.value = postRT.texture;
  renderer.setRenderTarget(ldrRT); renderer.render(finalScene, orthoCam);
  renderer.setRenderTarget(null); renderer.render(fxaaScene, orthoCam);
}

if (!CAPTURE) requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); setTimeout(() => document.getElementById('loading').classList.add('done'), 350); });
else {
  let frames = 0;
  window.__frame = (i) => { while (frames < i) { tick(1 / 30, frames === i - 1); frames++; } return D.t; };
  window.__info = () => ({ depth: -(D.y + 0.73), surf: D.surf, t: D.t, verts: diverGeo.attributes.position.count, blades: tiers.map((T) => T.blades.misc.length / 4), meshes: bladeMeshes.length, load: performance.now() });
  window.__ready = true;
}
</script>
