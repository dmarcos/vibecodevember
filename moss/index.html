// A range building with real doorways, medial moulding, mansard frieze and an
// optional pierced roof comb. Local origin is on the floor; front faces +z.
function building(m, o) {
  const { w, d, h = 3.4, doors = 1, doorW = 1.5, doorH = 2.3, t = 0.75, col = PAL.stucco, fr = PAL.red, roof = 2.0, frieze = 'fret', wallF = 'wall', colonnade = false } = o;
  m.site(() => {
    m.box(0, -0.25, 0, w + 0.9, 0.25, d + 0.9, { c: col, solid: 1, t: 0.08 });
    m.box(0, 0, 0, w - 2 * t + 0.3, h + 0.2, d - 2 * t + 0.3, { c: PAL.dark, solid: 1, flat: 1, j: 0, noTop: true });
    // Walls, block by block so fractures have somewhere to happen.
    const seg = (cx, cz, ww, dd, hh, y = 0) => {
      const n = Math.max(1, Math.round(ww / 2.4)), bw = ww / n;
      const courses = Math.max(1, Math.round(hh / 1.2)), ch = hh / courses;
      for (let c = 0; c < courses; c++) for (let i = 0; i < n; i++) {
        m.box(cx - ww / 2 + bw * (i + 0.5), y + c * ch, cz, bw + 0.005, ch + 0.005, dd, { c: col, f: wallF, fp: 0.12 + c * 0.14, j: 0.012 });
      }
    };
    const sideSeg = (cx, dd, hh) => {
      const n = Math.max(1, Math.round(dd / 2.4)), bd = dd / n;
      for (let i = 0; i < n; i++) m.box(cx, 0, -dd / 2 + bd * (i + 0.5), t, hh, bd + 0.005, { c: col, f: wallF, fp: 0.16, j: 0.012 });
    };
    seg(0, -d / 2 + t / 2, w, t, h);
    sideSeg(-w / 2 + t / 2, d - 2 * t, h);
    sideSeg(w / 2 - t / 2, d - 2 * t, h);
    const solid = w - doors * doorW, pier = solid / (doors + 1);
    let x = -w / 2;
    for (let i = 0; i <= doors; i++) {
      seg(x + pier / 2, d / 2 - t / 2, pier, t, doorH);
      x += pier;
      if (i < doors) {
        const lintelStart = R(110, 420);
        m.whole('lintel', () => m.box(x + doorW / 2, doorH, d / 2 - t / 2, doorW + 0.5, 0.26, t * 0.98, { c: PAL.wood, mat: 2 }), lintelStart);
        if (colonnade) m.box(x + doorW / 2, 0, d / 2 - t / 2, 0.42, doorH, 0.42, { c: col, f: 'wall', fp: 0.25 });
        x += doorW;
      }
    }
    seg(0, d / 2 - t / 2, w, t, h - doorH - 0.26, doorH + 0.26);
    // Medial moulding.
    m.box(0, h, 0, w + 0.46, 0.14, d + 0.46, { c: fr, solid: 1, t: -0.04 });
    m.box(0, h + 0.14, 0, w + 0.62, 0.16, d + 0.62, { c: col, solid: 1, t: 0.08 });
    // Mansard frieze in sections, each with its own fate.
    const secs = Math.max(2, Math.round(w / 3.2)), sw = w / secs;
    for (let i = 0; i < secs; i++) {
      const left = i === 0 ? 0.55 : 0, right = i === secs - 1 ? 0.55 : 0;
      m.box(-w / 2 + sw * (i + 0.5), h + 0.3, 0, sw + 0.005, roof, d + 0.2, { c: fr, f: 'vault', fp: 0.32, t: [left, right, 0.55, 0.55], panel: { front: frieze, back: frieze } });
    }
    if (colonnade || o.colonnettes) {
      const n = Math.floor(w / 0.75);
      for (let i = 0; i < n; i++) m.box(-w / 2 + 0.38 + i * 0.75, h + 0.34, d / 2 + 0.11, 0.2, roof * 0.42, 0.2, { c: col, j: 0, f: 'vault', fp: 0.1 });
    }
    m.box(0, h + 0.3 + roof, 0, w - 1.0, 0.18, d - 0.8, { c: col, solid: 1, t: -0.08 });
    m.box(0, h + 0.48 + roof, 0, w - 1.15, 0.2, d - 0.95, { c: fr, solid: 1, t: 0.1 });
    if (o.comb) combAt(m, w, d, h + 0.68 + roof, o.comb, col, fr);
    if (o.masks) {
      for (const k of [-1, 1]) for (let i = 0; i < o.masks; i++) rainMask(m, k * (w / 2 - 0.9), h + 0.32 + i * 1.02, d / 2 + 0.06, 0.65, col, PAL.ochre);
      rainMask(m, 0, h + 0.3, d / 2 + 0.14, 0.82, col, PAL.blue);
    }
  });
}
function combAt(m, w, d, y0, H, col, fr) {
  const tiers = 3, cz = -d * 0.2;
  let W = w * 0.8, y = y0;
  for (let i = 0; i < tiers; i++) {
    const h = H * (i === 0 ? 0.42 : i === 1 ? 0.34 : 0.24), th = 0.8 - i * 0.14;
    m.box(0, y, cz, W, 0.34, th + 0.18, { c: col, solid: 1 });
    const cols = 5 - i, gap = W / cols;
    for (let c = 0; c <= cols; c++) m.box(-W / 2 + c * gap, y + 0.34, cz, 0.42, h - 0.68, th, { c: fr, f: 'comb', fp: 0.14 });
    for (let c = 0; c < cols; c++) {
      m.box(-W / 2 + (c + 0.5) * gap, y + 0.34 + (h - 0.68) * 0.46, cz, gap - 0.42, 0.16, th * 0.55, { c: col, f: 'comb', fp: 0.2 });
      if (i < 2) rainMask(m, -W / 2 + (c + 0.5) * gap, y + 0.34 + (h - 0.68) * 0.52, cz + th * 0.2, 0.42, fr, PAL.ochre);
    }
    m.box(0, y + h - 0.34, cz, W, 0.34, th + 0.18, { c: col, f: 'comb', fp: 0.1, panel: { front: 'fret', back: 'fret' } });
    y += h; W *= 0.7;
  }
  m.box(0, y, cz, W * 0.7, 0.5, 0.36, { c: fr, f: 'comb', fp: 0.5, t: [0.25, 0.25, 0, 0] });
}

// The great stepped mass: tiers with inset corners, talud, shadow-line recess
// and overhanging apron, faced in veneer blocks and climbed by a real stair.
function pyramid(m, o) {
  const { w, d, tiers, th, inset, stairW, col = PAL.stucco, trim = PAL.cream, stairCol = PAL.cream, serpents = false, top } = o;
  m.site(() => {
    let W = w, D = d, y = -1.2;
    const c = Math.min(1.5, inset * 0.6);
    for (let i = 0; i < tiers; i++) {
      const tH = i === 0 ? th + 1.2 : th, tal = tH * 0.68, rec = tH * 0.1, apr = tH * 0.22, ix = inset * 0.42;
      m.box(0, y, 0, W, tal, D - 2 * c, { c: col, solid: 1, t: [ix, ix, 0, 0], j: 0, bottom: false });
      m.box(0, y, 0, W - 2 * c, tal, D, { c: col, solid: 1, t: [0, 0, ix, ix], j: 0 });
      const W2 = W - 2 * ix, D2 = D - 2 * ix;
      m.box(0, y + tal, 0, W2 - 0.6, rec, D2 - 0.6, { c: shade(col, 0.5), solid: 1, j: 0 });
      m.box(0, y + tal + rec, 0, W2 + 0.2, apr, D2 + 0.2, { c: trim, solid: 1, t: 0.16, j: 0.01, panel: { all: o.apron || 'fret' } });
      // Veneer: the skin that peels away and tumbles down the terraces.
      for (let k = 0; k < 4; k++) {
        const along = k % 2 === 0 ? W : D, out = k % 2 === 0 ? D : W, L = along - 2 * c;
        const n = Math.max(2, Math.round(L / 2.3)), bw = L / n;
        m.at(0, 0, 0, k * Math.PI / 2, () => {
          for (let b = 0; b < n; b++) {
            const bx = -L / 2 + bw * (b + 0.5);
            if (k === 0 && Math.abs(bx) < stairW / 2 + 0.2) continue;
            const courses = tal > 2.2 ? 3 : 2;
            for (let cc = 0; cc < courses; cc++) {
              const ch = tal / courses, z0 = out / 2 + 0.05 - ix * (cc / courses);
              m.box(bx, y + cc * ch, z0 - 0.16, bw + 0.01, ch + 0.01, 0.36, { c: col, f: 'veneer', fp: 0.2 + cc * 0.04, sz: -ix / courses, j: 0.022 });
            }
          }
        });
      }
      if (o.mascarons && i % 2 === 0) for (const k of [-1, 1]) for (const off of [0.32, 0.72]) {
        const mx = k * (stairW / 2 + (W2 / 2 - stairW / 2) * off);
        m.at(mx, y + 0.1, D / 2 + 0.16, 0, () => m.site(() => rainMask(m, 0, 0, 0, Math.min(1.25, tal * 0.42), PAL.stucco, PAL.ochre)));
      }
      y += tH; W -= 2 * inset; D -= 2 * inset;
    }
    // The stair runs out past the first tier so the mass reads as climbable.
    const total = y + 1.2, ext = th * 1.15, zBase = d / 2 + ext, zTop = D / 2 + inset * 0.9;
    const n = Math.round(total / 0.42), rise = total / n, dz = (zBase - zTop) / n;
    const segs = Math.max(2, Math.round(stairW / 2.7)), sw = stairW / segs;
    for (let i = 0; i < n; i++) {
      const yy = -1.2 + i * rise, zz = zBase - i * dz;
      for (let s = 0; s < segs; s++) {
        const dp = dz + 1.5;
        m.box(-stairW / 2 + sw * (s + 0.5), yy, zz - dp / 2, sw + 0.004, rise + 0.004, dp, { c: stairCol, j: 0.016 });
      }
    }
    // Balustrades, broken every few metres.
    const parts = Math.max(3, Math.floor(total / 4));
    for (const k of [-1, 1]) for (let p = 0; p < parts; p++) {
      const a = p / parts, b = (p + 1) / parts;
      m.ramp(k * (stairW / 2 + 0.55), lerp(-1.2, total - 1.2, a) - 0.3, lerp(zBase, zTop, a), lerp(-1.2, total - 1.2, b) - 0.3, lerp(zBase, zTop, b), 1.1, 1.05, { c: o.rail || col });
      if (serpents) m.box(k * (stairW / 2 + 1.25), lerp(-1.2, total - 1.2, a), lerp(zBase, zTop, a) - 0.9, 0.3, 0.35, 0.8, { c: PAL.jade, j: 0.03 });
    }
    if (serpents) for (const k of [-1, 1]) serpentHead(m, k * (stairW / 2 + 0.55), 0.68, zBase + 0.15, 1.5, col, PAL.jade);
    if (top) m.at(0, y, 0, 0, () => {
      m.box(0, 0, 0, W + 2 * inset - 2.2, 0.55, D + 2 * inset - 2.2, { c: trim, solid: 1, t: 0.1 });
      m.at(0, 0.55, -0.5, 0, () => top(W + 2 * inset - 2.2, D + 2 * inset - 2.2));
    });
  });
  return { top: -1.2 + tiers * th + 1.2 };
}

function ballCourt(m, x, z, yaw) {
  m.at(x, 0, z, yaw, () => m.site(() => {
    const L = 52, gap = 11;
    m.box(0, 0, 0, gap + 2, 0.3, L, { c: PAL.floor, solid: 1 });
    for (const k of [-1, 1]) m.at(k * (gap / 2 + 6.2), 0, 0, k < 0 ? Math.PI : 0, () => {
      // Sloped playing wall, flat bench, tall rear wall.
      const n = 10, sl = L / n;
      for (let i = 0; i < n; i++) {
        const zc = -L / 2 + sl * (i + 0.5);
        m.box(-5.0, 0, zc, 2.5, 1.0, sl + 0.01, { c: PAL.stucco, t: [0, 0, 0, 0], panel: { left: 'fret' } });
        m.box(-3.2, 1.0, zc, 2.6, 4.4, sl + 0.01, { c: PAL.red, t: [1.3, 0, 0, 0], f: 'veneer', fp: 0.2 });
        m.box(2.5, 0, zc, 9.2, 8.2, sl + 0.01, { c: PAL.stucco, t: [0.3, 0.5, 0, 0], f: 'veneer', fp: 0.06 });
        m.box(2.5, 8.2, zc, 8.6, 0.5, sl + 0.01, { c: PAL.red, t: 0.1, panel: { right: 'glyph' } });
      }
      // Ring, set high in the wall, and a stone-tenon to hold it.
      m.at(-4.45, 6.2, 0, -Math.PI / 2, () => {
        m.whole('wall', () => {
          const ring = [];
          for (let i = 0; i <= 12; i++) { const a = i / 12 * TAU; ring.push([0.72 + Math.cos(a) * 0.22, Math.sin(a) * 0.22]); }
          m.at(0, 0, 0, 0, () => {
            const save = m.t; const seg = 24;
            for (let s = 0; s < seg; s++) {
              const a = s / seg * TAU, b = (s + 1) / seg * TAU;
              for (let i = 0; i < 12; i++) {
                const [r0, h0] = ring[i], [r1, h1] = ring[i + 1];
                const pt = (r, h, ang) => m.w(Math.sin(ang) * r, Math.cos(ang) * r, h);
                m.quad(pt(r0, h0, a), pt(r0, h0, b), pt(r1, h1, b), pt(r1, h1, a), PAL.cream, null, m.group);
              }
            }
            m.t = save;
          });
          m.box(0, -1.3, -0.15, 0.32, 0.65, 0.26, { c: PAL.cream });
        }, 900);
      });
      // A small temple sits on the eastern wall.
      if (k > 0) m.at(2.5, 8.7, -7, -Math.PI / 2, () => building(m, { w: 11, d: 5, h: 2.6, doors: 3, doorW: 1.0, doorH: 1.9, roof: 1.5, t: 0.55 }));
    });
    // Closing end zones.
    for (const k of [-1, 1]) m.box(0, 0, k * (L / 2 + 3), gap + 28, 2.2, 6, { c: PAL.stucco, t: 0.5, panel: { all: 'lattice' } });
    m.box(0, 0.3, 0, 1.2, 0.05, 1.2, { c: PAL.red, j: 0 });
  }));
}

function observatory(m, x, z, yaw) {
  m.at(x, 0, z, yaw, () => m.site(() => {
    m.box(0, -0.5, 0, 25, 3.0, 24, { c: PAL.stucco, solid: 1, t: 0.6 });
    m.box(0, 2.5, 0, 19, 2.8, 18, { c: PAL.red, solid: 1, t: 0.5, panel: { all: 'lattice' } });
    const rise = 5.8, n = 14;
    for (let i = 0; i < n; i++) m.box(0, -0.5 + i * rise / n, 15 - i * 0.34 - 1, 7, rise / n + 0.01, 2.0, { c: PAL.cream });
    m.revolve(0, 5.3, 0, [[0, 0], [7.5, 0], [6.7, 1.4], [6.9, 1.6], [0, 1.6]], 40, { solid: 1, c: PAL.stucco });
    // Drum walls: twelve curved sectors with four doors between them.
    const sectors = 12, wallH = 4.2;
    for (let i = 0; i < sectors; i++) {
      const a = i / sectors * TAU, b = (i + 1) / sectors * TAU;
      const door = i % 3 === 1;
      const ca = door ? 0.56 : 0;
      m.whole('wall', () => {
        m.revolve(0, 6.9, 0, [[5.6, ca ? 2.5 : 0], [5.6, wallH]], 6, { a0: a, a1: b, c: PAL.stucco });
        m.revolve(0, 6.9, 0, [[4.7, wallH], [4.7, ca ? 2.5 : 0]], 6, { a0: a, a1: b, c: shade(PAL.rubble, 0.5) });
      }, door ? R(500, 1100) : R(300, 1150));
      if (!door) {
        m.revolve(0, 6.9, 0, [[5.6, 0], [5.6, 0.01]], 2, { a0: a, a1: b, solid: 1 });
      }
    }
    m.revolve(0, 6.9, 0, [[4.0, 0], [4.0, wallH + 0.1]], 24, { solid: 1, c: shade(PAL.rubble, 0.42) });
    m.revolve(0, 6.9 + wallH, 0, [[5.85, 0], [5.95, 0.32], [5.6, 0.5], [5.1, 0.5]], 40, { c: PAL.red, solid: 1 });
    // Half of the dome goes early; the sliver that survives is what you recognise.
    for (let s = 0; s < 8; s++) {
      m.revolve(0, 7.4 + wallH, 0, [[5.1, 0], [4.7, 1.3], [3.8, 2.4], [2.5, 3.2], [1.0, 3.6], [0.01, 3.7]], 6, { a0: s / 8 * TAU, a1: (s + 1) / 8 * TAU, c: PAL.stucco, f: s > 3 ? 'vault' : 'block' });
    }
    for (let i = 0; i < 4; i++) { const a = i / 4 * TAU + 0.4; m.at(Math.sin(a) * 6.1, 7.4 + wallH + 0.1, Math.cos(a) * 6.1, a, () => rainMask(m, 0, 0, 0, 0.5, PAL.red, PAL.ochre)); }
  }));
}

function arch(m, x, z, yaw) {

function palace(m, x, z, yaw) {
  m.at(x, 0, z, yaw, () => m.site(() => {
    const W = 118, D = 62, H = 9;
    // Terraced mass with long stair facing the plaza.
    for (let i = 0; i < 3; i++) m.box(0, -1 + i * H / 3, 0, W - i * 5, H / 3 + (i === 0 ? 1 : 0), D - i * 5, { c: i % 2 ? PAL.cream : PAL.stucco, solid: 1, t: 0.7, j: 0 });

    for (let i = 0; i < steps; i++) for (let s = -3; s <= 3; s++) m.box(s * 4.3, -1 + i * (H + 1) / steps, D / 2 + 5.3 - i * 0.47 - 1.5, 4.31, (H + 1) / steps + 0.004, 3, { c: PAL.cream, j: 0.016 });
    m.at(0, H, 0, 0, () => {

      m.at(-37, 0, 1, Math.PI / 2, () => building(m, { w: 30, d: 7, h: 3.5, doors: 5, doorW: 1.6, doorH: 2.4, roof: 2.0, frieze: 'fret' }));
      m.at(37, 0, 1, -Math.PI / 2, () => building(m, { w: 30, d: 7, h: 3.5, doors: 5, doorW: 1.6, doorH: 2.4, roof: 2.0, frieze: 'fret' }));
      // Upper storey over the rear range.
      m.at(-18, 6.4, -21, Math.PI, () => building(m, { w: 34, d: 5.5, h: 2.9, doors: 7, doorW: 1.3, doorH: 2.0, roof: 1.6, t: 0.55, frieze: 'glyph2', masks: 1 }));
      // Four-storey watchtower in the court.
      m.at(13, 0, 0, 0, () => m.site(() => {
        let tw = 8.4, y = 0;

function makeNoiseTexture(S = 512) {

      const per = base << o, lat = new Float32Array(per * per);

        const fy = y / S * per, y0 = fy | 0, y1 = (y0 + 1) % per, ty = fy - y0, sy = ty * ty * ty * (ty * (ty * 6 - 15) + 10);
        for (let x = 0; x < S; x++) {
          const fx = x / S * per, x0 = fx | 0, x1 = (x0 + 1) % per, tx = fx - x0, sx = tx * tx * tx * (tx * (tx * 6 - 15) + 10);
          const a = lat[y0 * per + x0], b = lat[y0 * per + x1], c = lat[y1 * per + x0], d = lat[y1 * per + x1];

  };

      const fx = x / S * cells, fy = y / S * cells, cx = fx | 0, cy = fy | 0;
      let best = 9;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        const gx = (cx + i + cells) % cells, gy = (cy + j + cells) % cells, k = (gy * cells + gx) * 2;
        const dx = cx + i + pts[k] - fx, dy = cy + j + pts[k + 1] - fy, dd = dx * dx + dy * dy;

  t.needsUpdate = true;
  return t;
}

// Height-integrated jungle mist replaces three's fog everywhere.
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG\nvarying vec3 vFogW;\n#endif`;

THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG\nvarying vec3 vFogW;\n#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  vec3 fogV = vFogW - cameraPosition; float fogD = length(fogV); vec3 fogR = fogV / max(fogD, 1e-3);

let uid = 0;
function patch(mat, o = {}) {
  const id = ++uid;
  mat.customProgramCacheKey = () => 'moss' + id;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    let v = sh.vertexShader, f = sh.fragmentShader;
    v = v.replace('#include <common>', '#include <common>\n' + COMMON_GLSL + (o.vars || ''));
    if (o.nbegin) v = v.replace('#include <beginnormal_vertex>', o.nbegin);
    if (o.begin) v = v.replace('#include <begin_vertex>', o.begin);
    if (o.project) v = v.replace('#include <project_vertex>', o.project);
    f = f.replace('#include <common>', '#include <common>\n' + COMMON_GLSL + (o.fvars || ''));
    if (o.color) f = f.replace('#include <color_fragment>', '#include <color_fragment>\n' + o.color);
    if (o.rough) f = f.replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n' + o.rough);
    if (o.normal) f = f.replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\n' + o.normal);
    if (o.ao) f = f.replace('#include <aomap_fragment>', '#include <aomap_fragment>\n' + o.ao);
    if (o.emis) f = f.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + o.emis);
    // Cloud shadows sweep across everything lit by the sun.
    if (mat.isMeshStandardMaterial) f = f.replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
      { float cs = texture2D(uNoise, vFogW.xz * 0.0013 + uCloud).r * .6 + texture2D(uNoise, vFogW.xz * 0.0041 + uCloud * 1.4).g * .4;
        float cShade = mix(1., .3 , smoothstep(.56 - uCloudAmt * .22, .78 - uCloudAmt * .22, cs));
        reflectedLight.directDiffuse *= cShade; reflectedLight.directSpecular *= cShade; }`);
    sh.vertexShader = v; sh.fragmentShader = f;
  };
  return mat;
}

const SURFACE_GLSL = `
// Height-field occlusion: anything taller than this point nearby shuts out the sky.
float hfAO(vec3 w, vec3 n){
  vec2 p = w.xz + n.xz * 1.5; float o = 0.;
  const float k = 1. / FIELD_W;
  float h;
  h = texture2D(uField, (p + vec2( .9, 0.)) * k + .5).r; o += sat((h - w.y - .08) / 1.8);
  h = texture2D(uField, (p + vec2(-.9, 0.)) * k + .5).r; o += sat((h - w.y - .08) / 1.8);
  h = texture2D(uField, (p + vec2(0.,  .9)) * k + .5).r; o += sat((h - w.y - .08) / 1.8);
  h = texture2D(uField, (p + vec2(0., -.9)) * k + .5).r; o += sat((h - w.y - .08) / 1.8);
  h = texture2D(uField, (p + vec2( 2., 2.)) * k + .5).r; o += sat((h - w.y - .2) / 4.);
  h = texture2D(uField, (p + vec2(-2., 2.)) * k + .5).r; o += sat((h - w.y - .2) / 4.);
  h = texture2D(uField, (p + vec2( 2.,-2.)) * k + .5).r; o += sat((h - w.y - .2) / 4.);
  h = texture2D(uField, (p + vec2(-2.,-2.)) * k + .5).r; o += sat((h - w.y - .2) / 4.);
  return 1. - sat(o * .19);
}
// Moss in the manner of Quilez's system for Brave: start uniform, then layer small
// independent formulas (thickness, length, colour, bending, movement), each driven by
// per-clump randomness and by what the surface is doing.
vec3 hash32(vec2 p){ vec3 q = fract(vec3(p.xyx) * vec3(.1031,.1030,.0973)); q += dot(q, q.yxz + 33.33); return fract((q.xxy + q.yzz) * q.zyx); }
// x: distance to the clump's centre. yzw: that clump's own random numbers.
vec4 mossClump(vec2 p){
  vec2 ip = floor(p), fp = fract(p); float best = 9.; vec2 cell = vec2(0.);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)), o = g + hash32(ip + g).xy * .9 - fp; float d = dot(o, o);
    if (d < best) { best = d; cell = ip + g; }
  }
  return vec4(sqrt(best), hash32(cell + 17.3));
}
// Clumps have no mipmaps of their own: as one shrinks below a pixel, its randomness fades to the average.
vec4 mossSettle(vec4 c, vec2 p){ return mix(c, vec4(.42, .5, .5, .5), smoothstep(.3, 1., fwidth(p.x) + fwidth(p.y))); }
// Thickness: a dome per clump, each clump its own height.
float mossThickness(vec4 c){ return (1. - smoothstep(.05, .86, c.x)) * (.42 + .58 * c.y); }
// Species: clover wants wet shade. Down and sideways yes; facing the sky, none at all.
float mossClover(vec3 n, float patchN){ return smoothstep(.55, -.15, n.y) * smoothstep(.42, .6, patchN); }
// Colour: family from the slow patchwork, a nudge per clump, then root-to-tip and fake occlusion.
vec3 mossPaint(vec4 c, float patchN, float height, float fine, float clover, float wet){
  float fam = patchN + (c.w - .5) * .3;
  vec3 col = mix(vec3(.024,.07,.018), vec3(.055,.125,.02), smoothstep(.22, .46, fam));
  col = mix(col, vec3(.115,.185,.028), smoothstep(.44, .64, fam));
  col = mix(col, vec3(.215,.235,.04), smoothstep(.64, .82, fam));
  col = mix(col, vec3(.15,.1,.035), smoothstep(.86, .97, fam) * .75);      // a few clumps go to rust-coloured sporophytes
  col = mix(col, col * vec3(.62,1.02,.86), smoothstep(.34, .16, fam) * .8); // and some to cold blue-green
  col = mix(col, vec3(.05,.17,.055) * (.85 + c.z * .4), clover * .85);
  // Light reaches the tips; the hollows between clumps stay dark, without a single ray.
  col *= mix(.64, 1.34, smoothstep(.02, .95, height));
  return col * (.74 + fine * .52) * (.88 + wet * .24);
}
`;

const CITY_VARS = `
attribute vec3 aPivot; attribute vec4 aFall; attribute vec4 aDecay; attribute vec3 aPanel;
varying vec3 vRest; varying vec3 vRestN; varying vec3 vPanel; varying float vSeed; varying float vFallen;
mat3 rotAxis(vec3 a, float r){ float s=sin(r), c=cos(r), o=1.-c;
  return mat3(o*a.x*a.x+c,o*a.x*a.y+a.z*s,o*a.z*a.x-a.y*s, o*a.x*a.y-a.z*s,o*a.y*a.y+c,o*a.y*a.z+a.x*s, o*a.z*a.x+a.y*s,o*a.y*a.z-a.x*s,o*a.z*a.z+c); }
void decayXf(out mat3 R, out vec3 T, out float ft){
  ft = clamp((uYear - aDecay.x) / aDecay.y, 0., 1.);
  float sl = smoothstep(aDecay.z, aDecay.z + 280., uYear);
  vec3 ax = normalize(vec3(sin(aDecay.w * 43.1), .35 * cos(aDecay.w * 91.7), cos(aDecay.w * 77.3)));
  float horiz = length(aFall.xz);
  vec3 tipAx = horiz > .01 ? normalize(vec3(aFall.z, 0., -aFall.x) + ax * .22) : ax;
  R = rotAxis(tipAx, aFall.w * ft * ft) * rotAxis(ax, .045 * sl * sin(aDecay.w * 19.));
  T = vec3(aFall.x * ft, aFall.y * ft * ft, aFall.z * ft) - vec3(0., .04 * sl, 0.);
}
`;
const CITY_NBEGIN = `mat3 dR0; vec3 dT0; float ft0; decayXf(dR0, dT0, ft0); vec3 objectNormal = dR0 * normal;`;
const CITY_BEGIN = `mat3 dR; vec3 dT; float ftt; decayXf(dR, dT, ftt);
  vec3 transformed = dR * (position - aPivot) + aPivot + dT;
  vRest = position; vRestN = normal; vPanel = aPanel; vSeed = aDecay.w; vFallen = ftt;`;

// Shared front: years since green reached this exact bit of surface.
const MOSS_AGE_GLSL = `
float mossAge(vec3 rest, vec3 world, vec3 n, vec2 wuv, vec4 n0, vec4 n1, vec4 n2){
  float arr = texture2D(uField, world.xz / FIELD_W + .5).g;
  float h = texture2D(uField, world.xz / FIELD_W + .5).a;
  float up = sat(n.y), wall = 1. - abs(n.y);
  float a = uYear - arr;
  a += (n0.b - .5) * 300. + (n1.r - .5) * 170. + (n2.g - .5) * 70.;
  a += up * 120. - wall * 35.;
  // Shaded faces stay wet longest: moss has always preferred the north side.
  a += -n.z * 55. * wall - dot(n, uSunDirFixed) * 25.;
  // Climbing a wall is slow. Height above the local ground costs years.
  a -= sat((world.y - h) * .06) * 40. + max(world.y - h, 0.) * uClimb;
  return min(a, uYear * 1.25 - 8. + step(arr, -60.) * 2000.);
}
`;

const cityMat = patch(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 }), {

    else if (matId == 8.) cellSz = vec2(.46, .62);

    vec2 blockId = floor(bc), bf = fract(bc);

      if (matId == 14.) {
        // Living rock: soft bedding planes cut back by the wind, under fading paint.
        float bedN = texture2D(uNoise, vec2(wuv.x * .025, vRest.y * .37)).r;
        float bed = fract(vRest.y * .78 + bedN * .9);
        vec3 rock = mix(vec3(.5,.42,.27), vec3(.36,.29,.18), bedN) * mix(.58, 1.14, smoothstep(.0, .34, bed)) * (.82 + n3.g * .34);
        mm = mix(mix(diffuseColor.rgb, diffuseColor.rgb * .55 + rock * .5, paintLoss), rock, stuccoLoss);
        mortar = 0.; blockBevel = 1.;
        extraBump = smoothstep(.0, .34, bed) * sat(Y / 500.) * .5;
      } else stuccoLoss = 1.;
      surf = mm;
    }
    float wallK = 1. - sat((aN.y - .1) / .6);
    // Rain streaks: black biofilm running down from each ledge.
    float streakN = texture2D(uNoise, vec2(wuv.x * .11, wuv.y * .011)).b;
    float streaks = smoothstep(.42, .78, streakN + n2.r * .25) * wallK * smoothstep(20., 620., Y);
    surf *= 1. - streaks * .66;
    surf = mix(surf, surf * vec3(.72,.7,.62), sat(Y / 800.));
    // Horizontal plaster goes grey first: it holds rain, soot and fungus.
    if (isTop) surf *= mix(1., (.36 + n1.b * .3) * (.75 + n2.r * .5), smoothstep(8., 230., Y));
    // Lichen rosettes, grey-green and rust orange.
    float lichenAge = sat((Y - 70. - n0.g * 300.) / 260.);
    float rosette = (1. - smoothstep(.0, .24, n3.a)) * smoothstep(.45,.62,n2.b);
    surf = mix(surf, mix(vec3(.5,.54,.42), vec3(.5,.28,.07), step(.82, n1.b)), rosette * lichenAge * .8 * (1. - organic));
    // Sky occlusion is shared by weathering, moss and light.
    float mossAO = mix(hfAO(vFogW, rN), 1., vFallen * .85);
    if (matId == 14. || matId == 17. || matId == 18.) mossAO = mix(mossAO, 1., .7);
    float mAge = mossAge(vRest, vFogW, rN, wuv, n0, n1, n2);
    mAge += mortar * stuccoLoss * 110. + (1. - mossAO) * 130.;
    if (vPanel.z > .5 && vPanel.z < 1.5) mAge += 150. - smoothstep(.3, .8, relief) * 900.;
    if (matId == 12.) mAge += crack * 260.;
    mAge = min(mAge, uYear * 1.25 - 8. + step(texture2D(uField, vFogW.xz / FIELD_W + .5).g, -60.) * 2000.);
    float cover = smoothstep(0., 62., mAge) * (1. - organic) * (1. - winCut * (1. - smoothstep(240., 620., mAge + (n1.g - .5) * 240.)));
    // Old moss holds soil: the ledges turn to humus and leaf litter.
    vec4 clump = mossSettle(mossClump(wuv * 2.4 + (n2.rg - .5) * 1.5), wuv * 2.4);
    float mossPatch = n1.g * .55 + n2.b * .45, clover = mossClover(rN, n1.b * .6 + n2.g * .4);
    float lump = mix(mossThickness(clump), .5 + (1. - n3.a) * .2, clover * .7);
    vec3 moss = mossPaint(clump, mossPatch, lump, n4.g, clover, uWet) * (1. + uMeadow * .85);
    float litter = smoothstep(180., 500., mAge) * sat(rN.y) * smoothstep(.45, .7, n1.b * .6 + n3.b * .5);
    moss = mix(moss, vec3(.085,.052,.026) * (.6 + n4.r * .9), litter);
    float darkYoung = 1. - smoothstep(0., 120., mAge);
    moss = mix(moss, moss * vec3(.5,.62,.45), darkYoung * .8);
    moss *= mix(1., mix(.5, 1., smoothstep(0., .9, 1. - mortar)), (1. - smoothstep(160., 520., mAge)) * stuccoLoss);
    diffuseColor.rgb = mix(surf, moss, cover);
    // Wet dark tide just ahead of the moss front.
    float damp = smoothstep(-90., 0., mAge) * (1. - cover);
    diffuseColor.rgb *= 1. - damp * .32 * (1. - organic);
    float pitDepth = (1. - stuccoLoss) * (relief * .9 - crack * .35) + stuccoLoss * (blockBevel * .9 + n2.g * .3 + n3.r * .16 - pits * .14) + (n4.r - .5) * .022;
    if (matId == 18.) pitDepth = 0.;
    float bumpH = (pitDepth * .09 + extraBump) * (1. - cover) + (lump * .16 + n4.r * .02) * cover;
    float roughK = mix(mix(.86, .96, stuccoLoss), 1., cover);
    roughK = mix(mix(roughK, .1, glassK), .28, goldK * (1. - cover));
    if (matId == 7. && cover < .5) roughK = mix(.42, .85, sat(Y / 500.));
    float aoK = mossAO * mix(1., .78 + blockBevel * .22, stuccoLoss * (1. - cover));
    if (matId == 14. || matId == 17. || matId == 18.) aoK = mix(aoK, 1., .62);
    if (vPanel.z > .5 && vPanel.z < 1.5) aoK *= mix(.55, 1., smoothstep(.15,.55,relief)) * (1.-cover*.4) + cover*.4;
  `,
  rough: `roughnessFactor = roughK;`,
  normal: `{ vec3 dpx = dFdx(-vViewPosition), dpy = dFdy(-vViewPosition); vec3 nr = normal;
      vec3 r1 = cross(dpy, nr), r2 = cross(nr, dpx); float det = dot(dpx, r1);
      float dhx = dFdx(bumpH), dhy = dFdy(bumpH);
      vec3 surfGrad = sign(det) * (dhx * r1 + dhy * r2);
      normal = normalize(abs(det) * nr - surfGrad * faceDirection); }`,
  ao: `reflectedLight.indirectDiffuse *= aoK; reflectedLight.directDiffuse *= mix(1., aoK, .35); reflectedLight.directSpecular *= aoK;`,
  emis: `{ float fres = pow(1. - sat(dot(normalize(vViewPosition), normal)), 3.);
      totalEmissiveRadiance += glow + uHorizon * glassK * (.045 + fres * .42) + diffuseColor.rgb * uSunCol * goldK * .35; }`,
});
const cityDepth = patch(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), { vars: CITY_VARS, begin: CITY_BEGIN });

// Real pile: moss shells stand off the surface and catch light on their tips.
const SHELLS = 4;
const shellMat = patch(new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0 }), {
  vars: CITY_VARS + `varying float vShell;`, nbegin: CITY_NBEGIN,
  begin: CITY_BEGIN + `
    vShell = (float(gl_InstanceID) + 1.) / ${SHELLS.toFixed(1)};
    transformed += dR * normal * vShell * .16;`,
  fvars: `varying vec3 vRest; varying vec3 vRestN; varying vec3 vPanel; varying float vSeed; varying float vFallen; varying float vShell;

  ` + SURFACE_GLSL + MOSS_AGE_GLSL,
  color: `
    if (abs(vPanel.z - 2.) < .5 || abs(vPanel.z - 4.) < .5 || abs(vPanel.z - 9.) < .5) discard;
    vec3 rN = normalize(vRestN), aN = abs(rN);

    float droop = 1. - abs(rN.y);
    vec2 lean = (n2.rg - .5) * .8 + vec2(0., -droop * .9) + vec2(sin(uClock * 1.1 + wuv.x * .8 + wuv.y * .5), cos(uClock * .9 + wuv.y * .7)) * .07;
    vec2 pw = wuv - lean * vShell * vShell * .2;

    vec4 tuft = texture2D(uNoise, pw * 3.1);

    float strand = texture2D(uNoise, pw * 13.).r;

    if (pile < need) discard;
    diffuseColor.rgb = mossPaint(clump, n1.g * .55 + n2.b * .45, mix(vShell, .8, clover), tuft.g, clover, uWet) * (1. + uMeadow * .85);
    float aoK = mix(hfAO(vFogW, rN), 1., vFallen * .85) * (.62 + vShell * .4);
  `,
  rough: `roughnessFactor = 1.;`,
  ao: `reflectedLight.indirectDiffuse *= aoK;`,
});

const TERRAIN_VARS = `attribute float aSoil; varying float vSoilK;`;
const terrainMat = patch(new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0 }), {
  vars: TERRAIN_VARS,
  begin: `vec3 transformed = position; transformed.y += aSoil * uRise; vSoilK = aSoil;`,

  color: `
    vec3 W = vFogW; vec2 wuv = W.xz;

    vec4 n2 = texture2D(uNoise, wuvB * .19), n3 = texture2D(uNoise, wuvB * .97), n4 = texture2D(uNoise, wuvB * 4.1);
    vec2 fuv = W.xz / FIELD_W + .5;

    float farArr = uFarArr.x + dot(W.xz, uFarArr.yz);

    // Bare trampled earth where the city lived.

    vec4 clump = mossSettle(mossClump(wuv * 1.3 + (n2.rg - .5) * 1.2), wuv * 1.3);
    float lump = mossThickness(clump), mossPatch = n1.g * .55 + n2.b * .45;
    vec3 grass = mix(vec3(.038,.085,.016), vec3(.09,.145,.028), n4.g * .6 + lump * .4) * (.78 + n3.g * .4);
    vec3 floorDark = mix(vec3(.05,.035,.018), vec3(.11,.07,.03), n3.b) * (.7 + n4.r * .7);
    vec3 forestFloor = mix(floorDark, mossPaint(clump, mossPatch, lump, n4.g, 0., uWet) * .85, smoothstep(.36,.6, n1.g * .75 + n2.b * .35));
    vec3 c = earth;
    c = mix(c, dryGrass, smoothstep(-40., 20., a));
    c = mix(c, grass, smoothstep(10., 90., a));

      c = mix(turf, mossPaint(clump, mossPatch, lump, n4.g, 0., uWet) * 1.1, smoothstep(0., 1., creep));
    }
    // Limestone bluffs where the ground falls away.
    vec3 wN = inverseTransformDirection(normalize(vNormal), viewMatrix);

    vec4 rk0 = texture2D(uNoise, sideUV * .031), rk1 = texture2D(uNoise, sideUV * .17), rk2 = texture2D(uNoise, sideUV * .83);

    vec3 farC = mix(uFarEarth * (.72 + n1.r * .3 + n2.g * .18), mix(vec3(.02,.05,.014), vec3(.05,.085,.022), n1.g), smoothstep(0., 280., uYear - farArr + (n0.b - .5) * 340.));

    diffuseColor.rgb = c;
    float bumpH = (n3.r * .14 + lump * .1 + n4.r * .04) * (.6 + .4 * smoothstep(0., 90., a));

  `,
  rough: `roughnessFactor = 1.;`,
  normal: `{ vec3 dpx = dFdx(-vViewPosition), dpy = dFdy(-vViewPosition); vec3 nr = normal;
      vec3 r1 = cross(dpy, nr), r2 = cross(nr, dpx); float det = dot(dpx, r1);
      vec3 surfGrad = sign(det) * (dFdx(bumpH) * r1 + dFdy(bumpH) * r2);

  ao: `reflectedLight.indirectDiffuse *= aoK; reflectedLight.directDiffuse *= mix(1., aoK, .3);`,

// Instanced plants, leaves and trunks all grow by the same rule.
const GROW_VARS = `
attribute vec3 iPos; attribute vec4 iMisc; attribute vec3 iTint; attribute vec3 iSoil;
varying vec3 vTint; varying float vGrow;
float growth(){ float age = uYear - iMisc.z; float g = age <= 0. ? 0. : 1. - exp(-age / iSoil.z);
  if (iMisc.w > -500.) g *= 1. - smoothstep(iMisc.w, iMisc.w + 9., uYear);
  return g; }
vec3 rootOf(){ vec3 b = iPos; b.y = max(b.y, iSoil.x + iSoil.y * uRise); return b; }
vec3 yawed(vec3 p, float c, float s){ return vec3(p.x * c + p.z * s, p.y, -p.x * s + p.z * c); }
`;
const FLUSH = `
  float seasonal = sin(uYear * .157 + iPos.x * .02 + iPos.z * .017) * .5 + .5;
  vTint = iTint * mix(.9, 1.12, seasonal);
`;
const PLANT_NBEGIN = `vec3 objectNormal = yawed(normal, cos(iMisc.y), sin(iMisc.y));`;
const PLANT_BEGIN = `
  float gg = growth(); vGrow = gg; ${FLUSH}
  vec3 tr = position;
  float swayY = abs(position.y);
  float sway = sin(uClock * 1.4 + iPos.x * .7 + iPos.z * .53 + position.y * .6) * (swayY < 1.5 ? .05 * swayY * swayY : .11 + .012 * swayY);
  tr.x += sway; tr.z += sway * .6;
  vec3 transformed = rootOf() + yawed(tr, cos(iMisc.y), sin(iMisc.y)) * iMisc.x * gg;
`;
const LEAF_FRAG = {
  fvars: `varying vec3 vTint; varying float vGrow;`,
  color: `diffuseColor.rgb *= vTint * 1.7;`,
  rough: `roughnessFactor = .62;`,
  emis: `{ vec3 sv = normalize((viewMatrix * vec4(uSunDir, 0.)).xyz);
     float thru = pow(sat(dot(normalize(-vViewPosition), sv) * .5 + .5), 3.);
     totalEmissiveRadiance += diffuseColor.rgb * uSunCol * thru * .9; }`,
};
let plantTex, canopyTex;
function plantMaterial() {
  return patch(new THREE.MeshStandardMaterial({ map: plantTex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.62, metalness: 0, alphaToCoverage: true }), { vars: GROW_VARS, nbegin: PLANT_NBEGIN, begin: PLANT_BEGIN, ...LEAF_FRAG });
}
function plantDepth() {
  return patch(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: plantTex, alphaTest: 0.45, side: THREE.DoubleSide }), { vars: GROW_VARS, begin: PLANT_BEGIN });
}
// Canopy puffs: billboards with the normals of a sphere, so a crown shades as one volume.
const CARD_VARS = GROW_VARS + `attribute vec3 aCenter; attribute vec3 aCard; varying float vCardAO;`;
const CARD_NBEGIN = `vec3 objectNormal = yawed(normal, cos(iMisc.y), sin(iMisc.y));`;
const CARD_BEGIN = `
  float gg = growth(); vGrow = gg; ${FLUSH}
  float crownScale = iMisc.x * gg;
  vec3 cc = aCenter;
  cc.x += sin(uClock * .9 + iPos.x * .13 + aCenter.y * .4) * .12 * aCenter.y * .08;
  cc.z += cos(uClock * .7 + iPos.z * .11 + aCenter.x * .4) * .1 * aCenter.y * .08;
  vec3 transformed = rootOf() + yawed(cc, cos(iMisc.y), sin(iMisc.y)) * crownScale;
  vCardAO = aCard.z;
  float cardSize = aCard.x * iMisc.x * (.32 + .68 * sqrt(gg)) * step(.001, gg);
  float cr = cos(aCard.y), sr = sin(aCard.y);
  vec2 cornerOff = vec2(position.x * cr - position.y * sr, position.x * sr + position.y * cr) * cardSize;
`;
const CARD_PROJECT = `
  vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.);
  mvPosition.xy += cornerOff;
  // Flat billboards can only swap whole: wind makes near-equal cards trade places, which reads as
  // z-fighting. Pushing each card's centre toward the eye along its own view ray makes a shallow cone
  // that looks identical on screen, but lets neighbours intersect along a stable seam, and keeps early-Z.
  float coneZ = min(mvPosition.z + (1. - max(abs(position.x), abs(position.y))) * cardSize * .85, -.05);
  mvPosition.xyz *= coneZ / min(mvPosition.z, -.05);
  gl_Position = projectionMatrix * mvPosition;
`;
function cardMaterial() {
  return patch(new THREE.MeshStandardMaterial({ map: canopyTex, alphaTest: 0.42, side: THREE.DoubleSide, roughness: 0.7, metalness: 0, alphaToCoverage: true }), {
    vars: CARD_VARS, nbegin: CARD_NBEGIN, begin: CARD_BEGIN, project: CARD_PROJECT,
    fvars: LEAF_FRAG.fvars + `varying float vCardAO;`,
    color: `diffuseColor.rgb *= vTint * mix(.62, 1.02, vCardAO);`,
    rough: LEAF_FRAG.rough, emis: LEAF_FRAG.emis + `totalEmissiveRadiance += diffuseColor.rgb * uHorizon * .22;`,
  });
}
function cardDepth() {
  return patch(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: canopyTex, alphaTest: 0.42, side: THREE.DoubleSide }), { vars: CARD_VARS, begin: CARD_BEGIN, project: CARD_PROJECT });
}
const BARK_FRAG = {
  fvars: `varying vec3 vTint; varying float vGrow; varying vec3 vLocal;`,
  color: `
    vec2 buv = vec2(atan(vLocal.x, vLocal.z) * .9 , vLocal.y * .35);
    vec4 b0 = texture2D(uNoise, buv * vec2(1., .4)), b1 = texture2D(uNoise, buv * vec2(4., 1.3));
    vec3 bark = mix(vec3(.11,.08,.055), vec3(.33,.27,.2), b1.b * .75 + b0.r * .4) * vTint * 1.6;
    float mossy = smoothstep(.34, .62, b0.g * .55 + b1.r * .35 + (1. - sat(vLocal.y * .04)) * .3);
    diffuseColor.rgb = mix(bark, mix(vec3(.04,.1,.018), vec3(.16,.25,.04), b1.g), mossy * smoothstep(.15,.7,vGrow));
    float bumpH = b1.b * .12;
  `,
  rough: `roughnessFactor = .95;`,
  normal: `{ vec3 dpx = dFdx(-vViewPosition), dpy = dFdy(-vViewPosition); vec3 nr = normal;
      vec3 r1 = cross(dpy, nr), r2 = cross(nr, dpx); float det = dot(dpx, r1);
      vec3 surfGrad = sign(det) * (dFdx(bumpH) * r1 + dFdy(bumpH) * r2);
      normal = normalize(abs(det) * nr - surfGrad * faceDirection); }`,
};
function trunkMaterial() {
  return patch(new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0 }), {
    vars: GROW_VARS + `varying vec3 vLocal;`, nbegin: PLANT_NBEGIN,
    begin: PLANT_BEGIN + `vLocal = position;`, ...BARK_FRAG,
  });
}
function trunkDepth() { return patch(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), { vars: GROW_VARS, begin: PLANT_BEGIN }); }

// Lianas and strangler roots: geometry already in place, inflating along its length.
const TUBE_VARS = `attribute vec2 aTube; attribute float aSeed2; varying vec3 vLocal; varying vec3 vTint; varying float vGrow;`;
const TUBE_BEGIN = `
  float tubeAge = uYear - aTube.y;
  float tg = tubeAge <= 0. ? 0. : 1. - exp(-tubeAge / 90.);
  tg = max(tg, 0.) * smoothstep(0., 6., tubeAge);
  vGrow = sat(tubeAge / 200.); vTint = vec3(.32 + aSeed2 * .3) + step(.11, aTube.x) * .42;
  vec3 transformed = position + normal * aTube.x * (.06 + tg * .94) * step(0., tubeAge);
  vLocal = position * 1.2;
`;
const tubeMat = patch(new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0 }), { vars: TUBE_VARS, begin: TUBE_BEGIN, ...BARK_FRAG });
const tubeDepth = patch(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), { vars: TUBE_VARS, begin: TUBE_BEGIN });
// Ivy leaves, each opening where the vine has just passed.
function ivyMaterial() {
  return patch(new THREE.MeshStandardMaterial({ map: plantTex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.55, metalness: 0, alphaToCoverage: true }), {
    vars: `attribute vec3 aCenter; attribute vec2 aLeaf; varying vec3 vTint; varying float vGrow;`,
    begin: `
      float lAge = uYear - aLeaf.x;
      float lg = lAge <= 0. ? 0. : 1. - exp(-lAge / 7.);
      vGrow = lg; vTint = mix(vec3(1.25,1.25,.7), vec3(.82), sat(lAge / 60.)) * (.8 + aLeaf.y * .5);
      float wob = sin(uClock * 2. + aCenter.x * 2.1 + aCenter.z * 1.7) * .02;
      vec3 transformed = aCenter + (position - aCenter) * lg + vec3(wob, wob * .4, wob) * lg;`,
    ...LEAF_FRAG,
  });
}

// ---------------------------------------------------------------------------
// Plant geometry
// ---------------------------------------------------------------------------
class Geo {
  constructor() { this.p = []; this.n = []; this.u = []; this.i = []; this.c = []; this.extra = {}; }
  v(x, y, z, nx, ny, nz, u, v) { this.p.push(x, y, z); this.n.push(nx, ny, nz); this.u.push(u, v); return this.p.length / 3 - 1; }
  // A leaf that arcs from a root and droops under its own weight.
