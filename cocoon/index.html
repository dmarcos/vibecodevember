<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SparkRenderer, SplatMesh, dyno } from '@sparkjsdev/spark';

// ============================================================================ setup
// World units: the butterfly is ~13 across, body centred on the origin, head toward +z,
// wings raised in a V toward +y. The chrysalis hangs head-down from a twig, cremaster at (0, 3.7, 0.4).
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot'), CAPTURE = Q.has('capture');
if (SHOT) document.body.classList.add('shot');
if (CAPTURE) document.body.classList.add('capture');
const COARSE = matchMedia('(pointer: coarse)').matches;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const ease2 = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
const DEG = Math.PI / 180;

const renderer = new THREE.WebGLRenderer({ antialias: false });
const DPR = Math.min(devicePixelRatio, COARSE ? 1 : 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(innerWidth < innerHeight ? 52 : 40, innerWidth / innerHeight, 0.02, 200);
const spark = new SparkRenderer({ renderer, focalDistance: 6, apertureAngle: 0 });
scene.add(spark);

// backdrop: deep blue-black, a faint glow behind the subject (linear colour: the output pass encodes)
const sky = new THREE.Mesh(new THREE.SphereGeometry(80, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vD;
    void main(){ float back = smoothstep(-0.3, 0.9, dot(vD, normalize(vec3(0.0, 0.3, -1.0))));
      vec3 c = mix(vec3(0.00012, 0.00018, 0.0006), vec3(0.0012, 0.0019, 0.0062), back) * (0.8 + 0.2*smoothstep(-1.0, 0.6, vD.y));
      gl_FragColor = vec4(c, 1.0); }`,
}));
scene.add(sky);
if (Q.has('axes')) { const ax = new THREE.AxesHelper(3); ax.material.depthTest = false; ax.renderOrder = 99; scene.add(ax); }

// ============================================================================ the twig, made of splats too
// A bark-covered stem the chrysalis hangs from, plus the tuft of silk the cremaster hooks into.
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi * 57 + yi * 131), b = hash((xi + 1) * 57 + yi * 131), c = hash(xi * 57 + (yi + 1) * 131), d = hash((xi + 1) * 57 + (yi + 1) * 131);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const twig = new SplatMesh({
  constructSplats: (splats) => {
    const N = COARSE ? 50000 : 110000, c = new THREE.Vector3(), sc = new THREE.Vector3(), q = new THREE.Quaternion(), col = new THREE.Color(), nrm = new THREE.Vector3();
    const axis = (s) => V(0.25 * Math.sin(s * 0.5), 3.98 + 0.18 * Math.sin(s * 0.33 + 0.6) - 0.012 * s * s, s);   // gently bent stem along z
    for (let i = 0; i < N; i++) {
      const s = -6 + Math.random() * 12, a = Math.random() * Math.PI * 2;
      const r = 0.15 * (1 - (s + 6) / 24) * (1 + 0.08 * vnoise(s * 3, a * 2));
      const p0 = axis(s), p1 = axis(s + 0.01), tdir = p1.sub(p0).normalize();
      const side = V(1, 0, 0).cross(tdir).normalize(), up = tdir.clone().cross(side).normalize();
      nrm.copy(side).multiplyScalar(Math.cos(a)).addScaledVector(up, Math.sin(a));
      c.copy(p0).addScaledVector(nrm, r);
      // bark: long fissures, grey-brown, lichen flecks; darker underneath
      const fis = Math.pow(Math.abs(Math.sin(a * 9 + vnoise(s * 1.5, a) * 4)), 6);
      const tone = 0.55 + 0.45 * vnoise(s * 4, a * 3) - 0.35 * fis;
      const lichen = vnoise(s * 0.9 + 7, a * 1.3) > 0.72 ? 1 : 0;
      col.setRGB(0.24 * tone, 0.19 * tone, 0.15 * tone);
      if (lichen) col.lerp(new THREE.Color(0.42, 0.46, 0.36), 0.6);
      const shade = 0.45 + 0.55 * clamp(nrm.y * 0.5 + 0.5, 0, 1);
      col.multiplyScalar(shade);
      q.setFromUnitVectors(V(0, 0, 1), nrm);
      sc.set(0.022, 0.03, 0.004);
      splats.pushSplat(c, sc, q, 0.95, col);
    }
    // cremaster: the short dark stalk the chrysalis hangs by
    for (let i = 0; i < 9000; i++) {
      const y = 3.5 + Math.random() * 0.48, a = Math.random() * Math.PI * 2, rr = 0.03 + 0.025 * (1 - (y - 3.5) / 0.48);
      c.set(Math.cos(a) * rr, y, 0.4 + Math.sin(a) * rr);
      nrm.set(Math.cos(a), 0, Math.sin(a)); q.setFromUnitVectors(V(0, 0, 1), nrm);
      const tone = 0.6 + 0.4 * Math.random();
      col.setRGB(0.2 * tone, 0.13 * tone, 0.07 * tone).multiplyScalar(0.6 + 0.4 * Math.max(0, Math.cos(a - 2.4)));
      sc.set(0.012, 0.016, 0.003);
      splats.pushSplat(c, sc, q, 0.95, col);
    }
    // silk pad
    for (let i = 0; i < 2500; i++) {
      const a = Math.random() * Math.PI * 2, rr = Math.pow(Math.random(), 1.5) * 0.12, y = 3.88 + Math.random() * 0.12;
      c.set(Math.cos(a) * rr, y, 0.4 + Math.sin(a) * rr);
      q.setFromEuler(new THREE.Euler(Math.random() * 3, Math.random() * 3, Math.random() * 3));
      sc.set(0.03 + Math.random() * 0.03, 0.0012, 0.0012);
      col.setRGB(0.55, 0.55, 0.53);
      splats.pushSplat(c, sc, q, 0.22, col);
    }
  },
});
scene.add(twig);

// ============================================================================ the metamorphosis
// One shader over all 2.1M splats of the scan. Before eclosion it rebuilds them as a chrysalis
// (each splat laid flat on a teardrop surface, shaded like a waxy jade case); during eclosion it lifts
// them into a glittering vortex that settles, body first, back onto the wings.
const uT = dyno.dynoFloat(0);       // eclosion progress 0..1
const uM = dyno.dynoFloat(0);       // ripeness: 0 jade, 1 the folded wings show through
const uSwayX = dyno.dynoFloat(0), uSwayZ = dyno.dynoFloat(0);
const uFlex = dyno.dynoFloat(0);    // slow wing breathing once out
const uPulse = dyno.dynoFloat(0);   // abdominal pumping of the pupa
const uSeam = dyno.dynoFloat(0);    // light leaking through the splitting seam
const uSweep = dyno.dynoFloat(-9);  // a sheen travelling out along the new wings
const uTime = dyno.dynoFloat(0);
const uCam = dyno.dynoVec3(new THREE.Vector3());
const uIri = dyno.dynoFloat(Q.has('iri') ? +Q.get('iri') : CAPTURE ? 1.0 : 0.75);   // how hard to push the scan's own angle-dependent blue

const metamorphosis = new dyno.Dyno({
  inTypes: { gsplat: dyno.Gsplat, t: 'float', m: 'float', sx: 'float', sz: 'float', flex: 'float', pulse: 'float', seam: 'float', sweep: 'float', time: 'float', cam: 'vec3', iri: 'float' },
  outTypes: { gsplat: dyno.Gsplat },
  globals: () => [dyno.unindent(/* glsl */`
    vec4 cocQuatMul(vec4 a, vec4 b) { return vec4(a.w*b.xyz + b.w*a.xyz + cross(a.xyz, b.xyz), a.w*b.w - dot(a.xyz, b.xyz)); }
    vec4 cocQuatFromTo(vec3 a, vec3 b) { float d = dot(a, b); if (d < -0.9999) return vec4(1.0, 0.0, 0.0, 0.0); return normalize(vec4(cross(a, b), 1.0 + d)); }
    vec3 cocQuatVec(vec4 q, vec3 v) { return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v); }
    float cocHash(uint h) { h ^= h >> 16; h *= 0x7feb352du; h ^= h >> 15; h *= 0x846ca68bu; h ^= h >> 16; return float(h) / 4294967295.0; }
    vec3 cocHash3(int i) { uint u = uint(i); return vec3(cocHash(u * 3u + 1u), cocHash(u * 3u + 2u), cocHash(u * 3u + 3u)); }
    vec3 cocRot(vec3 d, float ax, float az) {
      float c = cos(az), s = sin(az); d.xy = vec2(c*d.x - s*d.y, s*d.x + c*d.y);
      c = cos(ax); s = sin(ax); d.yz = vec2(c*d.y - s*d.z, s*d.y + c*d.z); return d;
    }
    // chrysalis surface as a function of (u along the body, theta around it)
    float cocRadius(float u, float theta, float pulse) {
      // closed, rounded crown -> broad shoulders at u~0.3 -> long taper to a point
      float top = pow(sin(clamp(u / 0.33, 0.0, 1.0) * 1.5708), 0.55);
      float bot = pow(cos(clamp((u - 0.33) / 0.67, 0.0, 1.0) * 1.5708), 0.8);          // rounded ogive to the tip
      float r = 1.3 * (u < 0.33 ? top : bot) + 0.035 * (1.0 - smoothstep(0.0, 0.04, u));
      r *= 1.0 + 0.006 * sin(u * 70.0) * smoothstep(0.08, 0.15, u) * (1.0 - smoothstep(0.26, 0.32, u));  // faint segments
      r *= 1.0 - 0.05 * exp(-theta*theta*10.0) * smoothstep(0.38, 0.6, u);                            // wing-case keel
      r *= 1.0 + 0.02 * pulse * smoothstep(0.05, 0.35, u);
      return r;
    }
    float cocH1(float n) { return fract(sin(n) * 43758.5453); }
    float cocVN(vec3 p) {
      vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); float n = dot(i, vec3(1.0, 57.0, 113.0));
      return mix(mix(mix(cocH1(n), cocH1(n + 1.0), f.x), mix(cocH1(n + 57.0), cocH1(n + 58.0), f.x), f.y),
                 mix(mix(cocH1(n + 113.0), cocH1(n + 114.0), f.x), mix(cocH1(n + 170.0), cocH1(n + 171.0), f.x), f.y), f.z);
    }
    float cocFbm(vec3 p) { return 0.5 * cocVN(p) + 0.25 * cocVN(p * 2.03 + 7.1) + 0.125 * cocVN(p * 4.1 + 3.3); }
    // even out the splats along the case (the scan is sparse at both ends of this axis)
    float cocEvenU(float x) {
      float k[10] = float[10](0.0, 0.034, 0.08, 0.118, 0.195, 0.324, 0.484, 0.625, 0.826, 1.0);
      float v[10] = float[10](0.0, 0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.99, 1.0);
      for (int i = 0; i < 9; i++) if (x <= k[i + 1]) return mix(v[i], v[i + 1], (x - k[i]) / (k[i + 1] - k[i]));
      return 1.0;
    }
  `)],
  statements: ({ inputs, outputs }) => dyno.unindentLines(/* glsl */`
    ${outputs.gsplat} = ${inputs.gsplat};
    vec3 W = ${inputs.gsplat}.center;
    vec4 q = ${inputs.gsplat}.quaternion;
    vec3 sc = ${inputs.gsplat}.scales;
    vec3 orig = ${inputs.gsplat}.rgba.rgb;
    vec3 h = cocHash3(${inputs.gsplat}.index);
    float T = ${inputs.t}, time = ${inputs.time};
    float side = W.x >= 0.0 ? 1.0 : -1.0;
    float span = smoothstep(0.4, 2.2, abs(W.x));

    // --- once out, the wings slowly open and close about the body axis
    float fa = ${inputs.flex} * span * side;
    vec2 pv = vec2(0.0, -0.6), rr = W.xy - pv;
    vec3 Wf = vec3(pv + vec2(cos(fa)*rr.x - sin(fa)*rr.y, sin(fa)*rr.x + cos(fa)*rr.y), W.z);

    // --- the chrysalis: wings rolled round a teardrop, body down the front seam, head at the bottom
    float u = cocEvenU(clamp((W.z + 2.3) / 6.9, 0.0, 1.0));
    float theta = clamp(W.x / 6.6, -1.0, 1.0) * 3.0;
    theta = mix(theta, (h.y * 2.0 - 1.0) * 3.14159, 1.0 - smoothstep(0.04, 0.3, u));    // the scan is patchy here: spread evenly round the crown
    float rad = cocRadius(u, theta, ${inputs.pulse});
    float e = 0.004;
    vec3 anchor = vec3(0.0, 3.6, 0.4);
    vec3 Lp = vec3(rad * sin(theta), -u * 4.9, rad * cos(theta));
    float prong = smoothstep(0.955, 1.0, u);
    Lp.x += sign(sin(theta) + 1e-4) * prong * 0.07;
    // analytic normal from neighbouring surface points
    float ru = cocRadius(u + e, theta, ${inputs.pulse}), rt = cocRadius(u, theta + e, ${inputs.pulse});
    vec3 du = vec3(ru * sin(theta), -(u + e) * 4.9, ru * cos(theta)) - Lp;
    vec3 dt = vec3(rt * sin(theta + e), Lp.y, rt * cos(theta + e)) - Lp;
    vec3 nL = normalize(cross(dt, du));
    if (dot(nL, vec3(sin(theta), 0.0, cos(theta))) < 0.0) nL = -nL;
    // three nested shells: a thin glassy cuticle, living green tissue, and the folded wings deep inside
    float layer = h.z < 0.3 ? 0.0 : (h.z < 0.62 ? 1.0 : 2.0);
    float depth = (layer == 0.0 ? 0.0 : (layer == 1.0 ? 0.04 : 0.11)) * clamp(rad / 1.3, 0.2, 1.0);
    vec3 C = anchor + cocRot(Lp - nL * depth, ${inputs.sx}, ${inputs.sz});
    vec3 nC = normalize(cocRot(nL, ${inputs.sx}, ${inputs.sz}));
    // lay each splat flat on the case: its thinnest axis along the surface normal
    vec3 thin = (sc.x <= sc.y && sc.x <= sc.z) ? vec3(1.0, 0.0, 0.0) : (sc.y <= sc.z ? vec3(0.0, 1.0, 0.0) : vec3(0.0, 0.0, 1.0));
    vec4 qC = cocQuatMul(cocQuatFromTo(normalize(cocQuatVec(q, thin)), nC), q);
    vec3 scC = sc * 1.3 * (1.0 - thin * 0.75) * mix(0.5, 1.0, smoothstep(0.0, 0.08, u)) * mix(1.0, 0.45, prong);

    // --- the case, built in layers so light passes into it and scatters back out
    vec3 sp = Lp * 3.0;
    float mott = cocFbm(sp * 1.3);
    float fine = cocVN(sp * 9.0);
    float speck = step(0.93, cocVN(sp * 22.0 + 11.0));
    float wrinkle = sin(u * 380.0 + sin(theta * 7.0) * 3.0 + cocFbm(sp * 2.2) * 14.0) * cocVN(sp * 3.0 + 5.0) * (1.0 - smoothstep(0.22, 0.4, u)) * smoothstep(0.03, 0.1, u);
    float wcU = clamp((u - 0.34) / 0.58, 0.0, 1.0);
    float outline = exp(-pow(abs(theta) - (0.5 + 0.5 * sin(3.14159 * wcU)), 2.0) / 0.0018) * step(0.34, u) * (1.0 - smoothstep(0.9, 0.96, u));
    float veins = 0.0;
    for (int i = 1; i <= 3; i++) veins += exp(-pow(abs(theta) - float(i) * 0.14 * (0.4 + 0.6 * sin(3.14159 * wcU)) - 0.02, 2.0) / 0.0006);
    veins *= smoothstep(0.38, 0.5, u) * (1.0 - smoothstep(0.85, 0.94, u));
    float keel = exp(-theta*theta * 140.0) * smoothstep(0.4, 0.6, u);
    float d1 = exp(-(pow((u - 0.3) * 55.0, 2.0) + pow((abs(theta) - 1.15) * 12.0, 2.0)));
    float d2 = exp(-(pow((u - 0.44) * 55.0, 2.0) + pow((abs(theta) - 0.85) * 12.0, 2.0)));
    float gold = clamp(d1 + d2, 0.0, 1.0);
    float lumO = dot(orig, vec3(0.3, 0.5, 0.2));
    float M = ${inputs.m};

    // lighting terms (view-dependent: the camera position comes in as a uniform)
    vec3 Vd = normalize(${inputs.cam} - C), Ld = normalize(vec3(-0.5, 0.75, 0.45));
