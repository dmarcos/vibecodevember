<style>
  :root { --ink: #f2efe6; --soft: #c6bfae; --bar: 56px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07050a; color: var(--ink); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  #slime { display: none; }
  .scrim { position: fixed; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,.45), transparent); }
  .bar { position: fixed; left: 0; right: 0; top: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(16px, 3vw, 36px); pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,.6); z-index: 3; }
  .brand { white-space: nowrap; font: 500 10px Inter, sans-serif; letter-spacing: .34em; text-transform: uppercase; color: var(--ink); opacity: .85; }
  .name { font: italic 400 24px 'Cormorant Garamond', Georgia, serif; letter-spacing: .05em; }
  #cc { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); font: italic 400 22px 'Cormorant Garamond', Georgia, serif; letter-spacing: .04em; color: #f4efe2; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.7); opacity: 0; transition: opacity .4s; white-space: nowrap; max-width: calc(100vw - 24px); pointer-events: none; z-index: 3; }
  #cc.on { opacity: 1; }
  #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); text-align: center; pointer-events: none; font-size: 10.5px; letter-spacing: .1em; color: var(--soft); text-shadow: 0 0 12px rgba(0,0,0,.9); z-index: 3; }
  #hint b { color: var(--ink); font-weight: 500; }
  #snd { position: fixed; right: clamp(16px, 3vw, 36px); bottom: 22px; z-index: 4; border: 1px solid rgba(242,239,230,.3); background: rgba(0,0,0,.3); color: var(--ink); border-radius: 16px; padding: 6px 12px; font: 500 10px Inter, sans-serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px); }
  #snd:hover { background: rgba(0,0,0,.5); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #050407; font: italic 400 24px 'Cormorant Garamond', Georgia, serif; color: #bdb4a2; letter-spacing: .06em; transition: opacity 1.2s; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
  body.shot .bar, body.shot #hint, body.shot .scrim, body.shot #snd, body.shot #loading, body.shot #cc { display: none !important; }
  body.capture #hint, body.capture #snd, body.capture #loading { display: none !important; }
  @media (max-width: 600px) {
    #snd { bottom: auto; top: 64px; }
    #hint { font-size: 10px; }
    .name { font-size: 20px; }
    .brand { letter-spacing: .2em; font-size: 9px; }
    #cc { font-size: 19px; bottom: 56px; }
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

// ============================================================================ constants
// Metres. Floor at y = 0, egg sits at the origin. Window on the back wall (-z),
// bed against the right wall (+x), dresser + TV on the left wall (-x), door in front (+z).
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot'), CAPTURE = Q.has('capture');
if (SHOT) document.body.classList.add('shot');
if (CAPTURE) document.body.classList.add('capture');
const COARSE = matchMedia('(pointer: coarse)').matches;
const ROOM = Q.has('room');   // default: the egg alone on a white studio set; ?room for the 80s bedroom
const TAU = Math.PI * 2;
const W = 5.4, D = 4.8, H = 2.6;
const EGG_RX = 0.235, EGG_HY = 0.31;
const THETA_H = 1.85;                        // below the lip: where drips, drool and webbing live
const NPET = 5;
const WIN = { x0: -1.45, x1: -0.35, y0: 1.0, y1: 2.0 };
const RUG_TOP = ROOM ? 0.011 : 0, RUG_RX = 1.25, RUG_RZ = 0.95;
const onRug = (x, z) => ROOM && (x / RUG_RX) ** 2 + (z / RUG_RZ) ** 2 < 1;
const BED = { x0: 0.75, x1: 2.7, z0: -1.8, z1: -0.8, top: 0.52 };
const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(1986);
const R = (a = 0, b = 1) => a + (b - a) * rnd();

// ---------------------------------------------------------------- CPU perlin (periodic)
const PERM = new Uint8Array(512);
{ const p = Array.from({ length: 256 }, (_, i) => i); for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y, z) { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14) ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
function pnoise(x, y, z, px = 256, py = 256) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const X0 = ((xi % px) + px) % px & 255, X1 = (((xi + 1) % px) + px) % px & 255;
  const Y0 = ((yi % py) + py) % py & 255, Y1 = (((yi + 1) % py) + py) % py & 255;
  const Z0 = zi & 255, Z1 = (zi + 1) & 255;
  x -= xi; y -= yi; z -= zi;
  const h = (X, Y, Z) => PERM[PERM[PERM[X] + Y] + Z];
  const u = fade(x), v = fade(y), w = fade(z);
  return lerp(
    lerp(lerp(grad(h(X0, Y0, Z0), x, y, z), grad(h(X1, Y0, Z0), x - 1, y, z), u), lerp(grad(h(X0, Y1, Z0), x, y - 1, z), grad(h(X1, Y1, Z0), x - 1, y - 1, z), u), v),
    lerp(lerp(grad(h(X0, Y0, Z1), x, y, z - 1), grad(h(X1, Y0, Z1), x - 1, y, z - 1), u), lerp(grad(h(X0, Y1, Z1), x, y - 1, z - 1), grad(h(X1, Y1, Z1), x - 1, y - 1, z - 1), u), v), w);
}
function fbm(x, y, z, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * pnoise(x * f, y * f, z * f); a *= 0.5; f *= 2.03; } return s; }
function fbmT(x, y, z, o, px, py) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * pnoise(x * f, y * f, z * f, px * f, py * f); a *= 0.5; f *= 2; } return s; }

// ---------------------------------------------------------------- GLSL noise
const SNOISE = /* glsl */`
vec3 snM3(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 snM4(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 snPerm(vec4 x){return snM4(((x*34.0)+10.0)*x);}
vec4 snTis(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=snM3(i);
  vec4 p=snPerm(snPerm(snPerm(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=snTis(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;
const BUMPN = /* glsl */`
vec3 bumpN(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float faceDir){
  vec3 sx=normalize(dFdx(surf_pos)); vec3 sy=normalize(dFdy(surf_pos));
  vec3 r1=cross(sy,surf_norm); vec3 r2=cross(surf_norm,sx);
  float det=dot(sx,r1)*faceDir;
  vec3 gr=sign(det)*(dHdxy.x*r1+dHdxy.y*r2);
  return normalize(abs(det)*surf_norm-gr);
}`;

// ============================================================================ renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT || CAPTURE });
const DPR = Math.min(devicePixelRatio, COARSE ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(ROOM ? 0x050308 : 0x050505);
if (ROOM) scene.fog = new THREE.FogExp2(0x0c0912, 0.05);
else { renderer.shadowMap.type = THREE.VSMShadowMap; renderer.toneMappingExposure = 1.2; }

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.03, 30);
camera.position.set(1.05, 0.82, 1.3);
if (Q.has('cam')) camera.position.fromArray(Q.get('cam').split(',').map(Number));

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.32, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 0.75;
controls.maxDistance = ROOM ? 1.95 : 2.6;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = 1.47;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.6;
controls.autoRotateSpeed = -0.35;

// ============================================================================ textures
function tex(c, { srgb = true, repeat = [1, 1] } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = MAXANISO;
  return t;
}
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

function woodTex(w, h, grooves, dark, light, seed) {
  const [c, g] = cnv(w, h), [cb, gb] = cnv(w, h);
  const id = g.createImageData(w, h), ib = gb.createImageData(w, h);
  for (let x = 0; x < w; x++) {
    let k = 0; while (k < grooves.length - 2 && x >= grooves[k + 1]) k++;
    const dE = Math.min(x - grooves[k], grooves[k + 1] - x);
    const tone = 0.8 + 0.4 * hash(k * 7 + seed);
    for (let y = 0; y < h; y++) {
      const warp = fbm(x * 0.006 + k * 3.1, y * 0.0016, seed, 3) * 70;
      const ring = Math.sin((x + warp) * 0.42 + k * 11) * 0.5 + 0.5;
      const streak = fbm(x * 0.09 + k * 5, y * 0.004, seed + 2, 2) * 0.5 + 0.5;
      let t = clamp(ring * 0.4 + streak * 0.8 - 0.15, 0, 1);
      let f = tone, b = 150 + t * 50;
      if (dE < 1.6) { f *= 0.22; b = 40; }
      const i = (y * w + x) * 4;
      id.data[i] = lerp(dark[0], light[0], t) * f; id.data[i + 1] = lerp(dark[1], light[1], t) * f; id.data[i + 2] = lerp(dark[2], light[2], t) * f; id.data[i + 3] = 255;
      ib.data[i] = ib.data[i + 1] = ib.data[i + 2] = b; ib.data[i + 3] = 255;
    }
  }
  g.putImageData(id, 0, 0); gb.putImageData(ib, 0, 0);
  return { map: tex(c), bump: tex(cb, { srgb: false }) };
}

function carpetTex() {
  const S = 256, [c, g] = cnv(S, S);
  const id = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const cl = fbmT(x / S * 4, y / S * 4, 0.5, 3, 4, 4) * 0.5 + 0.5;
    const v = 0.5 + 0.45 * cl + 0.4 * (Math.random() - 0.5);
    const i = (y * S + x) * 4;
    id.data[i] = 128 * v; id.data[i + 1] = 66 * v; id.data[i + 2] = 24 * v; id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  g.lineCap = 'round';
  for (let k = 0; k < 4200; k++) {
    const x = Math.random() * S, y = Math.random() * S, a = Math.random() * TAU, l = 2 + Math.random() * 5;
    const lt = Math.random();
    g.strokeStyle = lt > 0.5 ? `rgba(${180 + lt * 40},${100 + lt * 30},${40},0.55)` : `rgba(40,20,8,0.5)`;
    g.lineWidth = 0.8 + Math.random() * 1.1;
    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) {
      if (x + dx < -8 || x + dx > S + 8 || y + dy < -8 || y + dy > S + 8) continue;
      g.beginPath(); g.moveTo(x + dx, y + dy); g.lineTo(x + dx + Math.cos(a) * l, y + dy + Math.sin(a) * l); g.stroke();
    }
  }
  return tex(c, { repeat: [W / 0.32, D / 0.32] });
}

function noiseTex(S, scale, base, amp, rep) {
  const [c, g] = cnv(S, S), id = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const n = fbmT(x / S * scale, y / S * scale, 3.3, 4, scale, scale) * 0.5 + 0.5;
    const v = clamp(base + amp * (n - 0.5) + (Math.random() - 0.5) * amp * 0.6, 0, 255);
    const i = (y * S + x) * 4; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  return tex(c, { srgb: false, repeat: rep });
}

function bedspreadTex() {
  const S = 1024, [c, g] = cnv(S, S);
  g.fillStyle = '#1c1a45'; g.fillRect(0, 0, S, S);
  const r2 = mulberry32(80);
  const each = (x, y, fn) => { for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) { g.save(); g.translate(x + dx, y + dy); fn(); g.restore(); } };
  for (let k = 0; k < 70; k++) {
    const x = r2() * S, y = r2() * S, s = 30 + r2() * 60, a = r2() * TAU;
    const col = ['#21c7b8', '#ff3fa4', '#ffd23a', '#7b5cff'][k % 4];
    each(x, y, () => { g.rotate(a); g.fillStyle = col; g.beginPath(); g.moveTo(0, -s * 0.6); g.lineTo(s * 0.55, s * 0.4); g.lineTo(-s * 0.55, s * 0.4); g.closePath(); g.fill(); });
  }
  for (let k = 0; k < 60; k++) {
    const x = r2() * S, y = r2() * S, a = r2() * TAU, col = ['#ffd23a', '#ffffff', '#21c7b8', '#ff3fa4'][k % 4];
    each(x, y, () => { g.rotate(a); g.strokeStyle = col; g.lineWidth = 7; g.lineCap = 'round'; g.beginPath(); for (let i = 0; i <= 24; i++) { const xx = i * 4 - 48, yy = Math.sin(i * 0.8) * 10; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke(); });
  }
  for (let k = 0; k < 40; k++) {
    const x = r2() * S, y = r2() * S, a = r2() * TAU;
    each(x, y, () => { g.rotate(a); g.strokeStyle = '#ffffff'; g.lineWidth = 5; g.beginPath(); for (let i = 0; i < 6; i++) g.lineTo(i * 14 - 40, (i % 2) * 18 - 9); g.stroke(); });
  }
  for (let k = 0; k < 500; k++) {
    const x = r2() * S, y = r2() * S, col = ['#ffd23a', '#ff3fa4', '#21c7b8', '#fff'][k % 4];
    each(x, y, () => { g.fillStyle = col; g.beginPath(); g.arc(0, 0, 3 + r2() * 4, 0, TAU); g.fill(); });
  }
  // fabric weave
  const id = g.getImageData(0, 0, S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const i = (y * S + x) * 4, w = ((x + y) % 4 < 2 ? 0.92 : 1.0) * (0.9 + Math.random() * 0.1); id.data[i] *= w; id.data[i + 1] *= w; id.data[i + 2] *= w; }
  g.putImageData(id, 0, 0);
  return tex(c, { repeat: [1.4, 1.4] });
}

function agePaper(g, w, h, seed) {
  const r2 = mulberry32(seed);
  g.globalCompositeOperation = 'multiply';
  const gr = g.createRadialGradient(w / 2, h / 2, w * 0.2, w / 2, h / 2, w * 0.8);
  gr.addColorStop(0, 'rgba(255,250,235,1)'); gr.addColorStop(1, 'rgba(200,170,120,1)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'source-over';
  // fold creases
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(w / 2 + 2, 0); g.lineTo(w / 2 + 2, h); g.moveTo(0, h / 2 + 2); g.lineTo(w, h / 2 + 2); g.stroke();
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(${r2() > 0.5 ? '255,255,255' : '0,0,0'},${r2() * 0.12})`; g.fillRect(r2() * w, r2() * h, 1 + r2() * 2, 1 + r2() * 2); }
}

function bmoviePoster() {
  const w = 512, h = 768, [c, g] = cnv(w, h);
  const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1a0306'); bg.addColorStop(0.55, '#5a0a0a'); bg.addColorStop(1, '#120203');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  // rays
  g.save(); g.translate(w / 2, 470);

function splatTex(seed) {
  const S = 256, [c, g] = cnv(S, S), r2 = mulberry32(seed);

  g.beginPath();
  for (let i = 0; i <= n; i++) { const a = i / n * TAU, r = 62 * lob[i % n]; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? g.lineTo(x, y) : g.moveTo(x, y); }

  for (let i = 0; i < 26; i++) { const a = r2() * TAU, d = 80 + r2() * 40; g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, 1.5 + r2() * 5, 0, TAU); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function smokeTex() {
  const S = 128, [c, g] = cnv(S, S), id = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x / S - 0.5, dy = y / S - 0.5, r = Math.sqrt(dx * dx + dy * dy) * 2;

}

// ============================================================================ boot
(async () => {
  try { await Promise.race([Promise.all(['40px VT323', '40px Creepster', '40px Monoton', '40px "Permanent Marker"', '40px Bungee'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* fonts are optional */ }
  vaporMat.uniforms.tSmoke.value = smokeTex();
  let env;
  if (ROOM) {
    buildRoom();
    // wet reflections: capture the room from the egg's point of view
    eggRoot.visible = false; puddle.visible = false; vaporMesh.visible = false; dust.visible = false; drips.visible = false; for (const d of drool) d.tb.mesh.visible = false;
    for (const m of beamSheets) m.visible = false;
    const cubeRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType });
    const cubeCam = new THREE.CubeCamera(0.05, 20, cubeRT); cubeCam.position.set(0, 0.45, 0); scene.add(cubeCam);
    cubeCam.update(renderer, scene);
    env = new THREE.PMREMGenerator(renderer).fromCubemap(cubeRT.texture).texture;
    drips.visible = true; for (const d of drool) d.tb.mesh.visible = true;
    eggRoot.visible = true; puddle.visible = true; vaporMesh.visible = true; dust.visible = true;
    for (const m of beamSheets) m.visible = true;
  } else {
    env = buildStudio();
    bloom.threshold = 2.5; bloom.strength = 0.25; bloom.radius = 0.2;
    dust.visible = false;
    scene.environment = env; scene.environmentIntensity = 0.15;
  }
  for (const m of [eggMat, mantleMat, meatMat, blobMat, puddleMat, mucusMat, ...splats.flatMap((s) => [s.m.material, s.dm.material])]) { m.envMap = env; m.needsUpdate = true; }
  AO_HIDE.push(vaporMesh, dust, puddle, drips, ...beamSheets, ...drool.map((d) => d.tb.mesh), ...webs.map((w) => w.tb.mesh), ...splats.flatMap((s) => [s.m, s.dm]), ...strands.map((s) => s.tube.mesh), blobs);
  resize();
  if (Q.has('react')) setTimeout(() => { firstTap = false; for (const t of Q.get('react').split(',')) trigger(t); }, (+Q.get('at') || 1) * 1000);
  if (Q.has('hide')) for (const k of Q.get('hide').split(',')) { const o = { drips, drool: null, gtao: null, dust, vapor: vaporMesh, puddle, strands: null }[k]; if (o) o.visible = false; if (k === 'drool') drool.forEach((d) => { d.tb.mesh.visible = false; d.tb.mesh.layers.set(5); }); if (k === 'gtao' && gtao) gtao.enabled = false; if (k === 'bloom') bloom.enabled = false; if (k === 'drips') drips.layers.set(5); }
  requestAnimationFrame(frame);
  setTimeout(() => document.getElementById('loading').classList.add('done'), 300);
})();
</script>
</body>
</html>
