<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = x => Math.min(1, Math.max(0, x));
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// mostly linear, with just a touch of ease at both ends — a steady hand
const steady = x => { x = clamp01(x); return x * .82 + x * x * (3 - 2 * x) * .18; };
const eoExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const ramp = (u, tau) => u <= 0 ? 0 : u - tau * (1 - Math.exp(-u / tau)); // ∫ of a speed that eases 0 → 1
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(9);
const R = (a, b) => a + (b - a) * rng();
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

// palette (linear, HDR)
const DEEP  = [0.10, 0.30, 1.00];
const GLASS = [0.26, 0.64, 1.00];
const HOT   = [0.55, 0.88, 1.00];
const WARM  = [1.00, 0.44, 0.14];

// ---------------------------------------------------------------- timeline
// Shots are separated by hard cuts (a few frames dipped to black), like a title sequence.
const CUTS = [];
const T = {
  draw0: .6, draw1: 4.4,          // the pen traces the square
  ext0: 8.6, ext1: 11.6,          // square → cube
  burst: 20.6,                    // the inner lights collapse and detonate
  w1: 23.4,                       // cube → tesseract
};
const CAPS = [];                  // the dimension labels live in the scene now
// mind blown plays over everything; its head explosion (GIF frames 8–15) peaks right as the supernova
// detonates, and in that flash the meme drops behind the scene and the tesseract unfolds on top of it
const MEME = { start: 20.6 - 1.5, frames: 53, fps: 10, cols: 10, rows: 6, a: 18.8, b: 24.4, swap: 20.6 };

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
// ?capture renders deterministic frames on demand (window.__frame); ?audiorec plays in real time and records the mix
const CAPTURE = /[?&]capture\b/.test(location.search), AUDIOREC = /[?&]audiorec\b/.test(location.search);
if (CAPTURE) document.body.classList.add('capture');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE }); }
catch (e) { document.getElementById('error').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.03, 200);
const group = new THREE.Group();
scene.add(group);

const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(2, 2), .5, .5, .5);
composer.addPass(bloom);
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2() }, uT: { value: 0 }, uCA: { value: .0012 }, uGrain: { value: .04 }, uVig: { value: .5 }, uFade: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uT, uCA, uGrain, uVig, uFade; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv = vUv;
      vec2 c = uv - .5; float d2 = dot(c,c);
      vec2 off = c*uCA*(.35 + d2*4.);
      vec3 col = vec3(texture2D(tDiffuse, uv - off).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv + off).b);
      vec2 cc = c*vec2(uRes.x/uRes.y, 1.);
      col *= mix(1., smoothstep(1.2, .15, length(cc)), uVig);
      float l = dot(col, vec3(.2126, .7152, .0722));
      col += vec3(-.002, .004, .008)*(1. - smoothstep(0., .2, l));       // teal lift in the blacks
      col *= 1. + .012*sin(uT*31.) + .008*sin(uT*17.3);                  // projector flicker
      float n = h(floor(uv*uRes) + fract(uT*7.13)*vec2(91.7, 37.3)) - .5;
      col *= 1. + n*uGrain; col += n*.006;
      gl_FragColor = vec4(max(col, 0.)*uFade, 1.);
    }`
});
composer.addPass(finalPass);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- shaders
const additive = { transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide };
const lens = { uFocus: { value: 8 }, uAperture: { value: .01 } }; // thin-lens depth of field, shared

// glowing capsule between two points, billboarded around its axis, defocused away from the focal plane
const ribbonMat = new THREE.ShaderMaterial({
  ...additive, uniforms: lens,
  vertexShader: `
    uniform float uFocus, uAperture;
    attribute vec3 aA; attribute vec3 aB; attribute vec4 aC; attribute vec3 aW;
    varying vec2 vP; varying float vLen; varying vec4 vC; varying vec3 vW; varying float vBlur; varying float vWW;
    void main(){
      vec3 A = (modelViewMatrix*vec4(aA,1.)).xyz;
      vec3 B = (modelViewMatrix*vec4(aB,1.)).xyz;
      vec3 d = B - A; float len = length(d);
      vec3 t = len > 1e-5 ? d/len : vec3(1.,0.,0.);
      vec3 s = cross(t, normalize(-(A+B)*.5));
      float sl = length(s); s = sl > 1e-4 ? s/sl : vec3(0.,1.,0.);
      float cA = uAperture*abs(-A.z - uFocus), cB = uAperture*abs(-B.z - uFocus);
      float W = aW.y + max(cA, cB)*1.6, e = position.x*2. - 1.;
      vec3 p = mix(A, B, position.x) + t*e*W + s*position.y*W;
      vP = vec2(position.x*len + e*W, position.y*W);
      vLen = len; vC = aC; vW = aW; vWW = W; vBlur = mix(cA, cB, position.x);
      gl_Position = projectionMatrix*vec4(p, 1.);
    }`,
  fragmentShader: `
    varying vec2 vP; varying float vLen; varying vec4 vC; varying vec3 vW; varying float vBlur; varying float vWW;
    void main(){
      if (vC.a <= 0.) discard;
      float dx = max(max(-vP.x, vP.x - vLen), 0.);
      float dist = length(vec2(dx, vP.y));
      float edge = 1. - smoothstep(.5*vWW, vWW, dist);
      float cw = vW.x + vBlur*.5;
      float focusK = vW.x > 0. ? vW.x/cw : 0.;
      // crisp, anti-aliased hairline: at least ~1.5px wide whatever the distance, fading into a soft core when defocused
      float px = fwidth(vP.y);
      float hw = max(vW.x*.35, px*.75);
      float aa = max(fwidth(dist), 1e-5);
      float line = vW.x > 0. ? (1. - smoothstep(hw - aa*.5, hw + aa*.5, dist))*min(1., vW.x*.7/px + .35) : 0.;
      float soft = vW.x > 0. ? exp(-pow(dist/cw, 2.)) : 0.;
      float core = mix(soft*focusK, line, focusK*focusK);
      float g1 = vW.y*.12 + vBlur*.5, g2 = vW.y*.4 + vBlur*.7;
      float glow = exp(-dist/g1)*.3*(vW.y*.12/g1) + exp(-dist/g2)*.07*(vW.y*.4/g2);
      float f = vW.z > 0. ? smoothstep(0., vW.z, vP.x)*pow(1. - smoothstep(.35*vLen, vLen, vP.x), 1.5) : 1.;
      vec3 col = (vC.rgb*glow*edge*.75 + mix(vC.rgb, vec3(1.), vW.z < 0. ? .12 : .85)*core*2.6)*vC.a*f;
      gl_FragColor = vec4(min(col, vec3(64.)), 1.);
    }`
});

// star / flare sprite that turns into a bokeh disc when out of focus
const spriteMat = new THREE.ShaderMaterial({
  ...additive, uniforms: lens,
  vertexShader: `
    uniform float uFocus, uAperture;
    attribute vec3 aP; attribute vec4 aC; attribute vec4 aQ; attribute float aK;
    varying vec2 vUv; varying vec4 vC; varying vec4 vQ; varying float vK; varying float vBlur;
    void main(){
      vec4 mv = modelViewMatrix*vec4(aP, 1.);
      float coc = uAperture*abs(-mv.z - uFocus);
      float sz = aQ.x + coc*.9;
      float e = aQ.x/sz;
      mv.xy += position.xy*sz;
      gl_Position = projectionMatrix*mv;
      vUv = position.xy; vC = vec4(aC.rgb, aC.a*pow(e, .9)); vQ = aQ; vK = aK; vBlur = 1. - e;
    }`,
  fragmentShader: `
    varying vec2 vUv; varying vec4 vC; varying vec4 vQ; varying float vK; varying float vBlur;
    float spike(vec2 q, float w, float l){ return exp(-abs(q.y)*w)*pow(max(1. - abs(q.x)*l, 0.), 4.); }
    void main(){
      if (vC.a <= 0.) discard;
      vec2 u = vUv; float r = length(u);
      float cs = cos(vQ.y), sn = sin(vQ.y);
      vec2 q = mat2(cs, -sn, sn, cs)*u;
      vec2 q2 = mat2(.7071, -.7071, .7071, .7071)*q;
      float core = exp(-r*r*240.)*vK;
      float halo = exp(-r*r*12.)*.32 + exp(-r*5.5)*.14;
      float sp = spike(q, 80., 1.) + spike(q.yx, 80., 1.) + .3*(spike(q2, 110., 1.7) + spike(q2.yx, 110., 1.7));
      float st = exp(-abs(u.y)*140.)*pow(max(1. - abs(u.x), 0.), 2.);
      float m = 1. - smoothstep(.82, 1., max(abs(u.x), abs(u.y)));
      vec3 c = vC.rgb*vC.a;
      vec3 sharp = (mix(c, vec3(vC.a), .75)*core*3. + c*(halo + sp*vQ.z + st*vQ.w))*m;
      float disc = (1. - smoothstep(.86, .98, r))*(.55 + .45*smoothstep(.45, .95, r));
      vec3 bokeh = mix(c, vec3(vC.a), .3)*disc*(.35 + vK*.25);
      vec3 col = mix(sharp, bokeh, smoothstep(.2, .75, vBlur));
      gl_FragColor = vec4(min(col, vec3(64.)), 1.);
    }`
});

// x-ray glass face
const faceMat = new THREE.ShaderMaterial({
  ...additive,
  uniforms: { uCol: { value: new THREE.Color() }, uI: { value: 0 }, uSweep: { value: -1 }, uT: { value: 0 } },
  vertexShader: `
    attribute float aW; attribute float aSeed;
    varying vec2 vUv; varying float vW; varying float vSeed;
    void main(){ vUv = uv; vW = aW; vSeed = aSeed; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform vec3 uCol; uniform float uI, uSweep, uT;
    varying vec2 vUv; varying float vW; varying float vSeed;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), f.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++){ s += a*noise(p); p *= 2.07; a *= .5; } return s; }
    void main(){
      if (vW <= 0.) discard;
      vec2 u = clamp(vUv, 0., 1.);   // MSAA can sample far outside sliver triangles
      float d = min(min(u.x, 1. - u.x), min(u.y, 1. - u.y));
      float rim = exp(-d*16.)*.2 + exp(-d*70.)*.28;
      vec2 g = abs(fract(u*4. + .5) - .5);
      float grid = (exp(-g.x*90.) + exp(-g.y*90.))*.05;
      float cloud = fbm(u*3.2 + vSeed*7. + uT*.03);
      float fill = .018 + .04*cloud*cloud;
      float sheen = exp(-pow((u.x + u.y)*.5 - uSweep, 2.)*60.)*.12;
      vec3 col = uCol*(rim + grid + fill + sheen)*uI*vW;
      gl_FragColor = vec4(min(col, vec3(16.)), 1.);
    }`
});

// ---------------------------------------------------------------- smoke + background
const NOISE = `
  float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
  float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
    return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y); }
  const mat2 OCT = mat2(1.6, 1.2, -1.2, 1.6);
  float fbm5(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++){ s += a*vnoise(p); p = OCT*p; a *= .5; } return s; }
  float fbm3(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 3; i++){ s += a*vnoise(p); p = OCT*p; a *= .5; } return s; }
  // slow, curling, rising billows
  float smoke(vec2 p, float t){
    p.y -= t*.035;
    vec2 q = vec2(fbm5(p + vec2(0., t*.05)), fbm5(p + vec2(5.2, 1.3) - t*.045));
    return fbm5(p + 1.9*q + vec2(t*.025, -t*.04));
  }
  float smokeLite(vec2 p, float t){
    p.y -= t*.06;
    vec2 q = vec2(fbm3(p + vec2(0., t*.08)), fbm3(p + vec2(5.2, 1.3) - t*.07));
    return fbm3(p + 1.6*q);
  }
`;
const smokeU = {
  uRes: { value: new THREE.Vector2() }, uDpr: { value: 1 }, uT: { value: 0 }, uS2: { value: 0 }, uS3: { value: 0 }, uFlash: { value: 0 },
  uSeed: { value: 0 }, uPar: { value: new THREE.Vector2() }, uLight: { value: new THREE.Vector2() }, uLightCol: { value: new THREE.Vector3() },
  uFall: { value: 2 }, uDensity: { value: .6 }, uRayK: { value: 1 },
};
function glyphAtlas() {
  // the rain spells MIND BLOWN down every column
  const c = document.createElement('canvas'); c.width = 640; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.font = '600 44px ui-monospace, Menlo, monospace'; x.textAlign = 'center'; x.textBaseline = 'middle';
  [...'MIND BLOWN'].forEach((ch, i) => x.fillText(ch, i * 64 + 32, 34));
  const t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
  return t;

  const jf = 1 + pr * 1.6;   // the tremor gets quicker too
  const jit = (a, b, c) => Math.sin(t * a * jf) + .6 * Math.sin(t * b * jf + 1.7) + .35 * Math.sin(t * c * jf + 4.1);
  group.position.set(jit(71.3, 113.9, 167.1), jit(83.7, 129.1, 191.3), jit(67.9, 101.3, 157.7)).multiplyScalar(.022 * pr);
  group.rotation.x += jit(59.1, 97.3, 143.9) * .012 * pr;
  group.rotation.z = jit(63.7, 89.9, 151.1) * .012 * pr;
  const throb = 1 + pr * (.012 * Math.sin(t * 19 * jf) + .02 * Math.max(0, Math.sin(t * 5.3 * jf)) ** 8);
  group.scale.setScalar(throb);
  group.updateMatrixWorld();
  project(zE, wE, th);

  // camera
  const shot = shoot(t, p);
  mx += (tmx - mx) * .03; my += (tmy - my) * .03;
  const par = s2;
  camPos.addScaledVector(right.set(1, 0, 0).applyQuaternion(camera.quaternion), mx * .08 * par).y -= my * .05 * par;
  camPos.x += Math.sin(t * 47.1) * flash * .06; camPos.y += Math.sin(t * 39.7 + 1) * flash * .06;
  camPos.x += Math.sin(t * .7) * .012 * s2; camPos.y += Math.sin(t * .53 + 2) * .01 * s2;    // handheld breath
  camera.position.copy(camPos); camera.lookAt(camTgt);
  if (camera.fov !== shot.fov) { camera.fov = shot.fov; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
  right.setFromMatrixColumn(camera.matrixWorld, 0); up.setFromMatrixColumn(camera.matrixWorld, 1); back.setFromMatrixColumn(camera.matrixWorld, 2);
  lens.uFocus.value = shot.focus; lens.uAperture.value = shot.ap;

  // shape
  const ec = mix3(mix3(DEEP, GLASS, s2), HOT, s3);
  const ek = (1.0 + .35 * s2 + 1.4 * s3 + build * .8 + flash * 3) * (1 + pr * (.18 * Math.sin(t * 47 * jf) + .5 * pr));
  const coreW = .007 + .002 * s3, glowW = .085 + .03 * s3 + .02 * s2;
  EDGES.forEach((e, k) => {
    let A = P[e.i], B = P[e.j], w = weight(e.i, [e.axis]);
    if (e.draw >= 0) {
      const q = clamp01(p - e.draw);
      if (e.rev) [A, B] = [B, A];
      B = tmp.lerpVectors(A, B, q);
      if (q <= 0) w = 0;
    }
    setRib(edges, k, A, B, ec, ek * w, coreW, glowW);
  });
  edges.flush();

  for (let i = 0; i < 16; i++) {
    let w = weight(i, []);
    if (i in CORNER_AT) {
      const d = p - CORNER_AT[i];
      w = d < 0 && t < 6 ? 0 : 1 + 2.5 * Math.exp(-Math.max(d, 0) * 3) * (t < 6 ? 1 : 0);
      if (i === 0 && p > 0 && p < 4) w = 1;
      if (i === 0 && p >= 4) w = 1 + 2.5 * Math.exp(-(t - T.draw1) * 3) * (t > T.draw1 && t < 7 ? 1 : 0);
      if (t < T.draw0) w = .6 * sstep(0, T.draw0, t);
    }
    setSpr(verts, i, P[i], ec, w * (.6 + .6 * s3 + flash * 2), .12 + .05 * s3, 0, 0, 0, .8);
  }
  const lTip = updateLabels(t, ec, ek, coreW, glowW, zE);
  if (p > 0 && p < 4) setSpr(verts, 16, penAt(p, tmp), [.7, .9, 1], 1.6, .14, 0, 0, 0, 1.4);
  else if (lTip) setSpr(verts, 16, lTip, [.7, .9, 1], 1.4, .11, 0, 0, 0, 1.4);
  else setSpr(verts, 16, ZERO, HOT, 0, .1);
  verts.flush();

  const fc = mix3(mix3(DEEP, GLASS, s2), HOT, s3);
  faceMat.uniforms.uCol.value.setRGB(fc[0], fc[1], fc[2]);
  faceMat.uniforms.uI.value = s1 * (.5 - .05 * s2 - .25 * s3 + flash) * (1 - .62 * sstep(12, 16, t) * (1 - sstep(20, 21, t)));
  faceMat.uniforms.uSweep.value = ((t * .09) % 1.6) * 1.6 - .6;
  faceMat.uniforms.uT.value = t;
  FACES.forEach((f, k) => {
    for (let c = 0; c < 4; c++) { const v = P[f.v[c]]; fPos[k * 12 + c * 3] = v.x; fPos[k * 12 + c * 3 + 1] = v.y; fPos[k * 12 + c * 3 + 2] = v.z; }
    fW.fill(weight(f.i, f.dirs), k * 4, k * 4 + 4);
  });
  faceGeo.attributes.position.needsUpdate = true; faceGeo.attributes.aW.needsUpdate = true;

  // inner lights: ignite in the cube, gather into one point, burst, return transfigured
  const conv = sstep(18.6, T.burst, t) * (1 - sstep(21.2, 24.2, t));
  const zs = Math.max(zE, .02);
  const lc = mix3(WARM, HOT, s3);
  let warmSum = 0;
  LIGHTS.forEach((L, i) => {
    L.cur.set(L.p.x + .1 * Math.sin(t * .31 + L.ph), L.p.y + .1 * Math.sin(t * .27 + L.ph * 1.3), (L.p.z + .1 * Math.sin(t * .23 + L.ph * .7)) * zs)
      .multiplyScalar((1 - conv * .97) * (1 + .25 * s3));
    const ap = sstep(L.t0, L.t0 + 1.1, t);
    const pop = t > L.t0 ? Math.exp(-(t - L.t0) * 2.2) * 2.5 : 0;
    L.k = ap * (1.5 + .35 * Math.sin(t * 1.9 + L.ph) + pop + 3 * build) * (1 - .5 * conv);
    warmSum += L.k;
    setSpr(lightSpr, i, L.cur, lc, L.k, L.size * (1 + .5 * build), 0, 0, .12, 1.3);
  });
  PAIRS.forEach(([a, b, ph, sp], k) => {
    const La = LIGHTS[a], Lb = LIGHTS[b];
    const fk = Math.min(La.k, Lb.k) * .22 * (1 - conv);
    setRib(filaments, k, La.cur, Lb.cur, lc, fk, .004, .05);
    const u = (t * sp + ph) % 1;
    setSpr(lightSpr, LIGHTS.length + k, tmp.lerpVectors(La.cur, Lb.cur, u), lc, fk * 3 * Math.sin(u * Math.PI), .07, 0, .3, 0, 1);
  });
  filaments.flush();
  const ck = build * 3 + flash * 5 + s3 * (.45 + .1 * Math.sin(t * 2.3));
  const ci = LIGHTS.length + PAIRS.length;
  setSpr(lightSpr, ci, ZERO, [.6, .85, 1], ck, .5 + build * .4 + flash * 1.3 - s3 * .25, 0, 0, .35, 1.2);
  setSpr(lightSpr, ci + 1, ZERO, HOT, 0, .1);
  lightSpr.flush();

  MOTES.forEach((m, i) => {
    tmp.set(m.p.x + .04 * Math.sin(t * .4 + m.ph), m.p.y + .05 * Math.sin(t * .33 + m.ph * 2), (m.p.z + .04 * Math.cos(t * .37 + m.ph)) * zs);
    if (s3 > 0) tmp.multiplyScalar(1 + .5 * s3);
    let lit = 0;
    for (const L of LIGHTS) lit += L.k / (1 + L.cur.distanceToSquared(tmp) * 40);
    const c = mix3(mix3(GLASS, WARM, clamp01(lit * .4) * (1 - s3)), HOT, s3);
    setSpr(motes, i, tmp, c, s2 * m.f * (.12 + lit * .45 + s3 * .5) * (.7 + .3 * Math.sin(t * 2 + m.ph * 5)), m.s, 0, 0, 0, 1);
  });
  motes.flush();

  // lens dust, fixed to the camera
  const th2 = Math.tan(camera.fov * Math.PI / 360);
  const dc = mix3(mix3(DEEP, WARM, .5 * clamp01(warmSum / 12) * (1 - s3)), HOT, s3);
  DUST.forEach((d, i) => {
    const z = d.z, x = (d.x + .03 * Math.sin(t * .11 + d.ph)) * z * th2 * camera.aspect;
    const y = ((d.y + .04 * Math.sin(t * .09 + d.ph * 2) + t * .01 + 1) % 2 - 1) * z * th2;
    tmp.copy(camPos).addScaledVector(right, x).addScaledVector(up, y).addScaledVector(back, -z);
    setSpr(dust, i, tmp, dc, d.f * (.35 + .3 * s3 + flash * 2) * (.75 + .25 * Math.sin(t * .8 + d.ph)), d.s, 0, 0, 0, 1);
  });
  dust.flush();

  // rays
  RAYS.forEach((r, i) => {
    const a = r.a + t * .012;
    const dir = tmp2.copy(right).multiplyScalar(Math.cos(a)).addScaledVector(up, Math.sin(a)).addScaledVector(back, -r.z).normalize();
    const g = eoExpo(clamp01((t - r.ts) / 1.1));
    const len = .25 + r.L * g;
    const A = tmp.copy(dir).multiplyScalar(.25), B = tmp3.copy(dir).multiplyScalar(len);
    const tw = 1 + .2 * Math.sin(t * 2.6 + r.ph);
    // after the blast the rays bleed away slowly, each at its own pace
    const on = g > 0 ? (1 - sstep(r.ts + r.hold, r.ts + r.hold + r.dim, t)) ** 1.4 : 0;
    setRib(rayCore, i, A, B, HOT, on * .75 * tw, .005, .07, 1.6);
    B.copy(dir).multiplyScalar(.25 + 16 * g);
    setRib(rayBeam, i, A, B, [.15, .45, 1], on * .05, 0, .45, 3.5);
    B.copy(dir).multiplyScalar(len);
    const arrive = t - (r.ts + .55);
    const fk = on * (arrive > 0 ? .9 + 2 * Math.exp(-arrive * 3) : .6) * tw;
    setSpr(rayFlare, i, B, HOT, 0, .1);
  });
  rayCore.flush(); rayBeam.flush(); rayFlare.flush();

  STREAM.forEach((s, i) => {
    const d = ((t - T.burst) * s.v + s.ph) % 12;
    const dir = tmp2.copy(right).multiplyScalar(Math.cos(s.a)).addScaledVector(up, Math.sin(s.a)).addScaledVector(back, -s.z).normalize();
    tmp.copy(dir).multiplyScalar(.6 + d);
    setSpr(stream, i, tmp, HOT, (t > T.burst ? s3 : 0) * sstep(0, 1.5, d) * (1 - sstep(6, 12, d)) * 1.2, s.s, 0, 0, 0, 1);
  });
  stream.flush();

  const age = t - T.burst;
  boomMat.uniforms.uAge.value = age;
  boomMat.uniforms.uSize.value = 5.6;
  DEBRIS.forEach((d, i) => {
    const on = age > 0 && age < d.life;
    tmp.copy(d.d).multiplyScalar(d.v * (1 - Math.exp(-Math.max(age, 0) * 1.4)) / 1.4);
    setSpr(debris, i, tmp, d.c, on ? 2.2 * Math.pow(1 - age / d.life, 1.5) : 0, d.s, 0, 0, .5, 1.3);
  });
  debris.flush();

  // sparks: failure bursts get more frequent and violent as the pressure climbs
  group.updateMatrixWorld();
  spGW.setFromMatrixPosition(group.matrixWorld);
  SPCH.forEach((ch, c) => {
    const cyc = Math.floor((t + ch.ph) / ch.per), bt = cyc * ch.per - ch.ph, q = prAt(bt);
    const live = q > .02 && ch.gate < q * 1.15;
    const e = CUBE_EDGES[Math.floor(hsh(ch.seed, cyc) * CUBE_EDGES.length)];
    spO.lerpVectors(P[e.i], P[e.j], .1 + .8 * hsh(ch.seed + 1, cyc)).applyMatrix4(group.matrixWorld);
    spN.copy(spO).sub(spGW).normalize();
    const ab = t - bt; // arc flash: a blue-white short at the failure point
    setSpr(sparkArc, c, spO, [.8, .88, 1], live ? (2.2 + 2 * q) * Math.exp(-ab * 22) * (1 + .5 * Math.sin(ab * 300)) : 0, .07 + .06 * q, 0, 0, 0, 1.5);
    for (let j = 0; j < SP_N; j++) {
      const i = c * SP_N + j, sd = ch.seed + j * 13.7;
      const a = ab - .16 * hsh(sd + 2, cyc) ** 2; // fragments sputter out over ~0.16s
      const life = lerp(.45, 1.6, hsh(sd + 3, cyc)) * (.8 + .4 * q);
      if (!live || a <= 0 || a > life || j > 5 + q * SP_N) { setRib(sparkRib, i, ZERO, ZERO, HOT, 0, 0, .01); continue; }
      // launch: mostly outward from the seam, wide spray, a few fast ones
      spV.set(hsh(sd + 4, cyc) - .5, hsh(sd + 5, cyc) - .5, hsh(sd + 6, cyc) - .5).multiplyScalar(2.2).addScaledVector(spN, 1)
        .normalize().multiplyScalar(lerp(1.1, 4.6, hsh(sd + 7, cyc) ** 1.6) * (1 + .7 * q));
      const drag = lerp(1.1, 2.6, hsh(sd + 8, cyc));
      // x(a) = o + (v - g/k)(1 - e^-ka)/k + (g/k)a ; v(a) = (v - g/k)e^-ka + g/k
      const ek = Math.exp(-drag * a);
      spA.copy(spV).addScaledVector(GRAV, -1 / drag);
      const head = tmp2.copy(spO).addScaledVector(spA, (1 - ek) / drag).addScaledVector(GRAV, a / drag);
      const vel = spA.multiplyScalar(ek).addScaledVector(GRAV, 1 / drag);
      const tail = tmp3.copy(head).addScaledVector(vel, -SHUTTER);
      if (tail.distanceToSquared(head) < 1e-6) tail.y += .001;
      // cooling: radiative, small fragments die first; some pop (carbon burst) late in life
      const th = Math.exp(-a / (life * .32));
      let k = (.5 + 2.4 * th ** 3) * (1 - sstep(.75, 1, a / life));
      if (hsh(sd + 9, cyc) < .18) { const pa = life * lerp(.4, .7, hsh(sd + 10, cyc)); k *= 1 + 5 * Math.exp(-(((a - pa) / .025) ** 2)); }
      k *= 1 + .25 * Math.sin(a * 140 + i * 2.1); // shimmer as they tumble
      setRib(sparkRib, i, tail, head, blackbody(th, spCol), k * (1.2 + q), .0016, .009, -1);
    }
  });
  sparkRib.flush(); sparkArc.flush();

  // smoke lighting: the pen while drawing, then the subject's heart
  if (p > 0 && p < 4) lightW.copy(penAt(p, tmp)).applyMatrix4(group.matrixWorld); else lightW.set(0, 0, 0);
  const lp = tmp.copy(lightW).project(camera);
  const behind = lp.z > 1 ? 0 : 1;
  smokeU.uLight.value.set(lp.x * .5 * camera.aspect, lp.y * .5);
  const blueI = (p > 0 && p < 4 ? .9 : .25 + .35 * s1) * (1 - s3);
  const warmI = Math.min(warmSum, 14) * .03 * (1 - s3);
  const hotI = s3 * .6 + flash * 1.4 + build * .4;
  smokeU.uLightCol.value.set(
    (DEEP[0] * blueI + WARM[0] * warmI + HOT[0] * hotI) * behind,
    (DEEP[1] * blueI + WARM[1] * warmI + HOT[1] * hotI) * behind,
    (DEEP[2] * blueI + WARM[2] * warmI + HOT[2] * hotI) * behind);
  smokeU.uFall.value = lerp(2.0, 1.1, s3);
  smokeU.uDensity.value = .7 + .15 * build - .1 * s3;
  smokeU.uRayK.value = 1 - .8 * sstep(T.burst + 3, T.burst + 9, t);
  smokeU.uSeed.value = shot.seed;
  smokeU.uPar.value.set(Math.atan2(camPos.x, camPos.z) * .35, Math.asin(clamp01((camPos.y / camPos.length() + 1) / 2) * 2 - 1) * .35);
  smokeU.uT.value = t;
  smokeU.uS2.value = s2;
  smokeU.uS3.value = s3;
  smokeU.uFlash.value = flash * .3;

  bloom.strength = .28 + flash * .5 + build * .15;
  bloom.radius = .45 + .15 * s3;
  bloom.threshold = .7 + .3 * s3;
  renderer.toneMappingExposure = 1 + flash * .3;
  finalPass.uniforms.uT.value = t;
  finalPass.uniforms.uCA.value = .0006 + .0006 * s3 + flash * .008;
  finalPass.uniforms.uFade.value = fade;

  // labels and the meme
  const fcL = mix3(DEEP, GLASS, s2);
  // fades in just before, out as its galaxy dissolve melts into the nebulae
  const mOp = sstep(MEME.a, MEME.a + .4, t) * (1 - sstep(22.9, MEME.b, t));
  memeMat.uniforms.uOp.value = mOp * (t < MEME.swap ? .96 : 1);
  memeQuad.renderOrder = t < MEME.swap ? 2000 : -900;
  memeMat.uniforms.uZoom.value = 1.05 - .05 * clamp01((t - MEME.a) / 5);
  memeMat.uniforms.uFrame.value = Math.min(MEME.frames - 1, Math.max(0, Math.floor((t - MEME.start) * MEME.fps)));

  // ui
  const ci2 = CAPS.findIndex(c => t >= c.a && t < c.b);
  if (ci2 !== capOn) {
    if (ci2 >= 0) {
      const c = CAPS[ci2];
      cap.className = c.pos;
      cL.textContent = c.l;
      void cap.offsetWidth;
      cap.classList.add('on');
    } else cap.classList.remove('on');
    capOn = ci2;
  }
  const stage = t < 7.6 ? 0 : t < 17.6 ? 1 : 2;
  navBtns.forEach((b, i) => b.classList.toggle('on', i === stage));
  trackFill.style.width = (clamp01(t / 25) * 100).toFixed(2) + '%';

  updateAudio(t, { p, s2, s3, build, fade, pr, pen: (p > 0 && p < 4) || !!lTip });
}

// ---------------------------------------------------------------- resize / loop
function resize() {
  const w = innerWidth, h = innerHeight;
  const bar = CAPTURE ? 0 : Math.round(Math.min(h * .11, Math.max(h * .055, (h - w / 2.2) / 2)));
  document.documentElement.style.setProperty('--bar', bar + 'px');
  visFrac = (h - 2 * bar) / h;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  smokeU.uRes.value.copy(db); smokeU.uDpr.value = renderer.getPixelRatio();
  finalPass.uniforms.uRes.value.copy(db);
}
addEventListener('resize', resize);
resize();

if (CAPTURE) {
  window.__frame = i => { clock = i / 30; t = storyT(clock); update(t); composer.render(); return t; };
  window.__ready = true;
} else if (AUDIOREC) {
  window.__recordAudio = secs => new Promise(res => {
    setSound(true); au.master.gain.cancelScheduledValues(0); au.master.gain.value = .8;
    const rec = new MediaRecorder(window.__audioStream, { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 256000 }), parts = [];
    rec.ondataavailable = e => parts.push(e.data);
    rec.onstop = async () => { const b = new Uint8Array(await new Blob(parts).arrayBuffer()); let s = ''; for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode(...b.subarray(i, i + 32768)); res(btoa(s)); };
    rec.start();
    const t0 = performance.now();
    renderer.setAnimationLoop(now => {
      clock = (now - t0) / 1000; t = storyT(clock); update(t); composer.render();
      if (clock > secs) { renderer.setAnimationLoop(null); rec.stop(); }
    });
  });
  window.__ready = true;
} else {
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) clock += dt;
  t = storyT(clock);
  update(t);
  composer.render();
});
requestAnimationFrame(() => document.getElementById('black').classList.add('out'));
}
</script>
</body>
</html>
