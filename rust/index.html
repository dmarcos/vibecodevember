const controls = new OrbitControls(camera, canvas);

// ============================================================================ helpers
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function hashJS(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {

  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);

  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbmJS(x, y, o = 4) { let s = 0, a = 0.5, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x, y); n += a; x = x * 2.03 + 17.1; y = y * 2.03 - 9.2; a *= 0.5; } return s / n; }

function prep(g) { g = g.index ? g.toNonIndexed() : g; for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k); return g; }
function merge(list) { return mergeGeometries(list.map(prep), false); }
function box(w, h, d, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (rx || ry || rz) g.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx, ry, rz)));
  g.translate(x, y, z); return g;
}
function cylBetween(a, b, r1, r0, seg = 6, open = true) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const g = new THREE.CylinderGeometry(r1, r0, len, seg, 1, open);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()));
  g.translate((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2); return g;
}
const rotY = (g, a) => g.applyMatrix4(new THREE.Matrix4().makeRotationY(-a));
function lathe(pts, seg = 128) { return new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg); }
const f2 = (n) => n.toFixed(3);
function rectSD(x, z, r) { const dx = Math.abs(x - r[0]) - r[2] + r[4], dz = Math.abs(z - r[1]) - r[3] + r[4]; return Math.hypot(Math.max(dx, 0), Math.max(dz, 0)) + Math.min(Math.max(dx, dz), 0) - r[4]; }

// ============================================================================ procedural noise texture (tileable)
// R, G: gradient fbm   B: worley F1 (cells / pits / flakes)   A: fine fbm grain
function makeNoise(N = 512) {
  const data = new Uint8Array(N * N * 4);
  const GX = new Float32Array(16), GY = new Float32Array(16);
  for (let i = 0; i < 16; i++) { GX[i] = Math.cos(i / 16 * Math.PI * 2); GY[i] = Math.sin(i / 16 * Math.PI * 2); }
  const ih = (x, y, s) => { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return h >>> 0; };
  function gn(x, y, P, s) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const x0 = ((ix % P) + P) % P, y0 = ((iy % P) + P) % P, x1 = (x0 + 1) % P, y1 = (y0 + 1) % P;
    let k;
    k = ih(x0, y0, s) & 15; const n00 = GX[k] * fx + GY[k] * fy;
    k = ih(x1, y0, s) & 15; const n10 = GX[k] * (fx - 1) + GY[k] * fy;
    k = ih(x0, y1, s) & 15; const n01 = GX[k] * fx + GY[k] * (fy - 1);
    k = ih(x1, y1, s) & 15; const n11 = GX[k] * (fx - 1) + GY[k] * (fy - 1);
    const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
    const a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
    return a + (b - a) * v;
  }
  function fbm(u, v, P0, oct, s) { let sum = 0, amp = 1, norm = 0, P = P0; for (let o = 0; o < oct; o++) { sum += amp * gn(u * P, v * P, P, s + o * 31); norm += amp; amp *= 0.5; P *= 2; } return sum / norm; }
  function worley(u, v, C, s) {
    const x = u * C, y = v * C, ix = Math.floor(x), iy = Math.floor(y); let d1 = 9;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const cx = ix + i, cy = iy + j, wx = ((cx % C) + C) % C, wy = ((cy % C) + C) % C;
      const h = ih(wx, wy, s), px = cx + (h & 1023) / 1023, py = cy + ((h >>> 10) & 1023) / 1023;
      const d = Math.hypot(px - x, py - y); if (d < d1) d1 = d;
    }
    return d1;
  }
  const c255 = (v) => Math.max(0, Math.min(255, Math.round(v)));
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const u = i / N, v = j / N, k = (j * N + i) * 4;
    data[k] = c255(128 + fbm(u, v, 4, 6, 1) * 330);
    data[k + 1] = c255(128 + fbm(u, v, 5, 6, 7) * 330);
    data[k + 2] = c255(worley(u, v, 16, 3) * 235);
    data[k + 3] = c255(128 + fbm(u, v, 32, 3, 11) * 300);
  }
  const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true; t.anisotropy = 8; t.needsUpdate = true;
  return { tex: t, data, N };
}
function makeNormalTex(src, N, strength) {
  const out = new Uint8Array(N * N * 4);
  const H = (i, j) => { i = (i + N) % N; j = (j + N) % N; const k = (j * N + i) * 4; return src[k] / 255 + 0.5 * src[k + 1] / 255; };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const dx = (H(i + 1, j) - H(i - 1, j)) * strength, dy = (H(i, j + 1) - H(i, j - 1)) * strength;
    const l = Math.hypot(dx, dy, 1), k = (j * N + i) * 4;
    out[k] = (-dx / l * 0.5 + 0.5) * 255; out[k + 1] = (-dy / l * 0.5 + 0.5) * 255; out[k + 2] = (1 / l * 0.5 + 0.5) * 255; out[k + 3] = 255;
  }
  const t = new THREE.DataTexture(out, N, N, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = true; t.anisotropy = 8; t.needsUpdate = true; return t;
}
const NOISE = makeNoise(512);
const WATER_N = makeNormalTex(NOISE.data, NOISE.N, 22);

// ============================================================================ shared uniforms
const U = {
  uYear: { value: 0 }, uTime: { value: 0 }, uSeason: { value: 0 }, uAutumn: { value: 0 }, uFrost: { value: 0 }, uGlint: { value: +(Q.get("glint") || 45) },
  uNoise: { value: NOISE.tex }, uSea: { value: SEA }, uTileDir: { value: TILE_DIR },
};

const COMMON_GLSL = /* glsl */`
uniform sampler2D uNoise;
uniform float uYear, uTime, uSeason;
float aH11(float n){ return fract(sin(n * 127.1 + 3.7) * 43758.5453); }
float aH21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 sRGB(vec3 c){ return pow(c, vec3(2.2)); }
vec3 perturbH(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float faceDir){
  vec3 vSigmaX = dFdx(surf_pos), vSigmaY = dFdy(surf_pos);
  vec3 R1 = cross(vSigmaY, surf_norm), R2 = cross(surf_norm, vSigmaX);
  float fDet = dot(vSigmaX, R1) * faceDir;
  vec3 vGrad = sign(fDet) * (dHdxy.x * R1 + dHdxy.y * R2);
  return normalize(abs(fDet) * surf_norm - vGrad);
}
`;

// ============================================================================ the ageing metal shader (steel, rust, tiles)
const AGE_GLSL = /* glsl */`
uniform sampler2D uNoise;
uniform float uYear, uRing0, uRate, uFlapSide, uWave, uFrost;
uniform vec3 uSea, uTileDir, uBase;
uniform vec3 uSunDir; uniform float uGlint;
varying vec3 vWP; varying vec3 vWN; varying vec3 vOP; varying vec3 vON; varying vec3 vAX; varying vec3 vAY; varying vec3 vAZ;
#define C_ 28.274334
#define PI_ 3.14159265
#define FROST_TOP 0.
#define FROST_CD 0.
vec2 gDX, gDY; float gPW; float gUp, gDn, gSeaF, gLow, gT, gTr;
vec3 h32(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
float h11(float n){ return fract(sin(n * 127.1 + 3.7) * 43758.5453); }
vec3 sRGB(vec3 c){ return pow(c, vec3(2.2)); }
vec4 T(vec2 uv, vec2 per){ vec2 s = 1. / per; return textureGrad(uNoise, uv * s, gDX * s, gDY * s); }
vec4 TB(vec2 uv, vec2 per, float b){ vec2 s = 1. / per; return textureGrad(uNoise, uv * s, gDX * s * b, gDY * s * b); }
vec4 TR(vec2 uv, vec2 per, float a){
  mat2 m = mat2(cos(a), sin(a), -sin(a), cos(a)); vec2 s = 1. / per;
  return textureGrad(uNoise, (m * uv) * s, (m * gDX) * s, (m * gDY) * s);
}
// skin waviness + orange peel: smooth fields sampled at fixed coarse LODs so their slopes stay continuous
float waveH(vec2 uv, float fPeel){
  float w = (textureLod(uNoise, uv / vec2(C_ / 6., 5.37), 2.5).g - .5) * .02 + (textureLod(uNoise, uv / vec2(C_ / 3., 11.9), 2.5).r - .5) * .035;
  w += (textureLod(uNoise, uv / vec2(C_ / 256., .1187), 3.).g - .5) * .00005 * fPeel;
  return w;
}
vec3 perturbA(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float faceDir){
  vec3 vSigmaX = dFdx(surf_pos), vSigmaY = dFdy(surf_pos);
  vec3 R1 = cross(vSigmaY, surf_norm), R2 = cross(surf_norm, vSigmaX);
  float fDet = dot(vSigmaX, R1) * faceDir;
  vec3 vGrad = sign(fDet) * (dHdxy.x * R1 + dHdxy.y * R2);
  return normalize(abs(fDet) * surf_norm - vGrad);
}
vec4 hexCell(vec2 p){
  const vec2 s = vec2(1., 1.7320508);
  vec4 hC = floor(vec4(p, p - vec2(.5, 1.)) / s.xyxy) + .5;
  vec4 h = vec4(p - hC.xy * s, p - (hC.zw + .5) * s);
  return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, hC.xy) : vec4(h.zw, hC.zw + .5);
}

// corrosion pits: each 9 cm cell may host a pit that, once active, weeps a rust tail downwards
vec4 pitField(vec2 uv, float act){
  const float NC = 314.; float csx = C_ / NC; const float csy = .09;
  vec2 g = vec2((uv.x + C_ * .5) / csx, uv.y / csy);
  vec2 id = floor(g);
  vec2 q = vec2(uv.x + C_ * .5, uv.y);
  float core = 0., halo = 0., tail = 0.;
  for (int dj = 0; dj <= 4; dj++) for (int di = -1; di <= 1; di++) {
    vec2 c = id + vec2(float(di), float(dj));
    vec3 r = h32(vec2(mod(c.x, NC), c.y) + 17.);
    if (r.z >= act) continue;
    float age = clamp((act - r.z) / .12, 0., 1.);

    vec2 d = q - pp;

    float dist = length(d * vec2(1., .85));
    core = max(core, 1. - smoothstep(rad * .55, rad + gPW, dist));
    halo = max(halo, (1. - smoothstep(rad, rad * (2. + 2.5 * r.y) + gPW, dist)) * (.2 + .5 * age));

    float L = mix(.03, .42, r.y * r.y) * (.3 + .7 * age);
    float w = rad * (.6 + dy * (2. + 6. * r.x)) + gPW * .6;

    tail = max(tail, tl * (.2 + .6 * age) * (.5 + .5 * r.y));
  }
  return vec4(core, halo, tail, 0.);
}
// oxide scale plates: procedural worley with F2-F1 edges (crack network) and a per-plate id
vec3 scalePlates(vec2 uv, vec2 warp){
  const float NC = 471.; float cs = C_ / NC;
  vec2 g = vec2((uv.x + C_ * .5) / cs, uv.y / cs) + warp;
  vec2 id = floor(g), f = fract(g);
  float f1 = 9., f2 = 9., hid = 0.;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = id + vec2(float(i), float(j));
    vec3 r = h32(vec2(mod(c.x, NC), c.y) + 3.1);
    vec2 pt = vec2(float(i), float(j)) + .5 + (r.xy - .5) * .9;
    float d = length(pt - f);
    if (d < f1) { f2 = f1; f1 = d; hid = r.z; } else if (d < f2) f2 = d;
  }
  return vec3(f1, f2 - f1, hid);
}

struct S {
  float h, frost, rd, tea, rust, heavy, crack, flaked, plateEdge, bead, haz, dSeam, panel, pcore, phalo, ptail, streak, tile, felt, bare, tgap, tRid, bio, hid, blister;
  vec4 nL, nM, nS, nF, nX, nXX, sB, nM3;
};

S surf(vec2 uv){
  S s;
  // y periods are deliberately incommensurate with x (and with each other) so nothing repeats up the stack
  vec4 nG = T(uv, vec2(C_, 53.7));
  vec4 nL = T(uv + vec2(0., nG.g * 6.), vec2(C_ / 3., 12.73)), nM = T(uv, vec2(C_ / 12., 3.11)), nS = T(uv, vec2(C_ / 48., .813)), nF = T(uv, vec2(C_ / 192., .1931));
  vec4 nX = TR(uv, vec2(.0437, .0491), .37) * .6 + TR(uv, vec2(.0613, .0571), 1.93).barg * .4, nXX = TR(uv, vec2(.0109, .0131), .83) * .55 + TR(uv, vec2(.0167, .0149), 2.41).gbar * .45, nM3 = TR(uv, vec2(.0071, .0083), .61) * .5 + TR(uv, vec2(.0113, .0097), 2.17).gbar * .5;
  vec4 sA = T(uv, vec2(C_ / 96., 9.)), sB = T(uv, vec2(C_ / 384., 2.7)), sC = T(uv, vec2(C_ / 1536., .55));
  s.nL = nL; s.nM = nM; s.nS = nS; s.nF = nF; s.nX = nX; s.nXX = nXX; s.sB = sB; s.nM3 = nM3;

  // ---- weld seams: 1.83 m rings, three panels per ring
  float dUp = 99., dSeam = 99., panel = .5;
#ifdef SEAMS
  float fy = (uv.y - uRing0) / 1.83; float ring = floor(fy); float fr = fract(fy);
  dUp = (1. - fr) * 1.83; float dDn = fr * 1.83;
  float pu = (uv.x + C_ * .5) / C_ * 3. + h11(ring + uRing0) * 3.;
  float dv = (.5 - abs(fract(pu) - .5)) * (C_ / 3.);
  dSeam = min(min(dUp, dDn), dv);
  panel = h11(ring * 3.1 + floor(pu) * 17.7 + uRing0);
#endif
  float vis = clamp(.012 / gPW, 0., 1.);
  float bw = .0055 + (nX.r - .5) * .0015;
  s.bead = (1. - smoothstep(bw - gPW, bw + gPW, dSeam)) * clamp(.012 / gPW, 0., 1.);
  s.haz = (1. - smoothstep(0., .045, dSeam)) * vis;
  s.dSeam = dSeam; s.panel = panel;

  // ---- run-off from seams and long streaks
  float colm = smoothstep(.5, .78, sA.r) * (.5 + .5 * sB.g) * (.6 + .4 * sC.r) * (.55 + .9 * nXX.g * nM3.r);
  float len = mix(.12, 1.6, sA.g);
  float streakSeam = colm * exp(-dUp / len);
  float longStreak = smoothstep(.56, .82, sA.g * .6 + sB.r * .3 + sC.g * .1);
  s.streak = longStreak;

  float blot = (nL.r * .4 + nG.r * .25 + nM.g * .22 + nS.r * .1 + nF.a * .03 - .5) * 3.2;

  // ---- heat shield tiles
  s.tile = 0.; s.felt = 0.; s.bare = 0.; s.tgap = 0.; s.tRid = 0.;
  float tileEd = 1.;
#ifdef TILES
  {
    vec4 hc = hexCell(uv / .34);
    vec2 cc = hc.zw * vec2(1., 1.7320508) * .34;
    float inT;
  #if MAP == 0
    float thc = (cc.x) / (C_ / 6.2831853);
    float dthc = abs(mod(thc - atan(uTileDir.z, uTileDir.x) + PI_, 6.2831853) - PI_);
    float hn = clamp((cc.y - (uRing0 + 33.1)) / 19., 0., 1.);
    float halfW = 1.6 + .07 * (h32(hc.zw * .37).x - .5) + hn * hn * hn * 2.;
    inT = step(dthc, halfW) * step(uRing0 + .25, cc.y);
  #else
    inT = step(.5, normalize(vON).z * uFlapSide);
  #endif
    vec2 a = abs(hc.xy);
    float ed = (.5 - max(dot(a, vec2(.5, .8660254)), a.x)) * .34;
    tileEd = ed;
    vec3 tr3 = h32(hc.zw + 3.1);
    s.tRid = tr3.x;
    vec4 cN = textureLod(uNoise, cc / (C_ / 12.), 0.), cN2 = textureLod(uNoise, cc / (C_ / 3.), 0.);
    float lossF = smoothstep(.22, 1., gTr) * .4;
    float key = clamp(tr3.x * .14 + smoothstep(.3, .7, 1. - cN.g) * .5 + smoothstep(.3, .7, 1. - cN2.r) * .5 - .07, .015, 1.);
    float lost = step(key, lossF) * step(.001, lossF);
    float feltOn = step(tr3.y, .7 - smoothstep(.2, .9, gTr) * .65);
    s.tile = inT * (1. - lost); s.felt = inT * lost * feltOn; s.bare = inT * lost * (1. - feltOn);
    s.tgap = (1. - smoothstep(.0015, .0015 + gPW * .7, ed)) * clamp(.005 / gPW, 0., 1.);
  }
#endif

  // ---- cryogenic frost on the propellant tanks (booster): thick white rime with vertical run lines
  s.frost = 0.;
#ifdef FROST
  {
    float fz = smoothstep(4.0, 5.2, uv.y) * (1. - smoothstep(FROST_TOP - 1.4, FROST_TOP - .4, uv.y));
    float cdx = (uv.y - FROST_CD) / .9; float cd = exp(-cdx * cdx);
    // non-repeating: rotated, incommensurate samples; vertical drip lines from near-vertical stretched noise
    vec4 f1 = TR(uv, vec2(1.93, 3.71), .04), f2 = TR(uv, vec2(.61, .83), .07), f3 = TR(uv, vec2(.071, 2.9), .015);
    float F = nG.g * .3 + f1.r * .35 + f2.g * .2 + f3.r * .15;
    float cov = smoothstep(.3, .6, F);
    s.frost = uFrost * fz * clamp(.42 + .58 * cov - smoothstep(.62, .85, f3.g) * .2, 0., 1.) * (1. - cd * .75);
  }
#endif

  // ---- susceptibility and stage masks
  float P = .45 + blot * .6 + .2 * gSeaF + .16 * gUp + .22 * gLow + .06 * gDn
          + .6 * s.bead + .18 * s.haz + .5 * streakSeam + .14 * longStreak + .5 * s.bare;
  float tr = gTr;
  float act = clamp((P - 1. + tr * .95) * .45 + (nM.r - .5) * .12, 0., .34) * smoothstep(2., 8., uYear)
            + s.haz * smoothstep(.04, .3, tr) * .12;
  vec4 pf = pitField(uv, act);
  s.pcore = pf.x; s.phalo = pf.y; s.ptail = pf.z;

  float teaThr = mix(1.25, .55, pow(clamp(tr / .5, 0., 1.), .6));
  float tea = smoothstep(teaThr, teaThr + .3, P + (nX.a - .5) * .08) * smoothstep(0., 1.2, uYear);
  s.tea = max(tea * (.3 + .7 * sB.g * nS.g * 2.), pf.z * .95);
  float rThr = mix(1.55, .42, pow(tr, .72));
  float rust = smoothstep(rThr, rThr + .12, P + (nF.r - .5) * .14 + (nX.r - .5) * .1 + (nXX.g - .5) * .06 + (nM3.b - .5) * .04) * smoothstep(1., 5., uYear);
  s.rust = max(rust, max(pf.y * .7, pf.x));
  s.rd = clamp((P + (nF.r - .5) * .2 + (nX.g - .5) * .15 - rThr) / .55, 0., 1.);   // oxide thickness: thin bloom at edges, crust inside
  float hThr = mix(1.9, .6, pow(tr, .8));
  s.heavy = smoothstep(hThr, hThr + .18, P + (nM.b - .5) * .25 + (nF.g - .5) * .1 + (nX.g - .5) * .05) * smoothstep(4., 14., uYear);

  // ---- scale: cracks, lifted plate edges, spalled plates
  vec3 sp = scalePlates(uv, (vec2(nF.r, nF.g) - .5) * 1.6 + (nX.ba - .5) * .5);
  float cw = .085 + gPW / (C_ / 471.) * .5;
  s.crack = s.heavy * (1. - smoothstep(cw * .4, cw, sp.y)) * smoothstep(.15, .45, s.heavy + (nS.b - .5) * .3);
  s.plateEdge = s.heavy * (1. - smoothstep(cw, cw * 3.5, sp.y));
  float flakeF = smoothstep(.5, 1., tr) * .32 * smoothstep(.3, .8, s.heavy) * (.6 + .8 * nM.a);
  s.flaked = step(sp.z, flakeF) * s.heavy;
  s.hid = sp.z;
  s.blister = smoothstep(.35, .7, s.rust) * (1. - s.heavy) * (1. - smoothstep(.0, .25, nX.b)) * smoothstep(.55, .7, nS.g);

  s.bio = smoothstep(.4, .95, tr + gLow * .35 + (nM.b - .5) * .6) * smoothstep(.5, .72, nS.g) * (.25 + .75 * gLow) * (.5 + .5 * gDn + .5 * (1. - gSeaF));

  // ---- height (metres)
  float h = 0.;
  h += s.bead * (.0011 + (nXX.r - .5) * .0004);
  h -= s.haz * .00008;
  h += s.tea * .00002;
  h += s.rust * (.0002 + s.rd * .0011 + ((nX.r - .5) * .0006 + (nXX.g - .5) * .0004 + (nF.b - .5) * .0006) * (.4 + s.rd));
  h -= s.pcore * .0014;
  h += s.phalo * .00015;
  h += s.blister * .0009 * smoothstep(.25, 0., nX.b);
  vec3 ph = h32(vec2(sp.z * 91., 7.));
  float plateH = .0016 + (ph.x - .5) * .0012 + (nXX.b - .5) * .0006 + dot(vec2(ph.y, ph.z) - .5, vec2(sp.x)) * .0015;   // tilted, lifted plates
  h += s.heavy * (plateH * (1. - s.flaked) + s.plateEdge * .0008 * (1. - s.flaked) - s.crack * .0018 - s.flaked * (.0006 - (nXX.r - .5) * .0008 - (nX.g - .5) * .0006));
#ifdef TILES
  h += s.tile * (.02 + smoothstep(0., .015, tileEd) * .003 + (nXX.b - .5) * .0002) + s.felt * (.006 + (nX.a - .5) * .0015);
  float stud = s.bare * (1. - smoothstep(.02, .028, length(hexCell(uv / .34).xy) * .34));
  h += stud * .006;
#endif
#ifdef FROST
  float fh = s.frost * .003 + (nX.r - .5) * .0018 + (nXX.g - .5) * .0012 + (sC.r - .5) * .001 + (nF.b - .5) * .0012;
  h = mix(h, h * .3 + fh, smoothstep(0., .45, s.frost));
#endif
  s.h = h;
  return s;
}

struct Age { vec3 col; float rough; float metal; vec3 nW; float h; };
Age ageSurface(){
  Age A;
  vec3 N = normalize(vWN) * (gl_FrontFacing ? 1. : -1.);
  float yy = vWP.y;
  vec2 uv; vec3 Tg, Bg;
#if MAP == 0
  float th = atan(vWP.z, vWP.x);
  float th2 = atan(-vWP.z, -vWP.x);
  vec2 d1 = vec2(dFdx(th), dFdy(th)), d2 = vec2(dFdx(th2), dFdy(th2));
  vec2 dth = dot(d1, d1) < dot(d2, d2) ? d1 : d2;
  const float K = C_ / 6.2831853;
  uv = vec2(th * K, yy);
  gDX = vec2(dth.x * K, dFdx(yy)); gDY = vec2(dth.y * K, dFdy(yy));
  Tg = vec3(-sin(th), 0., cos(th)); Bg = vec3(0., 1., 0.);
#else
  vec3 on = normalize(vON); vec3 ao = abs(on);
  if (ao.x >= ao.y && ao.x >= ao.z) { uv = vOP.zy; Tg = vAZ; Bg = vAY; }
  else if (ao.y >= ao.z) { uv = vOP.xz; Tg = vAX; Bg = vAZ; }
  else { uv = vOP.xy; Tg = vAX; Bg = vAY; }
  gDX = dFdx(uv); gDY = dFdy(uv);
#endif
  gPW = max(max(length(gDX), length(gDY)), 1e-5);
  gUp = clamp(N.y, 0., 1.); gDn = clamp(-N.y, 0., 1.);
  gSeaF = clamp(dot(N, uSea) * .5 + .5, 0., 1.);
  gLow = exp(-max(yy - 2., 0.) / 24.);
  gT = clamp(uYear / 100., 0., 1.); gTr = clamp(gT * uRate, 0., 1.);
  float tr = gTr;

  S s = surf(uv);
  A.h = s.h;
#ifdef CHEAPN
  A.nW = N;
#else
  float e = max(gPW * .8, .0002);
  float hx = surf(uv + vec2(e, 0.)).h, hy = surf(uv + vec2(0., e)).h;
  vec2 grad = vec2(hx - s.h, hy - s.h) / e;
  {
    float fPeel = clamp(.003 / gPW, 0., 1.) * (1. - s.rust);
    const float E = .03;
    float w0 = waveH(uv, fPeel);
    grad += uWave * (1. - s.heavy) * vec2(waveH(uv + vec2(E, 0.), fPeel) - w0, waveH(uv + vec2(0., E), fPeel) - w0) / E;
  }
  Tg = Tg - N * dot(N, Tg); Tg /= max(length(Tg), 1e-4);
  Bg = Bg - N * dot(N, Bg) - Tg * dot(Tg, Bg); Bg /= max(length(Bg), 1e-4);
  grad = clamp(grad, vec2(-4.), vec2(4.));
  vec3 nW = N - grad.x * Tg - grad.y * Bg;
  A.nW = (length(nW) > 1e-4 && !any(isnan(nW))) ? normalize(nW) : N;
#endif

  vec4 nL = s.nL, nM = s.nM, nS = s.nS, nF = s.nF, nX = s.nX, nXX = s.nXX;
  vec3 col; float rough, metal;
#if KIND == 0
  // 304L, cold-rolled: bright, faintly warm, panel-to-panel sheen differences
  col = sRGB(vec3(.80, .79, .775)) * (.97 + .035 * s.panel) * (.975 + .04 * nF.a);
  rough = mix(.14, .19, s.panel) + (s.sB.a - .5) * .02;
  metal = 1.;
  // weld heat tint: straw → bronze → blue, then a dark oxidised bead
  float d = s.dSeam, vis = clamp(.01 / gPW, 0., 1.);
  vec3 tint = vec3(1.);
  tint = mix(tint, vec3(1.02, .86, .58), (1. - smoothstep(.016, .034, d)) * smoothstep(.009, .014, d));
  tint = mix(tint, vec3(.78, .52, .36), (1. - smoothstep(.009, .014, d)) * smoothstep(.0065, .009, d));
  tint = mix(tint, vec3(.52, .50, .92), (1. - smoothstep(.0062, .0075, d)) * smoothstep(.005, .006, d));
  col *= mix(vec3(1.), tint, vis * .9);
  col = mix(col, col * vec3(.48, .46, .45), s.bead); rough = mix(rough, .42, s.bead);
  // dulling of the passive film with age
  col *= mix(1., .55 + .2 * nM.b, smoothstep(.12, .9, tr)); rough += .3 * smoothstep(.1, .9, tr) * (.6 + .4 * nS.g) + .06 * smoothstep(.02, .3, tr) * nF.a;
  // tea staining: thin, translucent golden-brown iron oxide
  vec3 teaC = mix(sRGB(vec3(.86, .64, .42)), sRGB(vec3(.70, .44, .26)), smoothstep(.3, .9, s.tea) * nS.r);
  col = mix(col, col * teaC, s.tea);
  rough = mix(rough, .38, s.tea * .6); metal = mix(metal, .82, s.tea * .3);
#elif KIND == 1

  // painted structural steel (tower, mount, chopsticks): chalks, bleeds rust, then scales
  col = sRGB(uBase) * (.9 + .14 * nM.a) * (.95 + .1 * nF.a) * mix(1., .55 + .2 * nM.b, smoothstep(.1, .8, tr));
  rough = .6 + (nS.g - .5) * .1; metal = 0.;
  col = mix(col, col * sRGB(vec3(.86, .78, .66)), s.tea); rough = mix(rough, .8, s.tea);
  col = mix(col, sRGB(vec3(.42, .2, .08)), s.streak * smoothstep(.05, .35, tr) * .55);
  {
    vec2 pc = floor(uv / vec2(1.7, 1.1));                                                  // touch-up paint patches
    col *= mix(1., .86 + .22 * h32(pc).y, step(.82, h32(pc + 5.).x));
    rough += (nX.a - .5) * .1;                                                             // orange-peel sheen
    float fy9 = abs(mod(yy + .75, 9.3) - .75);                                               // bolt rows at the splice flanges
    vec2 bq = fract(uv / .17) - .5;
    float bolt = (1. - smoothstep(.17, .24, length(bq))) * (1. - smoothstep(.5, .75, fy9)) * clamp(.012 / gPW, 0., 1.);
    col *= 1. - bolt * .4; A.h += bolt * .006;
    float edge = smoothstep(.5, .85, nS.b) * smoothstep(.1, .5, tr);                        // paint worn through to primer
    col = mix(col, sRGB(vec3(.55, .28, .2)), edge * .35 * (1. - s.rust));
  }
#elif KIND == 3
  // grid fins: heat-darkened steel castings
  col = sRGB(vec3(.2, .19, .18)) * (.85 + .3 * nM.a) * (.9 + .2 * nXX.r);
  rough = .4 + (nS.g - .5) * .14; metal = .9;
  col = mix(col, col * sRGB(vec3(.6, .5, .4)), s.tea);
#else
  col = sRGB(vec3(.38, .34, .31)) * (.9 + .15 * nM.a);
  rough = .34 + (nS.g - .5) * .1; metal = 1.;
  float band = sin(yy * 7. + nM.r * 3.) * .5 + .5;
  col *= mix(vec3(1.), mix(vec3(.62, .55, .95), vec3(1.05, .8, .5), band), .5);
  col = mix(col, col * sRGB(vec3(.6, .5, .4)), s.tea);
#endif

  // ---- rust: from orange bloom to dark, cracked, spalling scale
  float rv = nM.r * .45 + nF.g * .35 + nX.b * .2;
  vec3 rustC = mix(sRGB(vec3(.43, .22, .11)), sRGB(vec3(.56, .33, .16)), smoothstep(.4, .72, rv));
  rustC = mix(rustC, sRGB(vec3(.27, .13, .07)), smoothstep(.4, .72, nS.r) * .8);
  rustC = mix(rustC, sRGB(vec3(.36, .27, .2)), smoothstep(.58, .82, nL.b) * .45);
  rustC *= .8 + .3 * nX.a + .2 * (nXX.r - .5) + .2 * (nL.g - .5) + .12 * (s.nM3.a - .5);
  vec3 heavyC = mix(sRGB(vec3(.24, .125, .065)), sRGB(vec3(.34, .17, .085)), nF.r);
  heavyC = mix(heavyC, sRGB(vec3(.12, .075, .05)), smoothstep(.5, .78, nS.a) * .8);
  heavyC *= (.85 + .3 * h32(vec2(s.hid * 53.)).x) * (.9 + .2 * s.nM3.g);
  vec3 freshC = mix(sRGB(vec3(.56, .30, .13)), sRGB(vec3(.70, .45, .2)), smoothstep(.35, .75, nXX.g)) * (.8 + .3 * nX.r);   // fresh oxide under spalled scale
  freshC = mix(freshC, sRGB(vec3(.18, .14, .12)), smoothstep(.65, .85, nX.b) * .55);                                            // pitted metal showing through

  // pit tails stain the steel even before rust proper
  col = mix(col, col * sRGB(vec3(.82, .55, .34)), s.ptail * .55);
  vec3 rustThin = mix(sRGB(vec3(.66, .45, .25)), sRGB(vec3(.58, .36, .19)), nX.r) * (.92 + .16 * nXX.a);
  vec3 rustThick = mix(rustC, sRGB(vec3(.24, .12, .065)) * (.85 + .3 * nXX.r), smoothstep(.45, 1., s.rd) * .75);
  vec3 rCol = mix(rustThin, rustThick, smoothstep(0., .45, s.rd + (nXX.g - .5) * .2));
  rCol = mix(rCol, vec3(dot(rCol, vec3(.3, .59, .11))), .14);
  col = mix(col, rCol, s.rust);
  rough = mix(rough, .74 + .18 * nF.r, s.rust); metal = mix(metal, .05, s.rust);
  col = mix(col, rustC * 1.25, s.blister * .5);
  col = mix(col, sRGB(vec3(.05, .03, .02)), s.pcore * .9); rough = mix(rough, .6, s.pcore);
  col = mix(col, heavyC, s.heavy);
  rough = mix(rough, .93, s.heavy); metal = mix(metal, 0., s.heavy);
  col = mix(col, mix(heavyC, sRGB(vec3(.55, .36, .18)), .6), s.plateEdge * (1. - s.flaked) * .75);    // lifted plate rims catch ochre
  col *= 1. + (h32(vec2(s.hid * 17.)).y - .5) * .5 * s.heavy * (1. - s.flaked);                        // plate-to-plate tone
  col = mix(col, freshC, s.flaked * .9); rough = mix(rough, .8, s.flaked); metal = mix(metal, .25, s.flaked * smoothstep(.6, .8, nX.b));
  col = mix(col, sRGB(vec3(.02, .015, .012)), s.crack * .95);

  // ---- grime, biofilm, salt
  col = mix(col, sRGB(vec3(.12, .14, .07)), s.bio * .55); rough = mix(rough, .9, s.bio * .6); metal *= 1. - s.bio * .7;
  float salt = gUp * smoothstep(.62, .72, nS.a) * smoothstep(.55, .8, nX.a) * smoothstep(.03, .25, tr);
  col = mix(col, sRGB(vec3(.82, .8, .76)), salt * .5); rough = mix(rough, .9, salt);

#ifdef FROST
  {
    float thick = smoothstep(.3, 1., s.frost);
    vec3 fc = mix(sRGB(vec3(.66, .70, .75)), sRGB(vec3(.9, .91, .93)), clamp(thick * .85 + nX.a * .15, 0., 1.));
    fc *= .95 + .07 * nXX.b;
    float fw = smoothstep(.04, .45, s.frost);
    col = mix(col, fc, fw); rough = mix(rough, .82 + .1 * nX.g, fw); metal = mix(metal, 0., fw);
  }
#endif
#ifdef TILES
  {
    // RCG-coated silica tiles: near-black, semi-gloss, slight tile-to-tile tone shifts
    vec3 tc = sRGB(vec3(.10 + .045 * s.tRid + .015 * nS.r)) * (.93 + .14 * nXX.a);
    tc = mix(tc, sRGB(vec3(.15, .145, .14)), smoothstep(0., 1., tr) * (.2 + .4 * nM.a));
    tc = mix(tc, sRGB(vec3(.12, .14, .07)), s.bio * .7);
    tc *= 1. - s.tgap * .75;

function agingMaterial({ map = 0, kind = 0, ring0 = 0, seams = false, tiles = false, frost = false, cheap = false, base = [0.55, 0.56, 0.57], rate = 1, flapSide = 0, wave = 1, side = THREE.FrontSide } = {}) {

// ============================================================================ site layout (shared by JS and GLSL)
const CONCRETE = [[0, 0, 72, 60, 3], [-132, -95, 50, 32, 3], [-340, 150, 58, 56, 3]];
const CLEARED = [[8, 0, 120, 100, 30], [-132, -95, 66, 48, 16], [-340, 150, 98, 92, 26], [-1215, -235, 1690, 15, 6], [-70, -163, 11, 76, 4], [-200, 30, 10, 130, 4]];
const ROADS = [[-1215, -235, 1690, 4.6, 0], [-70, -163, 4, 74, 0], [-200, 30, 3.5, 128, 0]];
const STAINS = [[11, 13, 3], [-11, 13, 3], [11, -13, 3], [-11, -13, 3], [-24.5, 5.5, 1.5], [-24.5, -5.5, 1.5], [-35.5, 5.5, 1.5], [-35.5, -5.5, 1.5]];
const TANKS = [];
for (let i = 0; i < 5; i++) { TANKS.push([-160 + i * 13.5, -108]); TANKS.push([-160 + i * 13.5, -84]); }
for (const t of TANKS) STAINS.push([t[0], t[1], 4.6]);
const beachX = (z) => 470 + 18 * Math.sin(z * 0.004) + 8 * Math.sin(z * 0.011 + 1);
const inTrench = (x, z) => x > -10 && x < 110 && Math.abs(z) < 9;
const trenchFloor = (x) => x < 20 ? -9 : -9 + 9 * (x - 20) / 90;
const sdList = (x, z, L) => { let d = 1e9; for (const r of L) d = Math.min(d, rectSD(x, z, r)); return d; };

function groundH(x, z) {
  let h = (fbmJS(x * 0.004, z * 0.004, 3) - 0.5) * 0.9 + (fbmJS(x * 0.03 + 4, z * 0.03, 2) - 0.5) * 0.25;
  const bx = beachX(z);
  const dune = smooth(bx - 120, bx - 70, x) * (1 - smooth(bx - 18, bx - 4, x));
  h += dune * (1.2 + 3.2 * fbmJS(x * 0.02, z * 0.02, 3)) ;
  if (x > bx - 10) h = Math.min(h, 0.7 - (x - (bx - 10)) * 0.034);
  const cl = sdList(x, z, CLEARED);
  h = h + (0.15 - h) * (1 - smooth(-4, 10, cl)) * 0.9;
  if (sdList(x, z, CONCRETE) < 0.5) h = 0.32;
  if (sdList(x, z, ROADS) < 0.5) h = Math.max(h, 0.22);
  if (inTrench(x, z)) h = trenchFloor(x);
  return h;
}
function sandAt(x, z) { const bx = beachX(z) + (fbmJS(z * 0.01, 3.3) - 0.5) * 30; return smooth(bx - 130, bx - 70, x); }
function wetAt(x, z) {
  const n = fbmJS(x * 0.0018 + 5, z * 0.0018 - 2, 5);
  let w = smooth(0.5, 0.64, n) * smooth(260, 420, Math.hypot(x + 120, z - 20)) * (1 - smooth(-260, -150, x - beachX(z)));
  return clamp(w, 0, 1);
}
function densAt(x, z) {
  const s = sandAt(x, z), w = wetAt(x, z);
  return clamp(0.92 - 0.25 * s - 0.6 * w + (fbmJS(x * 0.02, z * 0.02, 2) - 0.5) * 0.3, 0.1, 1);
}
function vegBirth(x, z) {
  const bx = beachX(z); if (x > bx - 14) return 140;
  const n = fbmJS(x * 0.012, z * 0.012), n2 = fbmJS(x * 0.06 + 7, z * 0.06 - 3, 3);
  const sd = sdList(x, z, CLEARED) + (n2 - 0.5) * 14;
  let b;
  if (sd > 0) b = n > 0.45 ? -20 + n2 * 10 : 2 + (0.45 - n) * 160;
  else b = 4 + (-sd) / 2.2 + n2 * 14;
  if (sdList(x, z, ROADS) < 0.5) b = Math.max(b, 22 + n2 * 40);
  if (sdList(x, z, CONCRETE) < 0) b = Math.max(b, 34 + n2 * 50 + n * 10);

// field texture: R birth year, G sand, B wet, A density
const FN = 512, FMIN = -1200, FSIZE = 2400;
const fieldData = new Uint8Array(FN * FN * 4);
for (let j = 0; j < FN; j++) for (let i = 0; i < FN; i++) {
  const x = FMIN + (i + 0.5) / FN * FSIZE, z = FMIN + (j + 0.5) / FN * FSIZE, k = (j * FN + i) * 4;
  fieldData[k] = clamp(Math.round((vegBirth(x, z) + 20) / 160 * 255), 0, 255);
  fieldData[k + 1] = Math.round(sandAt(x, z) * 255);
  fieldData[k + 2] = Math.round(wetAt(x, z) * 255);
  fieldData[k + 3] = Math.round(densAt(x, z) * 255);
}
const fieldTex = new THREE.DataTexture(fieldData, FN, FN, THREE.RGBAFormat);
fieldTex.magFilter = THREE.LinearFilter; fieldTex.minFilter = THREE.LinearFilter; fieldTex.needsUpdate = true;

// pad cracks: grey level = year the crack opens (white = never). Weeds follow them.
const CR = 2048, CMIN = -110, CSIZE = 220;
const crackWeeds = [];
const crackTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = CR;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, CR, CR);
  g.globalCompositeOperation = 'darken'; g.lineCap = 'round'; g.lineJoin = 'round';
  const rnd = mulberry(91);

      x += Math.cos(ang) * l; z += Math.sin(ang) * l;

      pts.push([x, z]);

// ============================================================================ sky, clouds, light
const sky = new Sky();

const cloudMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.BackSide, fog: false,

const sun = new THREE.DirectionalLight(0xfff0dc, 3.4);

// ============================================================================ ground
const GROUND_GLSL = /* glsl */`

let shot = 1, auto = true, autoSeq = true, idleT = 0, dirT = 0, shotT = 0, seqI = 0;
const D = { az: 0.55, el: 0.1, r: 240, ty: 64 };
function directorTarget(t) {
  const s = SHOTS[shot], base = s.az ?? 0.15;
  return { az: base + Math.sin(t * s.spd) * s.span, el: s.el, r: s.r * (1 + 0.06 * Math.sin(t * 0.11)), ty: s.ty };
}
function nextShot(year) {
  const seq = year < 30 ? EARLY : LATE; seqI = (seqI + 1) % seq.length; shot = seq[seqI]; shotT = 0; dirT = 0;
}
const wrapA = (a) => Math.atan2(Math.sin(a), Math.cos(a));
function syncDirectorFromCamera() {
  const off = camera.position.clone().sub(controls.target);
  D.r = off.length(); D.ty = controls.target.y; D.az = Math.atan2(off.z, off.x); D.el = Math.asin(clamp(off.y / D.r, -1, 1));
}
controls.addEventListener('start', () => { auto = false; idleT = 0; });
controls.addEventListener('end', () => { idleT = 0; });
function setShot(n) { shot = n; auto = true; autoSeq = false; dirT = 0; shotT = 0; }
if (Q.has('cam')) { const [az, el, r, ty] = Q.get('cam').split(',').map(Number); Object.assign(D, { az, el, r, ty }); shot = -1; }
else if (Q.has('view')) { shot = +Q.get('view'); autoSeq = false; const v = SHOTS[shot]; Object.assign(D, { az: v.az, el: v.el, r: v.r, ty: v.ty }); }

addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (P >= 1) P = 0; setPlaying(!playing); }
  else if (e.key >= '1' && e.key <= '9') setShot(+e.key);
  else if (e.key === 'c' || e.key === 'C' || e.key === '0') { autoSeq = true; auto = true; }
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
  else if (e.key === 'ArrowRight') { P = pOf(yearOf(P) + 5); hold = 0; }
  else if (e.key === 'ArrowLeft') { P = pOf(yearOf(P) - 5); hold = 0; }
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); });

// ============================================================================ loop
const clock = new THREE.Clock();
let time = 0, wind = new THREE.Vector2(), lastEnvYear = -99, envTimer = 0, lastGrowYear = -99;
let frameAvg = 16, dprTimer = 0, looping = false;

function applyYear(year) {
  U.uYear.value = year;
  const f = ((year % 1) + 1) % 1;                             // 0 = November
  U.uSeason.value = Math.cos((f - 0.7) * Math.PI * 2);        // +1 = high summer (dry)
  const d = Math.min(Math.abs(f - 0.04), Math.abs(f - 1.04));
  U.uAutumn.value = Math.exp(-Math.pow(d / 0.07, 2));
  if (Math.abs(year - lastGrowYear) > 0.02) { updateGrowers(year); lastGrowYear = year; }
  for (const g of gpuGrown) g.mesh.count = bornCount(g.births, year);
  // carriage cable failure: the chopsticks slide and cant
  const slip = smooth(77.5, 79.5, year);
  chop.position.y = 64 - slip * 14; chop.rotation.z = -slip * 0.09; chop.rotation.x = slip * 0.05;
  fallenTiles.mesh.count = bornCount(fallenTiles.births, year);
  masts[0].rotation.z = -smooth(51.5, 53, year) * 1.545;                    // the north-east mast falls
  masts[2].rotation.x = smooth(35, 75, year) * 0.13;                         // the north-west one leans
  masts[3].rotation.z = smooth(70, 90, year) * 0.07;
  const dec = smooth(25, 95, year);                                         // the light goes flat and hazy
  scene.fog.density = 0.00019 + dec * 0.00016;
  su.turbidity.value = 3.2 + dec * 4.5; su.rayleigh.value = 1.15 - dec * 0.45;
  renderer.toneMappingExposure = 0.62 - dec * 0.06;
  pond.position.y = -9.5 + smooth(6, 20, year) * 1.9;
  pond.visible = year > 6;
  const t = year / 100;
  farMat.color.setRGB(0.93 - t * 0.35, 0.93 - t * 0.33, 0.9 - t * 0.38);
  cloudMat.uniforms.uCover.value = 0.38 + 0.12 * dec + 0.16 * Math.sin(year * 2.3) * Math.sin(year * 0.71 + 1);
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  time += dt;
  U.uTime.value = time;

  if (playing && !looping) {
    if (P < 1) P = Math.min(1, P + dt / DUR);
    else if ((hold += dt) > 7) {
      looping = true; fadeEl.style.opacity = 1;
      setTimeout(() => { P = 0; hold = 0; fadeEl.style.opacity = 0; looping = false; }, 1300);
    }
  }
  const year = yearOf(P);
  applyYear(year);

  wind.x += dt * (playing ? 0.05 : 0.002); wind.y += dt * (playing ? 0.02 : 0.001);
  cloudMat.uniforms.uWind.value.copy(wind);
  WATER_N.offset.x = time * 0.004; WATER_N.offset.y = time * 0.0025;

  // HUD
  yearEl.textContent = 2026 + Math.floor(year);
  fillEl.style.width = (P * 100) + '%'; knobEl.style.left = (P * 100) + '%';
  let cap = CAPTIONS[0][1]; for (const [y, c] of CAPTIONS) if (year >= y) cap = c;
  if (cap !== lastCap) { lastCap = cap; capEl.style.opacity = 0; setTimeout(() => { capEl.textContent = cap; capEl.style.opacity = 1; }, 450); }

  // camera
  if (!auto) { idleT += dt; if (idleT > 10) { syncDirectorFromCamera(); auto = true; } }
  if (auto && autoSeq && shot !== -1) { shotT += dt; if (shotT > (SHOTS[shot].r > 100 ? 10 : 13)) nextShot(year); }
  if (auto && shot !== -1) {
    dirT += dt;
    const T = directorTarget(dirT), k = 1 - Math.exp(-dt * 0.55);
    T.r += Math.min(70, Math.abs(T.ty - D.ty) * 0.8);          // pull back while craning between heights
    D.az += wrapA(T.az - D.az) * k; D.el += (T.el - D.el) * k; D.r += (T.r - D.r) * k; D.ty += (T.ty - D.ty) * k;
  }
  if (auto) {
    controls.target.set(0, D.ty, 0);
    camera.position.set(Math.cos(D.az) * Math.cos(D.el) * D.r, D.ty + Math.sin(D.el) * D.r, Math.sin(D.az) * Math.cos(D.el) * D.r);
  }
  controls.enabled = true;
  controls.update();
  if (camera.position.y < 1.6) camera.position.y = 1.6;

  // environment refresh
  envTimer += dt;
  if (!envRT || (envTimer > 1.0 && (Math.abs(year - lastEnvYear) > 0.25 || playing))) { captureEnv(); envTimer = 0; lastEnvYear = year; }

  renderer.render(scene, camera);

  // adaptive resolution
  frameAvg = frameAvg * 0.95 + dt * 1000 * 0.05; dprTimer += dt;
  if (!SHOT && dprTimer > 2.5) {
    dprTimer = 0;
    const nd = frameAvg > 26 ? Math.max(0.6, dpr - 0.15) : frameAvg < 15 ? Math.min(MAX_DPR, dpr + 0.1) : dpr;
    if (Math.abs(nd - dpr) > 0.01) { dpr = nd; renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight, false); }
  }
}

applyYear(yearOf(P));
renderer.compile(scene, camera);
if (!CAPTURE) renderer.setAnimationLoop(frame);
else {
  // ?capture: deterministic 15 s / 30 fps film. Each shot has its own camera move and its own slice of the century;
  // the shots cut on the year, so every cut lands on a visibly older steel.
  const LEEA = TILE_TH + Math.PI;
  // 30 s, one continuous century: the year never jumps back, every shot is a time-lapse of its own detail.
  // [t0, t1, year0, year1, [az, el, r, ty, side, centreX] start, ... end]
  const TX = TOWER.x;
  const SUNAZ = Math.atan2(SUN.z, SUN.x), SHIPAZ = SUNAZ + 0.5, GL0 = SUNAZ + (+(Q.get('gl0') || 0.42)), GL1 = SUNAZ + (+(Q.get('gl1') || 0.2));
  const LEE = TILE_TH + Math.PI;
  const PA = (az, r, y) => [Math.cos(az) * r, y, Math.sin(az) * r];
  const ORB = (az, el, r, ty, side = 0, cx = 0) => {           // orbit spec -> camera position + target
    const tx = cx - Math.sin(az) * side, tz = Math.cos(az) * side;
    return { p: [tx + Math.cos(az) * Math.cos(el) * r, ty + Math.sin(el) * r, tz + Math.sin(az) * Math.cos(el) * r], l: [tx, ty, tz] };
  };
  const shot = (t0, t1, y0, y1, a, b, fov, ez = 'soft') => ({ t0, t1, y0, y1, a, b, fov, ez });
  const CUTS = [
    // ---- I. grandeur: a long-lens orbit past the tower and both faces of the ship, a turning worm's-eye, the clean sheen
    shot(0.0, 4.6, 0, 0.3, null, null, [12.5, 11.5], 'io'),
    shot(4.6, 8.0, 0.3, 0.6, null, null, [62, 54], 'io'),
    shot(8.0, 10.8, 0.6, 1.2, { p: PA(SHIPAZ + 0.11, 46, S0 + 12), l: [0, S0 + 20, 0] }, { p: PA(SHIPAZ - 0.09, 46, S0 + 12), l: [0, S0 + 20, 0] }, [28, 28]),
    // ---- II. the details corrode: welds, grid fins, flaps, tiles
    shot(10.8, 12.8, 1.2, 20, ORB(-0.82, 0.03, 10.5, B0 + 40.2, 3.0), ORB(-0.7, 0.01, 9.6, B0 + 40.8, 3.2), [34, 34]),
    shot(12.8, 15.2, 20, 46, { p: PA(0.36, 11.5, Hs0 + 3.6), l: [...PA(0.02, 6.6, Hs0 - 2.0)] }, { p: PA(0.18, 10.2, Hs0 + 3.0), l: [...PA(0.0, 6.6, Hs0 - 2.0)] }, [38, 36]),
    shot(15.2, 17.6, 46, 62, { p: PA(TILE_TH + Math.PI / 2 + 0.5, 13.5, S0 + 8.5), l: PA(TILE_TH + Math.PI / 2, 6.2, S0 + 7) }, { p: PA(TILE_TH + Math.PI / 2 + 0.38, 12.2, S0 + 7.6), l: PA(TILE_TH + Math.PI / 2, 6.2, S0 + 7) }, [36, 34]),
    shot(17.6, 19.8, 62, 72, ORB(TILE_TH + 1.9, 0.05, 11, S0 + 22), ORB(TILE_TH + 1.7, 0.02, 10, S0 + 23.2), [34, 34]),
    shot(19.8, 21.8, 72, 80, ORB(LEE - 1.3, 0.1, 15, S0 + 38), ORB(LEE - 1.1, 0.06, 13.5, S0 + 39.2), [34, 34]),
    // ---- III. the larger ruin, then pull away
    shot(21.8, 24.2, 80, 88, ORB(1.42, 0.05, 80, 62, 0, TOWER.x), ORB(1.32, 0.04, 75, 58, 0, TOWER.x), [34, 34]),
    shot(24.2, 25.8, 88, 93, { p: PA(0.85, 96, 34), l: [0, 80, 0] }, { p: PA(0.85, 96, 34), l: [0, 36, 0] }, [30, 30], 'io'),
    shot(25.8, 30.0, 93, 100, null, null, [32, 36], 'io'),
  ];
  CUTS[0].orbit = [0.8, 2.3, -0.088, -0.083, 780, 720, 76, 76];                       // telephoto arc: ship front → tower → sunlit back
  CUTS[1].worm = [SUNAZ - 0.75, SUNAZ + 0.05, 34, 1.7, 24, 128];                     // camera circles the mount's foot while tilting up the stack
  CUTS[10].orbit = [LEE + 0.55, LEE + 0.55 + 2.4, 0.04, 0.2, 70, 430, S0 + 22, 72];   // rotate while pulling back to the whole pad
  const STAGE = [[0, 'Day 0', 'Polished 304L stainless'], [1.2, 'Salt air', 'Tea stains bleed from the welds'], [9, 'Pitting', 'Each pit weeps an orange tail'],
    [20, 'Grid fins', 'Rust blooms through the lattice'], [46, 'Flaps', 'The hinges and flap skins corrode'], [62, 'Crevice corrosion', 'Heat-shield tiles let go'],
    [72, 'Scale', 'The oxide thickens and cracks'], [80, 'Neglect', 'Rust and green climb the tower'], [88, 'Exfoliation', 'Plates of scale spall from pitted steel'], [96, 'A century', 'Rust']];
  const ease = (x) => x * x * (3 - 2 * x);
  const easeIO = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const capYear = document.getElementById('capYear'), capStage = document.getElementById('capStage');
  let lastStage = '';
  renderer.setPixelRatio(MAX_DPR); renderer.setSize(innerWidth, innerHeight, false);
  window.__frame = (i) => {
    const t = i / 30;
    let c = CUTS[CUTS.length - 1]; for (const k of CUTS) if (t >= k.t0 && t < k.t1) { c = k; break; }
    const u = clamp((t - c.t0) / (c.t1 - c.t0), 0, 1);
    const e = c.ez === 'io' ? ease(ease(u)) * 0.7 + u * 0.3 : ease(u) * 0.35 + u * 0.65;
    const year = c.y0 + (c.y1 - c.y0) * u;
    const lerp3 = (A, B) => [A[0] + (B[0] - A[0]) * e, A[1] + (B[1] - A[1]) * e, A[2] + (B[2] - A[2]) * e];
    let pos, tgt;
    if (c.orbit) {
      const [a0, a1, e0, e1, r0, r1, ty0, ty1] = c.orbit, az = a0 + (a1 - a0) * e, el = e0 + (e1 - e0) * e;
      const r = r0 * Math.pow(r1 / r0, e), ty = ty0 + (ty1 - ty0) * e;
      pos = [Math.cos(az) * Math.cos(el) * r, ty + Math.sin(el) * r, Math.sin(az) * Math.cos(el) * r]; tgt = [0, ty, 0];
    } else if (c.worm) {
      const [a0, a1, r, cy, ty0, ty1] = c.worm, az = a0 + (a1 - a0) * u;
      pos = [Math.cos(az) * r, cy, Math.sin(az) * r]; tgt = [0, ty0 + (ty1 - ty0) * e, 0];
    } else { pos = lerp3(c.a.p, c.b.p); tgt = lerp3(c.a.l, c.b.l); }
    camera.fov = c.fov[0] + (c.fov[1] - c.fov[0]) * e; camera.updateProjectionMatrix();
    P = pOf(year); time = t; U.uTime.value = t;
    applyYear(year);
    wind.set(3 + t * 0.06, 1 + t * 0.025); cloudMat.uniforms.uWind.value.copy(wind);
    WATER_N.offset.set(t * 0.004, t * 0.0025);
    controls.target.set(...tgt);
    camera.position.set(...pos);
    if (camera.position.y < 1.6) camera.position.y = 1.6;
    camera.lookAt(controls.target);
    captureEnv();
    renderer.render(scene, camera);
    capYear.firstChild.nodeValue = String(2026 + Math.floor(year));
    let st = STAGE[0]; for (const s of STAGE) if (year >= s[0]) st = s;
    if (st[1] !== lastStage) { lastStage = st[1]; capStage.innerHTML = `${st[1]}<b>${st[2]}</b>`; }
    return t;
  };
}
requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('loading').classList.add('done')));
window.__ready = true;
</script>
