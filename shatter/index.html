<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Water } from 'three/addons/objects/Water.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';

await RAPIER.init();

// ?capture renders a deterministic video: a virtual clock advances 1/30 s per frame, clicks happen on their own,
// and sound events are logged (window.__sfx) so the audio can be rebuilt offline and muxed with the frames.
const CAPTURE = new URLSearchParams(location.search).has('capture');
const CAP_FPS = 30;
let vClock = 0;
const nowMs = () => CAPTURE ? vClock * 1000 : performance.now();
const sfxLog = []; window.__sfx = sfxLog;
await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));

// ---------------------------------------------------------------- noise
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
  const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const w = zf * zf * zf * (zf * (zf * 6 - 15) + 10);
  const a = hash3(xi, yi, zi), b = hash3(xi + 1, yi, zi), c = hash3(xi, yi + 1, zi), d = hash3(xi + 1, yi + 1, zi);
  const e = hash3(xi, yi, zi + 1), f = hash3(xi + 1, yi, zi + 1), g = hash3(xi, yi + 1, zi + 1), h = hash3(xi + 1, yi + 1, zi + 1);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (h - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return y1 + (y2 - y1) * w;
}
function fbm3(x, y, z, oct = 4) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * noise3(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}
const smootherstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * t * (t * (t * 6 - 15) + 10); };
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());

// ---------------------------------------------------------------- bowl profile (metres)
// A chawan: ~13 cm across, ~8 cm tall, trimmed foot ring, slightly inturned lip.
const L = (a, b) => t => [mix(a[0], b[0], t), mix(a[1], b[1], t)];
const Qb = (a, c, b) => t => { const u = 1 - t; return [u*u*a[0] + 2*u*t*c[0] + t*t*b[0], u*u*a[1] + 2*u*t*c[1] + t*t*b[1]]; };
const Cb = (a, c1, c2, b) => t => { const u = 1 - t;
  return [u*u*u*a[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*b[0], u*u*u*a[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*b[1]]; };
function polyline(segs) { const P = []; for (const [f, n] of segs) for (let i = P.length ? 1 : 0; i <= n; i++) P.push(f(i / n)); return P; }

const outerLine = polyline([
  [L([0, 0.0045], [0.0205, 0.0045]), 40],
  [Qb([0.0205, 0.0045], [0.0228, 0.0045], [0.0232, 0.002]), 12],
  [Qb([0.0232, 0.002], [0.0236, 0], [0.0255, 0]), 12],
  [L([0.0255, 0], [0.0285, 0]), 10],
  [Qb([0.0285, 0], [0.0308, 0], [0.031, 0.002]), 12],
  [L([0.031, 0.002], [0.0315, 0.006]), 10],
  [Qb([0.0315, 0.006], [0.032, 0.0085], [0.0355, 0.0092]), 12],
  [Cb([0.0355, 0.0092], [0.051, 0.0105], [0.0668, 0.03], [0.0662, 0.062]), 120],
  [Cb([0.0662, 0.062], [0.0659, 0.07], [0.0652, 0.0755], [0.0648, 0.078]), 40],
]);
const innerLine = polyline([
  [Cb([0, 0.011], [0.027, 0.011], [0.0605, 0.024], [0.0612, 0.055]), 160],
  [Cb([0.0612, 0.055], [0.0615, 0.066], [0.061, 0.074], [0.0606, 0.078]), 40],
]);

function makeProfile(P, K, inner) {
  const cum = [0];
  for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i-1][0], P[i][1] - P[i-1][1]));
  const total = cum[cum.length - 1];
  const R = new Float32Array(K), Y = new Float32Array(K), NR = new Float32Array(K), NY = new Float32Array(K);
  let seg = 0;
  for (let k = 0; k < K; k++) {
    const s = k / (K - 1) * total;
    while (seg < P.length - 2 && cum[seg + 1] < s) seg++;
    const t = (s - cum[seg]) / ((cum[seg + 1] - cum[seg]) || 1);
    R[k] = mix(P[seg][0], P[seg + 1][0], t); Y[k] = mix(P[seg][1], P[seg + 1][1], t);
  }
  for (let k = 0; k < K; k++) {
    const k0 = Math.max(0, k - 1), k1 = Math.min(K - 1, k + 1);
    const dr = R[k1] - R[k0], dy = Y[k1] - Y[k0], l = Math.hypot(dr, dy) || 1;
    if (inner) { NR[k] = -dy / l; NY[k] = dr / l; } else { NR[k] = dy / l; NY[k] = -dr / l; }
  }
  return { R, Y, NR, NY, K };
}
const OUT = makeProfile(outerLine, 1600, false);
const IN = makeProfile(innerLine, 1600, true);

// The bowl surface is parametrised by a unit disk: radius = normalised arc length
// along the profile, angle = angle around the axis. Fracture happens in this disk.
function surf(prof, x, y, P, N) {
  const l = Math.hypot(x, y);
  const rho = Math.min(1, l);
  const f = rho * (prof.K - 1), i0 = Math.min(prof.K - 2, Math.floor(f)), t = f - i0;
  const r = mix(prof.R[i0], prof.R[i0 + 1], t), yy = mix(prof.Y[i0], prof.Y[i0 + 1], t);
  const nr = mix(prof.NR[i0], prof.NR[i0 + 1], t), ny = mix(prof.NY[i0], prof.NY[i0 + 1], t);
  const c = l > 1e-9 ? x / l : 1, s = l > 1e-9 ? y / l : 0;
  P.set(r * c, yy, r * s);
  if (N) N.set(nr * c, ny, nr * s).normalize();
}

// ---------------------------------------------------------------- textures
function genBowlTexture(S, inner) {
  const cc = document.createElement('canvas'); cc.width = cc.height = S;
  const rc = document.createElement('canvas'); rc.width = rc.height = S;
  const cctx = cc.getContext('2d'), rctx = rc.getContext('2d');
  const cimg = cctx.createImageData(S, S), rimg = rctx.createImageData(S, S);
  const o = [0, 0, 0, 0, 0];
  for (let py = 0; py < S; py++) {
    const y = 1 - 2 * (py + 0.5) / S;
    for (let px = 0; px < S; px++) {
      const x = 2 * (px + 0.5) / S - 1;
      const l = Math.hypot(x, y);
      if (l > 1.03) continue;
      const rho = Math.min(1, l), cx = l > 1e-6 ? x / l : 1, sx = l > 1e-6 ? y / l : 0;
      (inner ? innerColor : outerColor)(x, y, rho, cx, sx, o);
      const k = (py * S + px) * 4;
      cimg.data[k] = Math.min(255, o[0] * 255); cimg.data[k+1] = Math.min(255, o[1] * 255); cimg.data[k+2] = Math.min(255, o[2] * 255); cimg.data[k+3] = 255;
      rimg.data[k] = o[4] * 255; rimg.data[k+1] = o[3] * 255; rimg.data[k+2] = 0; rimg.data[k+3] = 255;
    }
  }
  cctx.putImageData(cimg, 0, 0); rctx.putImageData(rimg, 0, 0);
  const map = new THREE.CanvasTexture(cc); map.colorSpace = THREE.SRGBColorSpace;
  const rough = new THREE.CanvasTexture(rc);
  return { map, rough };
}

const DEEP = [0.025, 0.065, 0.27], MID = [0.07, 0.20, 0.52], BRIGHT = [0.16, 0.38, 0.72];
const PALE = [0.55, 0.68, 0.82], BEAD = [0.02, 0.045, 0.17], RIM = [0.50, 0.37, 0.27];
const CLAY = [0.68, 0.50, 0.36], POOL = [0.02, 0.16, 0.30];
function mixc(o, c, t) { o[0] = mix(o[0], c[0], t); o[1] = mix(o[1], c[1], t); o[2] = mix(o[2], c[2], t); }

function glazeBody(x, y, rho, cx, sx, o, seed) {
  const streak = fbm3(cx * 9 + seed, sx * 9, rho * 2.2, 3);
  const mott = fbm3(x * 6 + 11 + seed, y * 6, 8.8, 4);
  const k = smoothstep(0.32, 0.68, streak * 0.65 + mott * 0.35);
  o[0] = mix(DEEP[0], MID[0], k); o[1] = mix(DEEP[1], MID[1], k); o[2] = mix(DEEP[2], MID[2], k);
  mixc(o, BRIGHT, smoothstep(0.6, 0.78, mott) * 0.45);
  // pale nuka-style overglaze running down from the rim
  const flowEdge = 0.8 + (fbm3(cx * 13 + seed, sx * 13, 1.3, 3) - 0.5) * 0.3;
  const fl = smoothstep(flowEdge - 0.03, flowEdge + 0.09, rho);
  const pm = fl * smoothstep(0.32, 0.62, mott * 0.5 + streak * 0.5 + 0.1);
  mixc(o, PALE, pm * 0.5);
  // glaze breaks to iron-brown on the lip
  const rb = smoothstep(0.962, 0.997, rho) * (0.55 + 0.45 * noise3(cx * 30, sx * 30, 2 + seed));
  mixc(o, RIM, rb * 0.85);
  if (noise3(x * 350, y * 350, 7 + seed) > 0.95) mixc(o, PALE, 0.2);
  const throwing = 1 + 0.015 * Math.sin(rho * 260 + fbm3(cx * 3, sx * 3, 1, 2) * 8);
  o[0] *= throwing; o[1] *= throwing; o[2] *= throwing;
  o[3] = 0.14 + 0.14 * (1 - mott); o[4] = 1;
  return mott;
}
function outerColor(x, y, rho, cx, sx, o) {
  const edgeN = fbm3(cx * 2.2, sx * 2.2, 3.1, 3);
  const drip = smoothstep(0.6, 0.9, noise3(cx * 10 + 0.3, sx * 10, 5.7)) * 0.075;
  const edge = 0.35 + (edgeN - 0.5) * 0.06 - drip;
  if (rho < edge) {
    const n = fbm3(x * 25, y * 25, 0.5, 3);
    o[0] = CLAY[0] * (0.82 + 0.3 * n); o[1] = CLAY[1] * (0.82 + 0.3 * n); o[2] = CLAY[2] * (0.82 + 0.3 * n);
    mixc(o, [0.55, 0.31, 0.19], smoothstep(edge - 0.07, edge - 0.004, rho) * 0.55);
    if (noise3(x * 260, y * 260, 2.0) > 0.86) { o[0] *= 0.45; o[1] *= 0.42; o[2] *= 0.4; }
    o[3] = 0.88; o[4] = 0;
    return;
  }
  glazeBody(x, y, rho, cx, sx, o, 0);
  const bd = 1 - smoothstep(0, 0.028, rho - edge);   // thick glassy bead where the glaze stopped
  mixc(o, BEAD, bd * 0.85); o[3] *= 1 - bd * 0.5;
}
function innerColor(x, y, rho, cx, sx, o) {
  glazeBody(x, y, rho, cx, sx, o, 40);
  const p = 1 - smoothstep(0.1, 0.42, rho + (noise3(cx * 4, sx * 4, 9) - 0.5) * 0.08); // glaze pools in the well
  mixc(o, POOL, p * 0.85); o[3] = mix(o[3], 0.06, p);
}

function genClayTexture(S) {
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d'), img = ctx.createImageData(S, S);
  for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {
    const u = px / S * Math.PI * 2, v = py / S * Math.PI * 2;
    const n = fbm3(Math.cos(u) * 3, Math.sin(u) * 3 + Math.cos(v) * 3, Math.sin(v) * 3, 4);
    const g = noise3(Math.cos(u) * 40, Math.sin(u) * 40 + Math.cos(v) * 40, Math.sin(v) * 40);
    let s = 0.84 + 0.2 * n + 0.08 * g;
    let r = 0.70 * s, gg = 0.64 * s, b = 0.57 * s;
    if (g > 0.9) { r *= 0.55; gg *= 0.5; b *= 0.48; }
    const k = (py * S + px) * 4;
    img.data[k] = r * 255; img.data[k+1] = gg * 255; img.data[k+2] = b * 255; img.data[k+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function genWoodTexture(S) {
  const cc = document.createElement('canvas'); cc.width = cc.height = S;
  const rc = document.createElement('canvas'); rc.width = rc.height = S;
  const cctx = cc.getContext('2d'), rctx = rc.getContext('2d');
  const ci = cctx.createImageData(S, S), ri = rctx.createImageData(S, S);
  const PL = 7;
  for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {
    const u = px / S, v = py / S;
    const plank = Math.floor(u * PL), pu = u * PL - plank;
    const vv = v + hash3(plank, 7, 1);
    const ang = vv * Math.PI * 2, cz = Math.cos(ang), sz = Math.sin(ang);
    const wn = fbm3(pu * 2.5 + plank * 7, cz * 1.3, sz * 1.3, 3);
    const ring = Math.sin((pu * 9 + wn * 5 + plank * 3.1) * Math.PI * 2) * 0.5 + 0.5;
    const fine = noise3(pu * 160 + plank * 13, cz * 2.5, sz * 2.5);
    const tint = 0.82 + 0.3 * hash3(plank, 3, 9);
    let s = (0.75 + 0.25 * ring * 0.6 + wn * 0.4) * (0.88 + 0.22 * fine) * tint;
    let r = 0.25 * s, g = 0.15 * s, b = 0.09 * s, rough = 0.38 + 0.18 * fine;
    const jv = hash3(plank, 2, 5);
    let jd = Math.abs(((vv % 1) + 1) % 1 - jv); jd = Math.min(jd, 1 - jd);
    if (pu < 0.008 || pu > 0.992 || jd < 0.0015) { r *= 0.25; g *= 0.25; b *= 0.25; rough = 0.9; }
    const k = (py * S + px) * 4;
    ci.data[k] = r * 255; ci.data[k+1] = g * 255; ci.data[k+2] = b * 255; ci.data[k+3] = 255;
    ri.data[k] = 0; ri.data[k+1] = rough * 255; ri.data[k+2] = 0; ri.data[k+3] = 255;
  }
  cctx.putImageData(ci, 0, 0); rctx.putImageData(ri, 0, 0);
  const map = new THREE.CanvasTexture(cc); map.colorSpace = THREE.SRGBColorSpace;
  const rough = new THREE.CanvasTexture(rc);
  for (const t of [map, rough]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6); }
  return { map, rough };
}

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const aniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e11);
scene.fog = new THREE.Fog(0x0d0e11, 1.6, 4.5);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.01, 20);
camera.position.set(0.42, 0.78, 0.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0); // HOVER_Y
controls.enableDamping = true;
controls.minDistance = 0.15; controls.maxDistance = 2.5;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true; controls.autoRotateSpeed = 0.35;

const key = new THREE.DirectionalLight(0xfff0dc, 2.6);
key.position.set(0.7, 1.6, 0.45);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -0.5, right: 0.5, top: 0.5, bottom: -0.5, near: 0.2, far: 4 });
key.shadow.bias = -0.0002; key.shadow.normalBias = 0.0012; key.shadow.radius = 3;

    for (let i = 0; i < n; i++) {
      const p = _bl.clone().add(new THREE.Vector3(gauss() * 0.04, gauss() * 0.02, gauss() * 0.04));
      emit(p, gauss() * 0.15, -Math.min(v, 25) * (0.3 + 0.5 * Math.random()) - 0.2, gauss() * 0.15, PAL.gold, st, 0.5 + Math.random() * 0.6, 0.008 + Math.random() * 0.01, 0.6, 0);
    }
  }
  // the bowl's golden flight at the end
  if (st > 55 && !fin.gone) {
    for (let i = 0; i < 14; i++) emit(_bl.clone().add(new THREE.Vector3(gauss() * 0.012, -Math.random() * 0.08, gauss() * 0.012)), gauss() * 0.12, -0.3, gauss() * 0.12, PAL.gold, st, 1.2 + Math.random() * 0.8, 0.018 + Math.random() * 0.02, 0.8, 0.3);
    emit(_bl, 0, 0, 0, [2.5, 1.8, 0.9], st, 0.05, 0.1 + Math.min(fin.bo, 30) * 0.008, 1, 0);
  }

  // the show, from the climax on: scheduled hits, live onsets, a steady barrage scaled by loudness, comets
  for (const s of fin.sched) if (!s.done && st >= s.t - 0.8) { s.done = true; launch(skyPoint(70 + Math.random() * 40), s.t, s.opts); }
  // kicks: launch a rocket ahead of time so it bursts exactly on the hit
  while (fin.kIdx < DRUMS.length && DRUMS[fin.kIdx][0] - 0.75 <= st) {
    const [t, kind, str] = DRUMS[fin.kIdx++];
    if (!kind.includes('K') || t < T_CLIMAX + 0.2 || t > T_FINAL - 0.2) continue;
    launch(skyPoint(75 + Math.random() * 45), t, { scale: 0.85 + 0.55 * str, n: 170, type: pick(['peony', 'peony', 'willow', 'peony']) });
  }
  // every hit lands now: snares crack, pre-climax hits glimmer far away, everything pulses
  while (fin.hIdx < DRUMS.length && DRUMS[fin.hIdx][0] <= st) {
    const [t, kind, str] = DRUMS[fin.hIdx++];
    fin.hit = Math.max(fin.hit, str);
    const after = t > T_FINAL + 0.1 ? 0.5 : 1;
    if (t < T_CLIMAX) { burst(skyPoint(170, 1.4), { scale: 0.5, n: 90 }); continue; }
    if (kind.includes('S')) {
      burst(skyPoint(55 + Math.random() * 30), { type: pick(['crackle', 'ring', 'crackle']), scale: (0.7 + 0.3 * str) * after, n: 120 });
      fxLight.color.setRGB(1, 0.95, 0.9); fxLight.intensity = Math.max(fxLight.intensity, 4 * str);
      if (fin.snares++ % 2 === 0 && t < 56) spawnComet(st);
    } else if (t > T_FINAL - 0.2) {
      burst(skyPoint(110), { scale: 0.6 * after, n: 120 });
    }
  }
  // the quarter-note pulse: a glint of sparkle on every beat
  if (st >= fin.beatNext) {
    fin.beat = 1;
    if (st > BEAT0 && st < 57.5 && !DRUMS.some(e => Math.abs(e[0] - fin.beatNext) < 0.1)) burst(skyPoint(140, 1.5), { scale: 0.35, n: 60, type: 'peony' });
    fin.beatNext += 2 * EIGHTH;
  }
  if (st > fin.nextComet && st < T_CLIMAX) { spawnComet(st); fin.nextComet = st + 1.6 + Math.random() * 2.5; }

  // the bowl becomes the last firework; then thank you
  if (!fin.gone && st >= T_FINAL) {
    fin.gone = true;
    bowlObj.visible = false;
    burst(_bl.clone(), { type: 'willow', scale: 1.8, n: 360 });
    burst(_bl.clone(), { type: 'peony', pair: ['white', 'gold'], scale: 1.4, n: 260 });
    burst(_bl.clone(), { type: 'ring', pair: ['rose', 'violet'], scale: 1.6 });
  }
  if (!fin.thanks && st >= T_FINAL + 0.5) { fin.thanks = true; thanksEl.classList.add('show'); }
  if (!fin.again && st >= T_FINAL + 4.5) { fin.again = true; thanksEl.classList.add('again'); }

  updateRockets(st);
  updateComets(st, dt);
  fxFlush();
}

// ---------------------------------------------------------------- simulation step
function step() {
  let preLv = null, preAv = null;
  if (bowlBody) { preLv = bowlBody.linvel(); preAv = bowlBody.angvel(); }
  for (const s of shards) if (!s.body.isSleeping()) { const v = s.body.linvel(); s.pv.set(v.x, v.y, v.z); }
  world.step(eventQueue);
  simTime += DT; stepCount++;
  let bowlHit = false;
  eventQueue.drainContactForceEvents(ev => {
    const h1 = ev.collider1(), h2 = ev.collider2();
    if (bowlColliders.has(h1) || bowlColliders.has(h2)) { bowlHit = true; return; }
    for (const h of [h1, h2]) {
      const s = byCollider.get(h);
      if (!s) continue;
      const v = s.body.linvel();
      clink(s, _v.set(v.x, v.y, v.z).sub(s.pv).length());
    }
  });
  if (bowlBody && stepCount % 2 === 0) {
    const t = bowlBody.translation(), r = bowlBody.rotation();
    fallRec.push([t.x, t.y, t.z, r.x, r.y, r.z, r.w]);
  }
  if (bowlHit && bowlBody) {
    const t = bowlBody.translation(), r = bowlBody.rotation();
    _P.set(t.x, t.y, t.z); _q.set(r.x, r.y, r.z, r.w);
    let minY = Infinity; const pts = intactHullAll, wp = [];
    for (let i = 0; i < pts.length; i += 3) {
      const p = new THREE.Vector3(pts[i], pts[i+1], pts[i+2]).applyQuaternion(_q).add(_P);
      wp.push(p); if (p.y < minY) minY = p.y;
    }
    const impact = new THREE.Vector3(); let c = 0;
    for (const p of wp) if (p.y < minY + 0.002) { impact.add(p); c++; }
    impact.divideScalar(c);
    const arm = impact.clone().sub(_P);
    const vp = new THREE.Vector3(preAv.x, preAv.y, preAv.z).cross(arm).add(new THREE.Vector3(preLv.x, preLv.y, preLv.z));
    const speed = -vp.y;
    if (speed > 1.1) shatter(impact, preLv, preAv, Math.min(speed, 6));
  }
  for (const s of shards) if (!s.full && simTime - s.born > 0.03) {
    for (const c of s.colliders) c.setCollisionGroups(G(SHARD, GROUND | SHARD | CHIP));
    s.full = true;
  }
  if (recOn && stepCount % 2 === 0) recordFrame();
}

// ---------------------------------------------------------------- input
const msgEl = document.getElementById('msg');
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  if (moved < 6 && performance.now() - downAt.t < 400) act();
  downAt = null;
});
function act() {
  initAudio();
  if (fin.again) { location.reload(); return; }
  if (state === 'hover') drop();
  else if (canFix()) fix();
}
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); act(); }
  if (e.code === 'KeyR' && state !== 'rewind' && state !== 'finale') { initAudio(); hardReset(); }
  if (e.code === 'KeyS') { slowmo = !slowmo; if (!slowmo) { slowT = -1; timeScale = 1; } }
});

// ---------------------------------------------------------------- post
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.45, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth, innerHeight);
  sparkU.uScale.value = renderer.domElement.height / 2;
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- loop
makeBowl();
loadingEl.style.opacity = 0; setTimeout(() => loadingEl.remove(), 700);
const clock = new THREE.Clock();
let msgText = '';
const _want = new THREE.Vector3(), _dv = new THREE.Vector3();
function setMsg(text, cls = '') {
  if (text === msgText) return;
  msgText = text;
  if (text) { msgEl.textContent = text; msgEl.className = 'show ' + cls; }
  else msgEl.className = msgEl.className.replace('show', '');
}
const hintEl = document.getElementById('hint'), thanksT = thanksEl.querySelector('.t'), againEl = thanksEl.querySelector('.again');
const ui = { msg: 0, hint: CAPTURE ? 0 : 1, flash: 0, thanksT: 0, againT: 0 };
function updateUI(dt) {
  const ap = (c, t, tau) => c + (t - c) * (1 - Math.exp(-dt / tau));
  ui.msg = ap(ui.msg, msgText ? 1 : 0, 0.18); msgEl.style.opacity = ui.msg.toFixed(3);
  ui.hint = ap(ui.hint, CAPTURE || state === 'finale' ? 0 : 1, 0.3); hintEl.style.opacity = ui.hint.toFixed(3);
  ui.flash *= Math.exp(-dt / 0.16); flashEl.style.opacity = ui.flash.toFixed(3);
  if (fin.thanks) ui.thanksT += dt;
  if (fin.again) ui.againT += dt;
  const e = 1 - Math.pow(1 - Math.min(1, ui.thanksT / 6), 3);
  thanksEl.style.opacity = smoothstep(0, 3, ui.thanksT).toFixed(3);
  thanksT.style.transform = `scale(${mix(0.94, 1, e).toFixed(4)})`; thanksT.style.letterSpacing = `${mix(0.06, 0.01, e).toFixed(4)}em`;
  againEl.style.opacity = smoothstep(0, 2, ui.againT).toFixed(3);
}
function frame(dt) {
  soundBudget = 6;
  if (CAPTURE) {   // the clicks a viewer would make
    if (state === 'hover' && !pieces && vClock > 2.2) drop();
    else if (state === 'shattered' && canFix() && nowMs() - shatterReal > 5200) fix();
  }
  goldU.uTime.value += dt;

  // time scale: ease into slow motion just before impact, hold it through the break, ease out
  if (slowmo) {
    if (state === 'falling' && bowlBody) {
      timeScale = mix(0.3, 1, smoothstep(0.06, 0.22, bowlBody.translation().y));
    } else if (slowT >= 0) {
      slowT += dt;
      timeScale = slowT < 1.4 ? 0.1 : mix(0.1, 1, smoothstep(1.4, 3.2, slowT));
      if (slowT > 3.2) { slowT = -1; timeScale = 1; }
    } else timeScale = 1;
  }

  if (state === 'hover') updateHover(dt);
  else if (state === 'rewind') updateRewind(dt);
  else if (state === 'finale') updateFinale(dt);
  else {
    acc += dt * timeScale;
    let n = 0;
    while (acc >= DT && n < 12) { step(); acc -= DT; n++; }
    if (n === 12) acc = 0;
  }
  if (bowlBody && bowlObj) {
    const t = bowlBody.translation(), r = bowlBody.rotation();
    bowlObj.position.set(t.x, t.y, t.z); bowlObj.quaternion.set(r.x, r.y, r.z, r.w);
  }
  if (state !== 'rewind' && state !== 'finale') for (const s of shards) {
    const t = s.body.translation(), r = s.body.rotation();
    s.mesh.position.set(t.x, t.y, t.z); s.mesh.quaternion.set(r.x, r.y, r.z, r.w);
  }

  if (state === 'hover') setMsg('Click to drop', pieces ? 'gold' : '');
  else if (canFix()) setMsg('Click to fix', 'gold');
  else setMsg('');
  updateUI(dt);

  if (state === 'finale') { composer.render(); return; }

  // camera keeps the bowl (or the spread of its shards) centred, in all three axes
  if (bowlObj) _want.copy(bowlObj.position);
  else {
    _want.set(0, 0, 0); let n = 0;
    for (const s of shards) if (s.kind === 'shard') { _want.add(s.mesh.position); n++; }
    if (n) _want.divideScalar(n); else _want.copy(controls.target);
  }
  _want.y = Math.max(0.02, _want.y);
  _dv.subVectors(_want, controls.target).multiplyScalar(1 - Math.exp(-dt * ({ hover: 3, falling: 25, rewind: 14, shattered: 4 }[state] ?? 7)));
  controls.target.add(_dv); camera.position.add(_dv);
  if (camera.position.y < 0.05) camera.position.y = 0.05;

  controls.update(dt);
  composer.render();
}
if (CAPTURE) {
  window.__frame = () => { vClock += 1 / CAP_FPS; frame(1 / CAP_FPS); return { t: vClock, musicStart: window.__musicStart ?? null, state }; };
  window.__ready = true;
} else renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), 0.05)));
</script>
