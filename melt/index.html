<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------------
const PIT_R = 10;
const LAVA_SIZE = 40;
const perlin = new ImprovedNoise();
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261103);
const R = (a, b) => a + (b - a) * Math.random();

function fbm3(x, y, z, oct = 4) {
  let a = 1, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) { s += a * perlin.noise(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}
function ridged3(x, y, z, oct = 3) {
  let a = 1, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) { s += a * (1 - Math.abs(perlin.noise(x * f + 11.3, y * f, z * f))); n += a; a *= 0.5; f *= 2.1; }
  return s / n;
}

// ---------------------------------------------------------------------------
// Terrain height
// ---------------------------------------------------------------------------
function terrainH0(x, z) {
  const r = Math.hypot(x, z);
  const ang = Math.atan2(z, x);
  const shoreN = fbm3(Math.cos(ang) * 1.4 + 3.1, 0.5, Math.sin(ang) * 1.4 + 3.1, 3) * 6.0;
  const bay = 3.6 * Math.exp(-Math.pow(angDiff(ang, CAM_A) / 0.34, 2)); // lava inlet reaching toward the crate
  const rr = r + shoreN - bay;
  let h = -1.4 + smoothstep(PIT_R - 0.8, PIT_R + 1.2, rr) * 2.0;
  h += smoothstep(PIT_R + 0.6, PIT_R + 7, rr) * 2.6;
  h -= smoothstep(PIT_R + 10, PIT_R + 26, rr) * 1.8;
  h += smoothstep(PIT_R + 26, PIT_R + 60, rr) * 16 * (0.55 + 0.9 * (fbm3(x * 0.035, 2.2, z * 0.035, 3) + 0.5));
  const m = smoothstep(PIT_R - 1.5, PIT_R + 3, rr);
  h += m * (fbm3(x * 0.14, 7.7, z * 0.14, 5) * 2.4 + (ridged3(x * 0.35, 1.3, z * 0.35) - 0.6) * 1.2);
  return h;
}

// the crate sits on a little flattened ledge on the near rim, facing the camera
const CAM_A = 1.37;
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const CRATE = (() => {
  for (let r = PIT_R + 1.6; r < PIT_R + 8; r += 0.2) {
    const x = Math.cos(CAM_A) * r, z = Math.sin(CAM_A) * r;
    let ok = true, hs = 0;
    for (const [dx, dz] of [[0, 0], [1.5, 1.5], [-1.5, 1.5], [1.5, -1.5], [-1.5, -1.5]]) {
      const h = terrainH0(x + dx, z + dz); hs += h; if (h < 0.4) ok = false;
    }
    if (ok) return { x, z, r, y: hs / 5 };
  }
  const r = PIT_R + 4; return { x: Math.cos(CAM_A) * r, z: Math.sin(CAM_A) * r, r, y: 1.5 };
})();
function terrainH(x, z) {
  let h = terrainH0(x, z);
  const d = Math.hypot(x - CRATE.x, z - CRATE.z);
  if (d < 2.9) h = lerp(h, CRATE.y - 0.02, smoothstep(2.7, 1.9, d));
  return h;
}

// baked height grid over lava area (for shader + particle collisions)
const HG = 256;
const heightGrid = new Float32Array(HG * HG);
const heightTexData = new Uint8Array(HG * HG * 4);
for (let j = 0; j < HG; j++) for (let i = 0; i < HG; i++) {
  const x = (i / (HG - 1) - 0.5) * LAVA_SIZE, z = (j / (HG - 1) - 0.5) * LAVA_SIZE;
  const h = terrainH(x, z);
  heightGrid[j * HG + i] = h;
  const v = Math.round(clamp((h + 2) / 4, 0, 1) * 255);
  heightTexData.set([v, v, v, 255], (j * HG + i) * 4);
}
function groundAt(x, z) {
  const u = (x / LAVA_SIZE + 0.5) * (HG - 1), v = (z / LAVA_SIZE + 0.5) * (HG - 1);
  if (u < 0 || v < 0 || u >= HG - 1 || v >= HG - 1) return terrainH(x, z);
  const i = u | 0, j = v | 0, fu = u - i, fv = v - j;
  const a = heightGrid[j * HG + i], b = heightGrid[j * HG + i + 1], c = heightGrid[(j + 1) * HG + i], d = heightGrid[(j + 1) * HG + i + 1];
  return lerp(lerp(a, b, fu), lerp(c, d, fu), fv);
}
const heightTex = new THREE.DataTexture(heightTexData, HG, HG, THREE.RGBAFormat);
heightTex.magFilter = heightTex.minFilter = THREE.LinearFilter;
heightTex.needsUpdate = true;

// ---------------------------------------------------------------------------
// Renderer / scene
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COL = new THREE.Color(0x1a0a07);
scene.fog = new THREE.FogExp2(FOG_COL, 0.017);
scene.background = FOG_COL.clone();

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
{
  const cr = CRATE.r + 5.0, cx = Math.cos(CAM_A) * cr, cz = Math.sin(CAM_A) * cr;
  camera.position.set(cx, Math.max(terrainH(cx, cz) + 2.8, CRATE.y + 4.6), cz);
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(Math.cos(CAM_A) * (CRATE.r - 3.8), 0.0, Math.sin(CAM_A) * (CRATE.r - 3.8));
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 34;
controls.maxPolarAngle = 1.42;
controls.enablePan = false;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.22;
let lastInteract = -1e9;
controls.addEventListener('start', () => { controls.autoRotate = false; lastInteract = performance.now(); });
controls.addEventListener('end', () => { lastInteract = performance.now(); });

// shared uniforms
const U = {
  uTime: { value: 0 },
  uFlicker: { value: 1 },
  uLavaR: { value: PIT_R + 1.5 },
  uLavaI: { value: 1.0 },
  uHeight: { value: heightTex },
  uLavaSize: { value: LAVA_SIZE },
};

// ---------------------------------------------------------------------------
// Environment map (lava glow from below, dark sky above) for reflections
// ---------------------------------------------------------------------------
{
  const envScene = new THREE.Scene();
  const envMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec3 vDir; void main(){
      float y = vDir.y;
      vec3 sky = mix(vec3(0.05,0.02,0.015), vec3(0.004,0.005,0.01), smoothstep(0.0,0.6,y));
      vec3 lava = mix(vec3(0.6,0.12,0.02), vec3(3.5,0.9,0.12), smoothstep(-0.05,-0.6,y));
      gl_FragColor = vec4(y<0.0 ? lava : sky, 1.); }`,
  });
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), envMat));
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.02).texture;
  scene.environmentIntensity = 0.35;
}

// sky dome
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uFog: { value: FOG_COL } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position = p.xyww; }`,
    fragmentShader: `uniform vec3 uFog; varying vec3 vDir;
      float h(vec3 p){ p = fract(p*0.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      void main(){
        float y = vDir.y;
        vec3 c = mix(uFog, vec3(0.006,0.006,0.012), smoothstep(0.02, 0.5, y));
        vec3 sp = floor(vDir*420.);
        float s = h(sp); float star = step(0.9975, s) * smoothstep(0.1,0.5,y) * (0.4 + 0.6*h(sp+3.1));
        c += vec3(0.9,0.85,1.0)*star*0.8;
        gl_FragColor = vec4(c,1.); }`,
  }));
  sky.renderOrder = -1;
  scene.add(sky);
}

// ---------------------------------------------------------------------------
// Lights
// ---------------------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0x1b1d2c, 0x3a1206, 0.35));
const moon = new THREE.DirectionalLight(0x7080b0, 0.35);
moon.position.set(-25, 35, -30);
scene.add(moon);

const mainLight = new THREE.PointLight(0xff6a22, 160, 0, 2);
mainLight.position.set(0, 2.2, 0);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(1024, 1024);
mainLight.shadow.camera.near = 0.3;
mainLight.shadow.camera.far = 70;
mainLight.shadow.bias = -0.003;
mainLight.shadow.normalBias = 0.04;
mainLight.shadow.radius = 4;
scene.add(mainLight);

const fillLights = [];
for (let i = 0; i < 3; i++) {
  const a = i / 3 * Math.PI * 2 + 0.4;
  const l = new THREE.PointLight(0xff4a12, 70, 30, 2);
  l.position.set(Math.cos(a) * 6, 1.2, Math.sin(a) * 6);
  l.userData.seed = i * 17.3;
  scene.add(l);
  fillLights.push(l);
}
const popLights = [];
for (let i = 0; i < 2; i++) {
  const l = new THREE.PointLight(0xffa040, 0, 14, 2);
  l.userData.life = 0; l.userData.peak = 0;
  scene.add(l);
  popLights.push(l);
}

// ---------------------------------------------------------------------------
// GLSL shared code
// ---------------------------------------------------------------------------
const GLSL_NOISE = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float a=0.5, s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p; a*=0.5; } return s; }
float fbm3o(vec2 p){ float a=0.5, s=0.; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p; a*=0.5; } return s; }
float hash13(vec3 p){ p = fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x), mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x), mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm3(vec3 p){ float a=0.5, s=0.; for(int i=0;i<4;i++){ s+=a*vnoise3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
vec3 lavaRamp(float t){
  t = clamp(t, 0., 1.2);
  vec3 c = mix(vec3(0.0), vec3(0.28,0.015,0.0), smoothstep(0.0,0.25,t));
  c = mix(c, vec3(1.5,0.16,0.01), smoothstep(0.2,0.5,t));
  c = mix(c, vec3(3.2,0.7,0.05), smoothstep(0.45,0.8,t));
  c = mix(c, vec3(5.5,2.6,0.6), smoothstep(0.8,1.15,t));
  return c;
}
`;

const GLSL_LAVA_LIGHT = /* glsl */`
        vec3 perturbN(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float fd){
          vec3 sx = dFdx(surf_pos), sy = dFdy(surf_pos);
          vec3 R1 = cross(sy, surf_norm), R2 = cross(surf_norm, sx);
          float det = dot(sx, R1) * fd;
          vec3 g = sign(det) * (dHdxy.x*R1 + dHdxy.y*R2);
          return normalize(abs(det)*surf_norm - g);
        }
        vec3 lavaIrr(vec3 P, vec3 N){
          vec2 q = P.xz; float lq = length(q); if (lq > uLavaR) q *= uLavaR/lq;
          vec3 L = vec3(q.x, 0.0, q.y) - P; float d = length(L); L /= max(d, 1e-3);
          float w1 = clamp((dot(N, L) + 0.35)/1.35, 0.0, 1.0);
          vec3 L2 = vec3(0.0, -1.0, 0.0) - P; float d2 = length(L2); L2 /= d2;
          float w2 = clamp((dot(N, L2) + 0.2)/1.2, 0.0, 1.0);
          float e = w1*w1 * 2.0 / (1.0 + 0.3*d*d) + w2 * 5.0 / (1.0 + 0.01*d2*d2*d2);
          float under = smoothstep(-0.3, 0.2, P.y);
          return vec3(1.0, 0.32, 0.07) * e * uLavaI * uFlicker * under;
        }
`;

// ---------------------------------------------------------------------------
// Lava surface
// ---------------------------------------------------------------------------
const MAXB = 32;
const bubbleUniform = { value: Array.from({ length: MAXB }, () => new THREE.Vector4(0, 0, 1, -1)) };
const lavaMat = new THREE.ShaderMaterial({
  fog: true,
  defines: { MAXB },
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {}]),
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform vec4 uBub[MAXB];
    varying vec3 vWorld;
    varying float vBubHeat;
    varying float vDome;
    varying vec3 vN;
    #include <fog_pars_vertex>
    ${GLSL_NOISE}
    float surfH(vec2 p, out float heat, out float dome){
      float h = (fbm3o(p*0.22 + vec2(uTime*0.05, -uTime*0.035)) - 0.44) * 0.28;
      h += sin(p.x*0.55 + uTime*0.6) * sin(p.y*0.47 - uTime*0.45) * 0.035;
      heat = 0.0; dome = 0.0;
      for (int i = 0; i < MAXB; i++) {
        vec4 b = uBub[i];
        if (b.w < 0.0) continue;
        vec2 dv = p - b.xy;
        float d = length(dv) / b.z;
        if (d > 5.0) continue;
        float dm = pow(max(0.0, 1.0 - d*d), 1.25);
        if (b.w < 1.0) {
          float g = b.w;
          float eg = 1.0 - (1.0-g)*(1.0-g);
          float wob = 1.0 + 0.07*sin(uTime*17.0 + b.x*13.0 + atan(dv.y, dv.x)*3.0)*g;
          h += b.z * 0.8 * eg * dm * wob;
          h -= b.z * 0.07 * eg * exp(-pow((d-1.15)*3.0, 2.0));
          heat += dm * (0.1 + 0.6*g*g);
          dome = max(dome, dm * eg);
        } else {
          float q = b.w - 1.0;
          float fade = 1.0 - q;
          h += b.z * 0.8 * dm * max(0.0, 1.0 - q*14.0);
          h -= b.z * 0.5 * fade*fade * exp(-d*d*2.5);
          float rr = 0.8 + q*3.4;
          h += b.z * 0.22 * fade * exp(-pow((d-rr)*2.5, 2.0));
          heat += fade*fade*(1.5*exp(-d*d*1.6) + 0.45*exp(-pow((d-rr)*2.0, 2.0)));
        }
      }
      return h;
    }
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vec2 p = wp.xz;
      float heat, dome, hh, dd;
      float h = surfH(p, heat, dome);
      const float e = 0.06;
      float hx = surfH(p + vec2(e, 0.0), hh, dd);
      float hz = surfH(p + vec2(0.0, e), hh, dd);
      vN = normalize(vec3(h - hx, e, h - hz));
      wp.y += h;
      vWorld = wp.xyz; vBubHeat = heat; vDome = dome;
      vec4 mvPosition = viewMatrix * wp;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: /* glsl */`
    uniform float uTime, uFlicker, uLavaSize;
    uniform sampler2D uHeight;
    varying vec3 vWorld;
    varying float vBubHeat;
    varying float vDome;
    varying vec3 vN;
    #include <fog_pars_fragment>
    ${GLSL_NOISE}
    vec2 voronoi(vec2 x, float t){
      vec2 n = floor(x), f = fract(x); float f1 = 8.0, f2 = 8.0;
      for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++){
        vec2 g = vec2(float(i), float(j));
        vec2 o = hash22(n+g); o = 0.5 + 0.42*sin(t + 6.2831*o);
        vec2 r = g + o - f; float d = dot(r,r);
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
      return vec2(sqrt(f1), sqrt(f2));
    }
    void main(){
      vec2 p = vWorld.xz; float t = uTime;
      float ground = texture2D(uHeight, p/uLavaSize + 0.5).r * 4.0 - 2.0;
      float shore = smoothstep(-1.1, 0.1, ground);

      vec2 q = vec2(fbm(p*0.11 + vec2(t*0.012, 0.0)), fbm(p*0.11 + vec2(5.2, -t*0.010)));
      vec2 pw = p + q*4.5;
      float base = fbm(pw*0.2 + vec2(t*0.018, t*0.011));
      float fine = fbm(pw*1.4 - vec2(t*0.05, t*0.03));
      vec2 v = voronoi(pw*0.55 + q*1.2, t*0.22);
      float edge = v.y - v.x + (fine-0.45)*0.12;

function patchRock(mat, opts = {}) {
  const bump = opts.bump ?? 1.0;
  const ash = opts.ash ?? 0.0;
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, { uTime: U.uTime, uFlicker: U.uFlicker, uLavaR: U.uLavaR, uLavaI: U.uLavaI });
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        vec4 wq = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wq = instanceMatrix * wq;
        #endif
        vWPos = (modelMatrix * wq).xyz;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos;
        uniform float uTime, uFlicker, uLavaR, uLavaI;
        ${GLSL_NOISE}
        ${GLSL_LAVA_LIGHT}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float rn = fbm3(vWPos*0.45);
        float rn2 = vnoise3(vWPos*3.1);
        diffuseColor.rgb *= mix(0.55, 1.35, rn) * (0.85 + 0.3*rn2);
        diffuseColor.rgb *= 0.9 + 0.12*sin(vWPos.y*5.0 + rn*6.0);
        float obsidian = smoothstep(0.62, 0.72, fbm3(vWPos*0.8 + 4.0));`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.28, obsidian);`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        float bh = fbm3(vWPos*2.4)*0.09 + vnoise3(vWPos*9.0)*0.025 + (1.0 - abs(vnoise3(vWPos*1.1)*2.0-1.0))*0.05;
        normal = perturbN(-vViewPosition, normal, vec2(dFdx(bh), dFdy(bh)) * ${bump.toFixed(2)}, faceDirection);
        vec3 wN = inverseTransformDirection(normal, viewMatrix);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.16,0.15,0.145)*(0.7+0.5*rn2), ${ash.toFixed(2)} * smoothstep(0.55, 0.95, wN.y) * smoothstep(0.4, 0.6, rn + 0.15));`)
      .replace('#include <opaque_fragment>', `
        outgoingLight += diffuseColor.rgb * lavaIrr(vWPos, wN);
        float crackN = 1.0 - abs(vnoise3(vWPos*vec3(1.6,2.6,1.6))*2.0 - 1.0);
        float crack = smoothstep(0.86, 0.97, crackN);
        float nearMelt = 1.0 - smoothstep(-0.1, 0.9, vWPos.y);
        float contact = 1.0 - smoothstep(-0.25, 0.22, vWPos.y);
        float pulse = 0.8 + 0.2*sin(uTime*1.3 + vWPos.x*0.7 + vWPos.z*0.5);
        outgoingLight += lavaRamp(0.62 + 0.25*rn2) * (crack*nearMelt*0.8 + contact*0.9) * pulse * uFlicker;
        #include <opaque_fragment>`);
  };
  return mat;
}

function makeRockGeo(rng, { detail = 5, cuts = 5, stretchY = 1, taper = 0, lump = 0.28, bend = 0 } = {}) {
  let g = new THREE.IcosahedronGeometry(1, detail);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  const planes = Array.from({ length: cuts }, () => ({
    n: new THREE.Vector3(rng() * 2 - 1, (rng() * 2 - 1) * 0.7, rng() * 2 - 1).normalize(),
    d: 0.5 + rng() * 0.35,
  }));
  const ox = rng() * 100, oy = rng() * 100, oz = rng() * 100;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    let r = 1 + lump * fbm3(v.x * 1.1 + ox, v.y * 1.1 + oy, v.z * 1.1 + oz, 4);
    r += 0.14 * (ridged3(v.x * 3.2 + ox, v.y * 3.2 + oy, v.z * 3.2 + oz) - 0.6);
    v.multiplyScalar(r);
    for (const p of planes) { const k = v.dot(p.n) - p.d; if (k > 0) v.addScaledVector(p.n, -k * 0.88); }
    v.multiplyScalar(1 + 0.025 * perlin.noise(v.x * 8 + ox, v.y * 8, v.z * 8));
    const yN = clamp((v.y + 1) / 2, 0, 1);
    v.y *= stretchY;
    const tp = 1 - taper * yN * yN;
    v.x *= tp; v.z *= tp;
    v.x += bend * yN * yN * stretchY;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

function addRock(geo, x, z, { scale = 1, sink = 0.4, rotY = 0, tiltX = 0, tiltZ = 0, mat = rockMat } = {}) {
  const m = new THREE.Mesh(geo, mat);
  const y = terrainH(x, z);
  m.position.set(x, y - sink * scale, z);
  m.scale.setScalar(scale);
  m.rotation.set(tiltX, rotY, tiltZ);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}

function basaltCluster(a, rc, rings, seedOff) {
  const geo = new THREE.CylinderGeometry(0.35, 0.35, 1, 6, 1);
  geo.translate(0, 0.5, 0);
  const items = [];
  const sp = 0.62;
  const [cx, cz] = polar(a, rc);
  for (let q = -rings; q <= rings; q++) for (let r = -rings; r <= rings; r++) {
    const s = -q - r; if (Math.abs(s) > rings) continue;
    const lx = sp * (q + r / 2), lz = sp * (r * Math.sqrt(3) / 2);
    const dist = Math.hypot(lx, lz);
    if (dist > rings * sp * (0.75 + 0.35 * perlin.noise(lx * 0.6 + seedOff, 1.1, lz * 0.6))) continue;
    const x = cx + lx, z = cz + lz;
    const g = terrainH(x, z);
    const radial = Math.hypot(x, z) - rc;
    let h = 0.9 + radial * 0.45 + (perlin.noise(x * 0.9 + seedOff, 3.3, z * 0.9) + 0.5) * 1.1 + (1 - dist / (rings * sp)) * 1.2;
    if (rand() < 0.15) h *= 0.55;
    h = Math.max(0.4, h);
    items.push({ x, z, y: g - 0.8, h: h + 0.8, rot: (rand() - 0.5) * 0.08, tx: (rand() - 0.5) * 0.05, tz: (rand() - 0.5) * 0.05, w: 0.92 + rand() * 0.14 });
  }
  const mesh = new THREE.InstancedMesh(geo, columnMat, items.length);
  const m = new THREE.Matrix4(), qn = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  items.forEach((it, i) => {
    e.set(it.tx, it.rot, it.tz); qn.setFromEuler(e);
    p.set(it.x, it.y, it.z); sc.set(it.w, it.h, it.w);
    m.compose(p, qn, sc); mesh.setMatrixAt(i, m);
  });
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
}

function makePuffTexture(size = 128) {
  const data = new Uint8Array(size * size * 4);
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    const x = i / (size - 1) * 2 - 1, y = j / (size - 1) * 2 - 1;
    const r = Math.hypot(x, y), ang = Math.atan2(y, x);
    const edge = 0.72 + 0.22 * perlin.noise(Math.cos(ang) * 1.6 + 5, Math.sin(ang) * 1.6 + 5, 0.5);
    let a = Math.pow(1 - smoothstep(0, edge, r), 1.6);
    a *= 0.55 + 0.45 * (fbm3(x * 2.5 + 9, y * 2.5, 1.7, 4) + 0.5);
    const v = Math.round(clamp(a, 0, 1) * 255);
    data.set([v, v, v, 255], (j * size + i) * 4);
  }
  const t = new THREE.DataTexture(data, size, size); t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}
function makeTileNoise(size = 128, cells = 4, oct = 5) {
  const out = new Float32Array(size * size);
  let amp = 1, norm = 0;
  for (let o = 0; o < oct; o++) {
    const L = cells << o;
    const grid = new Float32Array(L * L).map(() => Math.random());
    for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
      const u = i / size * L, v = j / size * L;
      const i0 = Math.floor(u), j0 = Math.floor(v);
      let fu = u - i0, fv = v - j0; fu = fu * fu * (3 - 2 * fu); fv = fv * fv * (3 - 2 * fv);
      const g = (a, b) => grid[((b % L + L) % L) * L + ((a % L + L) % L)];
      out[j * size + i] += amp * lerp(lerp(g(i0, j0), g(i0 + 1, j0), fu), lerp(g(i0, j0 + 1), g(i0 + 1, j0 + 1), fu), fv);
    }
    norm += amp; amp *= 0.5;
  }
  const data = new Uint8Array(size * size * 4);
  for (let k = 0; k < size * size; k++) { const v = Math.round(clamp(out[k] / norm, 0, 1) * 255); data.set([v, v, v, 255], k * 4); }
  const t = new THREE.DataTexture(data, size, size);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

let actx = null, master = null, muted = false, noiseBuf = null;
function initAudio() {

  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 3, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = w * 0.5 + last * 6; }
  const loopNoise = () => { const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(); return s; };
  // deep rumble
  const rumble = loopNoise(); const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 85; lp.Q.value = 0.8;
  const rg = actx.createGain(); rg.gain.value = 0.55;
  const lfo = actx.createOscillator(); lfo.frequency.value = 0.09; const lfoG = actx.createGain(); lfoG.gain.value = 0.25; lfo.connect(lfoG).connect(rg.gain); lfo.start();
  rumble.connect(lp).connect(rg).connect(master);
  // bubbling bed
  const bed = loopNoise(); const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 260; bp.Q.value = 1.2;
  const bg = actx.createGain(); bg.gain.value = 0.06; bed.connect(bp).connect(bg).connect(master);
  // fume hiss
  const hiss = loopNoise(); const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3500;
  const hg = actx.createGain(); hg.gain.value = 0.012; hiss.connect(hp).connect(hg).connect(master);
}
function popSound(r, worldX, worldZ) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  _v.set(worldX, 0, worldZ).project(camera);
  const pan = actx.createStereoPanner(); pan.pan.value = clamp(_v.x, -1, 1) * 0.8;
  const dist = camera.position.distanceTo(_p.set(worldX, 0, worldZ));
  const vol = clamp(10 / dist, 0.15, 1.2) * clamp(r, 0.25, 1.4);
  const out = actx.createGain(); out.gain.value = vol; out.connect(pan).connect(master);
  const o = actx.createOscillator(); o.type = 'sine';
  const f0 = (180 + Math.random() * 140) / Math.sqrt(Math.max(r, 0.2));
  o.frequency.setValueAtTime(f0 * 0.55, t);
  o.frequency.exponentialRampToValueAtTime(f0, t + 0.03);
  o.frequency.exponentialRampToValueAtTime(f0 * 0.3, t + 0.18 + r * 0.15);
  const og = actx.createGain(); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.5, t + 0.012); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.25 + r * 0.2);
  o.connect(og).connect(out); o.start(t); o.stop(t + 0.6);
  const n = actx.createBufferSource(); n.buffer = noiseBuf; n.playbackRate.value = 0.8 + Math.random() * 0.4;
  const nb = actx.createBiquadFilter(); nb.type = 'bandpass'; nb.frequency.value = 600 + Math.random() * 600; nb.Q.value = 0.9;
  const ng = actx.createGain(); ng.gain.setValueAtTime(0.25, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.12 + r * 0.25);
  n.connect(nb).connect(ng).connect(out); n.start(t, Math.random() * 2); n.stop(t + 0.6);
}

const bubbles = [];
function spawnBubble(x, z, r, dur) {

function randomLavaPoint(minDepth = -0.9) {
  for (let k = 0; k < 30; k++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * (PIT_R + 1);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;

}
function popBubble(b) {
  const r = b.r;
  const n = Math.round(6 + r * r * 55);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.random()) * r * 0.9;
    const out = R(0.4, 2.2) * Math.sqrt(r);
    const up = R(1.8, 5.5) * Math.sqrt(r) * (1 - rr / r * 0.4);
    spawnDrop(b.x + Math.cos(a) * rr, r * 0.4, b.z + Math.sin(a) * rr, Math.cos(a) * out, up, Math.sin(a) * out, R(0.025, 0.07) * (0.6 + r));
  }
  for (let i = 0; i < 4 + r * 18; i++) spawnEmber(b.x + R(-r, r) * 0.6, 0.3, b.z + R(-r, r) * 0.6, R(-1, 1), R(1.5, 4.5) * Math.sqrt(r), R(-1, 1), R(1.5, 4));
  const puffs = 1 + Math.round(r * 3);
  for (let i = 0; i < puffs; i++) spawnSmoke(b.x + R(-0.3, 0.3) * r, 0.3, b.z + R(-0.3, 0.3) * r, { size0: 0.6 * r + 0.3, size1: 3 + r * 3, life: 7, amax: 0.35, vy: 1.4, heat: 1, spread: 0.4 });
  const l = popLights.reduce((a, b2) => (a.userData.life < b2.userData.life ? a : b2));
  l.position.set(b.x, 0.7 + r * 0.5, b.z); l.userData.peak = 25 * r * r + 6; l.userData.life = 1; l.userData.dur = 0.25 + r * 0.3;
  popSound(r, b.x, b.z);
}
let bubbleTimer = 0;

    const big = Math.random() < 0.12;
    const r = big ? R(0.8, 1.5) : R(0.18, 0.55);
    spawnBubble(x, z, r, big ? R(1.6, 3.0) : R(0.5, 1.4));
    if (Math.random() < 0.25) for (let k = 0; k < 3; k++) spawnBubble(x + R(-1.2, 1.2), z + R(-1.2, 1.2), R(0.12, 0.3), R(0.4, 1.0));
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (!b.popped) {

      if (b.g >= 1) { b.g = 1; b.popped = true; popBubble(b); }

          P.xz = uCenter.xz + d*spread;

      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; varying vec3 vOPos;
        uniform float uTime, uFlicker, uLavaR, uLavaI;
        uniform float uMelt, uHeat, uChar, uCrack, uGlow, uFloor, uH;

      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>

        #include <opaque_fragment>`);
  };
  return mat;
}

function patchLavaLit(mat) {
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, { uTime: U.uTime, uFlicker: U.uFlicker, uLavaR: U.uLavaR, uLavaI: U.uLavaI });
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; uniform float uTime, uFlicker, uLavaR, uLavaI;
        ${GLSL_LAVA_LIGHT}`)
      .replace('#include <opaque_fragment>', `
        outgoingLight += diffuseColor.rgb * lavaIrr(vWPos, inverseTransformDirection(normal, viewMatrix)) * 0.8;
        #include <opaque_fragment>`);
  };
  return mat;
}

    if (focus && things.includes(focus)) {
      const q = focus.group.position;
      _ct.set(q.x, 0.15, q.z);
    } else if ((linger -= dt) <= 0) { camState = 'return'; focus = null; }
    if (camState === 'focus') {
      _off.copy(home.pos).sub(home.target); _off.y = 0; _off.setLength(3.0);
      _off.y = 1.45;
      _cp.copy(_ct).add(_off);
      _cp.y = Math.max(_cp.y, groundAt(_cp.x, _cp.z) + 1.3);
    }
  }
  if (camState === 'return') { _ct.copy(home.target); _cp.copy(home.pos); }
  const k = 1 - Math.exp(-dt * (camState === 'return' ? 1.4 : 1.8));
  controls.target.lerp(_ct, k);
  camera.position.lerp(_cp, k);
  if (camState === 'return' && camera.position.distanceTo(home.pos) < 0.05) camState = 'free';
}
function followThings(dt) {
  updateCamera(dt);
  if (userOrbiting || held || camState !== 'free') return;
  let best = null;
  for (const th of things) {
    if (th.state !== 'melting' && th.state !== 'flying' && th.state !== 'resting') continue;
    if (th.state === 'flying' && th.vel.y > 0) continue;
    const q = th.group.position;
    if (!onScreen(q.x, Math.max(q.y, 0), q.z, 0.88)) { best = q; break; }
  }
  if (!best) return;
  _pan.set(best.x - controls.target.x, 0, best.z - controls.target.z);
  _pan.multiplyScalar(Math.min(1, dt * 1.6));
  controls.target.add(_pan); camera.position.add(_pan);
}

function updateHoldTarget(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const { origin: o, direction: d } = raycaster.ray;
  const holdY = CRATE.y + 1.1;
  let t = d.y < -1e-3 ? (holdY - o.y) / d.y : 40;
  t = Math.min(t, 40);
  holdTarget.copy(o).addScaledVector(d, t);
  _pan.set(holdTarget.x - CRATE.x, 0, holdTarget.z - CRATE.z);
  if (_pan.length() > 8.5) { _pan.setLength(8.5); holdTarget.x = CRATE.x + _pan.x; holdTarget.z = CRATE.z + _pan.z; }
  holdTarget.y = Math.max(holdTarget.y, groundAt(holdTarget.x, holdTarget.z) + 0.5);
}
addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || held) return;
  const th = pickThing(e);
  if (!th) return;
  e.stopPropagation();
  initAudio();
  held = th; th.state = 'held'; holdVel.set(0, 0, 0);
  if (th.slot.thing === th && th.group.position.distanceTo(th.slot.world) < 0.01) { /* still owns slot until it melts */ }
  grabInfo = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  updateHoldTarget(e);
  holdTarget.y = Math.max(holdTarget.y, th.group.position.y + 0.6);
  if (th.kind === 'duck') squeak(); else knock(0.25, 220);
  renderer.domElement.style.cursor = 'grabbing';
}, true);
addEventListener('pointermove', (e) => {
  if (held) {
    grabInfo.moved = Math.max(grabInfo.moved, Math.hypot(e.clientX - grabInfo.x, e.clientY - grabInfo.y));
    updateHoldTarget(e);
    tagEl.style.left = e.clientX + 'px'; tagEl.style.top = e.clientY + 'px';
    return;
  }
  if (e.buttons) return;
  const th = pickThing(e);
  renderer.domElement.style.cursor = th ? 'grab' : '';
  tagEl.style.opacity = th ? 1 : 0;
  if (th) { tagEl.textContent = th.def.name; tagEl.style.left = e.clientX + 'px'; tagEl.style.top = e.clientY + 'px'; }
}, true);
addEventListener('pointerup', (e) => {
  if (!held) return;
  e.stopPropagation();
  const th = held; held = null;
  const tap = grabInfo.moved < 8 && performance.now() - grabInfo.t < 350;
  const p = th.group.position;
  if (tap) {
    // lob it into a visible patch of lava
    const [tx, tz] = visibleLavaPoint();
    const T = 1.1;
    th.vel.set((tx - p.x) / T, (0 - p.y) / T + 0.5 * 9.8 * T, (tz - p.z) / T);
  } else {
    th.vel.copy(holdVel);
    const sp = th.vel.length(); if (sp > 9) th.vel.multiplyScalar(9 / sp);
    th.vel.y += 0.8;
    keepLandingInView(p, th.vel);
  }
  th.angVel.set(R(-4, 4), R(-3, 3), R(-4, 4));
  th.state = 'flying';
  renderer.domElement.style.cursor = '';
  tagEl.style.opacity = 0;
}, true);

// ---------------------------------------------------------------------------
// Click to stir
// ---------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downPos = [e.clientX, e.clientY]; initAudio(); });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 6) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const { origin: o, direction: d } = raycaster.ray;
  if (d.y >= -1e-3) return;
  const t = -o.y / d.y;
  const x = o.x + d.x * t, z = o.z + d.z * t;
  if (groundAt(x, z) > -0.4) return;
  bubbles.splice(0, Math.max(0, bubbles.length - (MAXB - 6)));
  spawnBubble(x, z, R(1.2, 1.7), 0.7);
  for (let k = 0; k < 5; k++) { const a = Math.random() * 6.28, rr = R(1.6, 3); spawnBubble(x + Math.cos(a) * rr, z + Math.sin(a) * rr, R(0.2, 0.5), R(0.4, 1.3)); }
  controls.autoRotate = false; lastInteract = performance.now();
});

// ---------------------------------------------------------------------------
// Post-processing: heat haze -> bloom -> output
// ---------------------------------------------------------------------------
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const hazePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAspect: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime, uAspect; varying vec2 vUv;
    ${GLSL_NOISE}
    float lum(vec3 c){ return dot(c, vec3(0.3,0.5,0.2)); }
    void main(){
      float heat = 0.0;
      for (int i = 1; i <= 4; i++) heat += lum(texture2D(tDiffuse, vUv - vec2(0.0, float(i)*0.025)).rgb);
      heat = smoothstep(0.6, 6.0, heat);
      vec2 p = vUv * vec2(uAspect, 1.0) * 14.0;
      vec2 off = vec2(vnoise(p + vec2(0.0, -uTime*2.2)), vnoise(p*1.3 + vec2(7.1, -uTime*2.8))) - 0.5;
      vec2 uv = vUv + off * 0.0055 * heat;
      gl_FragColor = texture2D(tDiffuse, uv);
    }`,
});
composer.addPass(hazePass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.5, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  hazePass.uniforms.uAspect.value = camera.aspect;
  emberMat.uniforms.uPx.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
let uTimeVal = 0;
const clock = new THREE.Clock();
// warm-up: pre-fill fumes so the scene starts alive
for (let i = 0; i < 160; i++) { uTimeVal += 0.07; ambientEmit(0.07); updateSmoke(0.07); updateEmbers(0.07); }

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  uTimeVal += dt;
  U.uTime.value = uTimeVal;
  const t = uTimeVal;
  const flick = 0.92 + 0.05 * perlin.noise(t * 0.7, 0.3, 0.1) * 2 + 0.03 * Math.sin(t * 9.0) * perlin.noise(t * 2, 4, 1);
  U.uFlicker.value = flick;
  mainLight.intensity = 160 * flick;
  for (const l of fillLights) l.intensity = 70 * (0.75 + 0.5 * (perlin.noise(t * 1.3, l.userData.seed, 0) + 0.5));
  for (const l of popLights) {
    if (l.userData.life > 0) { l.userData.life = Math.max(0, l.userData.life - dt / l.userData.dur); l.intensity = l.userData.peak * Math.pow(l.userData.life, 2); }
    else l.intensity = 0;
  }
  updateBubbles(dt);
  ambientEmit(dt);
  updateSmoke(dt);
  updateEmbers(dt);
  updateDrops(dt);
  updateFire(dt);
  updateThings(dt);
  followThings(dt);
  hazePass.uniforms.uTime.value = t;

  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(() => {
  frame();
  const ld = document.getElementById('loading');
  ld.style.opacity = 0; setTimeout(() => ld.remove(), 900);
});
</script>
</body>
</html>
